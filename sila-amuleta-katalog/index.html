<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e8">
<title>Каталог</title>
<link rel="stylesheet" href="app.css">
<!-- Необязательно: внутри Telegram даёт ready()/expand() и цвета темы. Без него страница работает так же. -->
<script id="tg-sdk" src="https://telegram.org/js/telegram-web-app.js" async></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1 class="brand" id="brand">Каталог</h1>
    <button class="cart-btn" id="cartBtn" type="button" aria-label="Открыть корзину">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
      <span class="count js-count" hidden>0</span>
    </button>
  </header>
  <p class="tagline" id="tagline"></p>
  <nav class="chips" id="chips" aria-label="Категории"></nav>
  <main class="grid" id="grid"></main>
  <p class="foot-note" id="footNote"></p>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:16px">Для каталога нужен JavaScript.</p></noscript>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
