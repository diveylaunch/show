<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перемещение оборудования: прототип</title>
<style>
:root{--bg:#fff;--s1:#F7F8F9;--bd:#DCDFE4;--tx2:#626F86;--tx:#172B4D;--blue:#0C66E4;--blue-h:#0055CC;--blue-l:#E9F2FF;--ok:#22A06B;--ok-l:#DCFFF1;--warn:#E2B203;--warn-l:#FFF7D6;--err:#C9372C;--err-l:#FFECEB}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/20px -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg);-webkit-text-size-adjust:100%}
h1{font-size:22px;line-height:28px;margin:0 0 4px;font-weight:600}
h2{font-size:16px;line-height:24px;margin:0 0 12px;font-weight:600}
h3{font-size:14px;line-height:20px;margin:0 0 8px;font-weight:600}
p{margin:0 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.muted{color:var(--tx2)}
.small{font-size:12px;line-height:16px}
[hidden]{display:none!important}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* шапка */
.top{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 24px;border-bottom:1px solid var(--bd);background:#fff;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.brand i{width:28px;height:28px;border-radius:4px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.brand i svg{width:18px;height:18px}
.roles{margin-left:auto;display:flex;align-items:center;gap:10px}
.roles label{color:var(--tx2);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;border-right:1px solid var(--bd);height:32px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--s1)}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.rsel{display:none}
select,input[type=text],input[type=date],textarea{border:1px solid var(--bd);border-radius:3px;background:#fff;height:32px;padding:0 8px;width:100%}
textarea{height:auto;min-height:72px;padding:6px 8px;resize:vertical}
select:hover,input:hover,textarea:hover{background:var(--s1)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff}
.bad{border-color:var(--err)!important}
.err{color:var(--err);font-size:12px;line-height:16px;margin-top:4px}
.nav{display:flex;align-items:center;gap:4px;padding:0 24px;border-bottom:1px solid var(--bd);background:#fff;min-height:44px}
.nav a{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 10px;color:var(--tx2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent}
.nav a:hover{color:var(--tx);background:var(--s1)}
.nav a[aria-current=page]{color:var(--blue);border-bottom-color:var(--blue)}
.nav a:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.nav .sp{flex:1}
main{padding:20px 24px 40px;min-height:60vh}
.nav .gbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--blue);border-radius:3px;background:#fff;color:var(--blue);font-weight:500;cursor:pointer;white-space:nowrap}
.nav .gbtn:hover{background:var(--blue-l)}
/* где сейчас заявка */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.flow .fs{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);white-space:nowrap}
.flow .fs i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:700;background:#fff}
.flow .fs.done{color:#216E4E}.flow .fs.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.flow .fs.on{color:var(--tx);font-weight:600}.flow .fs.on i{border-color:var(--blue);background:var(--blue);color:#fff}
.flow .fs.bad i{background:var(--err);border-color:var(--err);color:#fff}
.flow .fl2{width:16px;height:1px;background:var(--bd)}
.nextp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--bd);border-radius:4px;padding:10px 12px;margin-bottom:16px}
.nextp .tx{flex:1;min-width:220px}
/* подсказка-гид */
.gd{position:fixed;right:24px;bottom:24px;width:370px;background:#fff;border:1px solid var(--bd);border-top:4px solid var(--blue);border-radius:6px;box-shadow:0 8px 24px rgba(9,30,66,.25);z-index:55;padding:14px 16px 12px}
.gd .gn{font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.gd .gn button{background:none;border:0;color:var(--tx2);cursor:pointer;padding:2px 4px;font-size:12px}
.gd .gn button:hover{color:var(--tx)}
.gd h4{margin:0 0 6px;font-size:15px;line-height:20px}
.gd p{margin:0 0 10px;color:#2C3E5D}
.gd .gb{display:flex;gap:8px;flex-wrap:wrap}
.gd .bar{height:3px;background:var(--s1);border-radius:2px;margin:0 0 10px;overflow:hidden}
.gd .bar b{display:block;height:100%;background:var(--blue)}
.gmini{position:fixed;right:24px;bottom:24px;z-index:55;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:0;border-radius:20px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(9,30,66,.3)}
body.guide main{padding-bottom:230px}
.gl{outline:3px solid #F5CD47!important;outline-offset:3px;animation:glp 1.4s ease-in-out infinite}
@keyframes glp{50%{outline-color:rgba(245,205,71,.25)}}
@media (prefers-reduced-motion:reduce){.gl{animation:none}}
.welcome p{margin:0 0 10px}
.welcome ol{margin:0 0 14px;padding-left:20px}
.welcome li{margin-bottom:4px}
footer{padding:12px 24px 24px;color:var(--tx2);font-size:12px;border-top:1px solid var(--bd)}
footer button{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-size:12px}

/* кнопки */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid transparent;border-radius:3px;background:#F1F2F4;color:var(--tx);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--bd)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-h)}
.btn.line{background:#fff;border-color:var(--bd)}
.btn.line:hover{background:var(--s1)}
.btn.dng{background:#fff;border-color:var(--err);color:var(--err)}
.btn.dng:hover{background:var(--err-l)}
.btn.sm{height:28px;padding:0 8px;font-size:13px}
.btn.lnk{background:none;color:var(--blue);padding:0 4px}
.btn.lnk:hover{background:var(--blue-l)}

/* плашки */
.lz{display:inline-block;padding:0 6px;border-radius:3px;font-size:12px;line-height:18px;font-weight:600;white-space:nowrap;background:#F1F2F4;color:var(--tx)}
.lz-s1{background:#F1F2F4;color:#44546F}
.lz-s2{background:var(--blue-l);color:#0055CC}
.lz-s3{background:var(--warn-l);color:#7F5F01}
.lz-s4{background:var(--ok-l);color:#216E4E}
.lz-s5{background:var(--blue);color:#fff}
.lz-s6{background:#1F845A;color:#fff}
.lz-s7{background:var(--err-l);color:#AE2E24}

/* список */
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head .grow{flex:1;min-width:200px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .search{position:relative;width:280px;max-width:100%}
.tools .search svg{position:absolute;left:8px;top:8px;color:var(--tx2)}
.tools .search input{padding-left:30px}
.tools select{width:auto;min-width:190px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--bd);border-radius:3px;background:#fff;cursor:pointer}
.chip:hover{background:var(--s1)}
.chip[aria-pressed=true]{background:var(--blue-l);border-color:var(--blue);color:#0055CC}
.chip b{background:var(--blue);color:#fff;border-radius:10px;padding:0 6px;font-size:12px;line-height:18px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--tx2);font-weight:600;padding:8px 12px;border-bottom:2px solid var(--bd);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--s1)}
.tbl tbody tr:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.tbl .num{font-weight:600;color:var(--blue);white-space:nowrap}
.cards{display:none}
.rcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--bd);border-radius:4px;padding:12px;margin-bottom:8px;cursor:pointer}
.rcard:hover{background:var(--s1)}
.rcard .r1{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}
.empty{border:1px dashed var(--bd);border-radius:4px;padding:32px 16px;text-align:center;color:var(--tx2)}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
.empty .btn{margin-top:12px}

/* панели и формы */
.panel{border:1px solid var(--bd);border-radius:4px;padding:20px;background:#fff;margin-bottom:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.fl{font-weight:600;font-size:12px;color:var(--tx2);display:block;margin-bottom:4px}
.fl i{font-style:normal;font-weight:400}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:3px;padding:8px 10px;cursor:pointer;background:#fff}
.opt:hover{background:var(--s1)}
.opt:has(input:checked){border-color:var(--blue);background:var(--blue-l)}
.opt:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:1px}
.opt input{margin:0;width:16px;height:16px;accent-color:var(--blue)}
.copts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.steps{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.st{display:flex;align-items:center;gap:8px;color:var(--tx2);font-weight:500}
.st b{width:24px;height:24px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff;color:var(--tx2)}
.st.on{color:var(--tx)}
.st.on b{background:var(--blue);border-color:var(--blue);color:#fff}
.st.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.st.done{color:var(--tx)}
.steps .ln{flex:1;height:1px;background:var(--bd);min-width:12px}
.w2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.side fieldset{border:1px solid var(--bd);border-radius:4px;padding:12px;margin:0 0 12px}
.side legend{font-weight:600;padding:0 4px}
.side .row{display:grid;grid-template-columns:1fr 84px;gap:8px;margin-top:6px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mode button{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--bd);border-radius:3px;background:#fff;cursor:pointer;text-align:left;min-height:44px}
.mode button:hover{background:var(--s1)}
.mode button[aria-pressed=true]{border-color:var(--blue);background:var(--blue-l)}
.mode button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.mdot{width:22px;height:22px;border-radius:50%;color:#fff;font:700 12px/22px sans-serif;text-align:center;flex:none}
.mdot.A{background:#44546F}.mdot.B{background:var(--blue)}
.ptxt{font-size:13px;line-height:18px;margin-bottom:6px}
.ptxt.miss{color:var(--tx2)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:0}
.dl dt{color:var(--tx2)}
.dl dd{margin:0}

/* схема */
.pv-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pv-tools .lg{display:flex;gap:14px;align-items:center;flex-wrap:wrap;flex:1;font-size:12px;color:var(--tx2)}
.pv-tools .lg span{display:inline-flex;align-items:center;gap:6px}
.pv-tools .lg .mdot{width:16px;height:16px;font-size:10px;line-height:16px}
.zoom{display:flex;gap:4px;align-items:center}
.zoom .zv{min-width:44px;text-align:center;font-size:12px;color:var(--tx2)}
.plan-scroll{overflow:auto;border:1px solid var(--bd);border-radius:4px;max-height:78vh;background:#fff;-webkit-overflow-scrolling:touch}
.plan{position:relative;max-width:none}
.plan>.pl{display:block;width:100%;height:100%}
.plan.int{cursor:crosshair}
.ov{position:absolute;inset:0;pointer-events:none}
.ov svg{position:absolute;inset:0;width:100%;height:100%}
.mk{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 13px/24px sans-serif;text-align:center;box-shadow:0 1px 4px rgba(9,30,66,.45);pointer-events:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.mk-A{background:#44546F}.mk-B{background:var(--blue)}
.plan.sm .mk{width:20px;height:20px;font-size:11px;line-height:16px;cursor:default}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.fig .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:500}
.hint{background:var(--blue-l);border-radius:3px;padding:8px 10px;color:#09326C;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.hint svg{margin-top:2px}
.hint.w{background:var(--warn-l);color:#533F04}

/* маршрут */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:10px;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--bd)}
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--bd);background:#fff;color:var(--tx2);font-weight:600;font-size:12px}
.dot svg{width:15px;height:15px}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.pending{border-color:var(--blue);color:var(--blue)}
.dot.ret{background:var(--warn);border-color:var(--warn);color:#172B4D}
.dot.rej{background:var(--err);border-color:var(--err);color:#fff}
.tl .t1{font-weight:600}
.tl .t2{color:var(--tx2);font-size:13px}
.cm{background:var(--s1);border-radius:3px;padding:6px 10px;margin-top:6px;font-size:13px}
.log{list-style:none;margin:0;padding:0}
.log li{padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.log li:last-child{border-bottom:0}
.log time{display:block;color:var(--tx2);font-size:12px}
.crumbs{font-size:12px;color:var(--tx2);margin-bottom:8px}
.crumbs a{color:var(--tx2)}
.act{border-color:var(--blue);background:#fff}
.act .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.jk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.jk strong{font-size:15px}
.jl{display:inline-block;padding:0 6px;border-radius:3px;font-size:12px;line-height:18px;font-weight:700;background:#DCDFE4;color:#172B4D;text-transform:uppercase}
.jl.b{background:#CCE0FF;color:#09326C}.jl.g{background:#BAF3DB;color:#164B35}.jl.y{background:#F8E6A0;color:#533F04}.jl.r{background:#FFD5D2;color:#5D1F1A}

/* админ */
.floors{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.fcard{border:1px solid var(--bd);border-radius:4px;overflow:hidden;background:#fff}
.fcard .pad{padding:12px}
.fcard .nm{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;align-items:center}
.fcard .plan-scroll{border:0;border-bottom:1px solid var(--bd);border-radius:0}
.fcard .bt{display:flex;gap:8px;flex-wrap:wrap}
.bld{margin:0 0 20px}
.bld h3{font-size:14px}
.rules{width:100%;border-collapse:collapse}
.rules td{padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.rules tr:last-child td{border-bottom:0}
.sw{position:relative;display:inline-block;width:36px;height:20px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:10px;background:#8590A2;transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--blue)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
.sw input:disabled{cursor:not-allowed}
.sw input:disabled+i{opacity:.5}
.tag{display:inline-block;background:#F1F2F4;border-radius:3px;padding:0 6px;font-size:12px;line-height:18px;margin:0 4px 2px 0}

/* модальное окно, уведомление */
.ovl{position:fixed;inset:0;background:rgba(9,30,66,.54);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:4px;max-width:960px;width:100%;box-shadow:0 8px 12px rgba(9,30,66,.25)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.mb{padding:16px}
.toast{position:fixed;left:24px;bottom:24px;background:var(--tx);color:#fff;padding:10px 14px;border-radius:4px;max-width:420px;z-index:60;box-shadow:0 4px 8px rgba(9,30,66,.3)}
.jira{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}
.jira .jt{font-size:20px;line-height:26px;font-weight:600;margin:4px 0 12px}
.jira .jbc{font-size:12px;color:var(--tx2)}
.jira .jd{border:1px solid var(--bd);border-radius:3px}
.jira .jd h4{margin:0;padding:8px 12px;border-bottom:1px solid var(--bd);font-size:13px;background:var(--s1)}
.jira .jd dl{margin:0;padding:8px 12px;display:grid;grid-template-columns:90px 1fr;gap:8px}
.jira .jd dt{color:var(--tx2);font-size:12px}
.jira .jd dd{margin:0;font-size:13px}
.att{display:inline-block;border:1px solid var(--bd);border-radius:3px;width:230px;overflow:hidden;background:#fff}
.att .nm{padding:6px 8px;font-size:12px;border-top:1px solid var(--bd)}
.jcm{display:flex;gap:10px;margin-top:12px;font-size:13px}
.av{width:28px;height:28px;border-radius:50%;background:#44546F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}

@media(max-width:900px){
 .cols{grid-template-columns:1fr}
 .w2{grid-template-columns:1fr}
 .jira{grid-template-columns:1fr}
}
@media(max-width:720px){
 .top{padding:8px 12px;gap:8px}
 .brand{font-size:15px}
 .roles{width:100%;margin-left:0}
 .roles .seg{display:none}
 .roles .rsel{display:block;flex:1}
 main{padding:16px 12px 32px}
 footer{padding:12px}
 .nav{padding:0 8px;overflow-x:auto}
 .nav a{padding:0 8px;white-space:nowrap}
 .tbl-wrap{display:none}
 .cards{display:block}
 .tools .search{width:100%}
 .tools select{flex:1;min-width:150px;padding-right:24px}
 .fgrid{grid-template-columns:1fr}
 .radios{grid-template-columns:1fr}
 .copts{grid-template-columns:1fr 1fr}
 .panel{padding:14px}
 .dl{grid-template-columns:1fr;gap:2px}
 .dl dt{margin-top:8px}
 .st span{display:none}
 .st.on span{display:inline}
 .figs{grid-template-columns:1fr}
 .side fieldset{padding:8px 10px;margin-bottom:8px}
 .hint .dsk{display:none}
 .mode{margin-bottom:8px}
 h1{font-size:19px;line-height:24px}
 .toast{left:12px;right:12px;bottom:12px;max-width:none}
 .ovl{padding:0}

function handleUpload(inp){
 var f=inp.files&&inp.files[0],key=inp.dataset.up,er=$('#upErr');
 function bad(t){er.textContent=t;er.hidden=false}
 if(!f)return;er.hidden=true;
 if(!/^image\/(png|jpeg)$/.test(f.type)){bad('Нужен файл PNG или JPG. Для PDF сначала сохраните страницу как картинку.');inp.value='';return}
 if(f.size>8*1024*1024){bad('Файл больше 8 МБ. Уменьшите картинку и загрузите снова.');inp.value='';return}
 var fr=new FileReader();
 fr.onload=function(){
  var im=new Image();
  im.onload=function(){state.uploads[key]={src:fr.result,w:im.naturalWidth,h:im.naturalHeight};save();render();toast('План загружен: '+planTitle(key)+'. Теперь точки ставятся на нём.')};
  im.onerror=function(){bad('Не удалось открыть картинку. Попробуйте другой файл.')};
  im.src=fr.result;
 };
 fr.onerror=function(){bad('Не удалось прочитать файл.')};
 fr.readAsDataURL(f);
}

 if(k==='hist'&&r){go('#/hist/'+encodeURIComponent(r.inv));return}
 if(k==='again'){guideStart();return}
 if(k==='min'||k==='max'){g.min=k==='min';save();renderGuide();return}
 if(k==='end'){state.guide={on:false,rid:null,min:false};save();renderGuide();toast('Подсказка закрыта. Вернуть её можно кнопкой «Пройти по шагам».');return}
}
function welcome(){
 openModal('<div class="mh"><b>Прототип системы заявок</b><button type="button" class="btn sm line mclose" data-act="mclose2">'+ic('x')+'Закрыть</button></div><div class="mb welcome">'+
 '<p>Это кликабельный прототип. Данные вымышленные и хранятся только в вашем браузере, так что можно нажимать что угодно.</p>'+
 '<p><b>Путь заявки:</b></p><ol><li>Инициатор создаёт заявку и ставит на схеме точки «откуда» и «куда».</li><li>Система сама собирает маршрут согласования по коммуникациям.</li><li>Руководитель и службы согласуют или возвращают с замечанием.</li><li>Задача уходит исполнителю в Jira, он берёт её в работу и отмечает выполнение.</li><li>Перенос попадает в историю оборудования.</li></ol>'+
 '<p>Роль меняется вверху справа. Проще пройти путь с подсказками, это минуты две.</p>'+
 '<div class="btns" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn pri" data-act="guideStart">'+ic('info')+'Пройти по шагам</button><button type="button" class="btn line" data-act="mclose2">Посмотрю сам</button></div></div>');
}

/* ---------- события ---------- */
document.addEventListener('click',function(ev){
 var t=ev.target;
 var row=t.closest&&t.closest('[data-open]');
 if(row&&!t.closest('a,button[data-act]')){go('#/req/'+encodeURIComponent(row.dataset.open));return}
 var a=t.closest&&t.closest('[data-act]');
 if(a){
  var act=a.dataset.act;
  if(act==='mclose'){if(t.id==='ovl')closeModal();return}
  if(act==='mclose2'){closeModal();return}
  if(act==='role'){state.role=a.dataset.r;save();filters.mine=false;render();return}
  if(act==='newReq'){draft=newDraft();go('#/new');return}
  if(act==='g'){gAction(a.dataset.g);return}
  if(act==='guideStart'){guideStart();return}
  if(act==='mine'){filters.mine=!filters.mine;a.setAttribute('aria-pressed',filters.mine);fillListBody();return}
  if(act==='clearF'){filters={q:'',st:'',mine:false};render();return}
  if(act==='export'){exportCSV();return}
  if(act==='next'){nextStep();return}
  if(act==='back'){draft.step--;draft.e={};refreshWiz();return}
  if(act==='submit'){submitDraft();return}
  if(act==='mode'){draft.mode=a.dataset.m;rerenderWiz();return}
  if(act==='zoom'){
   var pv=a.closest('.pv'),z=Math.min(4,Math.max(1,parseFloat(pv.dataset.zoom)*parseFloat(a.dataset.f)));
   pv.dataset.zoom=z;$('.plan',pv).style.width=(z*100)+'%';var zv=$('.zv',pv);if(zv)zv.textContent=Math.round(z*100)+'%';if(pv.dataset.wiz)draft.zoom=z;return;
  }
  if(act==='decide'){decide(a.dataset.rid,a.dataset.d);return}
  if(act==='resubmit'){resubmit(a.dataset.rid);return}
  if(act==='jira'){jiraModal(getReq(a.dataset.rid));return}
  if(act==='jstatus'){
   var r=getReq(a.dataset.rid),now=nowISO(),ex=state.role==='admin'?'Администратор (за исполнителя)':'Орлов В. Н.',cm=$('#cmt'),c=cm?cm.value.trim():'';
   if(!r||!canExec(r))return;
   if(a.dataset.to==='work'){r.status='В работе';r.jira.status='В работе';r.log.push({t:now,who:ex,text:'Взял задачу '+r.jira.key+' в работу (статус пришёл из Jira)'});r.log.push({t:now,who:'Система',text:'Уведомление отправлено инициатору: '+r.init})}
   else{r.status='Выполнена';r.jira.status='Готово';r.log.push({t:now,who:ex,text:'Работы выполнены'+(c?'. «'+c+'»':'')+' (статус пришёл из Jira)'});r.log.push({t:now,who:'Система',text:'Заявка закрыта. Уведомление отправлено инициатору: '+r.init})}
   save();render();window.scrollTo(0,0);toast(r.status==='В работе'?'Заявка в работе. Инициатор получил уведомление.':'Заявка выполнена. Инициатор получил уведомление, история оборудования обновилась.');return;
  }
  if(act==='viewer'){
   var rq=getReq(a.dataset.rid),fg=figures(rq)[+a.dataset.i];
   openModal('<div class="mh"><b>'+esc(fg.title)+'</b><button type="button" class="btn sm line mclose" data-act="mclose2">'+ic('x')+'Закрыть</button></div><div class="mb">'+pvHTML(fg.key,fg.marks,{tools:true,zoom:isMobile()?2.2:1})+'</div>');return;
  }
  if(act==='upReset'){delete state.uploads[a.dataset.key];save();render();toast('Вернули схему по умолчанию.');return}
  if(act==='resetDemo'){try{localStorage.removeItem(LS)}catch(e){}state=initialState();state.seen=true;filters={q:'',st:'',mine:false};draft=null;closeModal();save();go('#/list');toast('Демо-данные сброшены.');return}
 }
 var pl=t.closest&&t.closest('.plan.int');
 if(pl&&!t.closest('.mk')&&draft){
  var rc=pl.getBoundingClientRect(),x=(ev.clientX-rc.left)/rc.width*100,y=(ev.clientY-rc.top)/rc.height*100;
  placePoint(draft.mode,x,y);
 }
});
function clamp(v){return Math.round(Math.min(100,Math.max(0,v))*10)/10}
function placePoint(side,x,y){
 var o=side==='A'?draft.from:draft.to;o.x=clamp(x);o.y=clamp(y);draft.e.pts='';
 var e=$('#e-pts');if(e)e.hidden=true;
 if(side==='A'&&draft.to.x==null){
  draft.mode='B';
  if(draft.from.b+'-'+draft.from.f!==draft.to.b+'-'+draft.to.f){rerenderWiz();return}
 }
 updateWizPlan();
 var mb=$$('.mode button');mb.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===draft.mode)});
}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
/* перетаскивание точек */
var drag=null;
document.addEventListener('pointerdown',function(ev){
 var m=ev.target.closest&&ev.target.closest('.plan.int .mk');
 if(!m||!draft)return;
 drag={s:m.dataset.mk,pl:m.closest('.plan')};try{m.setPointerCapture(ev.pointerId)}catch(e){}
 ev.preventDefault();
});
document.addEventListener('pointermove',function(ev){
 if(!drag)return;
 var rc=drag.pl.getBoundingClientRect(),o=drag.s==='A'?draft.from:draft.to;
 o.x=clamp((ev.clientX-rc.left)/rc.width*100);o.y=clamp((ev.clientY-rc.top)/rc.height*100);
 var el=drag.pl.querySelector('.mk-'+drag.s);if(el){el.style.left=o.x+'%';el.style.top=o.y+'%'}
});
function endDrag(){if(!drag)return;drag=null;updateWizPlan()}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

document.addEventListener('input',function(ev){
 var t=ev.target;
 if(t.id==='q'){filters.q=t.value;fillListBody();return}
 if(t.dataset&&t.dataset.f&&draft){
  draft[t.dataset.f]=t.value;
  if(t.dataset.f==='name'&&t.value.trim().length>=2){draft.e.name=false;t.classList.remove('bad');t.removeAttribute('aria-invalid');var e=$('#e-name');if(e)e.hidden=true}
 }
 if(t.id==='cmt'&&t.value.trim()){t.classList.remove('bad');var ec=$('#e-cmt');if(ec)ec.hidden=true}
});
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.id==='fst'){filters.st=t.value;fillListBody();return}
 if(t.id==='rsel'){state.role=t.value;save();filters.mine=false;render();return}
 if(t.dataset&&t.dataset.comm&&draft){var c=t.dataset.comm,i=draft.comms.indexOf(c);if(t.checked&&i<0)draft.comms.push(c);if(!t.checked&&i>=0)draft.comms.splice(i,1);return}
 if(t.dataset&&t.dataset.f==='type'&&draft){draft.type=t.value;return}
 if(t.dataset&&t.dataset.sel&&draft){
  var p=t.dataset.sel.split('.'),o=draft[p[0]];
  if(p[1]==='b'){o.b=t.value;o.f=bld(o.b).floors[0]}else o.f=+t.value;
  o.x=null;o.y=null;
  draft.mode=p[0]==='from'?'A':'B';
  rerenderWiz();return;
 }
 if(t.dataset&&t.dataset.rule){var r=state.rules.filter(function(x){return x.id===t.dataset.rule})[0];r.on=t.checked;save();render();toast(t.checked?'Правило включено. Действует для новых заявок.':'Правило выключено. Действует для новых заявок.');return}
 if(t.dataset&&t.dataset.up){handleUpload(t);return}
});
document.addEventListener('keydown',function(ev){
 if(ev.key==='Escape'&&$('#ovl'))closeModal();
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('tr[data-open]')){ev.preventDefault();go('#/req/'+encodeURIComponent(ev.target.dataset.open))}
});

render();
if(!state.seen){state.seen=true;save();welcome()}
})();
</script>
</body>
</html>
