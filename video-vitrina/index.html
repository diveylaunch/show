だ画像を切り取るのではなく、実際に垂らす動画演出のようにしてください。」", "img": "https://pbs.twimg.com/amplify_video_thumb/2106603881904197632/img/Vpb8x482DBxgR0Bf.jpg", "post": "https://x.com/Kaiyu_AI/status/2106605246235762929", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106603881904197632/vid/avc1/480x270/LdXYwyo_TGhgrMGV.mp4", "orig": "https://video.twimg.com/amplify_video/2106603881904197632/vid/avc1/1920x1080/rrKF8QMwI92yxFO5.mp4", "rem": ""}, {"n": 505, "c": "interactive", "t": [], "a": "aichrislee", "p": "Build me a jet engine in interactive 3D, from intake to exhaust, in one HTML file with Three.js.\n\nMake it look real: the big front fan, the compressor stages, the combustion chamber glowing inside, the turbine and the nozzle. The fan and the shafts spin. I can drag to orbit around it and scroll to zoom.\n\nAdd an Explode button. When I press it, every part slides apart along the engine's axis with its name on a label. Press it again and it all snaps back together. When I hover a part, it lights up and shows one line on what it does.\n\nNo images. Do not ask me any questions. Just build it.", "img": "https://pbs.twimg.com/ext_tw_video_thumb/2106535291490078720/pu/img/bMMjvxCgGNOxoUHM.jpg", "post": "https://x.com/aichrislee/status/2106535528149479847", "v": true, "x": true, "card": "https://video.twimg.com/ext_tw_video/2106535291490078720/pu/vid/avc1/480x270/GWxsOexxNGtPasEM.mp4?tag=12", "orig": "https://video.twimg.com/ext_tw_video/2106535291490078720/pu/vid/avc1/1280x720/F0S2-OkdzLIEQ46R.mp4?tag=12", "rem": ""}, {"n": 506, "c": "interactive", "t": [], "a": "ivanainai", "p": "Create a beautiful, interactive 3D browser artwork of a single stained-glass hibiscus flower.\nUse the attached leaf as a reference for material delicacy, intricate veins, translucent colours and restrained presentation. Create an original flower composition.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106462402082430976/img/uHjCWdroO1tDA8ep.jpg", "post": "https://x.com/ivanainai/status/2106481339193245918", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106462402082430976/vid/avc1/320x360/qJRA6cUOYMCnnvO8.mp4", "orig": "https://video.twimg.com/amplify_video/2106462402082430976/vid/avc1/1080x1218/YkuIozvlekUEhzwH.mp4", "rem": ""}, {"n": 507, "c": "3d", "t": [], "a": "dan__proggg", "p": "No CAD, no Blender. Just Claude Opus 5.5 and a browser\n\nA full five-story pagoda, built joint by joint from a blueprint - 28.5 m, 343 steps 🏯 #claude #threejs", "img": "https://pbs.twimg.com/amplify_video_thumb/2106477046503194624/img/DN9qhVjNQ9Nq0IbE.jpg", "post": "https://x.com/dan__proggg/status/2106477834873274533", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106477046503194624/vid/avc1/524x270/Ur3WBQbwVLhVi3cT.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2106477046503194624/vid/avc1/1400x720/Oah5AYsiFDsxOmqu.mp4?tag=14", "rem": ""}, {"n": 508, "c": "3d", "t": [], "a": "riyadbkhsh", "p": "Make a launch video for my side project.\nNo After Effects. \nNo stock music. \nJust code:\n– music made from scratch\n– a 3D Times Square from real NYC data\n– 605 billboards lighting up on the beat", "img": "https://pbs.twimg.com/amplify_video_thumb/2106465415715012608/img/uq7vp3_vN3UaIMQl.jpg", "post": "https://x.com/riyadbkhsh/status/2106467130963300736", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106465415715012608/vid/avc1/480x270/c2f7JlW8qWz8gGPa.mp4", "orig": "https://video.twimg.com/amplify_video/2106465415715012608/vid/avc1/1920x1080/POpzGitQaqzooBeZ.mp4", "rem": ""}, {"n": 509, "c": "motion", "t": [], "a": "paripune", "p": "Made a short film about faith. One unbroken line draws the whole story. It traces every object, the image fills in, and the line flows on to the next. Write the code for every frame.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106457713698013184/img/3QXXDJMSWGW0nPTd.jpg", "post": "https://x.com/paripune/status/2106458692669657175", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106457713698013184/vid/avc1/320x568/fmuqNz3vEB0al4N9.mp4", "orig": "https://video.twimg.com/amplify_video/2106457713698013184/vid/avc1/1080x1920/4iWPk_neXRN3-xs4.mp4", "rem": ""}, {"n": 510, "c": "explainer", "t": [], "a": "hariBuilds_", "p": "Build a complete data animation about Earth’s most isolated location. Visualize Point Nemo, orbital altitude vs. terrestrial distance, and the oceanic spacecraft cemetery.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106440439624810496/img/DXAU0LsAsStJ5tkx.jpg", "post": "https://x.com/hariBuilds_/status/2106440528435007643", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106440439624810496/vid/avc1/320x568/BMNmp7zj7rLkHXOr.mp4", "orig": "https://video.twimg.com/amplify_video/2106440439624810496/vid/avc1/1080x1920/bQZsBBnio4PspXqV.mp4", "rem": ""}, {"n": 511, "c": "interactive", "t": [], "a": "tarunyadav9761", "p": "Create a promo video from scratch with zero templates.\n• Built and run the native macOS app to capture real 2x Retina screenshots\n• Script and time a full voiceover with word-level kinetic captions\n• Write a procedural synth engine for the background track and SFX\n• Animate 12 scenes in Remotion with 3D perspective tilts and spring physics\n• Render a full 1080p 60fps cut ready for X", "img": "https://pbs.twimg.com/amplify_video_thumb/2106435025503952896/img/2ywco_hhaOL7Ivyx.jpg", "post": "https://x.com/tarunyadav9761/status/2106435688292053244", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106435025503952896/vid/avc1/480x270/28Tw5lZUYzYO3s-c.mp4", "orig": "https://video.twimg.com/amplify_video/2106435025503952896/vid/avc1/1920x1080/OH3yJYQYbTbv1v5j.mp4", "rem": ""}, {"n": 512, "c": "interactive", "t": [], "a": "abyssallD", "p": "One prompt: a video of all progress, then n years into the future. A painted rocket, not a white tube. White nose. White body. A black band with a white triangle. Another dark ring lower down. Panel lines on the nose once the onboard camera looks straight down. Then the broadcast. Countdown. Water on the deck. Ignition. The tower drops away. Long tracker. Beach shot as it goes supersonic. Nine cameras. A clock that actually moves. Max-q on the overlay like a real feed.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106433755158065152/img/kpv8XsLhW2eH2MrX.jpg", "post": "https://x.com/abyssallD/status/2106434250467602690", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106433755158065152/vid/avc1/480x270/t3_EnTmGOzUMkqLj.mp4", "orig": "https://video.twimg.com/amplify_video/2106433755158065152/vid/avc1/1920x1080/IHYZW2CFhfhWZwFj.mp4", "rem": ""}, {"n": 513, "c": "motion", "t": [], "a": "flxrnc", "p": "@claudeai mascot directed my cat's first movie. every frame is code. no after effects. a tiny film set, a tuxedo cat as the star, a live monitor, and a slow blink straight into the lens.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106431421665386497/img/QOGdtSXmUPjgPHaq.jpg", "post": "https://x.com/flxrnc/status/2106434118640619627", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106431421665386497/vid/avc1/480x270/J4jgX3kGb3m6zpMc.mp4", "orig": "https://video.twimg.com/amplify_video/2106431421665386497/vid/avc1/1920x1080/B7TQRA9-sG02JcNf.mp4", "rem": ""}, {"n": 514, "c": "explainer", "t": [], "a": "ulyssexbt", "p": "Make a film about its own prompt.\n15 seconds. 0 keyframes. 0 samples\nevery frame is code. every sound is code. even the equalizer is dancing to its own soundtrack\n\nstep 1 → score first - the music is written in code at 120 BPM, every beat exported as data\nstep 2 → one function draws everything - seek(t) paints frame t, no timers, no randomness\nstep 3 → the visuals hear the song - FFT on its own mix, the bars are the real track\nstep 4 → it grades itself - one still per beat, scored 1-10, fixes the lowest on camera", "img": "https://pbs.twimg.com/amplify_video_thumb/2106381915716501504/img/7iTiXJmUOe1k8Ycw.jpg", "post": "https://x.com/ulyssexbt/status/2106383971093205279", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106381915716501504/vid/avc1/480x270/B0jTZFv1KaU1Ycx2.mp4", "orig": "https://video.twimg.com/amplify_video/2106381915716501504/vid/avc1/1920x1080/8pecume3lG7pCfZi.mp4", "rem": ""}, {"n": 515, "c": "motion", "t": [], "a": "ponzponz15", "p": "1. LPを9つの場面に分解して縦型動画の構成に。コピーは一字一句そのままWebフォントで組み直し、ロゴはSVGで描き直し。\n\n2. 元画像の人物写真は150px前後で、拡大すると崩れる → 高解像度に再生成 Codex呼び出し\n\n3. 動きはHTML/CSS/JavaScript（髪の揺れはWebGL）で書いて、ブラウザで1フレームずつ撮影して60fpsに。動画編集ソフトは不使用。BGMはLyria 3 Pro。", "img": "https://pbs.twimg.com/amplify_video_thumb/2106303445183684608/img/4yBbrOGa8o-BHlme.jpg", "post": "https://x.com/ponzponz15/status/2106307182019145882", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106303445183684608/vid/avc1/290x270/amMrKSkBMYOMTL50.mp4", "orig": "https://video.twimg.com/amplify_video/2106303445183684608/vid/avc1/2160x2000/DT9DKx3FPMKyjnh3.mp4", "rem": ""}, {"n": 516, "c": "explainer", "t": [], "a": "HenrygSing", "p": "给它一份讲稿和一段“导演要求”（风格参照 Kurzgesagt × 皮克斯开场）。它先出方案，我确认后再动手。它先写 STORYBOARD.md，每一场写清时间、画面、文字、转场。用 Remotion 一场一场搭。还有一个就是在本地用微软的TTS 生成语音。免费。", "img": "https://pbs.twimg.com/amplify_video_thumb/2106205976911310849/img/GZ2kjVfQxEM8Egrg.jpg", "post": "https://x.com/HenrygSing/status/2106208175792050247", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106205976911310849/vid/avc1/480x270/sgbbTu3ig_Ot1L57.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2106205976911310849/vid/avc1/1280x720/Pta8ef_raXRWZiy_.mp4?tag=14", "rem": ""}, {"n": 517, "c": "motion", "t": [], "a": "twoclipping", "p": "<inputs>\nAsk me for: my product's name (one lowercase word), a 4-word tagline, the 3-step story of what it does, a launch date and domain, a royalty-free song with a clear drop, 4 vertical talking-to-camera clips and 12 portrait photos. If I skip any, use the defaults: \"castr\", \"ugc ads, cast by ai\", write a brief → scan 1,000 creators → cast 4, Mixkit \"Cat Walk\" (129.6 BPM, drop at 29.7s), free Pexels clips and portraits, and transparent stickers from Pixabay (serum, mic, megaphone, vintage camera, spotlight, lips).\n<\/inputs>\n\n<direction>\nA 25 second square launch trailer, 1440x1440 at 60fps, loud poster style. Cobalt #2B3BFF, ink #0E0F1F, cream #F6E4C6, pink #FF7DC7, tangerine #FF5A1F. Archivo 900 extra-condensed for names, expanded for headlines, Geist and Geist Mono for labels. Op-art sunburst, scrolling waves, film grain. Real media only: the clips play inside the design, and the stickers get a white die-cut border and a soft shadow.\nMotion rules: the camera never stops (a slow 1.03-1.07 push on every scene), nothing pops in (letters rise through a mask line one by one), nothing snaps to the beat (patterns rotate continuously), swaps are carousel glides of about 0.55s, colour changes fade over about 0.35s, stickers ease in and then keep a slow sway. No full stops after the wordmark or any headline.\nBanned: beat-snapped rotations, pop-in slams, white flashes, crossfades between scenes, hard cuts, templates.\n<\/direction>\n\n<structure>\n54 beats. The song starts 8 beats before its drop.\nBeats 0-8: a cobalt sunburst turns around a breathing cream disc. The wordmark types in with a gliding caret and the tagline pill rises. The disc floods the frame into the drop.\nBeat 8, the drop: the cream becomes the face of a 3D box and \"ONE BRIEF\" rises letter by letter. The camera pulls back to the box floating on waves. On beat 12 it turns to \"1,000 CREATORS\" (stacked, with outlined echoes), on beat 14 to \"ZERO DMs\".\nBeats 16-22: a whip to a dark desk. A tangerine \"BRIEF #042\" ticket types its rows (product, vibe, cast, due), stickers drift on, a polaroid of a real clip drops onto the corner, and a \"NOW CASTING\" stamp presses down on beat 20.\nBeats 22-34: the casting stage. A crowd of black and white portraits in an arc, a 3D stage block, and the creators gliding through like a carousel. Each plays live in a big disc in black and white, with their name in pink on the stage, their followers, and a MATCH % that counts up. One beat later a \"CAST ✓\" stamp lands and the clip fades to colour. A counter rolls 1/4 to 4/4.\nBeats 34-39: pink floods out of the last disc. The disc morphs into a phone screen (the clip keeps playing) and fans into 4 phones playing all 4 creators, with views counting up. \"4 ADS\" and \"BY FRIDAY\" rise.\nBeats 39-44, the music's break: the pink floor drops away and a cream \"JOIN THE WAITLIST\" ticket glides down onto the sunburst. On the pickup its stub tears off.\nBeats 44-54: the ticket body morphs into a poster arch. The wordmark rises in, then the tagline, then an info bar slides up in 3 blocks (date, numbers, domain) and a ticker runs round the frame edge. Then it all folds back into the opening disc, so the last frame is the first.\n<\/structure>\n\n<build>\n1. One HTML canvas. Every frame is a pure function of time inside seek(t).\n2. A beat map in beats, B = 60/BPM, with the song placed so its drop lands on beat 8.\n3. The 3D box is an orthographic projection: each face is a 1440px offscreen canvas drawn with an affine transform and shaded by its normal.\n4. Cut the clips to 30fps JPEG sequences with ffmpeg, draw frame floor(t*30), and do the black and white with ctx.filter.\n5. Trim the sticker PNGs and add the die-cut border by dilating their alpha.\n6. Sound: a downloaded SFX for every event (a shutter on every cast, whooshes on the glides, key clicks on the typing), each placed by its measured peak. Loudnorm to -14 LUFS.\n7. Render with Playwright at 60fps with 8 motion-blur subframes. Scan for single-frame pops, then compare its motion against a reference video (hard jumps per second, share of still frames).\n<\/build>\n\n<gotchas>\nA pattern that rotates one notch per beat reads as stutter: rotate it continuously, and pick each ring's speed so it lands on the same pattern at the last frame. 4 subframes ghost on fast whips, so use 8. A layer whose background is a huge flood circle still covers the screen after sliding down one frame height, so switch it to a full-frame rect once it has flooded. Counters read the frame's time, not the subframe's. The disc must morph inside the same camera transform as the scene it leaves, or it jumps.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the beat map and 6 stills (open, box, brief, casting, phones, poster) before you render.\n<\/start>", "img": "https://pbs.twimg.com/amplify_video_thumb/2106100402835869696/img/LXDT_GPsLqMfR17L.jpg", "post": "https://x.com/twoclipping/status/2106101258834551116", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106100402835869696/vid/avc1/320x320/vQcF6E8bhEqt-DV1.mp4", "orig": "https://video.twimg.com/amplify_video/2106100402835869696/vid/avc1/1080x1080/beYZ1kiLecYtf6_1.mp4", "rem": ""}, {"n": 518, "c": "explainer", "t": [], "a": "michaelraspuzzi", "p": "explain loop transformers in a youtube animated short. search web for some real papers to read too.\n\nswitch up scenes, and make the visual narrative more compelling. also, make sure hook creates a curiosity gap for real world application on why this matters.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106082956771217409/img/knWMwB9KwXefuZdG.jpg", "post": "https://x.com/michaelraspuzzi/status/2106083592820740595", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106082956771217409/vid/avc1/320x568/-grPWOcDBrEYWOg5.mp4", "orig": "https://video.twimg.com/amplify_video/2106082956771217409/vid/avc1/1080x1920/49h_pE04-l1O1yAP.mp4", "rem": ""}, {"n": 519, "c": "explainer", "t": [], "a": "woojinrad", "p": "Read the attached article and make a 25-second animated explainer (1080×1350, 24 fps) in a colored-pencil storybook style, drawn entirely in JavaScript on an HTML canvas, with a soundtrack synthesized using the Web Audio API. Pick 3 main ideas, give each a short caption taken from the text, and use one simple original character. Show me the storyboard first, then render it to MP4.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106082690361352192/img/wnqVmOQkgDZujIw2.jpg", "post": "https://x.com/woojinrad/status/2106083299462455731", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106082690361352192/vid/avc1/320x400/4vDY5XG1M_Fkcvky.mp4", "orig": "https://video.twimg.com/amplify_video/2106082690361352192/vid/avc1/1080x1350/2C_zP0SvuAX8t-W2.mp4", "rem": ""}, {"n": 520, "c": "motion", "t": [], "a": "AIMevzulari", "p": "Bu herhangi bir görüntü üretim modeli kullanmadan, yaratıcı olarak yapabileceğin en iyi şekilde Canvas 2D ile animasyona çevir. Konu: Galileo 1638'de sorduğu Bir top A noktasından B'ye en hızlı hangi yoldan iner? sorusuna karşılık kendi çözümü olan Düz rampa en kısa yol ama en hızlısı değil! Galileo çember yayının daha hızlı olduğunu gösterdi. Asıl cevabı (cycloid) 1696'da Bernoulli buldu.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106050684600639488/img/W2qiyUL_w3A9zgaK.jpg", "post": "https://x.com/AIMevzulari/status/2106052083040256293", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106050684600639488/vid/avc1/480x270/JEHuVauCeK8ela_E.mp4", "orig": "https://video.twimg.com/amplify_video/2106050684600639488/vid/avc1/1920x1080/RbXlrn60nLM7Ti2u.mp4", "rem": ""}, {"n": 521, "c": "motion", "t": [], "a": "testlandblog", "p": "wie funktioniert eine dampfmaschine, gib mir das bitte als Erklärvideo im 3Blue1Brown-Stil aus", "img": "https://pbs.twimg.com/amplify_video_thumb/2105990637191311360/img/ddRb-C9jhfgZx0WU.jpg", "post": "https://x.com/testlandblog/status/2105991032571617500", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105990637191311360/vid/avc1/480x270/PtDIl47VHz_GgcfE.mp4", "orig": "https://video.twimg.com/amplify_video/2105990637191311360/vid/avc1/1920x1080/XxiK5XkKY9R0ovwX.mp4", "rem": ""}, {"n": 522, "c": "motion", "t": [], "a": "minochan0824", "p": "新機能のリリースに関してイメージ動画みたいなの作りたいんだけど、モーショングラフィックスとか作れる？\n参考はね、こういうやつ。（プロダクトローンチとかでよく見るUI動く系の参考のXリンク貼る）\nアップデート内容は、管理画面から音声テスト確認できるようになった（管理画面のスクショ貼る）", "img": "https://pbs.twimg.com/amplify_video_thumb/2105922161794007040/img/Lpw3mpHrFG8MowMj.jpg", "post": "https://x.com/minochan0824/status/2105933530190827805", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105922161794007040/vid/avc1/480x270/T82LaGdA0DQeKfxB.mp4", "orig": "https://video.twimg.com/amplify_video/2105922161794007040/vid/avc1/1920x1080/0PXlBLNfF1vncLiB.mp4", "rem": ""}, {"n": 523, "c": "motion", "t": [], "a": "twoclipping", "p": "<inputs>\nAsk me for: my product's name (nightshift) (one lowercase word, it becomes a black wordmark with a period), the one job a user hands it before bed (book 10 sales calls this week), the three results it reports by morning (200 leads found / 200 emails sent / 10 calls booked), two photos of the same place at night and by day (aligned, so a crossfade reads as a real sunrise), one sunny daytime photo for outside the logo, and a song with a big hit near its start. If I skip any, use the defaults.\n<\/inputs>\n\n<direction>\nA 24 second square product launch video, 1440x1440 at 60fps, 2D only, one continuous take that loops. The whole video happens inside the period of the wordmark. Outside it's daytime (the sunny photo behind a black wordmark). Inside it's the night photo under iOS-style glass panels (the blurred photo behind each panel, a tint, a rim light). Nothing cuts: every scene grows out of the last, shapes morph, dots fly, colours change under floods. Every morph glides 0.8s on cubic-bezier(.45,0,.15,1) and the camera zoom rides the same curve. Geist, the real macOS pointer, soft shadows that grow with each shape's height.\nBanned: flat or gradient backgrounds made in code, camera zooms into tiny points, hard cuts, crossfades between scenes, bouncy springs, particles, glows, holds longer than 1s, cropped type.\n<\/direction>\n\n<structure>\nBeats are the song's. The song enters on its big hit as the first pill appears.\nOpen: the letters slide into the period and vanish into it while it glides to the middle. The period opens like an iris onto the night inside it, and \"you log off at 6\", then \"[product] doesn't\", roll through one mask line over the night photo.\nAsk: a glass \"Ask [product]\" pill springs in. The cursor clicks it, it glides into an input and the job types out.\nFind: send shrinks the input to a dot that ripples into a 23x15 grid. A scan line sweeps it, 200 dots light up and a counter counts them.\nWrite: the lit dots pour into a glass email composer. A second, purple cursor labelled \"[product]\" types a personal opener and presses Send, and the counter runs to 200/200.\nNight: the composer becomes a glass orb with a progress ring. A clock chip swaps 11:42 PM, 3:17 AM, 5:02 AM, 6:59 AM while the sky relights from night to dawn and \"while you sleep\" rolls in.\nResults (beat 20): the orb turns black and goo-splits into the three result pills. The checks pop green.\nMorning: the pills merge into a Dynamic Island that grows into a phone lock screen: the day photo, the date, a big 7:00, the bezel growing out of the screen edge. Three glass notifications stack in, and the cursor taps the first, which opens like iOS.\nProof: a week calendar (10 meetings pop in, a hover shows one's time), then a pipeline chart ($48,200 counts up, the line draws, a hover follows it). A black flood from the line's end becomes \"Start your night shift →\" and the cursor clicks it.\nOut: the button shrinks into a dot, the whole scene closes down into it like an iris, and the letters slide back out of the period. The tagline rises. Last frame = first frame.\n<\/structure>\n\n<build>\n1. One HTML canvas. Everything is a pure function of time inside seek(t): no timers, no state between frames.\n2. One element morphs through every state (size, radius, colour, material) from a table of beat times, so retiming is one edit.\n3. Render the inside world into an offscreen canvas and reveal it through the period with a circular mask. Never zoom the camera into the dot.\n4. Glass: a pre-blurred copy of the photo clipped to the shape, then a tint and a gradient rim.\n5. Goo: blur + alpha threshold on an offscreen layer for the split and the merge.\n6. Sound: a downloaded SFX for every event, each placed by its measured peak. The song enters on its hit. Loudnorm to -14 LUFS.\n7. Render with Playwright at 60fps with 4 motion-blur subframes. Scan every frame for single-frame jumps and fix each one.\n<\/build>\n\n<gotchas>\nA camera zoom into an off-centre dot swings sideways and spikes, so open the dot instead. Ease a closing iris by area, not radius, or its first frames jump. A helper that sets globalAlpha must restore the caller's, or fading cards pop. Counters read the frame's time, not the subframe's, or the digits smear.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the beat map and 6 stills (open, find, write, results, phone, out) before you render.\n<\/start>", "img": "https://pbs.twimg.com/amplify_video_thumb/2105927334729502720/img/yZZvvWv1sOfR0LdS.jpg", "post": "https://x.com/twoclipping/status/2105927781678747965", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105927334729502720/vid/avc1/320x320/17vUF06AK1vcAkLf.mp4", "orig": "https://video.twimg.com/amplify_video/2105927334729502720/vid/avc1/1440x1440/O7oiCtmzl7aXXGtN.mp4", "rem": ""}, {"n": 524, "c": "3d", "t": [], "a": "generussai", "p": "animate golden ratios and mandlebrot sets, sacred geometry and cymatics in a well thought out eye candy javascript or 3js 3d animated video. use motion animation to show off your skills and push the limits with quick cuts, vibrant colors and cute but badass characters. make it like an adult cartoon you'd watch on adult swim", "img": "https://pbs.twimg.com/amplify_video_thumb/2105910102125600768/img/vUn7-mtR0AqlqcbV.jpg", "post": "https://x.com/generussai/status/2105921281673904308", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105910102125600768/vid/avc1/480x270/_mVhlX3I0qRkmiti.mp4", "orig": "https://video.twimg.com/amplify_video/2105910102125600768/vid/avc1/1920x1080/ENUoJrB4J_Jt5MUz.mp4", "rem": ""}, {"n": 525, "c": "motion", "t": [], "a": "qianqiongge", "p": "请在当前项目做一支 15 秒的产品使用说明视频，使用 Remotion，竖版 1080×1920、30fps、共 450 帧。只用 assets 目录里提供的商品图和我给出的事实，不下载陌生素材，不补销售数据。\n\n第 0 至 3 秒展示商品与一句使用场景。第 3 至 9 秒演示两步操作，每步只出现一个动作。第 9 至 13 秒展示结果，并保留能看清的停留时间。最后 2 秒显示产品名称，不加购买引导。\n\n先列分镜与素材缺口，再做预览。字幕单独排版，动效以当前帧号计算。不要用真实时钟驱动时间线，也不要使用不固定的随机数。商品、文字、镜头时间分别配置，方便以后替换。\n\n交付可编辑项目、启动与渲染命令、MP4，以及第 1、5、10、14 秒的静帧。缺少必要素材时停止并说明，不用假素材代替。”", "img": "https://pbs.twimg.com/amplify_video_thumb/2105901924541464576/img/JQSCc12HeMNpULzy.jpg", "post": "https://x.com/qianqiongge/status/2105902139902246969", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105901924541464576/vid/avc1/432x270/xW_3iyutfWgMIiBA.mp4", "orig": "https://video.twimg.com/amplify_video/2105901924541464576/vid/avc1/1920x1200/ygCpHSH4ZQFaksXD.mp4", "rem": ""}, {"n": 526, "c": "3d", "t": [], "a": "oab10don", "p": "クラウドのLinux環境にBlenderをPythonモジュールとして入れ、シーン構築からレンダーまで全部スクリプトで実行\nステージ、照明、紙吹雪、カメラワークをコードで組み、Cyclesで描画\nグロー、フラッシュ、色収差の後処理とMP4化まで自動\nBGMもサンプル素材なし。キック、スネア、ベース、シンセをnumpyのコードで合成\nダンスの腰の高さを解析し、本来のテンポが約137BPMと特定\n拍ごとにダンスの時間を補正して、全拍で沈み込みがキックと±0.5フレームで一致\nカット、照明、ズーム、質感の切り替えもすべて拍の頭に合わせ、最後の一撃で全員静止\nカメラはPythonで毎フレーム計算。急降下、回り込み、顔のアップから横に振り抜くカットなど\n拍の頭でクローム、ゴールド、ホログラム、ボクセルに質感とメッシュが変わる", "img": "https://pbs.twimg.com/amplify_video_thumb/2105879628590309377/img/gPRpNvj7mJupUnVr.jpg", "post": "https://x.com/oab10don/status/2105879685322457273", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105879628590309377/vid/avc1/320x568/TBe4kC9m5DiVbhBg.mp4", "orig": "https://video.twimg.com/amplify_video/2105879628590309377/vid/avc1/1080x1920/XnqORkGiw97Gdw9Y.mp4", "rem": ""}, {"n": 527, "c": "3d", "t": [], "a": "Xanares", "p": "Make a 37-second demoscene tech demo for the track ~/Downloads/(filename).mp3.\nThe goal is graphics nobody has seen before. Like it's a statement for a new AI demoscene.\n\nStory, in one continuous shot with no cuts:\n- A chrome sphere floats in dark fog. On each hit in the track, it gains one Mandelbox fractal level.\n- In the drop, the object grows until its top face is a landscape. Fly low over it at sunset, then dive off its edge.\n- At the end, the fractal collapses into 3D gold letters of the title. Carve the letters from the same fractal and light them with the same light.\n\nLook: path-traced quality. Soft shadows, ambient occlusion, glossy reflections, fog with light shafts, depth of field, motion blur, bloom.\n\nSync: analyse the track first. Save a JSON beat map with hits, breaks, and kick, snare and hat onsets. Kicks pulse the light. Hats add surface detail.\n\nTech:\n- One WebGL2 fragment-shader raymarcher. One HTML page is both the live player and the render source.\n- Live: 60 fps in Chrome.\n- Offline: 1920x1080 at 60 fps with 16 samples per pixel. Render it in headless Chrome on the Mac GPU, pipe the PNG frames to ffmpeg, and use the MP3 as the audio.\n- Do not use AI image or video generators.\n- Check contact sheets of stills before the full render.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105764181311901696/img/JhfA5mPSyvVgI4-Z.jpg", "post": "https://x.com/Xanares/status/2105770390924738984", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105764181311901696/vid/avc1/480x270/lAfiYrUzr87nkU11.mp4", "orig": "https://video.twimg.com/amplify_video/2105764181311901696/vid/avc1/1920x1080/r_uU-irCB2K2S1AV.mp4", "rem": ""}, {"n": 528, "c": "explainer", "t": [], "a": "_koushikde_", "p": "Make a 15s motion video in code (1920x1080, 60fps, one HTML file drawing every frame from a single seek(t) function, rendered with Playwright + ffmpeg, original synthesized sound at 128 BPM).\nIdea: a blank résumé fills itself in, one skill per bar, and every skill gets proved on screen before it's ticked.\nStory: a paper résumé slams onto a dark page and its rows type in (skills, type, systems, depth, data) → the camera pushes into the orange bullet until it floods the frame → five skill meters fill, each on a different curve → one word swings from thin to black on the beat, then flips through six typefaces → a dot grid ripples and resolves into a pixel mascot → a square tunnel flies at the camera and an extruded \"3D\" slams out → bars trace a spring curve while a counter lands on the reel's real frame count → \"EVERY FRAME ON THE BEAT.\" one word per beat → the résumé comes back, filled in, mascot in the photo box.\nRules: one orange accent carries every transition; springs, never linear; every state change sits on the beat; no corner labels, no fake HUD numbers.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105722944601341952/img/B7L18PHFRU97fIhR.jpg", "post": "https://x.com/_koushikde_/status/2105730717455937635", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105722944601341952/vid/avc1/480x270/P2BeYzYRIsbkMGr2.mp4", "orig": "https://video.twimg.com/amplify_video/2105722944601341952/vid/avc1/1920x1080/CK7NUfi-r9SiBnOP.mp4", "rem": ""}, {"n": 529, "c": "motion", "t": [], "a": "imryven", "p": "Rebuild my Claude Code setup around this tree:\n\n1. Look in ~/.claude/agents and .claude/agents for subagents that already cover explorer, worker and researcher. Draft new ones only for roles that are missing. Set each to model: opus, effort: medium. If an existing subagent is pinned to a different model, list it, don't touch it.\n\n2. Set the main session's effortLevel to high in ~/.claude/settings.json, and set advisorModel to fable.\n\n3. Check for anything disabling the advisor: CLAUDE_CODE_DISABLE_ADVISOR_TOOL, DISABLE_TELEMETRY, any variable blocking feature-flag fetches, and CLAUDE_CODE_EFFORT_LEVEL, which overrides subagent effort. Report what you find. Change nothing yet.\n\n4. Add one line to ~/.claude/CLAUDE.md: consult the advisor before a large plan, when an error repeats, and before marking a long task done.\n\nShow every change as a diff first. Don't touch anything until I say go.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105718703442538496/img/grjx2PHTXArM_qhf.jpg", "post": "https://x.com/imryven/status/2105719735438495965", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105718703442538496/vid/avc1/320x400/PoqUvZLDg1V7nHlp.mp4", "orig": "https://video.twimg.com/amplify_video/2105718703442538496/vid/avc1/2160x2700/6N-dKk-B7-mHz9DY.mp4", "rem": ""}, {"n": 530, "c": "motion", "t": [], "a": "renmu2017", "p": "帮我制作一段视频动画。主题是:“未来已来”，包括音效和音乐。你可以使用任何你觉得合适的工具和技术，如果有需要的话也可以到这个网站https://t.co/rG1XlnIVU5", "img": "https://pbs.twimg.com/amplify_video_thumb/2105671027481354240/img/Vov9nORZoqZVZAgO.jpg", "post": "https://x.com/renmu2017/status/2105675303670477264", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105671027481354240/vid/avc1/480x270/AFgSNV3FKl1Khg85.mp4", "orig": "https://video.twimg.com/amplify_video/2105671027481354240/vid/avc1/1920x1080/dK8FTa-oly9ZsUT7.mp4", "rem": ""}, {"n": 531, "c": "3d", "t": [], "a": "Gdgtify", "p": "Create a 20.00-second kinetic typography film titled “ESCAPE THE ORBIT,” based on John F. Kennedy’s Rice University address, September 12, 1962.\n\nThe central experience: a sentence discovers that it can change its own trajectory.\n\nDeliver one complete, self-contained HTML file. Composition: 1080×1080. Target: 60fps. Use Canvas, SVG, or embedded WebGL. Embed required assets and libraries. The film must work without audio.\n\nEXACT DISPLAY TEXT\n“We choose to go to the moon”\n“[…]”\n“not because they are easy,”\n“but because they are hard”\nPreserve this order. The bracketed ellipsis explicitly indicates omitted speech. Attribution is separate from the excerpt. No additional slogans.\nART DIRECTION\nBackground: midnight # 080D23.\nPrimary type: warm white # FFF4DD.\nTrajectory: electric coral # FF654F.\nSecondary orbital geometry: blue # 6685FF.\nUse a broad, confident grotesque for the speech and a sharply drawn italic for the final emphatic word. Avoid the appearance of a spacecraft dashboard. No rockets, astronaut illustrations, starfield wallpaper, lens flares, or decorative telemetry.\nThe frame should resemble an exceptionally refined astronomical instrument that has become expressive.\n\nCENTRAL VISUAL RULE\nThe baseline of the sentence is a trajectory.\n\nAt first it is trapped in a closed orbit. A rhetorical decision changes that orbit into an open path. The letters remain the same travelers throughout.\nUse an abstract orbital metaphor; do not present invented mission data or imply a physically accurate flight simulation.\nSTORYBOARD\n0.00–3.50\nThe opening excerpt appears across the center, large and horizontal. Reveal it in three meaningful phrase groups.\nA single hairline ellipse passes behind the baseline. A small circular lunar mark occupies its distant focus.\nHold the completed phrase motionless for 700ms.\n\n3.50–6.00\nThe camera pulls back. The previously straight baseline reveals a shallow curvature.\n\nThe phrase travels along the ellipse as a coherent unit. Keep its glyphs upright during the initial movement. Only after the reading hold may they progressively adopt the tangent of the path.\n\nThe viewer realizes the sentence is circling rather than advancing.\n6.00–7.00\nShow the bracketed omission in an uncluttered central opening. The orbital movement decelerates.\n\n7.00–10.50\nReveal the next clause on the near side of the orbit. Its final word travels through one smooth, effortless arc and returns toward where it started.\n\nThis ease should feel elegant but unproductive. Avoid comic bouncing.\n\n10.50–14.50\nReveal the final clause horizontally before transforming it.\nAt its emphasis, the ellipse opens at one precise point. The same tracked letter group takes the new tangent and departs.\nPerform one deliberate 70-degree camera roll. Counter-rotate the active phrase so it remains readable while the orbital field changes orientation around it.\n\nThe trajectory sweeps from lower left to upper right. Acceleration is conveyed by expanding spacing between its trailing marks, not by shaking the camera.\n\n14.50–17.00\nThe camera matches the departing phrase’s velocity. The phrase becomes visually still while the old orbit recedes beneath it.\n\nThe lunar mark enlarges into a restrained crescent through geometric overlap. The crescent brackets the destination without becoming a cartoon illustration.\n17.00–20.00\nResolve into a spacious editorial composition containing the selected excerpt in reading order, including its omission marker.\n\nThe open trajectory runs through the margins and exits the frame. Hold the entire image completely still for the final 1.2 seconds.\n\nCHOREOGRAPHY\nUse only three camera operations: pullback, roll, velocity match.\nGive each operation a rhetorical purpose.\nKeep the currently read phrase at least 64px high in the 1080px composition.\nMotion blur may affect trailing geometry, never the active text.\nNo word may begin its ornamental travel before its reading hold finishes.\n\nIMPLEMENTATION\nRepresent the ellipse and departure path analytically. Blend position and tangent continuously at the departure point; no teleportation.\nUse arc-length sampling for consistent spacing along curves.\nSeparate camera transforms from glyph orientation.\nCache glyph rendering and static geometry.\nExpose window.ready and window. seek(t). Seeking must pause playback and render any time from 0 through 20 deterministically, including out-of-order calls.\nProvide window.frame(n) for n=0…1199 at t=n/60.\nRender t=20 as the final held composition.\nUse no accumulated physics or runtime randomness.\n\nQUALITY GATE\nInspect frames at 0, 3, 5, 7.5, 10.5, 13, 16, and 19 seconds.\nVerify that the same tracked phrase visibly follows its own trajectory.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105125811946770432/img/F2yLy9eiT0bqktqd.jpg", "post": "https://x.com/Gdgtify/status/2105669567036989608", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105125811946770432/vid/avc1/320x320/hpwqnm4aGn8X43dS.mp4", "orig": "https://video.twimg.com/amplify_video/2105125811946770432/vid/avc1/1080x1080/40PB0DJ1q4l6xIXc.mp4", "rem": ""}, {"n": 532, "c": "motion", "t": [], "a": "wozu_co", "p": "please create me a motion design / launch video for supasito dot com it should be under 15 seconds.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105661990794297344/img/GVejtrdfpplhNAfS.jpg", "post": "https://x.com/wozu_co/status/2105662660779893062", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105661990794297344/vid/avc1/480x270/5BrIGGwBj2Uz-S7a.mp4", "orig": "https://video.twimg.com/amplify_video/2105661990794297344/vid/avc1/1920x1080/VgBWv9XtsUCuw439.mp4", "rem": ""}, {"n": 533, "c": "explainer", "t": [], "a": "GabZoFar", "p": "Make one 60-second, 60 fps, Apple-style motion-graphics product film for Kirocast (https://t.co/YDA5cSDcTa, \"The MacOS screen recorder built for AI.\"), in two versions: 16:9 at 1920×1080 and 9:16 at 1080×1920 for Instagram Reels and TikTok. Both versions share the same timeline", "img": "https://pbs.twimg.com/media/HTjMVSjWsAAfzAp.jpg", "post": "https://x.com/GabZoFar/status/2105657821475852359", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105657491950317568/vid/avc1/480x270/5sl5q7dam4bAxU2R.mp4", "orig": "https://video.twimg.com/amplify_video/2105657491950317568/vid/avc1/1920x1080/tV3GB4R_F9VnulVc.mp4", "rem": ""}, {"n": 534, "c": "interactive", "t": [], "a": "YouWareAI", "p": "A live WebGL ink painting in the style of Qi Baishi, with paper fibre, dry-brush whiskers and an escape when you touch the water.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105655712865222657/img/8nwZRam5f-bBLZGj.jpg", "post": "https://x.com/YouWareAI/status/2105656935622259061", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105655712865222657/vid/avc1/480x270/zr2xPnaSlctmz9xa.mp4", "orig": "https://video.twimg.com/amplify_video/2105655712865222657/vid/avc1/3840x2160/9aL9gqudtk7uaNIk.mp4", "rem": ""}, {"n": 535, "c": "3d", "t": [], "a": "akakuma0219", "p": "Three.jsで1分のホラー映像を作って。題材は〇〇。見つかったビデオテープの最後の一分という設定で、手持ちカメラの主観、自動で進む。音も含めて、画像や音声ファイルは使わず全部コードで", "img": "https://pbs.twimg.com/amplify_video_thumb/2105628007054655488/img/x9FY2SXSlrCRnRXX.jpg", "post": "https://x.com/akakuma0219/status/2105628049169658335", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105628007054655488/vid/avc1/480x270/QA_awAMTU-IhqHx8.mp4", "orig": "https://video.twimg.com/amplify_video/2105628007054655488/vid/avc1/1280x720/MOi0qtGjaOtWQyhK.mp4", "rem": ""}, {"n": 536, "c": "explainer", "t": [], "a": "Gdgtify", "p": "Create a 20.00-second kinetic spoken-word film titled “BUILD THE FLOOR.”\nTreat this as an original miniature speech staged inside a typographic field. Every line reorganizes the field of the frame. The final declaration must stand on a field that finally lies flat.\nDeliver one self-contained HTML file, 1080×1080, targeting 60fps, using SVG and/or Canvas. Embed all required assets.\nART DIRECTION\nBackground #102820. Letterforms # F4E9D5. Field lines and filings # F2B544. A magnetic-monument world: streamlines, flux, stillness at the null. Typography stays crisp; particles are atmosphere only. High-contrast serif for the speech, heavy grotesque for load-bearing words, restrained monospace for flux gauges. No horseshoe magnets, lightning, electron diagrams, or sci-fi arcs.\nORIGINAL SPEECH — EXACT WORDS, EXACT ORDER\n“We were told to wait.”\n“So we learned the weight of waiting.”\n“Then one voice made room.”\n“Then another.”\n“Now the floor belongs to us.”\nDo not attribute these words to any real person. No extra slogans. The complete speech must be understandable without audio.\nCENTRAL VISUAL RULE\nWords have assigned field roles. WAIT is a repelling plate; letterforms lean away from it, kerning compressed. WAITING is field lines sagging under load while filings stream toward the low side. VOICE is one pole reversed; the field reorganizes and letters stand upright along it. ROOM is a null point, a still eye inside the field. FLOOR is the field flattened into a horizontal plane. These roles must emerge from the actual letterforms responding to the field, not from illustrations.\nSTORYBOARD\n0.00–3.00 — “We were told to wait.” The sentence leans away from the WAIT plate; streamlines compress against it. Available space pinches on the plate side; the sentence remains readable, pressed but intact.\n3.00–6.50 — “So we learned the weight of waiting.” Reveal in phrase groups. Field lines sag deeper with each phrase. Filings — deterministic, hash-seeded per id and time — drift along the streamlines toward the low side and gather. The WAITING glyph hangs tilted inside the field as a suspended load.\n6.50–10.00 — “Then one voice made room.” VOICE enters; one pole reverses. The field reorganizes: old streamlines retract by dash-offset while new ones draw in. Letters rotate upright along the new field — analytic rotation of whole glyphs, never path morphing. ROOM opens as a null point, a still eye; the counter of the O in ROOM is its center, and the next composition sits calm inside it.\n10.00–12.50 — “Then another.” A second pole turns. The field becomes symmetric; every letter stands vertical. The baseline levels into the first perfect horizontal in the film. Hold absolute stillness for at least 400ms — even the filings pause.\n12.50–16.00 — “Now the floor belongs to us.” The field flattens into a hor", "img": "https://pbs.twimg.com/amplify_video_thumb/2105494658390392833/img/y_17MDZ6yK668rG-.jpg", "post": "https://x.com/Gdgtify/status/2105570411870130294", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105494658390392833/vid/avc1/320x320/yibaj74i_xjh1Jya.mp4", "orig": "https://video.twimg.com/amplify_video/2105494658390392833/vid/avc1/1080x1080/nUzV6IMMdOCumQYG.mp4", "rem": ""}, {"n": 537, "c": "explainer", "t": [], "a": "mablesjoseph", "p": "Can you generate a motion graphics explainer in the visual style of this post and using all its content? I will leave the details up to you. I want you to show off what you can do so you have full creative freedom within those styling constraints. I want to give this to my engineers at my company. I want you to be proud of the final product. Utilize the elevenlabs and remotion tools at your disposal and let me know if you don't see them for some reason. Use whatever you want in those tools to make the most polished product that you would be proud of. Source Article : Context Tax - X article from the article", "img": "https://pbs.twimg.com/amplify_video_thumb/2105469897618624512/img/5cUkMUfe8pdyIYXk.jpg", "post": "https://x.com/mablesjoseph/status/2105472483054735781", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105469897618624512/vid/avc1/480x270/XWMOwE0LO1zDh2NH.mp4", "orig": "https://video.twimg.com/amplify_video/2105469897618624512/vid/avc1/1920x1080/u71qvvBN3EuU-ypO.mp4", "rem": ""}, {"n": 538, "c": "interactive", "t": [], "a": "chudry223", "p": "Create an interactive particle effects animation using Three.js that transforms simple ideas into a mesmerizing 3D experience.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105374918938419201/img/bt4NdNhEZ7rm1yA4.jpg", "post": "https://x.com/chudry223/status/2105374954195657142", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105374918938419201/vid/avc1/438x270/mtTIp6ywqVc5wys_.mp4", "orig": "https://video.twimg.com/amplify_video/2105374918938419201/vid/avc1/1104x680/60UL587FruKzTjWI.mp4", "rem": ""}, {"n": 539, "c": "interactive", "t": [], "a": "techartist_", "p": "Create an interactive 3D house animation showing the construction process from Foundation through Skeleton, Systems and Envelope to Finished. Include an X-ray view that reveals the plumbing, power and air inside. Use Three.js and WebGPU.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105350420080279554/img/6QGw9WGpKvbdm9U2.jpg", "post": "https://x.com/techartist_/status/2105350783416021472", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105350420080279554/vid/avc1/432x270/9Zl3WrD2MUgqa_Tj.mp4", "orig": "https://video.twimg.com/amplify_video/2105350420080279554/vid/avc1/1890x1180/Vp4VK-GqKfK3MefP.mp4", "rem": ""}, {"n": 540, "c": "3d", "t": [], "a": "Gorden_Sun", "p": "卡点的3D球体下坠的动画视频：对标专业的Blender做的效果，音乐是多首经典的纯音乐，场景按音乐切换，3D球体下坠时在3D场景的物件中弹跳，按音乐的节奏点亮物件。带一些幽默的元素。\n使用three.js制作，不要使用Blender制作", "img": "https://pbs.twimg.com/amplify_video_thumb/2105301541041352704/img/sO590d89I3EaPaoF.jpg", "post": "https://x.com/Gorden_Sun/status/2105302007896797351", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105301541041352704/vid/avc1/480x270/1x0Htyebcd8asonv.mp4", "orig": "https://video.twimg.com/amplify_video/2105301541041352704/vid/avc1/1280x720/L1TNDK7fFdUrDXFC.mp4", "rem": ""}, {"n": 541, "c": "motion", "t": [], "a": "johncodunayo", "p": "SPEAKER CAROUSEL\n<setup>\nClaude is connected directly to my open After Effects project through the AE MCP.\nWork inside the Inner comp where the speaker ring already exists.\n<\/setup>", "img": "https://pbs.twimg.com/amplify_video_thumb/2105270731349037057/img/_7mz_ZseRpy6wjl2.jpg", "post": "https://x.com/johncodunayo/status/2105271353993560372", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105270731349037057/vid/avc1/320x320/tSr3YoCLJ24azJzL.mp4", "orig": "https://video.twimg.com/amplify_video/2105270731349037057/vid/avc1/1080x1080/SfLBNvc3XoSN5EmI.mp4", "rem": ""}, {"n": 542, "c": "interactive", "t": [], "a": "gkxspace", "p": "<role>   You are a pixel animator and game feel designer who also writes chiptune music. What you create with code should look like hand-drawn character animation from a top-tier 16-bit era studio, not scaled-down vector graphics.   <\/role> <inputs>   The following are defaults, start working directly without asking me:   - Title: \"The 99th Spell\"   - Resolution: 1920×1080, 60fps, duration exactly 16 seconds<\/inputs>", "img": "https://pbs.twimg.com/media/HTJhmVhbcAACzD1.jpg", "post": "https://x.com/gkxspace/status/2105260627937923139", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103847608553005056/vid/avc1/480x270/FyPKD9BhPJZaPTsi.mp4", "orig": "https://video.twimg.com/amplify_video/2103847608553005056/vid/avc1/1920x1080/SxAatzZX_U3EdK5E.mp4", "rem": ""}, {"n": 543, "c": "interactive", "t": [], "a": "JakubAntowski", "p": "recreate the blue beret blob from OpenAI's Dots — fuzzy felt surface, breathing, blinking, squash & stretch, a lagging beret, and a subtle reaction to the mouse.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105244326003404800/img/h1JniFPlHQGupKsI.jpg", "post": "https://x.com/JakubAntowski/status/2105245285916020905", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105244326003404800/vid/avc1/480x270/SdY0TcHrBTtVgKZO.mp4", "orig": "https://video.twimg.com/amplify_video/2105244326003404800/vid/avc1/1600x900/DIigi7-VEE1-bhqY.mp4", "rem": ""}, {"n": 544, "c": "motion", "t": [], "a": "q970270495", "p": "make a modern slick and punchy video for a modern startup that works on inference", "img": "https://pbs.twimg.com/amplify_video_thumb/2105233409786388482/img/28PklBs7Qa8tvxUa.jpg", "post": "https://x.com/q970270495/status/2105233470574497923", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105233409786388482/vid/avc1/480x270/G519B2u1AcvTdfqr.mp4", "orig": "https://video.twimg.com/amplify_video/2105233409786388482/vid/avc1/1920x1080/du0IGO-I1PhA4UiT.mp4", "rem": ""}, {"n": 545, "c": "3d", "t": [], "a": "Grace_sunnyy", "p": "帮我生成一段约 3 分钟的视频，解释太阳系的各大行星。做科普知识讲解，让高中生都能听得懂，解释完太阳系再讲解银河系的相关知识。画面要炫酷展现出浩瀚的宇宙，配上中英字幕。", "img": "https://pbs.twimg.com/amplify_video_thumb/2105174617463922688/img/zAMU9h2Wn-ynEz_4.jpg", "post": "https://x.com/Grace_sunnyy/status/2105180285520486816", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105174617463922688/vid/avc1/480x270/7aIGi0VxAPC5OpT1.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2105174617463922688/vid/avc1/1280x720/0JWd29gKwg80Mp_j.mp4?tag=14", "rem": ""}, {"n": 546, "c": "motion", "t": [], "a": "X7mdNet", "p": "جربت Motion بـ Claude Opus 5.5\nHeadless chrome\nCanvas API (Assets Generation/ Paper textures)\nYoga-layout\nPrextext\nFloating UI\nوقلت له يسوي\nVox-vibe video\nوعطيته ملفات PDFs وصور", "img": "https://pbs.twimg.com/amplify_video_thumb/2105177635420590080/img/MquvpFupwPns4tNi.jpg", "post": "https://x.com/X7mdNet/status/2105177788043157811", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105177635420590080/vid/avc1/480x270/IPgn8THibFj4MrNu.mp4", "orig": "https://video.twimg.com/amplify_video/2105177635420590080/vid/avc1/1280x720/HvrlEgSTSdjwKCPT.mp4", "rem": ""}, {"n": 547, "c": "interactive", "t": [], "a": "threeaus", "p": "15s studio motion-design reel, 1920x1080.\nWarm off-white, black type, one orange accent only.\nA single orange circle with motion blur is the through-line and the cut.\nShow: toggle click, the word Motion, shape morphs, dotted connector, rounded diamond, circular kinetic type (KINETIC TYPE · 3D · LOOPS · SPRINGS · EASING), dot grid, then the card “Opus 5.5 / Motion designer. / 0 keyframes”.\nSprings, no glow, no particles, no default easing.\nLooks like a refined product-studio showreel, not an AI trailer.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105151540256473089/img/uNf4Q4a0d1i5dHQT.jpg", "post": "https://x.com/threeaus/status/2105152377057886343", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105151540256473089/vid/avc1/320x568/i-tSyvGrQ3Paity_.mp4", "orig": "https://video.twimg.com/amplify_video/2105151540256473089/vid/avc1/1920x3414/XScacYPP26mLoWmf.mp4", "rem": ""}, {"n": 548, "c": "explainer", "t": [], "a": "blueoctopusai", "p": "Make a motion graphics video that explains how the First & 10 Yellow Line works.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105113773853859840/img/aZ_nEcFx-WrsFVgP.jpg", "post": "https://x.com/blueoctopusai/status/2105116391439270222", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105113773853859840/vid/avc1/480x270/2m8unqihZ4QzQygJ.mp4", "orig": "https://video.twimg.com/amplify_video/2105113773853859840/vid/avc1/1920x1080/60bA-YMtVZFeuecq.mp4", "rem": ""}, {"n": 549, "c": "3d", "t": [], "a": "filicroval", "p": "make a 3D voxel world of a capybara in a hot tub boat drifting down a river. as good as you can", "img": "https://pbs.twimg.com/amplify_video_thumb/2105002180944052224/img/yRso4nG82RK1iiZu.jpg", "post": "https://x.com/filicroval/status/2105048723768168898", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105002180944052224/vid/avc1/320x360/dJPkKbbKb_GTWqVB.mp4", "orig": "https://video.twimg.com/amplify_video/2105002180944052224/vid/avc1/1920x2160/tWCoYAxQiRE32DdK.mp4", "rem": ""}, {"n": 550, "c": "motion", "t": [], "a": "notdwd", "p": "Make a 12s motion video in code (1920x1080, 30fps, one HTML file drawing every frame from a single seek(t) function, rendered with Playwright + ffmpeg, with original synthesized sound).\n\nStory: a dark prompt pill on an off-white page types \"make a launch video\" with a real keystroke rhythm → enter, the button flashes orange and the pill slides up → a 12-frame filmstrip stamps in left to right, one frame per beat at 120 BPM; each frame shows one pose of an orange ball's bounce (squash on contact, stretch mid-air, real arcs) → a playhead sweeps the strip while a big viewer above plays the poses as a flipbook, twice, faster the second time → the strip slides away, \"every frame is code.\" fills the screen, and the ball arcs over and lands as the period.\n\nRules: arrive fast, land soft (cover 12–19% of the remaining distance per frame); nothing ever freezes (slow push on every hold); stagger 2–4 frames; blur only on fast moves; big and readable on a phone; off-white, ink and one orange only. Sound: a tick per key, a click on enter, a rising note per frame stamp, a thump when the ball lands.\n\nShow me 5 stills first (typing, strip half-built, flipbook, headline, last frame), critique them like a harsh motion director, fix the 3 worst problems, then render.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105029513612853248/img/cFdPhGlxu7ZOfcZH.jpg", "post": "https://x.com/notdwd/status/2105031774904766641", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105029513612853248/vid/avc1/480x270/pxwaahMENzWa3lyM.mp4", "orig": "https://video.twimg.com/amplify_video/2105029513612853248/vid/avc1/1920x1080/gPH01GCrTAe09xHn.mp4", "rem": ""}, {"n": 551, "c": "interactive", "t": [], "a": "egeberkina", "p": "Create a visually stunning 60-second video explaining how an earthquake happens through an interactive tectonic sandbox.\n\nMake it feel like we are watching someone explore a beautiful real-time simulation, not a slideshow or traditional educational video.\n\nStart with a clean 3D cross-section of Earth’s crust. Two tectonic plates slowly move against each other. Visualize the fault between them and show friction locking the plates while stress gradually builds.\n\nAs pressure increases, make the simulation more intense: rock layers deform, stress zones glow, subtle vibrations begin, and a live seismograph starts reacting.\n\nThen trigger the earthquake. The fault suddenly slips and releases a massive burst of energy. Show seismic waves radiating outward through the ground, then transition upward to the surface where the landscape and a small city begin shaking.\n\nVisualize P-waves and S-waves traveling differently through the Earth, followed by the strongest surface waves. Show buildings reacting differently depending on distance from the epicenter.\n\nEnd by zooming back underground to reveal smaller aftershocks around the fault, then pull out to show the complete tectonic system.\n\nUse cinematic motion graphics, satisfying physics simulations, dramatic scale transitions, premium 3D scientific visualization, minimal typography, dynamic labels, smooth UI overlays and seamless transitions.\n\nThe pacing should constantly evolve and reveal something new every few seconds so the full 60 seconds stays visually engaging.\n\nMake it feel like an Apple-quality interactive science visualization turned into a cinematic motion-design video.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105029494004240384/img/c2mszcPkZ8Mf78H9.jpg", "post": "https://x.com/egeberkina/status/2105029713445949521", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105029494004240384/vid/avc1/480x270/lIUZLHM8tMkInPo3.mp4", "orig": "https://video.twimg.com/amplify_video/2105029494004240384/vid/avc1/1920x1080/1nrywbSj8u5N8cst.mp4", "rem": ""}, {"n": 552, "c": "explainer", "t": [], "a": "jdverolme", "p": "I need a 1-minute motion graphics video about the history of AI up to today, with a short introduction. Your role is a motion designer. Go all-in.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105012433823653888/img/PLNAREfU6I4YOPuV.jpg", "post": "https://x.com/jdverolme/status/2105013143596302685", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105012433823653888/vid/avc1/480x270/PBChJFmILacBq-sR.mp4", "orig": "https://video.twimg.com/amplify_video/2105012433823653888/vid/avc1/1920x1080/p6zDtH5OlHoy_uhh.mp4", "rem": ""}, {"n": 553, "c": "3d", "t": [], "a": "ViC305", "p": "create a 3d rendered video thats extremely detailed on the difference between spacex flight 13 sub orbital starlink satellite deployment", "img": "https://pbs.twimg.com/amplify_video_thumb/2104992207459803136/img/NaCCFfMdlDvQD8bO.jpg", "post": "https://x.com/ViC305/status/2105012738174885957", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104992207459803136/vid/avc1/480x270/lX7LmG-ehPc24fpo.mp4", "orig": "https://video.twimg.com/amplify_video/2104992207459803136/vid/avc1/1920x1080/jZzCm7j1qJ6VFNLd.mp4", "rem": ""}, {"n": 554, "c": "interactive", "t": [], "a": "theparuchh", "p": "Build \"Time, Undone.\" - a single self-contained HTML file (embedded JS and CSS) running a genuine WebGPU + WGSL interactive 3D mechanical watch that takes itself apart as you scroll, while it keeps running. No 3D engine libraries; all geometry is generated in code.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105009115906904065/img/n8CMxokwa5BQAVQU.jpg", "post": "https://x.com/theparuchh/status/2105009470292013286", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105009115906904065/vid/avc1/296x270/_XrA5vCNfiQ_ylm9.mp4", "orig": "https://video.twimg.com/amplify_video/2105009115906904065/vid/avc1/1920x1744/3_vK9g8rmJqOIxwa.mp4", "rem": ""}, {"n": 555, "c": "interactive", "t": [], "a": "adomicael", "p": "Create an interactive explainer animation showing what happens when you ask an AI a question. Visualize the path from a phone, through fiber optic cables across the US, into a data center, passing through 8 GPUs, down to a single transistor, and back with the answer.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104974247986606080/img/3ajpl7SrVB8IyOYO.jpg", "post": "https://x.com/adomicael/status/2104977482818707503", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104974247986606080/vid/avc1/424x270/7IfVc8UPfn0JWYh_.mp4", "orig": "https://video.twimg.com/amplify_video/2104974247986606080/vid/avc1/3400x2160/ZJVCdP1R3yu6jd6B.mp4", "rem": ""}, {"n": 556, "c": "3d", "t": [], "a": "everestchris6", "p": "<role>\nyou design and build motion videos entirely in code, with gsap for the animation and three.js for any 3d. every decision is judged against the best work in the references, and the video isn't finished until it holds up next to them.\n<\/role>\n\n<brief>\n- what the video is for: [product, service or business]\n- who's watching: [who the viewer is and what they care about]\n- what they should do at the end: [call to action]\n- length and sizes: [e.g. 30 seconds, 16:9 and 9:16]\n- brand: [name, logo files, colours, fonts]\n- facts file: [path]. this is the only source for any number, name or claim that appears on screen\n- assets: [footage, photos, screenshots, product files]\n- style references: [links or a folder of videos whose motion i like]\n\ni'm away and won't answer questions. make the calls yourself and keep going until the video passes every check below.\n<\/brief>\n\n<kit>\nbefore anything else, clone and read https://t.co/FMs1prnPP0. read SKILL.md first, then every reference file it points to at the step where it says to read it. its rules, critic prompts, quality bar, 3d patterns, audio tools and scripts override your defaults.\n<\/kit>\n\n<setup>\n- build every scene as an html page animated on a single gsap timeline, with three.js for any 3d, all as pinned local files\n- render the timeline to video frame by frame using the renderer in the kit\n- use ffmpeg for frames, contact sheets and audio measurement\n- keep every api key in environment variables. never write a key into any file\n- render a 5 second test first and confirm it works before building the real video\n<\/setup>\n\n<study_the_references>\nif i gave you references, study them before planning anything.\n- run a fast numeric pass over every frame: how much changed from the last frame, brightness and edge detail, to find every cut and every fast moment\n- make one overview contact sheet per video, and a dense sheet of one second at 16 to 20 frames a second around every transition\n- write a note per video: the key moment, how it works, and how it could be used in this video\n- pull out the motion rules and named techniques that hold across the best ones\n- references are for study only. never copy their footage, logos, layouts or music\nif i gave you no references, use the motion notes in the kit.\n<\/study_the_references>\n\n<motion_principles>\n1. the thing in the front of the shot becomes the transition. a title, logo or object moves towards the camera while the next scene is already waiting underneath\n2. one object carries the story across shots and keeps its identity, so it reads as one continuous piece\n3. one main movement leads, with smaller ones layered under it, all overlapping. the frame never stops and starts all at once\n4. the speed always changes. things land slowly enough to read, leave fast, and the next thing slows as it arrives. no linear motion\n5. cuts are allowed only when size, direction and subject match on both sides\n6. every action produces a visible result. a scan makes findings, a tap makes a new state, a request makes a confirmation\n7. type is motion too. big words enter from opposite sides, reveal the next scene, and never sit over busy picture without something behind them to stay readable\n8. vary the scale from close, to wide, to overhead, to full-frame type. never repeat the same layout, like a heading over three cards\n<\/motion_principles>\n\n<storyboard>\nwrite a brief and a storyboard before any animation.\n- one table: time, what's on screen, what this moment is for, how it leaves, and which object carries into the next shot\n- around 12 to 15 compositions per 30 seconds, each lasting about 1.4 to 3.5 seconds\n- the main subject fills most of the frame. no small cards floating in empty space\n- frame one is a finished picture, never a word halfway through flying in\n- name three signature moments you can describe without using effect names\n- the video must make sense with the sound off\n- send the storyboard to a fresh critic and fix what it finds before building\n<\/storyboard>\n\n<build>\n- every animated value is a function of timeline time only. no timers, no real-time animation, no unseeded randomness. any frame must render the same every time\n- write the shared pieces first: colours, fonts, shared 3d models and the exact pixel position of every handoff between scenes\n- build each scene as its own component with its own test page, rendered to stills and a short clip, and send it to a critic before it joins the film\n- carried objects land on exactly the same pixels on both sides of a cut\n- run several builders in parallel on separate sections once the shared pieces exist\n- don't stop to ask for approval between steps\n<\/build>\n\n<3d>\n- only use 3d where it explains something physical or spatial, like layers, parts, placement or scale\n- light it like a product shoot, with a soft key light from one side and a rim light behind\n- keep the camera between about 35 and 55 degrees. never look straight down on a large surface, and never end tight on a flat one\n- style buildings like a premium architectural model with real materials and a base\n- no floating parts, no gaps where parts meet, no flat black glass, no repeating textures\n- labels are html positioned from the 3d scene every frame, never text inside the 3d\n- measure the rendered background pixel and adjust until it matches the brand colour\n- anything that moves like a real product is measured from real footage frame by frame, and those measurements are the curve\n<\/3d>\n\n<images_and_footage>\n- prefer building shots in code. use generated images or clips only for supporting shots, and label anything generated as a concept\n- upscale and smooth any generated clip to match the rest, and regenerate anything that warps\n- never generate a fake finished job, fake customer, fake review or fake result\n<\/images_and_footage>\n\n<audio>\n- match the music's energy to the picture and the viewer, and keep it low\n- prefer clean library music and sound effects over generated ones. never name a brand in a music prompt\n- one short, soft whoosh per real scene change, and small clicks or pops only on real on-screen actions\n- screen effects for boom, hiss and length before using them, and set each one just above the music in its own frequency range, with a cap so nothing gets harsh\n- cut every scene change on a beat\n- always export a music-only version\n<\/audio>\n\n<critic_loop>\nthe builder never judges its own work.\n- after the storyboard, each component and each full render, send the render, the brief and the references to a fresh critic that has seen none of the building\n- never tell a critic what you think you fixed or what you believe about the references. it pulls its own frames and measures for itself\n- the critic makes a contact sheet every 0.2 seconds plus dense frames around every transition, measures frozen time and loudness, and returns a ranked list of problems with timestamps, ending with ship or one more pass\n- fix the biggest problem first, render, then send to a new critic that checks every previous item as fixed, partly fixed or still there, and hunts for anything new that broke\n- keep a ledger of every round: what was found, what changed, and the numbers before and after\n<\/critic_loop>\n\n<quality_bar>\nthe video isn't done until all of these pass, measured:\n- no more than about 1 second of frozen screen per 30 seconds, and no still stretch longer than about half a second\n- frame one is a finished composition\n- all text meets at least 4.5:1 contrast, and nothing collides with or flies through other text\n- brand colours in 3d renders match the brand values\n- loudness is steady and comfortable for web, with no clipping, and effects never louder than the music\n- a first-time viewer understands it with the sound off\n- a critic would put it next to the references without it looking weaker. a video with no bugs is not the same as a good video\n<\/", "img": "https://pbs.twimg.com/amplify_video_thumb/2104965023546449920/img/XwTBwlP6Jcwu0eVm.jpg", "post": "https://x.com/everestchris6/status/2104965415164399895", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104965023546449920/vid/avc1/480x270/-2ShcXd4-zKKoSuj.mp4", "orig": "https://video.twimg.com/amplify_video/2104965023546449920/vid/avc1/1920x1080/GCC0_7mTtNBkwvuj.mp4", "rem": ""}, {"n": 557, "c": "3d", "t": [], "a": "kopert0x", "p": "Create a single self-contained index.html: a ~2-minute animated short called \"the last piano\", in a hand-drawn crayon and watercolor style.\n\nScene: a small rusty robot with one glowing eye walks through a dark, empty city in the rain and finds an old upright piano under a broken streetlamp. Later a black cat shows up to listen.\n\nMusic: compose an original piano piece (Am - F - C - G) and synthesize it in Web Audio. It starts with one unsure note and grows into full chords.\n\nSync: one timeline drives both. The robot's hands hit the keys that are actually sounding. Every note turns on a window in the city, the rain turns to snow, and the final chord lights up everything that's left.\n\nRules: Canvas 2D only, no libraries, no external assets.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104960378710974464/img/1L115F0Y6-b7U3qg.jpg", "post": "https://x.com/kopert0x/status/2104961082880098349", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104960378710974464/vid/avc1/480x270/Sww-DvEX8v5VmhKq.mp4", "orig": "https://video.twimg.com/amplify_video/2104960378710974464/vid/avc1/1920x1080/_JI3UnesHrsXGlN_.mp4", "rem": ""}, {"n": 558, "c": "motion", "t": [], "a": "deebeeeff", "p": "make a dynamic 10-second motion graphics video celebrating The Ferguson Recipes 20th Anniversary", "img": "https://pbs.twimg.com/amplify_video_thumb/2104952260019306496/img/TWhiKXguP7aL_YEN.jpg", "post": "https://x.com/deebeeeff/status/2104952364365234301", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104952260019306496/vid/avc1/320x320/HIm4hNhy954-5TDF.mp4", "orig": "https://video.twimg.com/amplify_video/2104952260019306496/vid/avc1/1080x1080/sWKwm1ChQGQgjLBB.mp4", "rem": ""}, {"n": 559, "c": "motion", "t": [], "a": "Ai9app", "p": "Make a 15-second motion-design showreel, like a résumé portfolio reel for a motion designer named CLAUDE. Go all out.\n- 1920×1080, 60 fps, exactly 15 s. Every frame and every sound is generated in code.\n- 128 BPM, 8 bars; each section is one bar (1.875 s), and every move lands on the beat.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104912329171492865/img/5-xIetkPIIUEl6R5.jpg", "post": "https://x.com/Ai9app/status/2104913448907989009", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104912329171492865/vid/avc1/480x270/EsqJqADr17pMWL8C.mp4", "orig": "https://video.twimg.com/amplify_video/2104912329171492865/vid/avc1/1920x1080/ghzX5Sz6Omzg7o47.mp4", "rem": ""}, {"n": 560, "c": "motion", "t": [], "a": "sportyblocks", "p": "Make a launch video for SportyBlocks. Use the provided logo, OG image, and component screenshots. Include soundtrack. Show real product components (87 sports components for Tailwind CSS, React, HTML).", "img": "https://pbs.twimg.com/amplify_video_thumb/2103872495405105153/img/BF-IHEvuhsVSUwS6.jpg", "post": "https://x.com/sportyblocks/status/2104905279515320796", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103872495405105153/vid/avc1/480x270/r8B1Vko3IuZ-KQF5.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2103872495405105153/vid/avc1/1280x720/5seEp7wlf6Kc69ja.mp4?tag=14", "rem": ""}, {"n": 561, "c": "interactive", "t": [], "a": "CurieuxExplorer", "p": "Create an interactive AI film titled 'The Humanity Machine'. 60 seconds, single HTML file. The film ends but the world stays with controls. Push AI capability to 100% causing parts of the world to turn red.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104899833119256576/img/9ATjCh7V1FAwvZh
