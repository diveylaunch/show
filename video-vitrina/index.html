/YBIILdu-eMyxZknN.mp4", "orig": "https://video.twimg.com/amplify_video/2108458292968366081/vid/avc1/1920x1080/v8mq7C89pF9-V8se.mp4", "rem": ""}, {"n": 433, "c": "3d", "t": [], "a": "BuildFastWithAI", "p": "Create a video using Rust + SVG via fframes where every frame is a function. Include particles, 3D geometry, springs, shaders and an audio-reactive ring, synchronized to a 128 BPM beat grid.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108402948451823616/img/nF5ErAXOqLdAwkJg.jpg", "post": "https://x.com/BuildFastWithAI/status/2108403445304844291", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108402948451823616/vid/avc1/480x270/7goUk6bvvxOzs5Ju.mp4", "orig": "https://video.twimg.com/amplify_video/2108402948451823616/vid/avc1/1920x1080/olCD2XGSKaS89D97.mp4", "rem": ""}, {"n": 434, "c": "interactive", "t": [], "a": "Drake5112", "p": "Create an interactive HTML presentation explaining the concept of 'Network Effects' where connections grow exponentially as user count increases (e.g., 5x users = 27x connections). The interface should include a slider allowing the viewer to manually adjust the number of users and see the resulting change in connection density in real-time. Use only HTML and JavaScript without external image assets. Include voice narration synchronized with the visual changes.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108391539919802368/img/wVhEmojHOSv9N6Fv.jpg", "post": "https://x.com/Drake5112/status/2108394129000661428", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108391539919802368/vid/avc1/480x270/FQDMOMk1hiPL5_Kt.mp4", "orig": "https://video.twimg.com/amplify_video/2108391539919802368/vid/avc1/1920x1080/UO5jSDYcn2AnyiHU.mp4", "rem": ""}, {"n": 435, "c": "interactive", "t": [], "a": "aichrislee", "p": "Build me a Saturn V rocket in interactive 3D, in one HTML file with Three.js.\n\nMake it look real: the white and black rocket standing on the launch pad, and inside it the parts you never get to see. The five giant F-1 engines at the bottom, the fuel and oxygen tanks in each stage, the second and third stages with their own engines, the lunar lander tucked in under the nose, the command module where the astronauts sit, and the escape tower on top. The engines glow and roar with fire and smoke. I can drag to orbit around it and scroll to zoom.\n\nAdd an Explode button. When I press it, every part slides apart along the rocket with its name on a label. Press it again and it all snaps back together. When I hover a part, it lights up and shows one line on what it does.\n\nNo images. Do not ask me any questions. Just build it.", "img": "https://pbs.twimg.com/ext_tw_video_thumb/2108347187260276736/pu/img/14gXV89HSZxb-eOc.jpg", "post": "https://x.com/aichrislee/status/2108347412636938609", "v": true, "x": true, "card": "https://video.twimg.com/ext_tw_video/2108347187260276736/pu/vid/avc1/480x270/Z_51jtcKeYbJYhMd.mp4?tag=12", "orig": "https://video.twimg.com/ext_tw_video/2108347187260276736/pu/vid/avc1/1280x720/rMoSwgQXf3iThUye.mp4?tag=12", "rem": ""}, {"n": 436, "c": "motion", "t": [], "a": "Screeendev", "p": "Using Remotion which i downloaded, Can you make me a Launch video for the app.\nUse the repo for information.\n\nI need a SaaS styled 15-30 second launch video, with zooms , cursor, typing, interaction with the app, showcase, different angles of the app, etc. \n\nbasically a full", "img": "https://pbs.twimg.com/amplify_video_thumb/2108333333948346368/img/9YH8pCG_6Q-fowch.jpg", "post": "https://x.com/Screeendev/status/2108333630623981790", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108333333948346368/vid/avc1/480x270/r7q7S3tMvc3YupT4.mp4", "orig": "https://video.twimg.com/amplify_video/2108333333948346368/vid/avc1/1920x1080/YXdQ6U9ttTjbGAQk.mp4", "rem": ""}, {"n": 437, "c": "3d", "t": [], "a": "juancarlos17626", "p": "una lámpara de lava realista en UN solo HTML con WebGL, sin imágenes ni librerías. Metal cepillado, vidrio en cono, cera que sube, se estira y se parte; interruptor, botón de color y control de temperatura.", "img": "https://pbs.twimg.com/ext_tw_video_thumb/2108301429215481857/pu/img/D4Jsc8dLmPJQ3yEs.jpg", "post": "https://x.com/juancarlos17626/status/2108301453907382690", "v": true, "x": true, "card": "https://video.twimg.com/ext_tw_video/2108301429215481857/pu/vid/avc1/320x568/z_wmkd_gRmbqJtEi.mp4?tag=12", "orig": "https://video.twimg.com/ext_tw_video/2108301429215481857/pu/vid/avc1/720x1280/_rIYA-0o5EqWIGEx.mp4?tag=12", "rem": ""}, {"n": 438, "c": "3d", "t": [], "a": "cryptowluha", "p": "Create a 3D animation showing a house growing out of a pencil sketch, line by line. The animation should progress through four stages: first lines, massing, detail, and finished home. Use Three.js and TSL for implementation.", "img": "https://pbs.twimg.com/amplify_video_thumb/2105788774680518656/img/aPvUGThTvQvn9tgM.jpg", "post": "https://x.com/cryptowluha/status/2108253385829060792", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2105788774680518656/vid/avc1/406x270/ilmXunx4XnhYmBNn.mp4", "orig": "https://video.twimg.com/amplify_video/2105788774680518656/vid/avc1/1920x1272/AOiZV6TzHA4n9CiD.mp4", "rem": ""}, {"n": 439, "c": "explainer", "t": [], "a": "fleyta88", "p": "Build a GSAP timeline for UI cards with specific timing constraints: 280ms for cards, 220ms for title, 160ms for metadata, and a 60ms stagger between elements. Implement a verification loop where the animation is stepped through frame-by-frame using Playwright, screenshots are compared to detect overshoot or errors, and the code is patched until it passes the checks without rewriting everything.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108249674029174784/img/tjEUMG_H19bOf3Pd.jpg", "post": "https://x.com/fleyta88/status/2108249741125443662", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108249674029174784/vid/avc1/320x400/Vg0_VBvwt8TIXJUj.mp4", "orig": "https://video.twimg.com/amplify_video/2108249674029174784/vid/avc1/1080x1352/QG4LWc5eb0ZYV8s7.mp4", "rem": ""}, {"n": 440, "c": "motion", "t": [], "a": "flxrnc", "p": "<inputs>\nGive me:\n\n* canvas color\n* shape color\n* accent color\n* shape radius\n* fonts\n* the states the shape should morph through\n\nUse hex codes, seconds, damping ratios and pixel sizes instead of adjectives.\n<\/inputs>\n\n<direction>\nMake a 14 second, 1440x1440, 60fps seamless UI motion loop.\n\nOne shape, zero cuts.\n\nThe shape morphs from state to state and is never replaced.\n\nEach state fills 50% of the frame.\n\nThe camera starts on the beat and settles slower than the shape.\n\nUse closed-form springs.\n\nShape damping 0.72, settle time 0.35s.\nCamera damping 1.0, settle time 0.6s.\n\nContent swaps use 12px blur and fade over 0.15s.\n\nThe cursor tip stays locked to whatever it drags.\n<\/direction>\n\n<structure>\nUse a 0.5s beat grid.\n\n0.0 - pixel mascot idles\n1.0 - mascot squashes into play button\n1.5 - loader\n2.0 - check draws\n2.5 - timeline scrub\n4.0 - keyframe stretches past the end and snaps back\n5.0 - bezier editor\n7.0 - counter rolls F 000 to F 840\n8.5 - render bar fills\n10.0 - command palette types \"export mp4\"\n11.0 - toast says \"840 frames rendered\"\n12.0 - toast shrinks back into the mascot\n\nThe last frame must be the first frame.\n<\/structure>\n\n<build>\nWrite one HTML file with Canvas 2D.\n\nwindow.renderAt(t) must be a pure function of time.\n\nNo Math.random.\nNo clock.\nNo carried state.\n\n?t= must freeze the exact moment.\n\nRender every frame from renderAt(frame / 60).\n\nUse 4 subframes for motion blur.\n\nEncode to H.264 at 60fps.\n<\/build>\n\n<gotchas>\nFix the cursor jump at the loop wrap with:\n\nt - 14*floor(t/14)\n\nDo not cross-fade orange into ink.\n\nUse a ripple from the center at 1.5s and from the click point at 12.0s.\n\nRoll word swaps vertically.\n\nStart draw-on after blur-in.\n\nAim the cursor at where the target will be when it lands.\n\nKeep cursor speed under 65 px/frame.\n<\/gotchas>\n\n<start>\nFirst show me the storyboard.\n\nThen write the code.\n\nAfter the first render, check 5 frames around every beat and fix the issues before the final render.\n<\/start>", "img": "https://pbs.twimg.com/amplify_video_thumb/2108230167030095872/img/gUVNHt1Q4JRlknQB.jpg", "post": "https://x.com/flxrnc/status/2108242454105251921", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108230167030095872/vid/avc1/320x320/uVVz2x1KtYHjUYDX.mp4", "orig": "https://video.twimg.com/amplify_video/2108230167030095872/vid/avc1/1440x1440/pnxHgGpsDrWlJybD.mp4", "rem": ""}, {"n": 441, "c": "3d", "t": [], "a": "tonysurix", "p": "in blender make a previs of a car driving thru a mountainside with a another car chasing. record a video and show me here when its done.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108230130430840832/img/Fv2w5WYsMJl7dKbO.jpg", "post": "https://x.com/tonysurix/status/2108230699224596746", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108230130430840832/vid/avc1/644x270/RpVD1hE7EsNVH5Bp.mp4", "orig": "https://video.twimg.com/amplify_video/2108230130430840832/vid/avc1/1920x804/ZVgRfDJQePBgzrwQ.mp4", "rem": ""}, {"n": 442, "c": "3d", "t": [], "a": "ultimaxbt", "p": "<inputs>\nAsk me for: my product, the exact request a user types into it, 6 to 8 photos for the result cards, a royalty-free song around 130 BPM with a clear drop (Mixkit, free for commercial use), and my brand mark for the end card. If I skip anything, use the defaults: the food-ordering story below, food photos from Pexels (fire noodles, birria tacos, hot chicken, buffalo wings, smash burger, spicy ramen), and Mixkit \"Cat Walk\".\n<\/inputs>\n\n<direction>\nA 15-second product launch film, 1920x1080 at 60fps. 2D only, one continuous take. No fades, blurs or cuts: each scene grows from the last. Text rises from a mask line, buttons expand into pages, and color floods from one object before shrinking into another. Give the camera one eased move per scene, and never zoom in and out consecutively.\n\nLook: warm white canvas (#f5f5f2), black UI (#0e0e10), lime accent (#cdf24f), orange (#ff6a2a), and a blue send button (#2f6bff). Add an Apple Intelligence-style iridescent glow around the input: a blurred conic gradient rotating through pink, orange, lime, cyan and violet. Use real food photography on dark cards, Geist for UI and a serif for the product name on the end card.\n\nBanned: crossfades, blur-ins, 3D, particles, camera moves that reverse direction, holds longer than 1s, anything that feels like a template.\n<\/direction>\n\n<structure>\n130 BPM, 32 beats (14.8s). Start the song 12 beats before its drop.\n\nBeats 0-6, ask: push slowly into the glowing composer, about 3x zoom. Type the request over three fixed lines with a natural keystroke rhythm:\n\"I'm really hungry, I don't know\nwhat I want but something\nspicy, crispy and filling\"\n\nBeat 6, send: press the send button. A lime ripple spreads from it and transforms the message into a chat bubble. Pull back once to reveal the phone around it (428x900 screen, 11px black bezel, 9:41 status bar).\n\nBeats 6-12, think: the send button grows into an orange wok, a half-disc with a thin handle. It tosses 6 colorful ingredients on beats 8, 9, 10 and 11 beneath the shimmering text \"Finding something for you…\".\n\nBeat 12, the drop: a lime circle expands from the wok to fill the frame in about 0.35s. Dark food cards (330x440, radius 28, photo on top, name, one-line description, price and rating) burst in from the center. Slide the strip across three cards and land on \"Fire Noodles\", which lifts with a \"Best match\" pill.\n\nBeats 16-21, chat: the lime contracts back into the user's bubble, carrying its words as the chosen card flies into its slot. \"Found it. Fire Noodles from Wok & Fire, smoky, spicy and seriously filling.\" rises in, followed by \"Want me to order it for you?\" Then show two pills: \"Order now\" in black and \"More options\" outlined. The cursor clicks Order now → spinner → \"✓ Ordered\".\n\nBeats 21-32, outro: the black button expands into the page, staying pill-shaped as it reaches the edges while the camera pushes into it. Its label grows to headline size, then slides away. Bring in \"You were craving noodles.\" and \"Now it's on the way.\" word by word (92px, white on black). A courier dot follows a route to a pin. The pin becomes the brand mark, and the wordmark wipes out from behind it, with \"made with\" above and the product name below.\n<\/structure>\n\n<build>\n1. One HTML file, 1920x1080. Compute every style from time inside seek(t): no CSS transitions, timers or state carried between frames.\n2. Use one camera transform on a container, keyed by [time, zoom, x, y] with eased segments and zoom interpolated in log space.\n3. Use closed-form step-response springs for every pop and settle.\n4. Make every handoff a shared element: the lime flood carries a copy of the bubble's words, and the button carries its label into the page.\n5. Sound: use a downloaded Mixkit SFX for each event - typing, send pop, each toss, drop impact, card swoosh, click, success tone, page-fill whoosh and mark sparkle. Place each by its measured peak and loudnorm to -14 LUFS.\n6. Render with Playwright at 60fps using 8 subframes per frame, blended with ffmpeg tmix. Review every fast moment frame by frame and scan the full video frame by frame.\n<\/build>", "img": "https://media.skillry.dev/opus-5-5/_prompts/ultimaxbt-549714/poster.d033c3dac3.webp", "post": "https://x.com/ultimaxbt/status/2108210884799549714", "v": false}, {"n": 443, "c": "motion", "t": [], "a": "0xverdao", "p": "Create a Minecraft-style animation inside a real street view environment. Stack 15 TNT blocks on the road, build a gold and diamond tower, drop a giant TNT block from the sky, and create craters blown into the actual road surface. Implement this as a single HTML file without external libraries.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108135792468000768/img/h_xao2aK51XrnMs0.jpg", "post": "https://x.com/0xverdao/status/2108188411844776363", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108135792468000768/vid/avc1/480x270/Q9HMP3qQDBKQw0hN.mp4", "orig": "https://video.twimg.com/amplify_video/2108135792468000768/vid/avc1/1920x1080/zp86EjxPtjqNHRGV.mp4", "rem": ""}, {"n": 444, "c": "3d", "t": [], "a": "SimonasLTU1", "p": "Create a visual experience for the theme \"If my dreams turned real\", narrated by a deep, warm, cinematic voice. The visual experience should be striking, highly graphical, beautifully animated, and genuinely impressive. It should be around 1 minute long. Treat it as an experimental piece of digital art created with HTML/CSS/JS/Three.js.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108175006974791680/img/7IM6h_GgQ1rJnzx7.jpg", "post": "https://x.com/SimonasLTU1/status/2108175272964981181", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108175006974791680/vid/avc1/480x270/uuxGogDVm2RYjYzw.mp4", "orig": "https://video.twimg.com/amplify_video/2108175006974791680/vid/avc1/1920x1080/cXqOxqe6DNHQ5cR_.mp4", "rem": ""}, {"n": 445, "c": "motion", "t": [], "a": "Khlaseek_dsgner", "p": "the card should scale in from 30% to 100% scale and it should go from Invisible to visible. every detail slide in orderly one after the other when the card settles in scale. the graph line animates in like a line path. the glow at the back becomes visible as the card details slides in. the two rectangles move accross the screen at slightly different timing giving it this light effect.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108167351770206208/img/DkMnuIF3npIIkPjN.jpg", "post": "https://x.com/Khlaseek_dsgner/status/2108167809997877659", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108167351770206208/vid/avc1/320x568/_5LfPyflMAK5FrbT.mp4", "orig": "https://video.twimg.com/amplify_video/2108167351770206208/vid/avc1/1920x3412/wW3giVq7kWhePoc-.mp4", "rem": ""}, {"n": 446, "c": "3d", "t": [], "a": "btcup99", "p": "创建一个2分钟的动效视频，主题是AI发展史。使用HyperFrames做动效，Three.js搭3D镜头，连打字声都是代码合成的。每一帧都是代码渲染，不使用任何视频生成模型。", "img": "https://pbs.twimg.com/amplify_video_thumb/2108149922650558464/img/hkQHNDj6QNvOemp0.jpg", "post": "https://x.com/btcup99/status/2108152460523311469", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108149922650558464/vid/avc1/480x270/KgsJlpBEFyri9jmA.mp4", "orig": "https://video.twimg.com/amplify_video/2108149922650558464/vid/avc1/1920x1080/f3vVi8pd5a9u47Fu.mp4", "rem": ""}, {"n": 447, "c": "motion", "t": [], "a": "KeWai386772", "p": "做一个 今年已颁发诺贝尔奖的人物与成就 的科普视频。要达到世界顶级youtuber视频制作的水准。顶级的电影导演、顶级的科普大师、数据可视化专家、配乐大师、动态图形设计大师、院士讲解级别的专业 + 脱口秀演员般的妙趣横生 + 电影人的叙事 + 高品位清晰清爽的设计风格", "img": "https://pbs.twimg.com/amplify_video_thumb/2108143214666584066/img/W3VfF4NQiYp95agv.jpg", "post": "https://x.com/KeWai386772/status/2108143449841262769", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108143214666584066/vid/avc1/480x270/bUC-uU9UNlZhqUN7.mp4", "orig": "https://video.twimg.com/amplify_video/2108143214666584066/vid/avc1/1920x1080/Mjbc10AArXnsSUJK.mp4", "rem": ""}, {"n": 448, "c": "3d", "t": [], "a": "mdaman010", "p": "Build a miniature 3D Middle-earth from scratch in Three.js. Include procedural terrain, 24 procedural landmarks, water/smoke/lava effects, day/night transitions, camera choreography, and frame-by-frame rendering for a 3:47 cinematic journey.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108108125031268352/img/LrYaHQ41S8-LBkt2.jpg", "post": "https://x.com/mdaman010/status/2108108452774207866", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108108125031268352/vid/avc1/480x270/tCyKzJ19O-IOAsFk.mp4", "orig": "https://video.twimg.com/amplify_video/2108108125031268352/vid/avc1/1920x1080/4hS8u1Upzwutk1Bx.mp4", "rem": ""}, {"n": 449, "c": "3d", "t": [], "a": "wikiwayne", "p": "Build the same looping claymation desk scene: a clay mug, a plant and a paper airplane circling the mug, animated on twos like real stop-motion.\n\nFirst in Blender, then in Three.js.", "img": "https://pbs.twimg.com/media/HUE2YXdWEAA0-Ig.jpg", "post": "https://x.com/wikiwayne/status/2108025937212080350", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108025892870000640/vid/avc1/480x270/BONWgpm91WpiAzd_.mp4", "orig": "https://video.twimg.com/amplify_video/2108025892870000640/vid/avc1/1920x1080/OCSW60XYUvW1sXfR.mp4", "rem": ""}, {"n": 450, "c": "3d", "t": [], "a": "wikiwayne", "p": "one Python script that builds a looping claymation desk scene in Blender. A clay mug with steam, a plant with five leaves, and a paper airplane circling the mug. 96 frames, animated on twos.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107951038732873728/img/KWNWf7ewbXm9b7vd.jpg", "post": "https://x.com/wikiwayne/status/2107951058584486055", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107951038732873728/vid/avc1/404x270/mpfYeKSA5jNqB5fR.mp4", "orig": "https://video.twimg.com/amplify_video/2107951038732873728/vid/avc1/1620x1080/F4ZL3VNzw4efBBAJ.mp4", "rem": ""}, {"n": 451, "c": "motion", "t": [], "a": "cgclick", "p": "Create a 5 sec motion graphics animation of a simple dot, bouncing into the center of the screen, it expands to a search bar and then text fills the box: \"I'm a motion designer, what should my next career be?\"  The animation should be be fluid, ease keyframes in and out,", "img": "https://pbs.twimg.com/amplify_video_thumb/2107904371555962881/img/CPG9cb_2mivPZzwi.jpg", "post": "https://x.com/cgclick/status/2107907343912497325", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107904371555962881/vid/avc1/480x270/o4S6YOLgM6KKFi5D.mp4", "orig": "https://video.twimg.com/amplify_video/2107904371555962881/vid/avc1/1920x1080/yKawjfvgblW7XYGW.mp4", "rem": ""}, {"n": 452, "c": "explainer", "t": [], "a": "wilzerjb", "p": "Create me a motion explainer video for my business @aidellyai", "img": "https://pbs.twimg.com/amplify_video_thumb/2107891973122142208/img/7hVC_MvmDTMR6Wn7.jpg", "post": "https://x.com/wilzerjb/status/2107892042320007630", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107891973122142208/vid/avc1/480x270/ma4lGkuV79yGZYtp.mp4", "orig": "https://video.twimg.com/amplify_video/2107891973122142208/vid/avc1/1920x1080/bP7FM92tlBszMnlf.mp4", "rem": ""}, {"n": 453, "c": "3d", "t": [], "a": "mdaman010", "p": "Build an entire miniature 3D world of Middle-earth from scratch in Three.js/WebGPU, including procedural terrain & geography, 24 procedural landmarks, water, smoke, lava & atmosphere, day/night transitions, camera choreography & route animation, frame-by-frame rendering, and an original orchestral score. Turn this into a 3:47 cinematic journey.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107888146839220224/img/ZBTxzhZdQxBeOqSl.jpg", "post": "https://x.com/mdaman010/status/2107888264904610173", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107888146839220224/vid/avc1/480x270/fa5MUW94RpiCqm-G.mp4", "orig": "https://video.twimg.com/amplify_video/2107888146839220224/vid/avc1/1280x720/hUAEJz8dSwQ-lp6t.mp4", "rem": ""}, {"n": 454, "c": "motion", "t": [], "a": "FedericoAltepo1", "p": "Make a fast 15s ad for https://t.co/HFGqzMVtnR.\nMake everyday AI users think \"I want my AI connected to my inbox.\"\nStudy the site and the reference ad. Bold, light mode, creative, no slop. Use music and sound design.\nEnd on the logo. Take the time to make it exceptional.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107882615881834496/img/jDZN2I1RtUWuPijO.jpg", "post": "https://x.com/FedericoAltepo1/status/2107883128610312496", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107882615881834496/vid/avc1/320x568/9O2kPWyblhdjsEli.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2107882615881834496/vid/avc1/720x1280/ZkfQVz7Hl814eL9a.mp4?tag=14", "rem": ""}, {"n": 455, "c": "explainer", "t": [], "a": "_eleanorina", "p": "Build the latest FrankenManim version on my Mac and then use it to create a nice 3b1b-style explainer video about Hoeffding's D. Use FrankenTTS to provide the narration.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107805948936884224/img/FykAPNh4xG5okQy6.jpg", "post": "https://x.com/_eleanorina/status/2107841006909653042", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107805948936884224/vid/avc1/480x270/5GbFvzH6c83ER55e.mp4", "orig": "https://video.twimg.com/amplify_video/2107805948936884224/vid/avc1/3840x2160/H7uSjluAGxhneuiQ.mp4", "rem": ""}, {"n": 456, "c": "3d", "t": [], "a": "okazaky", "p": "Create a 50-second vertical music video using programmatic rendering (Three.js) instead of native video AI.\n1. Generate song with Suno. Extract lyrics from embedded metadata.\n2. Separate stems with Demucs (vocals, drums, bass, other).\n3. Transcribe vocals with mlx_whisper. Align with official lyrics to create script where '1 lyric line = 1 scene'.\n4. Write storyboard: define 'What to show in 3D', 'Camera', 'Main word' for each lyric line.\n5. Have 4 parallel Opus sub-agents write scene programs.\n6. Export 16-frame contact sheet for visual verification.\n7. Render headless Chrome at 1080x1920, 60fps.\n8. Normalize volume to -14 LUFS.\nStyle: Engraving-like lines, colors limited to Black, Bone, Orange.", "img": "https://pbs.twimg.com/ext_tw_video_thumb/2107826490754977792/pu/img/WmRIKevWTpopSl4i.jpg", "post": "https://x.com/okazaky/status/2107826563786084783", "v": true, "x": true, "card": "https://video.twimg.com/ext_tw_video/2107826490754977792/pu/vid/avc1/320x568/W8LlfEsdJJ8sgccG.mp4?tag=12", "orig": "https://video.twimg.com/ext_tw_video/2107826490754977792/pu/vid/avc1/720x1280/UtBQH9_qeVwsDoTF.mp4?tag=12", "rem": ""}, {"n": 457, "c": "interactive", "t": [], "a": "twoclipping", "p": "<inputs>\nAsk me for: a voiceover or song with a spoken line (the audio file) and its transcript, 10-12 small objects that sum up my life, two silhouettes to light like a heat camera (a head in profile and a raised hand), and the 3 words I want to land hardest. If I skip any, use the defaults: vinyl, book, camera, cat, coin, game controller, cap, heart, money, plant, clapperboard, skateboard; free CC0 silhouettes from Openverse; action, intention, curiosity.\n<\/inputs>\n\n<direction>\nA 20 second 4:3 film, 1440x1080 at 60fps, cut to the voice. Off-white paper, black, one red, one yellow, Geist for every word. Film grain on everything, a soft vignette, and a camera that never rests: a slow handheld float under everything plus a slow push inside every scene.\nNo scene cuts to the next: each handoff starts on the exact last frame of the scene before. The only hard cuts are the beat flips on the last word.\nEvery object is pixel art you draw yourself: a 16x16 grid per object, every cell a hand-placed colour, rendered as a 3D block (a darker extrusion down-right, a thin bevel on every cell) with a soft contact shadow.\nThe silhouettes are lit like a heat camera: the heat comes from how thick the body is at each point, so the nose, the hair and the fingertips run cooler, plus one hotspot and a slow moving noise, mapped through a black > red > orange > cream ramp. The edge stays razor sharp, with a soft glow outside it.\nMotion rules: nothing pops in (eased glides of about 0.5s with a soft start), fast moves get real motion blur instead of ghost copies, and captions type with the voice behind a block cursor.\nBanned: stock footage, AI video, 3D camera moves, particles, glitch.\n<\/direction>\n\n<structure>\nHang every scene on the transcript's word timings (measure them with faster-whisper word timestamps, one short chunk at a time):\n1. The first word fills a yellow card. The card wipes off to the left and the question types underneath on two centred lines that glide to stay centred as they grow, the key word underlined in red as it's spoken.\n2. The objects streak past in lanes above and below the words, a cyan four-point flare sweeps in, then the page burns away: black closes in from the edges onto the head, behind a hot red edge.\n3. The head heats up on black while the answer types low on the left. A thin white orbit draws itself around the head, its far half passing behind it. On the last word, paper blooms out from inside the head with the objects in it, and the camera falls through: the head rushes past the lens until the paper is all we see.\n4. The objects sit on a tilted ring seen in perspective (the front ones bigger and lower, drawn last), slowly turning, each one bobbing; the coin flips and lands with sparks.\n5. On each of the 3 words, that object flies out of the ring to the left and grows, the page floods black from it, and the word types beside it (camera: a red shutter star; book: a red ribbon sweep; record: two white orbits and red notes). Then the flood drains back into the object as it flies home, and the camera dives closer into the ring. Put each hero object in the slot that is front-left when its word lands.\n6. The ring pulls in a touch, bursts outward, every object turns to ink, and ink blots grow and swallow the page.\n7. The hand rises into frame, hot, with the line split either side of it. The heart drops into its palm, then lifts to the centre at the size the next scene holds it.\n8. The last word, one letter per beat, the background flipping paper / black / red, the heart holding its place across the cut, the centre object morphing pixel by pixel into the next one.\n9. Thin brush strokes sweep through, the letters drift apart and float, then settle back into the word with the heart above it. The camera keeps pushing through the hold.\n<\/structure>\n\n<build>\n1. One HTML canvas. Every frame is a pure function of time inside seek(t).\n2. Bake each pixel sprite once to an offscreen canvas (the extrusion layers, then the face), then draw it scaled and rotated.\n3. The heat: precompute each silhouette's base heat once (a distance transform of the mask, held at the edge value outside it so nothing dark bleeds in when it is upscaled). Every frame, add the hotspot and two octaves of value noise at quarter resolution, map it through a 256-step lookup, upscale it, and cut it with the full-resolution mask.\n4. The fall through the head: draw the ring scene into an offscreen layer, mask it with the head scaled up about a point inside the skull, and grow that scale on a cubed curve until the head covers the frame. The ring inside zooms less than the head does, so it reads as depth.\n5. The pixel morph: pair every cell of object A with a cell of object B and glide each one's position and colour, with a small random delay per cell.\n6. Render with Playwright at 60fps with 8 motion-blur subframes, then lay the original audio back on with ffmpeg.\n<\/build>\n\n<gotchas>\nA mask PNG with no alpha channel fills the whole box with heat, so put the silhouette in the alpha. A limb cut by the photo's border shows as a straight edge, so extend the mask past the frame. A handoff only reads as smooth when the last frame of one scene is the first frame of the next: draw the outgoing scene under the transition, and give scenes that show the same ring one shared zoom function. A flood that's still retreating when the next scene starts reads as a hard cut, so let it finish first. A fast ease-out flood reads as a jump; use a soft start.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, measure the word timings, then show me 8 stills before you render.\n<\/start>", "img": "https://pbs.twimg.com/amplify_video_thumb/2107822027188924416/img/xfOoZDmjCc7r4pUQ.jpg", "post": "https://x.com/twoclipping/status/2107822293653041659", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107822027188924416/vid/avc1/360x270/PuWk2PVHu9v8SGt8.mp4", "orig": "https://video.twimg.com/amplify_video/2107822027188924416/vid/avc1/1440x1080/g5Ob2xYrXqkL-97L.mp4", "rem": ""}, {"n": 458, "c": "interactive", "t": [], "a": "MrKindey", "p": "No plugins, no app, just a single HTML file running Three.js on WebGPU.\n\nIt's an interactive 3D house that builds itself in five stages: Foundation → Skeleton → Systems → Envelope → Finished. Every part has its own window on the timeline, so you can scrub through the construction like a video.\n\nWhat's inside:\n→ X-ray mode that makes the structure transparent and shows the water, power, sewage and airflow routes, with filters for each system\n→ Explode, to pull the layers apart\n→ Cut, a section plane that slices through the building\n→ Dusk, a lighting switch to see it at night\n→ Instanced vegetation, so a dozen olive trees cost almost nothing to render\n→ Callouts and preset cameras for each stage\n\nThe subject is a traditional hillside villa, but the format works for any building. A developer could show a buyer exactly what's behind the walls before a single wall exists.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107817719353528320/img/400AehIlrWl2XFV1.jpg", "post": "https://x.com/MrKindey/status/2107817784432267498", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107817719353528320/vid/avc1/480x270/XLe4G3ZBRlg-eU1G.mp4", "orig": "https://video.twimg.com/amplify_video/2107817719353528320/vid/avc1/1280x720/5z40ksgZo4j8f5dO.mp4", "rem": ""}, {"n": 459, "c": "motion", "t": [], "a": "IlyaPion", "p": "Create me a motion graphics promo video for https://t.co/ypdsMqmm8D\n\nUse only what you have in skills and what you can pull from the webpage!\n\n30seconds. Make it awesome and as if i paid 50thousand for this! 16:9 format. English", "img": "https://pbs.twimg.com/amplify_video_thumb/2107816136255438848/img/AU5kfFlXhQ-HaFgH.jpg", "post": "https://x.com/IlyaPion/status/2107816382289072443", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107816136255438848/vid/avc1/480x270/s-eKJ5GnnDIZlOBm.mp4", "orig": "https://video.twimg.com/amplify_video/2107816136255438848/vid/avc1/1920x1080/6c5RPHi39Pqc8G80.mp4", "rem": ""}, {"n": 460, "c": "motion", "t": [], "a": "tkz_aiart", "p": "あなたは一流のモーションデザイナー兼クリエイティブエンジニアです。\n添付の曲を紹介する、SNS投稿用のトラックカード動画を作ってください。\n\n## 成果物\n- 1920×1080（16:9）・60fps・約15秒のMP4（音あり、AAC 192kbps、−14 LUFS）\n-", "img": "https://pbs.twimg.com/amplify_video_thumb/2107799637310701568/img/FPucRKWP7C_l1rt1.jpg", "post": "https://x.com/tkz_aiart/status/2107811706411864352", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107799637310701568/vid/avc1/480x270/WJ9DGAKAdTt29Cfs.mp4", "orig": "https://video.twimg.com/amplify_video/2107799637310701568/vid/avc1/1920x1080/yVXw5_Eu1xvqa2_h.mp4", "rem": ""}, {"n": 461, "c": "motion", "t": [], "a": "thegreatola", "p": "You are my motion designer. Make a product demo video for [PRODUCT NAME], a [ONE LINE: what it is and who it's for].\n\nYou have access to this repo. Before designing anything, read it so the video shows the real product:\n- the actual screens, in the order a real user", "img": "https://pbs.twimg.com/amplify_video_thumb/2107800885044633601/img/c6iqy9JJQVTCOyqF.jpg", "post": "https://x.com/thegreatola/status/2107802366363738411", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107800885044633601/vid/avc1/480x270/DsrC3LjFWP4pnUwu.mp4", "orig": "https://video.twimg.com/amplify_video/2107800885044633601/vid/avc1/1920x1080/5lziTKD6Bp93mrYJ.mp4", "rem": ""}, {"n": 462, "c": "3d", "t": [], "a": "aicreataro", "p": "Write a story. Create the text layout and motion using HTML/Three.js. Combine with voice and sound effects to export as a single video.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107793524091764736/img/I3LR5luwbBX3KnWU.jpg", "post": "https://x.com/aicreataro/status/2107794785188864070", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107793524091764736/vid/avc1/480x270/dQzkHwTXopujLd1q.mp4", "orig": "https://video.twimg.com/amplify_video/2107793524091764736/vid/avc1/1920x1080/GKiYMnXoThAxr8bp.mp4", "rem": ""}, {"n": 463, "c": "explainer", "t": [], "a": "nakazakifam", "p": "NextCoreのような海外のカッコイいYouTubeチャンネルをオマージュした、タイポグラフィとコードだけで作成する心理学解説動画を作ってください。画像生成AIや動画生成AIは使わず、全てコード（HTML/CSS/JSなど）で表現できる描写に制限して作成します。数秒ごとに連続で異なる描写スタイルに切り替わりながら進む構成にしてください。", "img": "https://pbs.twimg.com/amplify_video_thumb/2107713858752114689/img/zVogjcwyijsEsvFP.jpg", "post": "https://x.com/nakazakifam/status/2107715000227831964", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107713858752114689/vid/avc1/480x270/NiziBlgLbBzBThBg.mp4", "orig": "https://video.twimg.com/amplify_video/2107713858752114689/vid/avc1/1920x1080/y_68VNOSr1AkhnPp.mp4", "rem": ""}, {"n": 464, "c": "explainer", "t": [], "a": "IncognitoPrince", "p": "Create a 1-minute explainer video about [Topic] featuring After Effects style kinetic text animations. Use HTML/CSS/JS to render the animation with smooth transitions, bold typography, and timed reveals. The final output should be a standalone web-based animation file that can be recorded or exported as a video.", "img": "https://media.skillry.dev/opus-5-5/_prompts/incognitoprince-849212/poster.46122e6172.webp", "post": "https://x.com/IncognitoPrince/status/2107664651760849212", "v": false}, {"n": 465, "c": "3d", "t": [], "a": "NFT_Chen", "p": "做一支 10 秒彩色皮影戏，讲【曹冲称象】。剪影布局，暖光透背，关节式偶戏。依次出现秤盘、铜碗、石头，先平衡，再把石头分批称、加起来。字幕卡点出现。用代码渲染，导出可播放视频。\n\n做一支 12 秒等距 2.5D 流程动画，讲【快递怎么分拣】。包裹沿分拣线、货台、平板运输、清关关卡移动，每步编号标签，最后双线汇成一条。干净、可跟读。\n\n做一支 10 秒比例尺对比，把【地球、木星、太阳】按真实半径同屏摆放。镜头平滑拉远，第一个物体缩小，点题「太阳底下约有 130 万个地球」。数字标注清晰。\n\n做一支 10 秒白板手绘。白底黑马克笔一笔笔画出【火柴人连甩 5 个包子】，红色只强调关键点。满足感粒子一颗比一颗大，最后角落画满。字幕：第 1 个，满足感拉满。\n\n做一支 10 秒 WebGL 电影感汉字演变，主题【火】。龟甲、青铜、墨迹、火光质感。「火」从甲骨到闪电、火把，再到现代照明，形态连续变形，对应炎、烈、焰。\n\n用 three.js 做一支 12 秒爆炸图，拆解【一部手机】。外壳、中框、芯片分层炸开，镜头环绕拉近，零件用虚线引出标注。可换成任何结构。\n\n做一支 10 秒 16 位像素典故，讲【黄粱一梦】。取象、中举、治河、出征，每段约 1.6 秒硬切，最后回到现实。字幕：第二年，考中进士，当上了官。\n\n做一支 10 秒绘本风科普，讲【小金鱼怎么游】。蜡笔线加铅笔涂色，线条抖动，眼睛、鳃、尾鳍对称，尾巴跟着节拍摆。纸本质感。\n\n做一支 10 秒 3Blue1Brown 式数学可视化，讲【圆面积】。深色底，圆切成 8、16、32 个扇形，真的移拼成长方形。公式逐项出现，定格 πr²。\n\n做一支 10 秒古地图动画，讲【长安到敦煌】。羊皮纸、淡墨山路，朱红路线一笔画过去，标注里程和一句讲解，最后盖章。镜头可缩放。\n\n做一支 10 秒 Kurzgesagt 式信息图，讲【纸对折厚度】。干净图形、大数字：对折 2 次，厚度 0.4 毫米，厚度 ×2。镜头规则拉近，直到终点。\n\n做一支 10 秒扁平 MG，讲【降水】。纯色几何、无描边。云里的小水滴越聚越大，然后掉下来。两段明暗，卡通云朵。\n\n做一支 10 秒卡点排版，120 BPM，讲【费曼学习法】。每个词卡一拍，黑底橙字切入。四步依次砸出，最后一锤：讲不清楚，就是没真懂。\n\n做一支 10 秒漫画分格，讲【一扇窗破了】。黑白网点加一个红色。听课、被发现、冲出教室，格间硬切，最后一格点题。\n\n做一支 12 秒横轴时间线，讲【从达特茅斯到 ChatGPT】。镜头沿轴推进，节点缩放点亮。年份大字加一句事件。示例节点：1971，又过了 41 年。", "img": "https://pbs.twimg.com/amplify_video_thumb/2107650820020015104/img/nc5449tAiE6buBqn.jpg", "post": "https://x.com/NFT_Chen/status/2107653056771068069", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107650820020015104/vid/avc1/480x270/7fP2yhUAM8BU9DdR.mp4", "orig": "https://video.twimg.com/amplify_video/2107650820020015104/vid/avc1/1280x720/Sn4sk4e9ApdvWu39.mp4", "rem": ""}, {"n": 466, "c": "3d", "t": [], "a": "tanabe_fragm", "p": "添付の画像を「最後の画面」にして、全部タイルでできた30秒の広告動画（音つき・mp4）を作ってください。\nブラウザ（Three.js）で組み、Chromeで全コマを書き出し、ffmpegでmp4にします。\n\n# ゴール\n- 見る人は25秒、タイルの制作動画だと思って見る。最後の数秒で、添付画像（広告）だったと気づく\n- 最後の画面は添付画像とほぼ同じ。文字が読める。画面いっぱいがタイル（床は見せない）\n\n# 仕様\n- 1920×1080、30fps、30秒。HTML1ファイル（Three.js。npmで入れてesbuildで1ファイルに固める）\n- 時刻 t を渡すと、同じ t なら必ず同じ絵になる作りにする（seek(t)）\n- タイルは1枚ずつ別のインスタンス。16:9の格子で約19万枚（576×324）\n- 位置・向き・厚み・面取り・色を1枚ずつ変える。目地（隙間）は空き。線は引かない\n- 添付画像は、タイルの色を取るためだけに使う（テクスチャとして貼らない）\n- 素材は約12種（釉薬セラミック、スレート、真珠貝、白磁、テラコッタ、ガラスなど）。色の明るさと彩度で割り当てる\n- 光は、左上の硬い太陽1つ。床は漆喰。奥に赤い大工のチョーク線がピンぼけで入る\n- 被写界深度（円形ボケ）を後処理で自作する。しぼりは最初大きく、最後は小さく\n\n# 流れ（秒）\n0〜3　 床に暗いタイルが1枚。カメラは床すれすれ\n3〜10　[組み始める場所]から、タイルが渦を巻いて落ちる。最初の1枚→周りの順に増える\n10〜21 一気に外へ広がる。カメラが引いて[見せたい絵]が見えてくる\n21〜24 全体が見える。文字になる場所は、周りと同じ淡い色のまま\n24〜26 文字・ロゴ・ボタンのタイルが、左から順にパタパタ裏返って現れる\n26〜30 真上からの構図で止まる。カーソルが[ボタンの文言]をクリックし、ボタンのタイルが少し沈む\n\n# ハマりどころ（必ず守る）\n- 文字になるタイルは、最初は周りの背景色で組む。背景色は、外側から内側へ塗り広げて決める。文字のふち（白ぶち）も一緒に裏返す。守らないと、途中で文字の形が見えてしまう\n- 真上のカメラは、位置を真上ぴったりにしない（向きが90°回る）。止める所は、動きの勢いをゼロにする（補間のはみ出しで反転する）\n- 最後の画面は、元画像と並べて色を比べ、露出・彩度・色味を合わせる\n- 文字が小さくて読めないときは、タイル数を増やす\n- 下地の暗い面は、タイルが着地したマスだけに出す\n\n# 音\n- ElevenLabsの効果音で、タイルを置く音・裏返す音・マウスのクリックを作る（各0.5秒）。作る前に、クレジットの消費を知らせる\n- タイルの着地・裏返しの時刻に合わせて並べて重ねる。カメラが遠いほど小さく、数が増えたら雨のようにまとめる\n- 24〜26秒のパタパタを、いちばん目立たせる。音量は -16 LUFS\n\n# 進め方\n1. 先に脚本（秒ごとの情景）を日本語で出し、OKをもらってから作る\n2. 途中のコマ（最初のタイル／組み始め／引き／全景／文字が出る瞬間／最後）を自分で見て直す\n3. 書き出しは Chrome（puppeteer-core）で seek(t) を30fpsぶん呼び、png を ffmpeg に流す\n4. 納品は mp4（高画質と共有用）と、確認した画像\n\n# 入力\n- エンドフレーム: [添付]\n- 組み始める場所: [例：人物の目]\n- 引いたときに見せたい絵: [例：笑顔の女性]\n- ボタンの文言: [例：無料体験はこちら]", "img": "https://pbs.twimg.com/amplify_video_thumb/2107643868024020992/img/CyEvGg-xYzLaYg8u.jpg", "post": "https://x.com/tanabe_fragm/status/2107644501372322001", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107643868024020992/vid/avc1/480x270/IL3CX64vk9V5qE6f.mp4", "orig": "https://video.twimg.com/amplify_video/2107643868024020992/vid/avc1/1920x1080/qA6sqLkSoN-kSHYH.mp4", "rem": ""}, {"n": 467, "c": "interactive", "t": [], "a": "atif_0075", "p": "Build a cow entirely with math and code running live in the browser. No 3D model, no animation file, no keyframes. Every muscle, hoof and tail flick must be calculated via physics simulation.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107568872710889472/img/_UYUhPC1J7DwJWMj.jpg", "post": "https://x.com/atif_0075/status/2107568937764639088", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107568872710889472/vid/avc1/480x270/8eI07cnSumRbt4OJ.mp4", "orig": "https://video.twimg.com/amplify_video/2107568872710889472/vid/avc1/1600x900/YrkySnfq7abTbVM1.mp4", "rem": ""}, {"n": 468, "c": "3d", "t": [], "a": "EarthwalkerX17", "p": "Build a miniature 3D Middle-earth from scratch using Three.js/WebGPU, then turn that world into a 3:47 cinematic journey. Include terrain/GIS baking, 24 handcrafted landmarks, lighting, atmosphere, day/night transitions, frame-by-frame video rendering, and an original orchestral score.", "img": "https://media.skillry.dev/opus-5-5/_prompts/earthwalkerx17-912577/poster.2fe761ba63.webp", "post": "https://x.com/EarthwalkerX17/status/2107515433972912577", "v": false}, {"n": 469, "c": "interactive", "t": [], "a": "techartist_", "p": "Create a physics simulation of a Rube Goldberg inspired machine where a marble ends up toppling a 1.8m domino. Use Three.js + Rapier. A falling domino can knock over one 1.5× its size, so ten growing dominoes carry the push from desk to room scale.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107513673728323585/img/eCSMTJELm6pz5Fht.jpg", "post": "https://x.com/techartist_/status/2107514291213697078", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107513673728323585/vid/avc1/480x270/79XmBhiRsrsoJQUq.mp4", "orig": "https://video.twimg.com/amplify_video/2107513673728323585/vid/avc1/1920x1080/MTd_39E46mQvtGu9.mp4", "rem": ""}, {"n": 470, "c": "3d", "t": [], "a": "llama3dstudio", "p": "Make an animation showing how fried chicken is made in Three.js. Everything should be procedural, with no imported 3D models.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107503566101356544/img/IXI_k6RT8S7maJUv.jpg", "post": "https://x.com/llama3dstudio/status/2107504609207918962", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107503566101356544/vid/avc1/544x270/C92hW2QwV-v2xpo3.mp4", "orig": "https://video.twimg.com/amplify_video/2107503566101356544/vid/avc1/2182x1080/qnNjLB5TJVqxiW3R.mp4", "rem": ""}, {"n": 471, "c": "3d", "t": [], "a": "rossaxbt", "p": "<inputs>\nAsk me for: one question a user asks my product and its one-line answer, two album covers, a royalty-free song around 110 BPM with a quiet intro and a hard drop (Mixkit, free for commercial use), and my logo for the ending. If I skip anything, use these defaults: \"is this all code?\" / \"yes. every frame.\", two atmospheric photos, and Mixkit \"Head Bang\".\n<\/inputs>\n\n<direction>\nA 22-second square loop, 1440x1440 at 60fps. 2D only, one continuous take. Nothing cuts: each scene grows from the one before it, and every gesture carries the camera into the next space. Each morph takes 0.8s on cubic-bezier(.45,0,.15,1). The camera zoom follows the same curve, making the shape changes feel almost invisible. Content dissolves during the second half of each glide. One gesture per scene.\n\nLook: a warm light stage (#f3f3f0 to #e3e3de), black UI, and a dark app world (#121212) tinted by the current album cover. Use one green accent (#1ed760), Geist for UI, the real macOS pointer, and soft layered shadows that grow as shapes lift.\n\nBanned: hard cuts, bouncy springs, particles, glows, zooming in and immediately back out, holds longer than 1s, anything that feels like a template.\n<\/direction>\n\n<structure>\nFollow the song's beats. The press lands on the drop.\n\nGenerate: the cursor clicks. The pill glides into a spinner, then becomes a check.\n\nChat: the check splits into three typing dots with goo. The left dot flies up, becomes the question bubble and types the question. The right dot flies down into the reply. Both bubbles shrink back into dots as they glide toward the center and merge with the middle dot.\n\nPlay: the middle dot bends into a play triangle, one point at a time. The cursor presses it on the drop. A white button appears under the click as the dark app floods the frame around it, leaving the white shape as the play button. The camera pulls back to reveal the full now-playing screen: large cover, title, heart (liked, filling green), progress bar, controls and volume.\n\nSwipe: the cursor drags the cover sideways. The next track slides in, and the app changes its tint to match the new cover.\n\nDrag: the camera glides toward the volume slider. The cursor pulls it to max and keeps going. The bar rubber-bands, dragging the camera sideways out of the app and onto a dark dotted canvas while the camera follows the knob.\n\nChart: the line lands and curves upward into a green chart as the number counts up. The volume knob becomes the chart's final point.\n\nDive: the cursor clicks that point. The camera dives into it until the light stage fills the frame.\n\nEnding: an \"Ask [my product]\" button grows from the light, narrows into a line, then fans out into my logo (default: the Claude spark, with six copies rotating into twelve rays in Claude orange). Hold for 2s.", "img": "https://media.skillry.dev/opus-5-5/_prompts/rossaxbt-312793/poster.b7d89646d6.webp", "post": "https://x.com/rossaxbt/status/2107483570885312793", "v": false}, {"n": 472, "c": "motion", "t": [], "a": "Thegawdstiles", "p": "Create a 37 second motion graphics promo for the concept brand Ajoflow, built entirely in code. No After Effects. No Premiere. Demonstrate the capabilities of pure code-driven animation for a brand promotional film.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107118970184552448/img/FxKLytkikJXmsj9Y.jpg", "post": "https://x.com/Thegawdstiles/status/2107481252785738178", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107118970184552448/vid/avc1/480x270/AoYs63PstsAdmI6q.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2107118970184552448/vid/avc1/1280x720/P0Dlm4qy4VJ1TA-_.mp4?tag=14", "rem": ""}, {"n": 473, "c": "3d", "t": [], "a": "rafiroutes", "p": "Implement all scenes, interactions/camera motions, and shader effects 100% in Three.js code (excluding character models from Blender, background sky from GPT imgen, and BGM from Google flow). Create an anime style opening teaser.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107465852987838464/img/1eYirD2fdfLw6g_B.jpg", "post": "https://x.com/rafiroutes/status/2107465888622596199", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107465852987838464/vid/avc1/480x270/DFj9IE9Rhs5tZEPK.mp4", "orig": "https://video.twimg.com/amplify_video/2107465852987838464/vid/avc1/1280x720/NlDvh6wBOXTJx04I.mp4", "rem": ""}, {"n": 474, "c": "motion", "t": [], "a": "jiro_aicompany", "p": "『SKILL.mdどおりに5選のショートを作って。台本は5つの項目と見出しに構造化して、事実は公式ドキュメントで確かめて。項目ごとの画像はコードで描いて、ゆっくり音声の長さに合わせて秒単位で切り替えて』", "img": "https://pbs.twimg.com/amplify_video_thumb/2107316446795792385/img/Sv1MPxf5flG1IF7_.jpg", "post": "https://x.com/jiro_aicompany/status/2107316487715487818", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107316446795792385/vid/avc1/480x270/5mWHe6SkkdPB8y38.mp4?tag=16", "orig": "https://video.twimg.com/amplify_video/2107316446795792385/vid/avc1/1920x1080/ImdXM1Pihna41Npf.mp4?tag=16", "rem": ""}, {"n": 475, "c": "explainer", "t": [], "a": "RashadMirza404", "p": "Create a self-contained, aesthetically pleasing, breathtaking animation of optogenetics: how a light-sensing protein from green algae became a light switch for brain cells. Use JavaScript on a single canvas, all in one HTML file. Be detailed and scientifically accurate.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107309988024664064/img/Sh237qEN6plWIinL.jpg", "post": "https://x.com/RashadMirza404/status/2107310721600020971", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107309988024664064/vid/avc1/468x270/7UJzGvIlOVhykpqc.mp4", "orig": "https://video.twimg.com/amplify_video/2107309988024664064/vid/avc1/3444x1984/sLGfcV3StUdilV-r.mp4", "rem": ""}, {"n": 476, "c": "interactive", "t": [], "a": "aichrislee", "p": "Build me a V8 car engine in interactive 3D, in one HTML file with Three.js.\n\nMake it look real: the engine block with its two banks of cylinders in a V, the pistons and connecting rods, the crankshaft, the camshafts and valves on top, the intake manifold and the exhaust headers glowing hot. The pistons pump up and down, the crankshaft turns, and the spark plugs flash when each cylinder fires. I can drag to orbit around it and scroll to zoom.\n\nAdd an Explode button. When I press it, every part slides apart with its name on a label. Press it again and it all snaps back together. When I hover a part, it lights up and shows one line on what it does.\n\nNo images. Do not ask me any questions. Just build it.", "img": "https://pbs.twimg.com/ext_tw_video_thumb/2107260052914536448/pu/img/Z0ub7Zl6_eO6e4EK.jpg", "post": "https://x.com/aichrislee/status/2107260223907922082", "v": true, "x": true, "card": "https://video.twimg.com/ext_tw_video/2107260052914536448/pu/vid/avc1/480x270/tM_Kx0IG5a2EW8kB.mp4?tag=12", "orig": "https://video.twimg.com/ext_tw_video/2107260052914536448/pu/vid/avc1/1280x720/-JovnoU0IVk222VV.mp4?tag=12", "rem": ""}, {"n": 477, "c": "motion", "t": [], "a": "0xnicc0", "p": "<inputs>\nAsk me for: a one-word product name for the wordmark, one accent color, and a royalty-free track around 120 BPM (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nProduct-launch UI motion in one continuous take. One shape tells the whole story: a prompt bar becomes a button, the button becomes a progress ring, the ring becomes a preview window, the window fills the screen, then shrinks into a toast and back into the prompt bar. No cuts, no fades between scenes: objects transform. A cursor triggers every change with real clicks. Warm off-white canvas, black UI, one accent color, Inter for UI and the wordmark. Springs everywhere with only a slight overshoot. Zoom the camera so each moment fills the square.\nBanned: crossfades, gradients on UI, particles, glows, bouncy easing, dead beats, anything that feels like a template.\n<\/direction>\n\n<structure>\n120 BPM, 24 beats, something happens on every beat.\nType the request into the prompt bar → click send → the bar collapses into a black circle → a progress ring fills in four steps while four chips spring out (concept, storyboard, motion, sound) → the chips fly into a timeline and the circle becomes a preview window → a playhead sweeps the clips → inside the preview an orbit draws itself, a planet starts moving and the wordmark rises letter by letter from a mask line → the preview fills the screen → the letters drop away, the planet flies into a toast and becomes its checkmark → \"Rendered in code · 60 fps\" → the toast turns back into an empty prompt bar. Last frame = first frame.\n<\/structure>\n\n<build>\n1. One HTML file with a 1440x1440 canvas. Draw everything inside seek(t): no CSS transitions, timers or state carried between frames.\n2. Use closed-form spring step responses. When a value changes target several times, add one spring per change so it stays a pure function of time.\n3. The main shape is one rounded rect whose width, height, radius, position and color are each a chain of springs.\n4. Typing is derived from time: characters shown = floor(progress × length), with a caret that blinks only when idle.\n5. Find the beat grid of the track, start on a downbeat and place every click, pop and chime on its measured peak.\n6. Render with Playwright at 60 fps, then encode H.264 CRF 16 and loudnorm to -14 LUFS.\n7. Render one still per beat first. Fix anything cramped, off-grid or hard to read before the full render.\n<\/build>\n\n<gotchas>\nText inside a morphing shape needs its own clip and separate enter/exit timing. Text swaps need their own fade so they never overlap. The cursor must end at the exact position it started, or the loop will stutter.\n<\/gotchas>", "img": "https://pbs.twimg.com/amplify_video_thumb/2107217634055909376/img/srbvoOCnmLj3_cKn.jpg", "post": "https://x.com/0xnicc0/status/2107217691505516612", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107217634055909376/vid/avc1/320x320/9V97Tr6mLY-xxvpr.mp4", "orig": "https://video.twimg.com/amplify_video/2107217634055909376/vid/avc1/1440x1440/Vog6XuBMLLFLpSZ2.mp4", "rem": ""}, {"n": 478, "c": "3d", "t": [], "a": "ivanainai", "p": "Create a visually stunning, silent 3D browser animation of Iron Man’s classic red-and-gold helmet, presented as a premium cinematic studio object.\n\nDeliver a complete runnable HTML experience using Three.js.\n\nCOMPOSITION\n\nOne helmet only, floating in the center of the", "img": "https://pbs.twimg.com/amplify_video_thumb/2107214287538098177/img/nyZXk-HspdisXLab.jpg", "post": "https://x.com/ivanainai/status/2107217500761190629", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107214287538098177/vid/avc1/320x568/Py6E-HrDtjijVrVw.mp4", "orig": "https://video.twimg.com/amplify_video/2107214287538098177/vid/avc1/1080x1920/b5kr9Bhw6-3jpffp.mp4", "rem": ""}, {"n": 479, "c": "motion", "t": [], "a": "ElitzaVasileva", "p": "Create a 45-second promotional video for https://t.co/4PtUhRtzAT with the cinematic world, typography, mystery, music, and epicness of [your favourite movie].\n\nYou’re the movie director - decide the story and creative direction. Use real product", "img": "https://pbs.twimg.com/amplify_video_thumb/2107186956589215744/img/kmOlw3RMDMhUAN-C.jpg", "post": "https://x.com/ElitzaVasileva/status/2107189860968591465", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107186956589215744/vid/avc1/480x270/1i2JwU6XfTwqBi1z.mp4", "orig": "https://video.twimg.com/amplify_video/2107186956589215744/vid/avc1/1920x1080/1kSuQ1_BFmLpS2de.mp4", "rem": ""}, {"n": 480, "c": "explainer", "t": [], "a": "nilou_salehi", "p": "Take a look at our documentation and the product ux and generate a marketing video which narrates how our product works", "img": "https://pbs.twimg.com/amplify_video_thumb/2107184134174973952/img/AkNUrzOeWlAniwVC.jpg", "post": "https://x.com/nilou_salehi/status/2107184179947458567", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107184134174973952/vid/avc1/480x270/klSCEupce-AkPo4v.mp4?tag=16", "orig": "https://video.twimg.com/amplify_video/2107184134174973952/vid/avc1/1280x720/gVJVEd6s4LEvNlSO.mp4?tag=16", "rem": ""}, {"n": 481, "c": "motion", "t": [], "a": "AiDinzeo", "p": "Create a video for casual viewing. No source materials; draw everything with code only. An endless zoom where no matter how close you get, it never ends. Approximately 300,000x deep, the same shape as the beginning appears again.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107126795753676800/img/oXQlb9393DIM4-uw.jpg", "post": "https://x.com/AiDinzeo/status/2107126979841708182", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107126795753676800/vid/avc1/320x568/dyzCYyHnwrUQlasj.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2107126795753676800/vid/avc1/720x1280/2FcrHq0gxeC2W_o4.mp4?tag=14", "rem": ""}, {"n": 482, "c": "interactive", "t": [], "a": "rossaxbt", "p": "<inputs>\nAsk me for: a short label for the opening toggle, one hero word, a percentage for the graph, the text for the final card, one accent color, and a track with a clear beat.\n<\/inputs>\n\n<direction>\nA 2D motion design film in 16:9. Use a warm off-white canvas, near-black backgrounds, bold typography and one vivid orange accent. The orange dot connects every scene: it starts in the UI, becomes the dot over a letter, traces a spring graph, grows into a shape and returns on the end card. A cursor makes the opening click feel real. Keep the motion sharp and controlled, with small spring overshoots and no dead time.\nBanned: stock footage, gradients, glows, particle bursts, random transitions and motion that isn't connected to an element already on screen.\n<\/direction>\n\n<structure>\nAround 15 seconds, with a visual change on every major beat.\nOpen: a cursor clicks the orange toggle beside \"Reduce Motion\". The letters bend and move into place until only \"Motion\" remains, with the orange dot above the \"i\".\nSpring: the dot jumps away from the word and lands on a graph. Its path draws a spring response, overshoots the target and settles beside a \"+22%\" callout.\nShape: the dot shoots across a line, grows into an orange circle and fills the frame. A black rounded square rotates inside it, then stretches into a pill. The scene contracts to a single orange dot on black.\nType: words like \"SPRINGS\", \"EASING\", \"KINETIC TYPE\", \"3D\" and \"SOUND\" orbit the dot. The circle of type opens out into a field of tiny dots.\nReveal: the halftone field expands and flips to black, revealing the final card: \"Opus 5.5\", \"Motion designer.\" and \"0 keyframes\".\nReturn: the orange dot moves back through the halftone, graph and toggle. Match the final frame to the first so the video loops cleanly.\n<\/structure>\n\n<build>\n1. One HTML file, 1920x1080 at 60fps. Compute every visual from time inside seek(t): no CSS transitions, timers or state carried between frames.\n2. Use closed-form springs for the toggle, bouncing dot and graph. Draw the graph from the same spring function that moves the dot.\n3. Animate letters individually for the \"Reduce Motion\" to \"Motion\" transformation. Keep the orange dot attached to the \"i\" until it begins its jump.\n4. Make the orange circle, rotating square and pill different states of the same shape. Preserve its position and motion through each transformation.\n5. Place the orbiting words along a circular path, then move their letters outward to hand the frame over to the halftone grid.\n6. Draw the halftone as a grid of dots whose sizes respond to the orange dot. Let it grow past the frame edges before revealing the end card.\n7. Sync the click, dot landing, graph peak, shape changes and final title to measured beats.", "img": "https://media.skillry.dev/opus-5-5/_prompts/rossaxbt-707651/poster.9a39dd420a.webp", "post": "https://x.com/rossaxbt/status/2107121188027707651", "v": false}, {"n": 483, "c": "motion", "t": [], "a": "yatudou14", "p": "使用JS+Canvas制作一个这个产品和插件的产品介绍动画，需要简洁、简约、时尚，且动画效果过渡自然、顺滑。文稿内容需要面向非技术小白的消费者。它是既有Obsidian插件也有web/桌面端，可以的话，放真实的操作视频动画演示最好。这个真实是指可以程序实现的真实操作动画及动效。还要有合适的宣发配乐（纯音无歌词），使用代码实现。最后导出 mp4 无损视频", "img": "https://pbs.twimg.com/amplify_video_thumb/2107092619763585024/img/CZpccOx155TUQxj4.jpg", "post": "https://x.com/yatudou14/status/2107092673005822057", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107092619763585024/vid/avc1/474x270/2tyqX_UENWXRB7UY.mp4", "orig": "https://video.twimg.com/amplify_video/2107092619763585024/vid/avc1/1440x820/q6Y_T4oZ7qh99G1j.mp4", "rem": ""}, {"n": 484, "c": "motion", "t": [], "a": "ligayabeebe", "p": "make a product launch video for 10xColleges. Nothing was screen-recorded. All 7,867 frames were drawn by code, so making a change means editing a script.", "img": "https://pbs.twimg.com/ext_tw_video_thumb/2107088171498438656/pu/img/wnl3Tz1dahu9Capl.jpg", "post": "https://x.com/ligayabeebe/status/2107088216071323995", "v": true, "x": true, "card": "https://video.twimg.com/ext_tw_video/2107088171498438656/pu/vid/avc1/320x568/eh34S3h4SaciID4C.mp4?tag=12", "orig": "https://video.twimg.com/ext_tw_video/2107088171498438656/pu/vid/avc1/720x1280/sOi4v6S0m8d87hVm.mp4?tag=12", "rem": ""}, {"n": 485, "c": "motion", "t": [], "a": "Pluvio9yte", "p": "公开我的制作方案，发给Opus5.5就能用\n\n  1. 选素材\n\n  三个标准，直接决定成败：\n\n  - 主体完整：人物或物体全身入画。细节会在加工中丢失，观众靠轮廓认东西，特写会变成一团。\n  - 背景干净：纯色、雪地、天空都行，主体和背景容易分开。\n  - 有明确的动作瞬间：打击、起跳、落地、转身。这些是后面做特效的支点。\n\n  来源可以是自己拍的、视频模型生成的，或有授权的现成片段。\n\n  2. 拆素材\n\n  从每一帧提取三类信息：\n\n  - 颜色：原画面。\n  - 远近：每个位置离镜头多远，用现成的深度估计模型算。\n  - 主体范围：哪里是主体、哪里是背景。\n\n  另外找出镜头切换发生在哪些时刻。这一步的要点是保持稳定：远近和主体范围要在同一个镜头内统一处理，否则播放起来会抖。\n\n  3. 定\"粒子\"和\"样式\"\n\n  先决定用什么东西来重建画面：圆点、方块、文字、线条都可以。\n\n  然后设计几种样式。每种样式其实只是三条规则的不同组合：\n\n  - 放在哪：整个画面都放，还是只放在主体上。\n  - 多大：统一大小，还是跟着明暗、远近变化。\n  - 什么颜色：用原画的颜色，还是统一用一两种颜色。\n\n  再加一个开关：是平铺在一个面上，还是按远近推进三维空间。推进去之后镜头才能环绕。\n\n  准备四到六种差异明显的样式就够用。粒子的疏密需要自己看着调：太大认不出内容，太小又和原片没区别。\n\n  4. 找节奏\n\n  - 定速度：选定音乐的速度，把时间切成等长的小格。让一格正好是整数帧，后面所有切换都好对齐。\n  - 找动作瞬间：结合\"声音突然变响\"和\"画面突然变动\"两个信号，找出素材里的打击点。\n  - 准备音乐：可以用现成的曲子并分析出它的拍子，也可以按定好的速度合成一段，并在打击点上加重音。\n\n  5. 编排\n\n  做一张时间表，写明每一格用哪种样式、什么配色、镜头在哪。这张表单独存放，以后调节奏只改它。\n\n  编排的四条原则：\n\n  - 开头交代变化：先给原画面，再过渡到粒子，让观众看懂发生了什么。\n  - 快慢交替：一直快会麻木，中间要有一段明显慢下来的部分。\n  - 配色要撞：相邻两格的颜色和样式反差越大，切换越有力。\n  - 结尾要有收束：比如粒子越来越大直到变成色块，或者回到原画面。\n\n  6. 关键时刻的反馈\n\n  在打击点上叠加短促的反应，按轻重分级：\n\n  - 每一次都有的轻反馈：粒子变形一下、镜头顶一下。\n  - 较重时才有的中反馈：一部分粒子朝镜头弹开。\n  - 最重的一两次才用的大反馈：时间静止，镜头环绕。\n\n  原则是弱而短。只动一部分粒子，几帧内结束，否则画面炸成一片，观众就看不清主体在做什么了。\n\n  贯穿全程的工作方法\n\n  - 先小样后全片：每做完一个环节，先渲染几帧看效果，确认了再往下。全片只在最后渲染。\n  - 拿不准的参数一次出一排：比如疏密，让 AI 同时出五六个档位并排放，你来挑。\n  - 改哪里渲哪里：调整某一段时只重新渲染那一段。\n  - 让 AI 自己看图：每一步都要求它把渲染结果打开看一遍再汇报。\n  - 所有随机都固定：保证同样的设置每次渲染结果一致，否则没法逐步修改。", "img": "https://pbs.twimg.com/amplify_video_thumb/2107086618645680128/img/j_rs6lZZfgQUdFp4.jpg", "post": "https://x.com/Pluvio9yte/status/2107087191738662953", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107086618645680128/vid/avc1/480x270/ul7Smg0RAgWCJ9ca.mp4", "orig": "https://video.twimg.com/amplify_video/2107086618645680128/vid/avc1/1920x1080/7StLgd-pdzmvFvQq.mp4", "rem": ""}, {"n": 486, "c": "explainer", "t": [], "a": "IvySparkleAI", "p": "A sung explainer from @leploutos gave me an idea: what if AI agents explained themselves over a house groove? Ten Treblo tracks, one human choice. Then Opus 5.5 got one brief: turn the chosen song into a film, not a slideshow. It built the motion, synced the words, rendered, checked and fixed its own work. Almost one-shot from our side—not one untested take. No editing timeline dragged by hand. Follow the copper thread. It becomes something else 😉 Taste set the direction. An experiment from our @agenticrealism world. Curious about the thinking behind it? Our articles go deeper. Link below. Agentic Music. This is Crazy.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107065301619666945/img/qHZ08EzTd7wFsAn_.jpg", "post": "https://x.com/IvySparkleAI/status/2107065771658543294", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107065301619666945/vid/avc1/320x568/5fxAD5RZIH3PWARC.mp4", "orig": "https://video.twimg.com/amplify_video/2107065301619666945/vid/avc1/1080x1920/anrJUSROrCYrMuem.mp4", "rem": ""}, {"n": 487, "c": "3d", "t": [], "a": "kisaka_ki", "p": "Build a debris flow riverbed change calculation model. Create a visualization video showing where and how much sediment accumulated, using 3D illustrations or actual aerial photo-like textures. You can choose the terrain freely. Make it easy to see where deposition and flooding occur.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107054745353637888/img/0esswVlVNuKGiNZr.jpg", "post": "https://x.com/kisaka_ki/status/2107054815255859326", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107054745353637888/vid/avc1/480x270/G3qRFQElBKOZhrsz.mp4", "orig": "https://video.twimg.com/amplify_video/2107054745353637888/vid/avc1/1920x1080/k-tg9N-0PoTBsp6r.mp4", "rem": ""}, {"n": 488, "c": "motion", "t": [], "a": "Gdgtify", "p": "Create a kinetic mathematical proof titled “THERE IS NO LAST PRIME.”\nStage Euclid’s argument as a beautiful mechanical inspection system. Typography becomes engraved number wheels, multiplication belts, and remainder indicators.\nThe mechanism must demonstrate the proof rather than decorate a narrated explanation.\nDELIVERABLE\nOne self-contained HTML file.\n1080×1080.\n20.00-second loop.\nDeterministic 60fps rendering.\nUse SVG and/or Canvas.\nNo external runtime assets.\nPALETTE\nPorcelain # F0EEE6.\nGraphite #222522.\nIndustrial green # 416B53.\nWarning orange # E78636.\nTYPE\nTabular monospace for all calculations.\nHeavy geometric grotesque for declarations.\nSmall technical serif for the final logical statement.\nUse disciplined spacing and large, readable numerals.\nLOCKED COPY\nSUPPOSE THE LIST ENDS.\nMULTIPLY EVERY PRIME ON IT.\nADD ONE.\nEVERY LISTED PRIME LEAVES REMAINDER 1.\nA PRIME FACTOR IS MISSING.\nTHERE IS NO LAST PRIME.\nCENTRAL EXAMPLE\nAssumed list:\n2, 3, 5, 7, 11, 13\nProduct:\n30030\nProduct plus one:\n30031\nFactorization:\n30031 = 59 × 509\nBoth factors are absent from the assumed list.\nIMPORTANT LOGIC\nDo not claim that multiplying primes and adding one always produces a prime.\nThe constructed number may be composite.\nIts prime factors cannot be any prime on the assumed complete list.\nThe numerical example illustrates the general contradiction.\nSTORYBOARD\n0.00–3.00\nSUPPOSE THE LIST ENDS.\nSix engraved prime wheels lock into a finite inspection rack.\nA physical end-stop closes after 13.\nThe end-stop makes the claim of completeness visible.\n3.00–6.50\nMULTIPLY EVERY PRIME ON IT.\nA belt couples all six wheels.\nShow a readable multiplication expression:\n2 × 3 × 5 × 7 × 11 × 13 = 30030.\nUse rolling numerals only during movement; settle the final value sharply.\n6.50–8.50\nADD ONE.\nA single orange unit enters the mechanism.\nIt advances the output from 30030 to 30031.\nMake this one-unit change the decisive visual event.\n8.50–12.50\nEVERY LISTED PRIME LEAVES REMAINDER 1.\nThe output passes through six division gates.\nEach gate is labelled with its prime.\nEach produces the same visible remainder: 1.\nArrange the six completed results so the audience can compare them simultaneously.\n12.50–15.50\nThe output opens as a labelled mechanical casing.\nInside, reveal:\n59 × 509.\nThese factors cannot fit into the supposedly complete rack.\nThe end-stop is forced outward by the new factor cards.\n15.50–18.00\nA PRIME FACTOR IS MISSING.\nThen:\nTHERE IS NO LAST PRIME.\nHold the general statement above the opened rack.\nInclude the compact general form:\nN = p₁p₂…pₖ + 1.\nN mod pᵢ = 1.\n18.00–20.00\nA fresh inspection plate slides over the mechanism.\nIts engraved edge becomes the original end-stop.\nReset the hidden wheels.\nReveal the opening rack at the exact initial position.\nREQUIRED MOTION\nEvery mechanical action must correspond to an operation in the proof.\nUse linked rota", "img": "https://pbs.twimg.com/amplify_video_thumb/2107038601468932096/img/zeOOQ1pASy2-_yNu.jpg", "post": "https://x.com/Gdgtify/status/2107054188836393073", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107038601468932096/vid/avc1/320x320/O1Ng7HbSOXABv1C7.mp4", "orig": "https://video.twimg.com/amplify_video/2107038601468932096/vid/avc1/1080x1080/ozxFFu4y8gO7yJqM.mp4", "rem": ""}, {"n": 489, "c": "motion", "t": [], "a": "mouri45", "p": "I heard you are good at making videos, so I want to know what kind of videos you can make. Please create several patterns of promotional videos for Meta VR Glasses.", "img": "https://pbs.twimg.com/amplify_video_thumb/2107035456953315328/img/kfdEHTXg2WqJypNq.jpg", "post": "https://x.com/mouri45/status/2107036053949575311", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2107035456953315328/vid/avc1/480x270/tpl5mt5IpNuhGRdj.mp4", "orig": "https://video.twimg.com/amplify_video/2107035456953315328/vid/avc1/1920x1080/WlC9ndcshDuaCtYi.mp4", "rem": ""}, {"n": 490, "c": "motion", "t": [], "a": "FinanceYF5", "p": "Make a beat-synced motion graphics music video for this track. Go all out.\n\n<Your music style>\n\n<Your music lyrics>", "img": "https://pbs.twimg.com/amplify_video_thumb/2106971653477687296/img/c7ddrxLKN5IncLO9.jpg", "post": "https://x.com/FinanceYF5/status/2106971898391462150", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106971653477687296/vid/avc1/480x270/bgxYgx-Qt8jPusH1.mp4?tag=16", "orig": "https://video.twimg.com/amplify_video/2106971653477687296/vid/avc1/1920x1080/DDf65PWC9oGnVh1d.mp4?tag=16", "rem": ""}, {"n": 491, "c": "motion", "t": [], "a": "ClaudeCode_UT", "p": "SKILL.mdどおりに「仕事が速くなるGmailの機能5選」を作って。台本は5つの項目に構造化して、働きは公式ヘルプで確かめて、画像はコードで描いて、ゆっくり音声に合わせて秒単位で切り替えて", "img": "https://pbs.twimg.com/amplify_video_thumb/2106958623276711936/img/k4XBnbgTX1ESV6_5.jpg", "post": "https://x.com/ClaudeCode_UT/status/2106958663525314769", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106958623276711936/vid/avc1/480x270/qwD41EOa_0kZPZv7.mp4?tag=16", "orig": "https://video.twimg.com/amplify_video/2106958623276711936/vid/avc1/1920x1080/gSYKeK_G-CNtn6Kn.mp4?tag=16", "rem": ""}, {"n": 492, "c": "interactive", "t": [], "a": "konstantinsaifo", "p": "Build one you can actually watch. Trucks reverse onto the dock, forklifts unload and boxes slide down chutes onto the right truck.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106854276442030080/img/Hux37FWbM6aRfqoi.jpg", "post": "https://x.com/konstantinsaifo/status/2106855420237169107", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106854276442030080/vid/avc1/480x270/qZQx5ubsG-b4MAYK.mp4", "orig": "https://video.twimg.com/amplify_video/2106854276442030080/vid/avc1/1920x1080/1AgqifvwPqIT2tX1.mp4", "rem": ""}, {"n": 493, "c": "motion", "t": [], "a": "uiNerd", "p": "[attach character image] make a 15-second animation of it, built in code. topic: the last day of Oktoberfest. one last ‘Prost!’ as the Wiesn lights go out. find free public-domain sounds online, sync them to the animation, and mix everything with ffmpeg.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106842187228925952/img/qRkkV8LvW-0KACJP.jpg", "post": "https://x.com/uiNerd/status/2106842274537635877", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106842187228925952/vid/avc1/320x320/kJZWfbUUhb4ZpSz5.mp4", "orig": "https://video.twimg.com/amplify_video/2106842187228925952/vid/avc1/1080x1080/Iq_68eKYqV5H9qVX.mp4", "rem": ""}, {"n": 494, "c": "motion", "t": [], "a": "YanivM79", "p": "\"This is the song, it will be posted on X. Create a related video for it.\"\n\nThen I pasted the lyrics and said: \"Finish all of it.\"", "img": "https://pbs.twimg.com/amplify_video_thumb/2106720506443399168/img/cVTob9mgZhdc0jmO.jpg", "post": "https://x.com/YanivM79/status/2106793839193158103", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106720506443399168/vid/avc1/480x270/zohM1RY2NOEQRZ_8.mp4", "orig": "https://video.twimg.com/amplify_video/2106720506443399168/vid/avc1/1920x1080/eacfWtZtHDqz3oZd.mp4", "rem": ""}, {"n": 495, "c": "3d", "t": [], "a": "SadAlbert10", "p": "Make a realistic 3D pixel Art animation of a Pelican riding a Bicycle over the Bridge, beautiful city in the background.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106789246547931137/img/XAc20OLPQ_tqGuph.jpg", "post": "https://x.com/SadAlbert10/status/2106789700807856416", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106789246547931137/vid/avc1/320x724/p9aEfM0YKMS-Zusk.mp4", "orig": "https://video.twimg.com/amplify_video/2106789246547931137/vid/avc1/1088x2464/UbcAEeu0ZMO31Zhc.mp4", "rem": ""}, {"n": 496, "c": "3d", "t": [], "a": "AYi_AInotes", "p": "Create a 30-second full-code-driven animation using SVG vector graphics and synthesized original soundtrack. \n\nVisual Style: Abandon line boiling; use hand-written vector gradients, soft shadows, and night sky glows.\n\nScene Sequence:\n1. A small character steps on the ground, charges up, runs into the sunset, and hits a star which explodes.\n2. Sync every action (stepping, charging, running, exploding) precisely to piano and harp notes frame-by-frame.\n3. Ending: Cursive text \"Claude Opus 5.5\" does a flip and lands as a decimal point, followed by confetti falling from a blink.\n\nTechnical Requirement: Every frame and note must be written by code.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106694219590979584/img/lxWrO89JJI3RHXIM.jpg", "post": "https://x.com/AYi_AInotes/status/2106784005911933194", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106694219590979584/vid/avc1/480x270/m3OGkZOoN662o79f.mp4", "orig": "https://video.twimg.com/amplify_video/2106694219590979584/vid/avc1/1920x1080/A0K42ei-E73RPebV.mp4", "rem": ""}, {"n": 497, "c": "motion", "t": [], "a": "thewevr", "p": "Make a complete music video for the song in this folder, with all\nvisuals drawn and animated in JavaScript. Use the entire song.\n\nSETUP\nInspect this folder and identify the song and any lyrics or reference\nfiles. Preserve my original files unchanged.\n\nUse this existing animation starter:\nhttps://t.co/oN3A7ZZyEl\n\nClone it into a new ./video subfolder, unless an existing copy is\nalready present. Do not overwrite existing work or clone into the\nnonempty project root.\n\nRead its README.md and ANIMATION_GUIDE.md completely, then inspect\nrender.mjs and the project configuration. Use the existing rendering\nmachinery rather than inventing a replacement.\n\nCheck Node.js, Chrome, and FFmpeg. Inspect the package configuration\nand install the project dependencies. Ask before making system-wide\nchanges or downloading large additional tools.\n\nDo not use fal, external image/video generation, paid APIs, or the\nhybrid music-video plugin. All finished visuals must be code-drawn.\n\nCREATIVE DIRECTION\nCreate a cohesive, visually imaginative animated music video with a\nhandmade, papery, illustrated feel. Express the song's meaning through\nscenes, characters, visual metaphors, and purposeful transitions.\nEstablish an engaging opening and develop recurring visual motifs.\nDo not make a slideshow, a generic audio visualizer, or one animation\nloop repeated for the entire song. Design characters appropriate to\nthis song rather than automatically using the starter's mascot.\n\nMUSIC AND TIMING\nUse the supplied recording as the continuous master soundtrack.\nDo not remix, replace, speed up, or shorten it.\n\nMeasure its duration and use available local audio-analysis tools to\nidentify musical sections and likely beat/accent timings. Record these\nin a shared timeline and drive animation from that timeline.\n\nUse supplied lyrics as authoritative. If lyrics are missing, use a\nlocal transcription tool only if available, flag uncertain words, and\ndo not invent lyrics. Continue with non-lyric visuals where necessary.\n\nWhen verified lyrics are available, use expressive, readable lyric\nanimation where it strengthens the scene. This explicitly overrides\nthe starter's default preference against lettering.\n\nPRODUCTION\nWrite STORYBOARD.md with timed scenes covering the complete recording.\nSave the project brief and rerender instructions in CLAUDE.md.\n\nThen build the video. Make reasonable creative decisions and continue\nwithout stopping for approval at every scene.\n\nTest a few representative frames and a short section before the full\nrender. Inspect the resulting images and frame sequences, fix visible\ndefects, and keep the animation practical for this computer.\n\nUse efficient code-drawn textures if expensive watercolor effects\nmake rendering impractical.\n\nDELIVERY\nRender the complete video", "img": "https://pbs.twimg.com/amplify_video_thumb/2106767334828376064/img/QuP1yP_ZeBHPLbid.jpg", "post": "https://x.com/thewevr/status/2106774417732681887", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106767334828376064/vid/avc1/480x270/pgmFyrg7yIq6T-q7.mp4", "orig": "https://video.twimg.com/amplify_video/2106767334828376064/vid/avc1/1920x1080/hlfUQWmLnUZXcyYb.mp4", "rem": ""}, {"n": 498, "c": "explainer", "t": [], "a": "ArchiveExplorer", "p": "Write my launch video as 9 beats: pain, reframe, name, how it works, objection, range, mechanism in numbers, offer, CTA – one line each. For every beat write 3 headline options and send them to Jev to pick the one that best fits my brief. Build each beat as a wireframe first in HyperFrames: boxes, outlined text, guide lines, no color. Show me one still per beat and lock the timing. Then skin it from my DESIGN.md without moving the layout, and render a split view: final on the left, wireframe on the right.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106732080574988288/img/zj1dn0NV6NVI1GE9.jpg", "post": "https://x.com/ArchiveExplorer/status/2106732275685560622", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106732080574988288/vid/avc1/480x270/Bin9al6c9JwyOg7J.mp4", "orig": "https://video.twimg.com/amplify_video/2106732080574988288/vid/avc1/1920x1080/IBfkzduNWdA5YeTC.mp4", "rem": ""}, {"n": 499, "c": "explainer", "t": [], "a": "xodud_rkd", "p": "Make a pixel motion video of all human progress, then 30 years into the future. Output in mp4", "img": "https://pbs.twimg.com/amplify_video_thumb/2106732077807009792/img/g1U8jVw4nA_WlR__.jpg", "post": "https://x.com/xodud_rkd/status/2106732228181160324", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106732077807009792/vid/avc1/480x270/Xnz7N9Tl7woJRAUj.mp4", "orig": "https://video.twimg.com/amplify_video/2106732077807009792/vid/avc1/960x540/4kb0yFI26dA3syRh.mp4", "rem": ""}, {"n": 500, "c": "motion", "t": [], "a": "leo114119", "p": "Reproduce and analyze Clawd Moves In from the living-screencast demo source.\nInspect the current commit, locks, STYLE.md, DEMO.md, CREDITS, core APIs,\nand demo/build.sh. Read the author MP4 and actual local files first.\n\nKeep it an attributed unofficial fan-film", "img": "https://pbs.twimg.com/amplify_video_thumb/2106713983193677824/img/8ezQRVMe3sF9xFhm.jpg", "post": "https://x.com/leo114119/status/2106714123580936422", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106713983193677824/vid/avc1/480x270/1f6Ayy_0rQVdeo9l.mp4", "orig": "https://video.twimg.com/amplify_video/2106713983193677824/vid/avc1/1280x720/eqbwHQdfw53veG38.mp4", "rem": ""}, {"n": 501, "c": "motion", "t": [], "a": "elkrispis", "p": "Plan a launch video. Music, logo, CTA. Modern, founder-like.\n\nThis is horrible. More movement. Use components, not a recording. Use the app's near-black theme. Animated text.\n\nSome parts too fast, some too slow. Only the key hits on the beat. Make it readable.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106700527480287232/img/IkKrf0Nfe5PXaM1L.jpg", "post": "https://x.com/elkrispis/status/2106701208647872980", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106700527480287232/vid/avc1/480x270/JSBbQqwts8aEkAPp.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2106700527480287232/vid/avc1/1280x720/PfgwQu5zo38SP9ZZ.mp4?tag=14", "rem": ""}, {"n": 502, "c": "motion", "t": [], "a": "shengtang135754", "p": "You are a creative developer and motion graphics designer. Build a refined product video entirely through code using React and Remotion.\n\nTreat this as a small motion graphics project. Think about the relationship between composition, typography, rhythm, and visual narrative versus implementation.\n\nProject Details\n\nProduct Name: [Product Name]\n\nProduct Features: [Short Description]\n\nTarget Audience: [Audience]\n\nMain Benefit: [One Clear Benefit]", "img": "https://pbs.twimg.com/amplify_video_thumb/2106656823805960192/img/w3twRFIMWrNJFeYu.jpg", "post": "https://x.com/shengtang135754/status/2106657027686900065", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106656823805960192/vid/avc1/320x568/5CYqCO8F_rIFT2eZ.mp4", "orig": "https://video.twimg.com/amplify_video/2106656823805960192/vid/avc1/1080x1920/lFkSJH3E6z3KKUWh.mp4", "rem": ""}, {"n": 503, "c": "explainer", "t": [], "a": "Cryptoxorz", "p": "Help me make a science explainer video. Topic: {Topic} (Supplementary materials: {Paper/Link/Screenshot, Optional}; Target audience: {Zero-basis public / Some basis, Optional})\n\n- Content: Explain one core question clearly, with a curiosity hook, counter-intuitive points, and life-like analogies, but facts must be accurate and sourced.\n  - Prioritize citing original papers, authoritative institutions, and textbooks; do not use secondary marketing accounts.", "img": "https://pbs.twimg.com/amplify_video_thumb/2106629580195049472/img/kUjnurwYQ5XTZYLf.jpg", "post": "https://x.com/Cryptoxorz/status/2106632900049359201", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2106629580195049472/vid/avc1/320x568/lAVjutWq8dldub9p.mp4", "orig": "https://video.twimg.com/amplify_video/2106629580195049472/vid/avc1/1080x1920/tSpVWRyXkVNWttyL.mp4", "rem": ""}, {"n": 504, "c": "motion", "t": [], "a": "Kaiyu_AI", "p": "「蜘蛛の糸の漫画を作成しています。\nhttps://t.co/8DlK2EPeo0\nそれを元にモーションコミックの作成してください。\nただし、差分の画像生成はCodex CLIを使用するように。また、Gemini APIを使って良いのはGemini 3.8 Flash TTSとTTS Lite、BGM用のLyria 3.5のみとし、Tire1なので1分間あたりや1日あたりの制限に引っかからないようにすること。\n糸を垂らす演出とか糸から登る演出とかはた
