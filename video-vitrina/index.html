 the desktop look like a point in space. And then it zooms back in to reveal a mobile screen in landscape mode with a chart in one half and an option chain in another. The video ends in Sjngle Screen Trading on SAHI\nuse javascript for it. be detailed and accurate. it should be visually stunning\n0:46", "img": "https://media.skillry.dev/opus-5-5/dale-vaz-879074/original.155c6e80d4.webp", "post": "https://x.com/dale_vaz/status/2103290592679879074", "v": true, "card": "https://media.skillry.dev/opus-5-5/dale-vaz-879074/original-card.0ab4f3343b.mp4", "orig": "https://media.skillry.dev/opus-5-5/dale-vaz-879074/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/dale-vaz-879074/remake.mp4"}, {"n": 53, "c": "motion", "t": ["canvas"], "a": "ChatGptAstra", "p": "以动态设计师的高级审美，制作一段动态的15秒动态图形视频", "img": "https://media.skillry.dev/opus-5-5/chatgptastra-807540/original.e84909440e.webp", "post": "https://x.com/ChatGptAstra/status/2103834787647807540", "v": true, "card": "https://media.skillry.dev/opus-5-5/chatgptastra-807540/original-card.cb75f1adb8.mp4", "orig": "https://media.skillry.dev/opus-5-5/chatgptastra-807540/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/chatgptastra-807540/remake.mp4"}, {"n": 54, "c": "explainer", "t": ["canvas", "svg", "css"], "a": "kloss_xyz", "p": "make a video highlighting key moments in the history of AI.", "img": "https://media.skillry.dev/opus-5-5/kloss-xyz-067876/original.ebb20ee088.webp", "post": "https://x.com/kloss_xyz/status/2103652674336067876", "v": true, "card": "https://media.skillry.dev/opus-5-5/kloss-xyz-067876/original-card.c4263a1b02.mp4", "orig": "https://media.skillry.dev/opus-5-5/kloss-xyz-067876/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kloss-xyz-067876/remake.mp4"}, {"n": 55, "c": "motion", "t": ["threejs", "canvas"], "a": "SPEARwtf", "p": "Create a 30sec pitch video for \n@chaindotwtf", "img": "https://media.skillry.dev/opus-5-5/spearwtf-029058/original.d210e8046f.webp", "post": "https://x.com/SPEARwtf/status/2103857153308029058", "v": true, "card": "https://media.skillry.dev/opus-5-5/spearwtf-029058/original-card.c787bf6327.mp4", "orig": "https://media.skillry.dev/opus-5-5/spearwtf-029058/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/spearwtf-029058/remake.mp4"}, {"n": 56, "c": "motion", "t": ["canvas"], "a": "MajorBaguette", "p": "make a presentation video for Brieform, 30 seconds long", "img": "https://media.skillry.dev/opus-5-5/majorbaguette-834228/original.b0e3fa0a59.webp", "post": "https://x.com/MajorBaguette/status/2103849602826834228", "v": true, "card": "https://media.skillry.dev/opus-5-5/majorbaguette-834228/original-card.e5269b6e10.mp4", "orig": "https://media.skillry.dev/opus-5-5/majorbaguette-834228/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/majorbaguette-834228/remake.mp4"}, {"n": 57, "c": "motion", "t": ["svg", "gsap"], "a": "miskinho_", "p": "make  1 dynamic 15-second motion graphics video that shows what an incredible motion designer you are, like it's your showreel for Quetzal. go all out.", "img": "https://media.skillry.dev/opus-5-5/miskinho-956105/original.9177868dec.webp", "post": "https://x.com/miskinho_/status/2103847584531956105", "v": true, "card": "https://media.skillry.dev/opus-5-5/miskinho-956105/original-card.7fede0d824.mp4", "orig": "https://media.skillry.dev/opus-5-5/miskinho-956105/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/miskinho-956105/remake.mp4"}, {"n": 58, "c": "motion", "t": ["threejs", "svg", "gsap"], "a": "felipemoller", "p": "Use apenas: JavaScript, Playwright e FFmpeg. Faça um vídeo moderno, elegante e impactante para meu produto (https://lp.meuorbe.com.br). Quero que simule os gastos em estabelecimentos do dia a dia, como mercado, posto de gasolina e restaurante. \n\nFaça no formato 9:16.", "img": "https://media.skillry.dev/opus-5-5/felipemoller-936736/original.f7148272e5.webp", "post": "https://x.com/felipemoller/status/2103846311149936736", "v": true, "card": "https://media.skillry.dev/opus-5-5/felipemoller-936736/original-card.4fb4a44fd8.mp4", "orig": "https://media.skillry.dev/opus-5-5/felipemoller-936736/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/felipemoller-936736/remake.mp4"}, {"n": 59, "c": "3d", "t": ["threejs", "shader", "svg"], "a": "mdaman010", "p": "Show me what goes on inside an AI data centre.", "img": "https://media.skillry.dev/opus-5-5/mdaman010-111079/original.b7ac5dc603.webp", "post": "https://x.com/mdaman010/status/2103845689713111079", "v": true, "card": "https://media.skillry.dev/opus-5-5/mdaman010-111079/original-card.43e9970128.mp4", "orig": "https://media.skillry.dev/opus-5-5/mdaman010-111079/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mdaman010-111079/remake.mp4"}, {"n": 60, "c": "motion", "t": ["canvas"], "a": "HO_BA", "p": "Make a dynamic 30-second motion graphics video that shows what an incredible motion designer you are, like it's your showreel for a résumé. go all out.  Make it a video to introduce \nhttps://\nmdfor.dev Use actual product screenshot/logo/assets Must have music and motion must match the music  Do it like a real professional production video, not like a demo or prototype. Add more animation and motion design; avoid using screenshots as raw; instead, break them down into components/icons so we can animate those too. Make the motions more juicy. Use the best motion design techniques you can.", "img": "https://media.skillry.dev/opus-5-5/ho-ba-761062/original.edf406f8ac.webp", "post": "https://x.com/HO_BA/status/2103845264649761062", "v": true, "card": "https://media.skillry.dev/opus-5-5/ho-ba-761062/original-card.79597a6089.mp4", "orig": "https://media.skillry.dev/opus-5-5/ho-ba-761062/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ho-ba-761062/remake.mp4"}, {"n": 61, "c": "motion", "t": ["canvas"], "a": "HowDevelop", "p": "Create and render a 15-second motion graphics video introducing TanStack AI. Make it feel like a premium            \n  developer-tool launch film produced by Studio1: fast, precise, visually surprising, and polished enough to open a   \n  keynote or lead a social campaign.                                                                                  \n                                                                                                                      \n  Use the TanStack AI feature details below as the source of truth. Studio1 is presenting the film; do not imply      \n  Studio1 built TanStack AI.                                                                                          \n                                                                                                                      \n  Format and deliverables                                                                                             \n  - 1920×1080, 30 fps, exactly 15 seconds; keep important content within a 9:16-safe central area.                    \n  - Deliver the rendered MP4 and the editable project/source. Use Remotion or another code-based motion graphics      \n  workflow if available.                                                                                              \n  - Use real, editable typography and vector-style graphics. Do not rely on AI-generated text inside images.          \n  - Add an original electronic sound design: a restrained opening pulse, tightly synchronized transition hits, rising \n  - Add an original electronic sound design: a restrained opening pulse, tightly synchronized transition hits, rising \n  momentum, and a satisfying final resolve. The story must also work muted.                                           \n                                                                                                                      \n  Visual direction                                                                                                    \n  Dark graphite canvas; luminous gradients and controlled flashes inspired by TanStack’s identity. Crisp typography,  \n  kinetic code, layered interface fragments, streaming data, branching paths, and smooth camera moves with convincing \n  depth. High contrast and immaculate spacing. Every transition should visually demonstrate a feature, rather than    \n  simply replace one title card with another. Keep all on-screen wording brief and legible. Avoid generic stock       \n  footage, spinning logos, fake dashboards, excessive glitch effects, and tiny code nobody can read.                  \n                                                                                                                      \n  Exact 15-second sequence                                                                                            \n  - 0:00–0:02 — Hook: A single prompt cursor blinks. It sends one signal that expands into a network of               \n  possibilities. On-screen: “What can one AI API become?”                                                             \n  - 0:02–0:04 — Core and providers: The signal resolves into chat(); provider nodes connect and swap rapidly without  \n  breaking the central flow. On-screen: “chat() · 24 providers”                                                       \n  - 0:04–0:06.5 — Multimodal: One continuous stream transforms into text, waveform, image frame, and video timeline.  \n  On-screen: “One pattern. Every modality.”                                                                           \n  - 0:06.5–0:09 — Agents and tools: The stream branches into sandboxed agent runs, then reaches external tools        \n  through MCP. Show distinct runs progressing in parallel. On-screen: “Agents · Sandboxes · MCP”                      \n  - 0:09–0:11.5 — Reliability: An interrupted stream freezes, reconnects, and resumes from the same point; a clean    \n  type-check confirmation snaps into place. On-screen: “Persistent. Durable. Type-safe.”                              \n  - 0:11.5–0:15 — Reveal: All paths converge into a bold final composition: “TanStack AI” followed by “Build what’s   \n  next.” Add a small “A Studio1 film” credit, visually subordinate to TanStack AI. Hold the final frame long enough   \n  to read it.                                                                                                         \n                                                                                                                      \n  Accuracy guardrails                                                                                                 \n  The supplied article says TanStack AI is in the release candidate phase, supports 24 providers, uses AG-UI, and     \n  offers composable chat(), media generation, sandbox and agent-harness primitives, MCP, type safety, persistence,    \n  and resumable streams. Do not call it a stable v1 release. Do not present planned orchestration features as already \n  shipped.                                                                                                            \n                                                                                                                      \n  Make the video, inspect the rendered result, and fix any clipped text, weak transitions, mistimed beats, or         \n  unreadable frames before delivering it. The goal is a memorable showreel, not a slideshow of feature bullets.", "img": "https://media.skillry.dev/opus-5-5/howdevelop-733090/original.c156b8a720.webp", "post": "https://x.com/HowDevelop/status/2103840883812733090", "v": true, "card": "https://media.skillry.dev/opus-5-5/howdevelop-733090/original-card.9738ab9ea0.mp4", "orig": "https://media.skillry.dev/opus-5-5/howdevelop-733090/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/howdevelop-733090/remake.mp4"}, {"n": 62, "c": "motion", "t": ["shader", "webgl", "canvas"], "a": "MiaAI_lab", "p": "Build me something when people see it, they will say \"Wow\". Must be immersive, when people see it, they will be stunned by what they see.\n\nThis can be a video, or anything else you can think of.\n\nBe creative. Go wild. Dig deep.\n\nNo AI slop. Something unique, think outside of the box. Think big. Think amazing. Something no other model done before.\n\nBe proud. Show your best. Don't disappoint.", "img": "https://media.skillry.dev/opus-5-5/miaai-lab-774895/original.fad5a90e2f.webp", "post": "https://x.com/MiaAI_lab/status/2103837519615774895", "v": true, "card": "https://media.skillry.dev/opus-5-5/miaai-lab-774895/original-card.e66141e288.mp4", "orig": "https://media.skillry.dev/opus-5-5/miaai-lab-774895/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/miaai-lab-774895/remake.mp4"}, {"n": 63, "c": "motion", "t": ["svg", "gsap"], "a": "gouthamjay8", "p": "I want you to create a highly professional SaaS product launch video. Go and look up [website] Pick that, and then make sure to get actual assets and images and all of that stuff from the internet. Turn it into these typical, very professionally edited, motion-graphics-styled product launch videos that you see people making on Twitter when they launch new SaaS products (which are showing off the features, the benefits, and all of these things). It should show what an incredible motion designer you are, like it's your showreel for a resume. Go all out.", "img": "https://media.skillry.dev/opus-5-5/gouthamjay8-910269/original.0ca013001b.webp", "post": "https://x.com/gouthamjay8/status/2103816261339910269", "v": true, "card": "https://media.skillry.dev/opus-5-5/gouthamjay8-910269/original-card.143b2bb6f3.mp4", "orig": "https://media.skillry.dev/opus-5-5/gouthamjay8-910269/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/gouthamjay8-910269/remake.mp4"}, {"n": 64, "c": "motion", "t": ["canvas", "svg"], "a": "marklaunches", "p": "build me an incredible video for my app. make it emotional.", "img": "https://media.skillry.dev/opus-5-5/marklaunches-041046/original.5eec9c39da.webp", "post": "https://x.com/marklaunches/status/2103811146411041046", "v": true, "card": "https://media.skillry.dev/opus-5-5/marklaunches-041046/original-card.728b09334b.mp4", "orig": "https://media.skillry.dev/opus-5-5/marklaunches-041046/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/marklaunches-041046/remake.mp4"}, {"n": 65, "c": "motion", "t": ["svg"], "a": "KmAsiff", "p": "make a dynamic 20-second motion graphics video that shows what an incredible our email verify tool is, put all the use case you can imagine. go all out'\ni want you to make it really modern and saas style. inspiration is yc videos and claude social videos", "img": "https://media.skillry.dev/opus-5-5/kmasiff-549880/original.cedac90f16.webp", "post": "https://x.com/KmAsiff/status/2103810247131549880", "v": true, "card": "https://media.skillry.dev/opus-5-5/kmasiff-549880/original-card.309e07b809.mp4", "orig": "https://media.skillry.dev/opus-5-5/kmasiff-549880/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kmasiff-549880/remake.mp4"}, {"n": 66, "c": "interactive", "t": ["svg"], "a": "redpersongpt", "p": "Create a studio level motion design ad for my app mimicly. Show me the best you got.\n\nYou are the lead creative strategist, product marketer, direct-response ad writer, and hands-on growth operator for Mimicly.\n\nYour job is to deeply understand Mimicly’s real product experience, then turn that understanding into high-quality ad concepts, ad assets, hooks, scripts, and launch-ready creative ideas that do NOT feel generic or “AI-made.”\n\nIMPORTANT:\n- Do not create generic “mockup app” marketing.\n- Do not rely on assumptions.\n- Base everything on Mimicly’s actual product, actual UI, and actual user flows.\n- Use the real product as the source of truth.\n- If you can access the website, App Store page, editor, simulator, screenshots, or any current product surfaces, inspect them directly before deciding anything.\n- If you can capture screenshots, screen recordings, or UI references from the actual product, do it.\n- Do not invent features that do not exist.\n- Do not break what currently works.\n\nPRODUCT YOU ARE WORKING ON\nMimicly is a chat mockup maker for screenshots, text stories, and dialogue videos.\nIt works on web and iPhone.\nIt offers 63 templates.\nUsers can edit both sides of conversations, names, profile photos, timestamps, colors, and supported UI details.\nIt includes chat templates, AI conversation templates, social-style templates, comment templates, stories, email, and game chat styles.\nSupported exports include image export, and supported templates can also be recorded as MP4.\nUsers can sign in and get 3 free exports. Pro unlocks the full template collection and watermark-free exports.\nMimicly’s value is speed, realism, flexibility, and “make it look right” editing.\n\nKNOWN PRODUCT FEEL / BRAND DIRECTION\n- Clean, modern, product-led\n- Useful, not cringe\n- Creative-tool energy, not fake-hype startup nonsense\n- Strong on realism and visual believability\n- The appeal is: “I can quickly create convincing chat/mockup content for content creation, storytelling, skits, tutorials, memes, product demos, lessons, storyboards, and social posts.”\n\nYOUR MISSION\nCreate a complete Mimicly ad-creative system based on the real product.\n\nPHASE 1 — PRODUCT UNDERSTANDING\nFirst, inspect and understand:\n1. The public website\n2. The App Store listing\n3. The homepage messaging\n4. The template browser / template categories\n5. The editor experience\n6. Preview behavior\n7. Export flow\n8. Paywall / free vs pro positioning\n9. The visual feel of the app and web product\n10. The strongest “wow” moments for first-time users\n\nPay special attention to:\n- Homepage hero\n- Template examples\n- Live editor behavior\n- The “before / after” feeling\n- How realistic the previews look\n- Which templates are most ad-worthy visually\n- Which screens are easiest to understand instantly in an ad\n\nIf possible, capture a reference set of real visuals:\n- app screenshots\n- web screenshots\n- editor screenshots\n- preview screenshots\n- export-related screens\n- 5–15 second screen recordings of realistic usage\n\nPHASE 2 — FIND THE BEST MARKETING ANGLES\nBased on the real product, identify the strongest ad angles.\n\nFind the best angles for users such as:\n- content creators\n- meme pages\n- storytellers\n- short-form video creators\n- skit makers\n- YouTubers / TikTok creators\n- marketers making fake chat visuals for concepts/storyboards\n- educators making lesson examples\n- people creating “text story” style content\n- people making AI conversation mockups\n- people making social post mockups\n\nFor each angle, define:\n- the user type\n- the core desire\n- the pain point\n- why Mimicly solves it better\n- the strongest visual proof\n- the best CTA\n\nPHASE 3 — CREATE A CREATIVE STRATEGY\nProduce a clear creative strategy document containing:\n1. Core positioning\n2. Top 5 user personas\n3. Top 10 ad angles\n4. Top 20 hooks\n5. Top 10 “visual demo” ideas\n6. Top objections and how to answer them\n7. Top App Store / landing page conversion messages\n8. What NOT to say\n9. Which claims need caution or proof\n10. Which existing product features deserve the most emphasis\n\nPHASE 4 — BUILD THE AD CONCEPTS\nCreate at least 12 strong ad concepts.\n\nFor each ad concept include:\n- concept name\n- target audience\n- angle\n- platform fit (TikTok / Instagram Reels / X / YouTube Shorts / App Store promo / website hero / paid social)\n- first 2-second hook\n- full ad script\n- scene-by-scene shot list\n- exact UI moments to show\n- on-screen text\n- voiceover\n- caption\n- CTA\n- why this concept should perform\n\nAt least:\n- 4 UGC-style concepts\n- 4 product-demo concepts\n- 2 comparison-style concepts\n- 2 “problem → solution” concepts\n\nPHASE 5 — USE THE REAL PRODUCT VISUALLY\nDo not make fake-looking ads.\n\nUse the actual Mimicly experience as much as possible:\n- show opening the app / website\n- show selecting a template\n- show editing messages / names / profile photos / timestamps\n- show the preview updating live\n- show switching between templates where useful\n- show export or save behavior where appropriate\n- show the realism of the result\n\nFocus heavily on visual proof.\nThe ad should make someone think:\n“Wait, this actually looks clean.”\n“Oh, I could use this.”\n“That took like 10 seconds?”\n\nPHASE 6 — PICK THE BEST TEMPLATES TO ADVERTISE\nReview Mimicly’s template universe and choose the best templates for marketing.\n\nRank the most ad-worthy templates by:\n- instant recognizability\n- visual clarity\n- emotional pull\n- creator usefulness\n- ability to demonstrate value quickly\n- likelihood to convert cold traffic\n\nLikely strong candidates may include:\n- WhatsApp-style chats\n- AI conversation templates (ChatGPT / Claude / Gemini style)\n- Instagram / DM / comment / post type templates\n- iMessage-style chats\n- Discord-style chats\n- story / social / dialogue video templates\n\nBut do not assume — inspect first.\n\nFor the top templates, say:\n- why they are ad-worthy\n- what kind of audience they attract\n- what kind of ad should use them\n\nPHASE 7 — CREATE REAL ASSETS OR ASSET BLUEPRINTS\nIf your environment allows it, create or organize:\n- a shot plan\n- a screenshot list\n- a screen recording list\n- asset naming\n- folder structure\n- recommended aspect ratios\n- prioritized recording checklist\n\nIf you cannot directly produce the final ad assets, produce a near-production-ready blueprint so a human editor can build them fast.\n\nDeliverables should include:\n- 10 static ad ideas\n- 10 short-form video ad ideas\n- 5 App Store screenshot angle ideas\n- 5 X/Twitter promo post ideas\n- 5 landing page hero/message ideas\n- 5 product-demo threads/carousels if relevant\n\nPHASE 8 — COPYWRITING\nWrite launch-ready copy in a way that does not sound like AI slop.\n\nTone:\n- sharp\n- natural\n- confident\n- slightly punchy\n- creator-friendly\n- not overhyped\n- not cringe\n- not corporate\n\nWrite:\n- 20 ad hooks\n- 20 CTAs\n- 15 captions\n- 10 App Store / social proof style lines\n- 10 short feature-value lines\n- 10 landing page headlines\n- 10 subheadlines\n\nAvoid fake urgency unless justified.\nAvoid saying it “goes viral.”\nAvoid empty words like “revolutionary.”\nAvoid generic “create stunning content” filler unless made specific.\n\nPHASE 9 — CONVERSION FOCUS\nRecommend which messages should push:\n- install\n- try free\n- first export\n- Pro conversion\n- template exploration\n- creator use cases\n\nMap the best message to the best funnel stage.\n\nTell me:\n- what gets the click\n- what gets the install\n- what gets the first successful export\n- what gets the Pro upgrade\n\nPHASE 10 — FINAL OUTPUT FORMAT\nGive the final answer in this structure:\n\n1. Mimicly product understanding\n2. Best audiences\n3. Best ad angles\n4. Best templates to feature\n5. 12 ad concepts\n6. Shot list / capture plan\n7. Copy bank\n8. Landing page / App Store messaging suggestions\n9. Recommended creative priorities\n10. Top 3 things to test first\n\nIf possible, end with:\n- “Best 3 concepts to make first”\n- “Fastest assets to produce tomorrow”\n- “Highest-upside experiment”\n\nQUALITY BAR\nThe output must feel like it came from a strong product marketer who actually inspected the product, not from an LLM guessing what a mockup app might be.\n\nBe specific.\nBe practical.\nBe visually aware.\nBe conversion-aware.\nBe ruthless about weak ideas.\nUse the real Mimicly product as your source of truth.\n\nStart by inspecting the real product surfaces, then build the strategy.", "img": "https://media.skillry.dev/opus-5-5/redpersongpt-284430/original.aa458f7e3a.webp", "post": "https://x.com/redpersongpt/status/2103807094554284430", "v": true, "card": "https://media.skillry.dev/opus-5-5/redpersongpt-284430/original-card.0babc3d801.mp4", "orig": "https://media.skillry.dev/opus-5-5/redpersongpt-284430/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/redpersongpt-284430/remake.mp4"}, {"n": 67, "c": "motion", "t": ["svg", "css"], "a": "TrigLyceee", "p": "réalise une vidéo résumant la vie politique au Maroc depuis l’indépendance", "img": "https://media.skillry.dev/opus-5-5/triglyceee-161719/original.cb9a4b70ca.webp", "post": "https://x.com/TrigLyceee/status/2103804459986161719", "v": true, "card": "https://media.skillry.dev/opus-5-5/triglyceee-161719/original-card.8dd4c52f50.mp4", "orig": "https://media.skillry.dev/opus-5-5/triglyceee-161719/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/triglyceee-161719/remake.mp4"}, {"n": 68, "c": "motion", "t": ["canvas"], "a": "Mounnna", "p": "Create a motion design video of a slow-reveal transition. Draw the logo as a wireframe first, then fly in faceted low-poly shards one by one until they assemble the logo. Finish by bringing in the app icon background and typing out the brand name.", "img": "https://media.skillry.dev/opus-5-5/mounnna-497266/original.ce992e530a.webp", "post": "https://x.com/Mounnna/status/2103802871934497266", "v": true, "card": "https://media.skillry.dev/opus-5-5/mounnna-497266/original-card.11b208e636.mp4", "orig": "https://media.skillry.dev/opus-5-5/mounnna-497266/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mounnna-497266/remake.mp4"}, {"n": 69, "c": "explainer", "t": ["svg"], "a": "henkvaness", "p": "make educational video out of article.", "img": "https://media.skillry.dev/opus-5-5/henkvaness-975279/original.b7fb5dee11.webp", "post": "https://x.com/henkvaness/status/2103801351993975279", "v": true, "card": "https://media.skillry.dev/opus-5-5/henkvaness-975279/original-card.792b7a5a04.mp4", "orig": "https://media.skillry.dev/opus-5-5/henkvaness-975279/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/henkvaness-975279/remake.mp4"}, {"n": 70, "c": "motion", "t": ["threejs", "shader", "canvas"], "a": "johnsavage_ai", "p": "use this image only as a style/vibe refference image and create a Opus 5.5 launch video (20 sec long) add film grain and CRT effect, make it mesmerizing, and show off your skills as a motion designer for a retro/futuristic style launch video 16:9", "img": "https://media.skillry.dev/opus-5-5/johnsavage-ai-427263/original.d2b14d5754.webp", "post": "https://x.com/johnsavage_ai/status/2103792769982427263", "v": true, "card": "https://media.skillry.dev/opus-5-5/johnsavage-ai-427263/original-card.fc030274a6.mp4", "orig": "https://media.skillry.dev/opus-5-5/johnsavage-ai-427263/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/johnsavage-ai-427263/remake.mp4"}, {"n": 71, "c": "interactive", "t": ["threejs", "canvas", "physics", "playable"], "a": "froessell", "p": "PRD — Police Chase Arcade Game\n\nWorking title: Heatwave\nPlatform: iOS + Android\nEngine: Unity\nGenre: Top-down 3D arcade chase / survival\nOrientation: Portrait\nInput: One-thumb touch controls\nBusiness model: TBD — design MVP around gameplay first\nPrimary goal: Build a genuinely fun playable prototype before adding progression or monetization.\n⸻\nProduct vision\nA fast, chaotic mobile arcade game where the player is constantly being pursued by increasingly aggressive police.\nThe player cannot directly attack.\nInstead, they survive by driving aggressively, drifting around obstacles, making sudden turns and tricking pursuing police into crashing into obstacles and each other.\nThe fantasy is:\nYou’re not stronger than the police. You’re harder to catch.\n\nRuns should produce constant near-misses, chain collisions and moments where the player escapes a seemingly impossible situation.\n\nThink:\n\neasy controls + aggressive pursuit + physics chaos + escalating pressure.\n\n⸻\n\nCore gameplay loop\n\nSTART RUN\n↓\nDRIVE / DRIFT\n↓\nPOLICE PURSUE\n↓\nBAIT POLICE\n↓\nDODGE\n↓\nPOLICE CRASH\n↓\nGAIN SCORE\n↓\nWANTED LEVEL INCREASES\n↓\nMORE / HARDER POLICE\n↓\nSURVIVE\n↓\nEVENTUALLY GET CAUGHT\n↓\nSCORE / RESTART\n\nTarget run duration:\n\n2–5 minutes.\n\nRestart should take less than 2 seconds.\n\n⸻\n\nDesign principles\n\n3.1 One-thumb playable\n\nThe player should be able to understand the controls within seconds.\nNo accelerator.\nNo brake pedal.\nNo virtual steering wheel.\nThe vehicle moves automatically.\nThe player controls only direction.\n\n(I moved away from this after testing it the first time and added the onscreen joystick)\n\n3.2 Arcade physics, not simulation\nVehicles should:\ndrift\nslide\nbounce\nspin\ncollide dramatically\nrecover quickly\nFun takes priority over physical accuracy.\n\n3.3 Pursuers are weapons\nPolice are effectively the player’s offensive mechanic.\nThe player should learn:\n“If I turn here, that cop is going straight into that wall.”\n3.4 Chaos should remain readable\n\nEven with 10+ vehicles on screen, the player must immediately understand:\nwhere they are\nwhere they’re moving\n\nwhere police are coming from\n\nwhat can kill them\n\n3.5 Failure should feel fair\n\nDeath should generally result from a mistake the player understands rather than unpredictable physics.\n\n⸻\n\nMVP scope\n\nDo not build progression, upgrades, missions or monetization for the first milestone.\n\nThe first version contains:\n\n1 player vehicle\n\n1 arena\n\n1 police vehicle\n\n1 elite police variant\n\n5 wanted levels\n\nphysics collisions\n\nenvironmental obstacles\nscoring\nplayer health\npolice destruction\nbasic VFX\nbasic audio\n\ngame-over screen\n\ninstant restart\n\nThat’s enough to determine whether the game deserves further development.\n\n⸻\n\nPlayer vehicle\n\nMovement\n\nPlayer vehicle uses a Rigidbody-based arcade controller.\n\nDo not rely heavily on realistic WheelColliders.\nCore variables should be exposed in the Unity Inspector:\nAcceleration\nMaximum Speed\nTurn Speed\nTurn Curve\nLateral Grip\nDrift Factor\nVehicle Mass\nCollision Force\nDrag\nAngular Drag\nRecovery Speed\nThese need to be extremely easy to tune.\n\n⸻\n\nControls\n\nRecommended first implementation:\n\nDrag steering\n\nPlayer touches anywhere on the lower portion of the screen.\n\nDragging horizontally controls steering.\n\n← drag          turn left\n→ drag          turn right\nVehicle accelerates automatically.\nSteering should be relative rather than absolute.\nThe player should be able to lift their finger without immediately losing control.\nAlternative to prototype\nTest:\nHold left/right side of screen = steer left/right.\nDon’t commit until both have been tested on a physical phone.\n⸻\nDrift system\nDrifting should happen naturally when turning at speed.\nNo dedicated drift button.\nAt low speed:\nhigh traction\n\nAt high speed:\n\nreduced lateral traction\n\nThis produces controlled sliding.\n\nLong drifts can optionally award score.\n\nExample:\n\nDRIFT\n+120\nLONG DRIFT\n+340\n\nBut drift scoring is secondary to police destruction.\n\n⸻\nPolice AI\nPolice should feel:\naggressive, predictable and slightly stupid.\nThey should not simply follow the player’s current position.\nInstead, calculate an interception target based on player velocity.\nConceptually:\ntarget =\nplayerPosition\n+\nplayerVelocity * predictionTime\nPolice therefore try to cut the player off.\n⸻\nPolice intelligence\n\nPolice intentionally have limited obstacle avoidance.\n\nThis is important.\n\nPerfect navigation would make the game less fun.\n\nPolice should:\n\npursue aggressively\n\nattempt interception\n\navoid obvious static obstacles\n\npoorly account for other police\novershoot turns\n\ncollide with each other\n\noccasionally take dangerous routes\n\nThis creates opportunities for the player.\n\n⸻\n\nPolice destruction\n\nPolice can be destroyed by:\n\nhigh-speed obstacle collisions\n\nhitting another police vehicle\n\nchain collisions\n\nenvironmental hazards\n\nThe player does not have weapons.\n\nExample scoring:\n\nCOP SMASHED\n+250\nDOUBLE SMASH\n+600\nTRIPLE SMASH\n+1,000\nPILEUP!\n+2,000\n\nChain collisions should be heavily rewarded.\n\n⸻\n\nWanted system\n\nWanted level controls difficulty.\n\n★☆☆☆☆\n★★☆☆☆\n★★★☆☆\n★★★★☆\n★★★★★\n\nWanted level increases based primarily on survival time and score.\nLevel 1\n2 police.\nSlow and forgiving.\n\nLevel 2\n\n3–4 police.\n\nSlightly faster.\n\nLevel 3\n\n5–6 police.\n\nMore aggressive interception.\n\nLevel 4\n\n7–9 police.\n\nElite police introduced.\nLevel 5\nMaximum chaos.\n10+ police depending on device performance.\n\nElite units appear frequently.\n\nThe game should eventually become effectively impossible.\n\nThat’s intentional.\n\n⸻\n\nElite police\n\nThe MVP only needs one special police type.\n\nInterceptor\n\nVisually distinct vehicle.\nCharacteristics:\nfaster than standard police\nlower mass\naggressive prediction\nsharp steering\neasier to destroy in collisions\n\nThis creates a glass-cannon pursuer.\n\n⸻\n\nPlayer health\n\nUse a simple health bar.\n\nExample:\nHULL\n██████░░░░\nMinor impacts:\nsmall damage.\n\nHeavy impacts:\n\nlarge damage.\n\nExtremely high-speed impacts:\npotential instant destruction.\nPolice contact alone shouldn’t immediately kill the player.\nThis allows chaotic scrambles.\n⸻\nArena\nFirst arena should be compact.\nSomething roughly equivalent to:\n\nROCK\n\n┌─────────────┐\n│             │\n│   ROCK      │\n│             │\n│       ███   │\n│             │\n│ ROCK        │\n│         ROCK│\n└─────────────┘\n\nObstacles need enough space between them for high-speed movement.\n\nAvoid procedural generation initially.\n\nHand-design one good arena.\n⸻\nEnvironment\nFor the first visual theme, I’d use something other than water so we’re not cloning the reference too closely.\nMy preference:\n\nDesert outlaw chase\n\nPlayer is an outlaw escaping through a stylized desert environment.\n\nEnvironment contains:\n\nrock formations\n\ncacti\n\nbarriers\n\nabandoned vehicles\n\nramps\n\nfences\n\nsmall buildings\n\ndust\n\ndestructible props\n\nIt also fits the chunky visual language you’re already exploring with Bolt Pit.\n\n⸻\n\nCamera\n\nTop-down perspective camera.\n\nNot completely vertical.\n\nSomething approximately:\n\n55–70° downward angle.\n\nCamera follows player with smoothing.\n\nCamera should look slightly ahead in the player’s travel direction.\n\nAt high speed:\n\ncamera pulls back slightly.\n\nAt low speed:\n\ncamera moves closer.\n\n⸻\nCamera juice\nSmall camera effects make a large difference.\nLight collision\nTiny shake.\n\nHeavy collision\n\nStrong short shake.\n\nPolice destruction\n\nShake + tiny freeze frame.\n\nExample:\n\n50–100 ms hit stop.\nLarge pileup\n\nSlight zoom impulse + shake + particles.\n\nDon’t overdo continuous shaking.\n\n⸻\n\nVisual style\n\nChunky stylized 3D.\n\nCharacteristics:\n\nsimplified geometry\n\nexaggerated proportions\n\nbright readable vehicles\n\nsoft lighting\n\nminimal textures\n\nstrong silhouettes\n\nexaggerated particles\nAvoid realistic vehicle proportions.\nCars should feel almost toy-like.\n⸻\nVFX\nMinimum MVP effects:\nPlayer\ndust trail\ntire/skid marks\ndrift smoke\n\nimpact sparks\n\nPolice\n\nsiren lights\n\nsmoke when damaged\n\ndestruction explosion\n\ndebris\n\nEnvironment\n\ndust\n\ndestructible objects\n\nimpact particles\n\n⸻\nCollision feedback\nEvery significant collision should combine:\nphysics + particles + audio + camera response.\nMajor police destruction:\nIMPACT\n→ physics impulse\n→ vehicle fragments/debris\n→ sparks\n→ smoke\n→ camera shake\n→ hit stop\n→ sound\n→ score popup\nThis interaction is one of the game’s main sources of satisfaction.\n⸻\nScore system\n\nScore comes from:\n\nActionExample\nSurviving+10/sec\nPolice destroyed+250\nDriftvariable\nNear miss+100\nDouble collision+600\nTriple collision+1,000\nLarge pileup+2,000\n\nExact values should remain configurable.\n\n⸻\n\nNear misses\n\nOptional for MVP but potentially valuable.\n\nDetect when a police vehicle passes extremely close to the player at high relative velocity.\n\nDisplay:\n\nCLOSE CALL! +100\n\nThis rewards risky driving.\n\n⸻\n\nUI\n\nDuring gameplay keep UI extremely minimal.\n\nSCORE                          COINS\n13,590                          14\n★★★☆☆\nWANTED\nGAME\nHULL\n████████░░\n\nNo minimap initially.\n\nOff-screen police can use subtle edge indicators.\n\n⸻\n\nGame over\n\nWhen hull reaches zero:\n\nbrief slow motion.\n\nPlayer crashes.\n\nThen:\n\nBUSTED\nSCORE\n24,850\nBEST\n31,220\n[ AGAIN ]\n\nTapping anywhere could restart.\n\nAvoid unnecessary menus between runs.\n\n⸻\n\nAudio\n\nThe soundscape should sell speed and collisions.\n\nRequired:\n\nengine\n\ntire squeal\n\npolice sirens\nimpact\nmetal crunch\ndebris\ndestruction\nUI score sounds\nwanted level increase\n\nSirens should become increasingly chaotic as wanted level increases.\n\n⸻\n\nTechnical architecture\n\nSuggested Unity structure:\n\nGameManager\nPlayer\n├── PlayerController\n├── VehiclePhysics\n├── PlayerHealth\n└── PlayerEffects\nPolice\n├── PoliceController\n├── PoliceAI\n├── VehiclePhysics\n├── PoliceHealth\n└── PoliceEffects\nSystems\n├── SpawnManager\n├── WantedManager\n├── ScoreManager\n├── AudioManager\n├── CameraManager\n└── PoolManager\nUI\n├── HUD\n├── WantedUI\n├── ScoreUI\n├── HealthUI\n└── GameOverUI\n\nAvoid building an elaborate framework.\n\n⸻\nObject pooling\nPolice, particles and debris should use object pooling.\nAvoid frequent:\n\nInstantiate()\nDestroy()\n\nduring gameplay.\nMobile performance should be considered from the beginning.\n⸻\nPerformance target\n\nTarget:\n\n60 FPS\non a mid-range modern iPhone/Android device.\nInitial limits:\n\n~12 active vehicles\n\n~100 simple debris/particles\n\nsimple shadows\n\nlimited real-time lights\n\nPerformance should be tested on device early.\n\n⸻\nDevelopment milestones\nMilestone 1 — Greybox driving\nBuild:\nempty arena\ncube player\ntouch steering\nacceleration\ndrifting\n\ncamera\n\nSuccess criterion:\n\nDriving around an empty arena feels satisfying.\n\nDo not continue until it does.\n\n⸻\nMilestone 2 — The chase\nAdd:\none police vehicle\npursuit AI\ninterception\ncollisions\nSuccess criterion:\n\nDodging one police car is entertaining.\n\n⸻\n\nMilestone 3 — Emergent chaos\n\nAdd:\n\nmultiple police\n\npolice-police collisions\n\nobstacles\n\ndestruction\n\nscoring\n\nSuccess criterion:\n\nPlayer can intentionally cause:\n\npolice → police\nand\npolice → environment\ncollisions.\nThis is the critical milestone.\n⸻\nMilestone 4 — Escalation\n\nAdd:\n\nwanted levels\n\nspawning\n\ndifficulty scaling\n\ninterceptor\n\nNow a run has an arc:\n\ncalm\n↓\npressure\n↓\nchaos\n↓\npanic\n↓\ndeath\n\n⸻\n\nMilestone 5 — Juice\nAdd:\nparticles\ncamera shake\nhit stop\nskid marks\n\ndust\n\nsirens\n\ncollision sounds\n\nscore popups\n\n⸻\n\nMilestone 6 — Mobile build\n\nBuild for real devices.\nTest:\ncontrols\nperformance\nreadability\nbattery/thermal behaviour\ndifferent screen ratios\n⸻\nMilestone 7 — Decide whether to continue\n\nAt this point, stop development temporarily.\n\nDon’t immediately build a garage and 37 unlockable cars.\n\nPut the build in front of people.\n\nThe important questions are:\n\nDo people immediately understand it?\nDo they restart after dying?\nDo they intentionally try to make cops crash?\nDoes “one more run” happen naturally?\nIf not, work on the core loop rather than adding content.\n⸻\nPhase 2 — only after validation\nIf the prototype works, then expand into:\nCars\n↓\nCoins\n↓\nUnlocks\n↓\nChallenges\n↓\nNew arenas\n↓\nSpecial police\n↓\nUpgrades\n↓\nDaily challenges\n↓\nLeaderboards\nPotential environments:\ndesert\ncity\ndocks\nsnow\nindustrial yard\nairport\nconstruction site\nmilitary base\nAnd then there’s room for ridiculous police units: SUVs, armored vans, helicopters dropping roadblocks, etc.\n\nI have opened a @[Unity CLI installation] project which we can work in. The art style of the game should be fun and cartoony and the action also over the top.\nI have imported the Topdown engine into the project as well that we can use:\nhttps://topdown-engine.moremountains.com/\n\nI want the game to be optimized for mobile, but should work on desktop while testing.", "img": "https://media.skillry.dev/opus-5-5/froessell-562325/original.eb54fc5e20.webp", "post": "https://x.com/froessell/status/2103789415323562325", "v": true, "card": "https://media.skillry.dev/opus-5-5/froessell-562325/original-card.a4880c04cf.mp4", "orig": "https://media.skillry.dev/opus-5-5/froessell-562325/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/froessell-562325/remake.mp4"}, {"n": 72, "c": "motion", "t": ["svg", "gsap"], "a": "rammanq", "p": "Make a dynamic motion graphics video that shows what an incredible platform AllInvestView is. Go all out.", "img": "https://media.skillry.dev/opus-5-5/rammanq-034553/original.80d3f7e5fd.webp", "post": "https://x.com/rammanq/status/2103788796022034553", "v": true, "card": "https://media.skillry.dev/opus-5-5/rammanq-034553/original-card.b941c56260.mp4", "orig": "https://media.skillry.dev/opus-5-5/rammanq-034553/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/rammanq-034553/remake.mp4"}, {"n": 73, "c": "motion", "t": ["canvas", "svg"], "a": "RatheeJaisal", "p": "build me a beautiful launch video 20 seconds or under that shows all our key features, make it fast paced and fit our brand", "img": "https://media.skillry.dev/opus-5-5/ratheejaisal-154698/original.506783e480.webp", "post": "https://x.com/RatheeJaisal/status/2103774864742154698", "v": true, "card": "https://media.skillry.dev/opus-5-5/ratheejaisal-154698/original-card.3bd673f4c9.mp4", "orig": "https://media.skillry.dev/opus-5-5/ratheejaisal-154698/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ratheejaisal-154698/remake.mp4"}, {"n": 74, "c": "motion", "t": ["svg", "gsap"], "a": "wani_shola", "p": "Make a showreel-style motion graphics video for my portfolio website, \nhttp://\nsholajegede.com, using Remotion. It should show what I do as a developer relations engineer, like a showreel for my résumé.\n\n- Use as much of the real website as possible: capture the pages and sections in a browser (home, Ask, package pages, Hire, mobile view, dark mode) and animate them inside browser and phone frames.\n- Show the site's chat answering real questions about my work, with the questions and answers large and bold. Use only facts and numbers that are on the site.\n- Follow premium brand rules: three colours and the site's own fonts, one idea per shot, key objects centred, space to breathe, eased motion only, smooth transitions instead of hard cuts, and a rhythm that speeds up and slows down with the story.\n- Add music at about 120 BPM (elite, kinetic, sophisticated) and cut every scene on the beat. No extra sound effects.\n- 1920×1080, about 90 to 100 seconds, ending on the website and my contact email.", "img": "https://media.skillry.dev/opus-5-5/wani-shola-459278/original.ffed3815a3.webp", "post": "https://x.com/wani_shola/status/2103769906638459278", "v": true, "card": "https://media.skillry.dev/opus-5-5/wani-shola-459278/original-card.941b916e4d.mp4", "orig": "https://media.skillry.dev/opus-5-5/wani-shola-459278/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/wani-shola-459278/remake.mp4"}, {"n": 75, "c": "motion", "t": ["canvas", "svg"], "a": "robvjourney", "p": "Can you make a 15-second motion graphic video of https://nohandslabs.com? Go ALL OUT and make the most badass video you possibly can use everything you've got.", "img": "https://media.skillry.dev/opus-5-5/robvjourney-237474/original.c15447f680.webp", "post": "https://x.com/robvjourney/status/2103768390322237474", "v": true, "card": "https://media.skillry.dev/opus-5-5/robvjourney-237474/original-card.94315e8929.mp4", "orig": "https://media.skillry.dev/opus-5-5/robvjourney-237474/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/robvjourney-237474/remake.mp4"}, {"n": 76, "c": "interactive", "t": ["canvas", "pixel", "playable"], "a": "aisongman", "p": "Create a 1-on-1 card game like Hearthstone.\nJust make it. As best you can.\nIn pixel art style.", "img": "https://media.skillry.dev/opus-5-5/aisongman-461057/original.b99a1a425c.webp", "post": "https://x.com/aisongman/status/2103763192971461057", "v": true, "card": "https://media.skillry.dev/opus-5-5/aisongman-461057/original-card.bcdd6758b8.mp4", "orig": "https://media.skillry.dev/opus-5-5/aisongman-461057/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/aisongman-461057/remake.mp4"}, {"n": 77, "c": "interactive", "t": ["canvas", "svg"], "a": "Bilimfili1", "p": "Make a 45–50 second vertical video for my app: a glance inside the app.\nShow every feature, use motion, be creative. I want it good enough for your CV.\n\n- Real, not mocked: record each feature being used in the simulator (tap a filter, open a result, add it).\n- Stretch your imagination: let each feature break out of the phone and change the world around it.\n- The bar: a motion designer's showreel piece. The best motion you can do. Go all out.\n- Nothing made up: every number and label on screen comes from the recordings.\n- No stock sound effects; I'll add the music.\n- Keep text clear of the TikTok/Instagram interface.\n- Let viewers follow: each feature stays on screen for at least 2.5 seconds.", "img": "https://media.skillry.dev/opus-5-5/bilimfili1-459762/original.a1f891890a.webp", "post": "https://x.com/Bilimfili1/status/2103743617848459762", "v": true, "card": "https://media.skillry.dev/opus-5-5/bilimfili1-459762/original-card.581fa64588.mp4", "orig": "https://media.skillry.dev/opus-5-5/bilimfili1-459762/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/bilimfili1-459762/remake.mp4"}, {"n": 78, "c": "explainer", "t": ["svg"], "a": "AmitSingha89", "p": "Make a professional explainer video for https://anuprerna.com for a first-time visitor.", "img": "https://media.skillry.dev/opus-5-5/amitsingha89-780553/original.9c8fbec40d.webp", "post": "https://x.com/AmitSingha89/status/2103737604277780553", "v": true, "card": "https://media.skillry.dev/opus-5-5/amitsingha89-780553/original-card.b9d2458b0d.mp4", "orig": "https://media.skillry.dev/opus-5-5/amitsingha89-780553/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/amitsingha89-780553/remake.mp4"}, {"n": 79, "c": "3d", "t": ["threejs", "shader", "canvas", "svg"], "a": "Sayan_shanky", "p": "show me what goes on inside an AI data centre.", "img": "https://media.skillry.dev/opus-5-5/sayan-shanky-868515/original.e5ba676ea2.webp", "post": "https://x.com/Sayan_shanky/status/2103736579449868515", "v": true, "card": "https://media.skillry.dev/opus-5-5/sayan-shanky-868515/original-card.dbed3284bc.mp4", "orig": "https://media.skillry.dev/opus-5-5/sayan-shanky-868515/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sayan-shanky-868515/remake.mp4"}, {"n": 80, "c": "motion", "t": ["svg"], "a": "lester_tyy", "p": "Study how this https://experiments.cloudjoi.com works and use Remotion to make a product showcase video.", "img": "https://media.skillry.dev/opus-5-5/lester-tyy-480587/original.b80fa83043.webp", "post": "https://x.com/lester_tyy/status/2103733819568480587", "v": true, "card": "https://media.skillry.dev/opus-5-5/lester-tyy-480587/original-card.4a7b9325e7.mp4", "orig": "https://media.skillry.dev/opus-5-5/lester-tyy-480587/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/lester-tyy-480587/remake.mp4"}, {"n": 81, "c": "motion", "t": ["canvas"], "a": "sahilvermaai", "p": "create a motion design video of a poster breaking out of its own frame.", "img": "https://media.skillry.dev/opus-5-5/sahilvermaai-189237/original.8e686c39bf.webp", "post": "https://x.com/sahilvermaai/status/2103725292095189237", "v": true, "card": "https://media.skillry.dev/opus-5-5/sahilvermaai-189237/original-card.10168c12ce.mp4", "orig": "https://media.skillry.dev/opus-5-5/sahilvermaai-189237/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sahilvermaai-189237/remake.mp4"}, {"n": 82, "c": "motion", "t": ["canvas", "css"], "a": "pound75423", "p": "添付した楽曲とキャラクター画像を使って、「サイケデリック・グリッチ系」のアニメーション MV を作ってください。\n\n【制作方法】\nHTML Canvas でアニメーションを書き、Playwright で 1 フレームずつキャプチャし、ffmpeg で音声と合成して MP4 を出力してください（1280×720、30fps、30MB 以内）。\nAI 動画生成は使わず、すべてプログラムによるアニメーションで作ってください。\n\n【前処理】\n1. キャラクター画像はすべて背景を透過し、白いステッカー風の縁取りと薄い影をつける。\n2. 楽曲を解析する：BPM、最初の拍の位置、各小節（4 拍）の頭、\n   各セクションのエネルギーの高低（イントロ／A メロ／サビ／落ちる部分）を求める。\n\n【編集ルール】\n- 1 拍ごとにカットを切り替える。カットはランダムにローテーション：全身、\n  バストアップ、目の超アップ、2 ポーズ並び、同じポーズの 5 連（それぞれ色相違い）、シーン画像。\n- 隣り合う 2 拍で同じポーズを使わない。\n- エネルギーが低い箇所はシーン画像や静かなカットにして、ひと息つかせる。\n- エフェクトの強さはセクションに合わせる：イントロ約 40%、A メロ 70%、サビ 100%。\n\n【エフェクト】\n1. 白フラッシュ：毎拍フラッシュしてすぐ消える。小節の 1 拍目が一番強い。\n2. 色相の流れ：背景は流れ続ける虹色パターン（同心円スパイラル、回転するカラーホイール、\n   溶ける虹の波、ストライプ、白黒チェッカー）。サビではキャラクターごと画面全体を hue-rotate する。\n3. 画面の引き裂き：拍が落ちた瞬間に横方向の帯状ずれ＋RGB 3 色分離をかけ、\n   次の拍までに元に戻す。キャラクターがずっとぼやけたままにならないように。\n4. 万華鏡：サビでは 1 小節おきに、画面を 8～12 枚の鏡像の扇形に分けてゆっくり回転させる。\n5. 小節ごとの大文字：小節の頭で画面中央に巨大な文字を約 0.4 秒フラッシュさせる。\n   合成モードは反転（difference）、縁取りは虹色。\n   大文字の内容：【ここに使いたい文字を書く、または「歌詞からキーワードを選んで」と書く】\n\n【その他】\n- 左上に小さくタイトル【名前】、右上に【日付】、右下に小節数を表示。\n- フィルムグレインと走査線を少し加える。冒頭は黒からフェードイン、最後はフェードアウト。\n- 本番出力の前に、各セクションのスクリーンショット一覧を見せて確認させてください。", "img": "https://media.skillry.dev/opus-5-5/pound75423-464968/original.17cc001663.webp", "post": "https://x.com/pound75423/status/2103722556918464968", "v": true, "card": "https://media.skillry.dev/opus-5-5/pound75423-464968/original-card.f666be5eac.mp4", "orig": "https://media.skillry.dev/opus-5-5/pound75423-464968/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/pound75423-464968/remake.mp4"}, {"n": 83, "c": "motion", "t": ["canvas"], "a": "souravbhar871", "p": "make a dynamic 10-second motion graphics video that shows who are you as Opus 5.5 - be as creative and dynamic as possible. Avoid the frames and texts on the corners which are typical ai made giveaways!", "img": "https://media.skillry.dev/opus-5-5/souravbhar871-477361/original.b33abc19ad.webp", "post": "https://x.com/souravbhar871/status/2103711849703477361", "v": true, "card": "https://media.skillry.dev/opus-5-5/souravbhar871-477361/original-card.e8237234af.mp4", "orig": "https://media.skillry.dev/opus-5-5/souravbhar871-477361/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/souravbhar871-477361/remake.mp4"}, {"n": 84, "c": "interactive", "t": ["threejs", "canvas"], "a": "Ved_CJ", "p": "I want multiplayer game, with proximity chat, with destructurable environment, that players will enjoy, shooting game", "img": "https://media.skillry.dev/opus-5-5/ved-cj-066575/original.0b409f121f.webp", "post": "https://x.com/Ved_CJ/status/2103708392930066575", "v": true, "card": "https://media.skillry.dev/opus-5-5/ved-cj-066575/original-card.ca0a708df7.mp4", "orig": "https://media.skillry.dev/opus-5-5/ved-cj-066575/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ved-cj-066575/remake.mp4"}, {"n": 85, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "gautam_mer1", "p": "an Apple-style 30s video of my app", "img": "https://media.skillry.dev/opus-5-5/gautam-mer1-530003/original.d799897a10.webp", "post": "https://x.com/gautam_mer1/status/2103703336780530003", "v": true, "card": "https://media.skillry.dev/opus-5-5/gautam-mer1-530003/original-card.edf9a01b11.mp4", "orig": "https://media.skillry.dev/opus-5-5/gautam-mer1-530003/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/gautam-mer1-530003/remake.mp4"}, {"n": 86, "c": "motion", "t": ["canvas"], "a": "doubleunplussed", "p": "I'd like you to make a music video in a similar style to this one:\n\nhttps://github.com/JohnHeibel/PDoomVideo\n\nTo this song:\n\nhttps://youtu.be/cobZuBii0Z0?si=ada6wxomeJbo-LRl\n\nDon't feel the need to represent everything in the lyrics literally - feel free to include relevant references to concepts, events, and lore in the video, even if obscure (especially if obscure). E.g. when the lyrics say \"when they say they're just predicting tokens...\", you might depict a \"stochastic parrot\". That one's not particularly obscure but is the kind of thing I mean. Instead of depicting like, literally predicting tokens (though you might do that too. Use your judgement! The video should be fun to watch for someone well steeped in AI and AI safety lore and discourse, and who Wille wcognise relevant pop culture and literary or historical references)\n\nI don't know how this ultimately results in a video file - I know the linked repo animates a video with JavaScript or something - but I ultimately want a rendered video file.\n\nFeel free to choose your tools, be creative, and exercise your own taste.\n\nThis repo \"fdsgdg\" appears to be have been accidentally created, but it's empty and we can use it for this, I can rename it afterwards.\n\nAlso, clip the final two beats from the audio.rught at the end, after \"then why does it talk back\" they are after the song has finished and sound bad.\n\nCredit the song to Suno and whatever Claude Opus model was the latest at the time of the YouTube upload, as prompted by Andy Masely (Andy printed Claude to write the lyrics, and Suno for the music), and credit the video to yourself.\n\nAnd have fun!\n\n----\n\nA style change - don't make Dr. Null's mouth wobble with the lyrics as if he's singing, it doesn't\n  actually look like he's singing, just that the curcle of his mouth is jittery. Best to just not\n  make him be singing. Make him just have appropriate expressions for the scenes, and not be singing\n  the song.\n\n----\n\nDr. Null's arms look a bit unnatural in many scenes - I think he's supposed to be holding\n  his hand on his face in shock or something, but it looks like it is a mistake. Can you make it look\n  more natural? If you do so and like the result, re-render.", "img": "https://media.skillry.dev/opus-5-5/doubleunplussed-181894/original.82018f5fb9.webp", "post": "https://x.com/doubleunplussed/status/2103697580421181894", "v": true, "card": "https://media.skillry.dev/opus-5-5/doubleunplussed-181894/original-card.cefb76ecf3.mp4", "orig": "https://media.skillry.dev/opus-5-5/doubleunplussed-181894/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/doubleunplussed-181894/remake.mp4"}, {"n": 87, "c": "motion", "t": ["svg", "gsap", "css"], "a": "bizibeast", "p": "Research \nhttp://\nBento.surf. Make a dynamic 40-second motion graphics video on \nhttp://\nBento.surf that shows what an incredible motion designer you are. like it's your showreel - Go all out.", "img": "https://media.skillry.dev/opus-5-5/bizibeast-505124/original.db164d70bd.webp", "post": "https://x.com/bizibeast/status/2103696876130505124", "v": true, "card": "https://media.skillry.dev/opus-5-5/bizibeast-505124/original-card.a87f326c1a.mp4", "orig": "https://media.skillry.dev/opus-5-5/bizibeast-505124/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/bizibeast-505124/remake.mp4"}, {"n": 88, "c": "motion", "t": ["canvas", "audio"], "a": "GroundControl", "p": "All right, this is an empty repo. Make me a 3-minute animated visualization using JavaScript, or you can do it in TypeScript if you want, about Japan's hot weather in 2026. Pull some online data to see why it was hot and how it compares to other years. I really want the animation to be visually appealing. I wanted to use a hand-drawn pencil style with a little bit of tasteful chromatic aberration. And maybe a bit of a pastiche look but it's supposed to look really, really cool. Also, use a JavaScript synthesizer to make a melody for this visualization that goes along with the theme.", "img": "https://media.skillry.dev/opus-5-5/groundcontrol-230877/original.360975f3b3.webp", "post": "https://x.com/GroundControl/status/2103678647777230877", "v": true, "card": "https://media.skillry.dev/opus-5-5/groundcontrol-230877/original-card.5f48f6d824.mp4", "orig": "https://media.skillry.dev/opus-5-5/groundcontrol-230877/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/groundcontrol-230877/remake.mp4"}, {"n": 89, "c": "explainer", "t": ["canvas", "audio"], "a": "tak3sh8", "p": "Do a quick hand-drawn whiteboard animations explaining what is replica symmetry breaking in the SK model\n\nPrompt 2: build the mp4 version with narration", "img": "https://media.skillry.dev/opus-5-5/tak3sh8-441895/original.0b7263b2f1.webp", "post": "https://x.com/tak3sh8/status/2103667481139441895", "v": true, "card": "https://media.skillry.dev/opus-5-5/tak3sh8-441895/original-card.e776e42355.mp4", "orig": "https://media.skillry.dev/opus-5-5/tak3sh8-441895/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/tak3sh8-441895/remake.mp4", "b": ["Белая доска от руки", "Рисуется маркером: графики, деревья, стрелки.", "Разбор задачи ЕГЭ, как на уроке."]}, {"n": 90, "c": "motion", "t": ["canvas", "svg"], "a": "ceowinkz", "p": "make a dynamic 15 second motion graphics video pitching my Amazon wholesale company, Winkz Enterprises, to a brand. show why they should let us sell their products. go all out.", "img": "https://media.skillry.dev/opus-5-5/ceowinkz-683602/original.7107053c99.webp", "post": "https://x.com/ceowinkz/status/2103647124126683602", "v": true, "card": "https://media.skillry.dev/opus-5-5/ceowinkz-683602/original-card.f4f4fb0ae5.mp4", "orig": "https://media.skillry.dev/opus-5-5/ceowinkz-683602/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ceowinkz-683602/remake.mp4"}, {"n": 91, "c": "motion", "t": ["canvas"], "a": "Xanderwow_A", "p": "Create a 1-minute video featuring a fight between Dario and Sam. It needs plot, explosive moments, to be hilarious and sufficiently abstract, with no limits on genre or art style—do what you're best at. Must have a clear winner between the two.", "img": "https://media.skillry.dev/opus-5-5/xanderwow-a-597063/original.4ed4c9a304.webp", "post": "https://x.com/Xanderwow_A/status/2103637769012597063", "v": true, "card": "https://media.skillry.dev/opus-5-5/xanderwow-a-597063/original-card.e262b4d094.mp4", "orig": "https://media.skillry.dev/opus-5-5/xanderwow-a-597063/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/xanderwow-a-597063/remake.mp4"}, {"n": 92, "c": "explainer", "t": ["canvas"], "a": "AstroTheWizard", "p": "I want you to make a 60-second, fully animated explainer video, end to end, completely on your own. I'm stepping away from my computer, so work autonomously until it's done. Don't stop to ask me questions; make the calls yourself and tell me what you decided at the end.\n\nTopic: the journey of photons \n\nStyle: whimsical, charming, storybook. Give the photon a personality. It should feel like a professional motion-design studio made it, not \"AI video\". The whole thing should be a pure JavaScript animation, rendered from code frame by frame. Don't use AI video generators for the visuals. I've seen the videos people are posting from Opus 5.5 (kinetic typography reels, continuous infinite zooms, data-driven explainers like The Pudding or 3Blue1Brown), and what makes them great is that they're code-rendered: crisp, precise, with a coherent design system and one strong formal idea per scene. Aim for that bar or above.\n\nMake it genuinely educational and accurate. Where you can, simulate the real thing: the random walk should be an actual random walk, not a drawing of one. Include real numbers (core temperature, distance, travel time, years inside the Sun) and be honest about uncertainty in the estimates. Use humor and visual gags to keep attention: onomatopoeia, little characters, callbacks. Put what was happening on Earth during those 100,000 years alongside the photon's timeline.\n\nDeliverable: 1920x1080 at 60fps, exactly 60 seconds, with:\n- A voiceover script you write yourself, voiced with the highest-quality text-to-speech model you can access\n- Burned-in captions, since most people watch on X with the sound off\n- An original music score that fits the whimsical tone and changes with each scene\n- Sound design synced exactly to the on-screen action (every bounce, pop, whoosh and ding)\n- A professional mix: music ducks under the voice, mastered to streaming loudness\n\nYou write the script, design the characters, pick the typography and palette, compose the music, and build the animation engine. Use any tools and resources you can find access to: open fonts, sample libraries, open-source models. Use whatever works.\n\nQuality is paramount. Build verification loops: render stills of every scene and review them critically, check transitions frame by frame, measure the audio mix numerically, fix what's weak and re-render. Don't hand me a first draft. Hand me something you'd put your name on. Also give me the source code so it's reproducible", "img": "https://media.skillry.dev/opus-5-5/astrothewizard-618782/original.0b4b294e7f.webp", "post": "https://x.com/AstroTheWizard/status/2103629247751618782", "v": true, "card": "https://media.skillry.dev/opus-5-5/astrothewizard-618782/original-card.578ec9371c.mp4", "orig": "https://media.skillry.dev/opus-5-5/astrothewizard-618782/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/astrothewizard-618782/remake.mp4"}, {"n": 93, "c": "interactive", "t": ["canvas", "audio", "playable"], "a": "NoLit64", "p": "Build a MapleStory clone in Raylib-cs.", "img": "https://media.skillry.dev/opus-5-5/nolit64-347627/original.bab752155f.webp", "post": "https://x.com/NoLit64/status/2103628970000347627", "v": true, "card": "https://media.skillry.dev/opus-5-5/nolit64-347627/original-card.50732fcd9c.mp4", "orig": "https://media.skillry.dev/opus-5-5/nolit64-347627/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nolit64-347627/remake.mp4"}, {"n": 94, "c": "motion", "t": ["gsap"], "a": "iamMXFSCHR", "p": "nice. wir brauchen ein launch video für den release. kannst du das machen? so a la anthropic like? hab da was gelesen und der prompt war \"\"make a modern slick and punchy video for a modern startup that works on inference\"\n\"\"\"\n\n\"\"\"\nlos, überrasch mich! hauptsache es geht viral\n\"\"\"\n\n\"\"\"\nja wo ist das video? i sehe nur eine .cinfig datei was als video abspielbar ist\n\"\"\"\n\n\"\"\"\nkönnen wir da noch eine trendige musik hinterlegen?\n\"\"\"", "img": "https://media.skillry.dev/opus-5-5/iammxfschr-955831/original.1500ad9b7c.webp", "post": "https://x.com/iamMXFSCHR/status/2103619221296955831", "v": true, "card": "https://media.skillry.dev/opus-5-5/iammxfschr-955831/original-card.ca1d36d549.mp4", "orig": "https://media.skillry.dev/opus-5-5/iammxfschr-955831/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/iammxfschr-955831/remake.mp4"}, {"n": 95, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "sachaarbonel", "p": "Create a professional product launch video with motion graphics. You have access to the designs in pen\n\nFollow-up:\nIt is better, but can you choose a royalty-free song online? You are clearly not a good song maker. Also, I would not hire you or pay you for this as a motion designer. This is not a professional-looking video. Also, it is a bit too fast and bumpy", "img": "https://media.skillry.dev/opus-5-5/sachaarbonel-673648/original.b9dd794707.webp", "post": "https://x.com/sachaarbonel/status/2103614797501673648", "v": true, "card": "https://media.skillry.dev/opus-5-5/sachaarbonel-673648/original-card.26957f72c1.mp4", "orig": "https://media.skillry.dev/opus-5-5/sachaarbonel-673648/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sachaarbonel-673648/remake.mp4"}, {"n": 96, "c": "motion", "t": ["canvas", "svg"], "a": "manuelogomigo", "p": "make a dynamic 15-second motion graphics video that shows what an incredible motion designer you are, like it's your showreel for a flowdrive. go all out.", "img": "https://media.skillry.dev/opus-5-5/manuelogomigo-052364/original.83bcca4a5b.webp", "post": "https://x.com/manuelogomigo/status/2103614667038052364", "v": true, "card": "https://media.skillry.dev/opus-5-5/manuelogomigo-052364/original-card.24e9c363b6.mp4", "orig": "https://media.skillry.dev/opus-5-5/manuelogomigo-052364/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/manuelogomigo-052364/remake.mp4"}, {"n": 97, "c": "motion", "t": ["canvas"], "a": "chrisjdimarco", "p": "make a dynamic 60-second motion graphics video that shows what an incredible motion designer you are, like it's your showreel for a résumé. go all out. and make the theme and content be about the importance of an informed public in a democracy, the importance of not having corrupted officials and greedy corporations, we need to remember what adam smith said about responsible capitalism or whatever (you can rewrite all of what im saying to sound so much smarter and better) and why facsism and croney capitalism can always reer its ugly head if we aren’t vigilant and always remember the important threats to prosperity and freedom which is the ruling classes need for more control, power and consolidation at the expense of others because they believe they know better.", "img": "https://media.skillry.dev/opus-5-5/chrisjdimarco-808196/original.377f237694.webp", "post": "https://x.com/chrisjdimarco/status/2103606498928808196", "v": true, "card": "https://media.skillry.dev/opus-5-5/chrisjdimarco-808196/original-card.95f603ced3.mp4", "orig": "https://media.skillry.dev/opus-5-5/chrisjdimarco-808196/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/chrisjdimarco-808196/remake.mp4"}, {"n": 98, "c": "motion", "t": ["css"], "a": "dzhohola", "p": "<inputs>\nAsk me for: 8 to 12 UI states I want the shape to become (e.g. button, loader, player, slider, toggle, tabs, chart, command palette, toast), pure black and white or one accent color, and a royalty-free song around 120 BPM (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nDribbble-level UI motion. One shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Light warm-gray canvas, black and white components, one clean UI font (Geist). Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. The last frame is the first frame, so it loops.\nBanned: bouncy easing, particle bursts, glows, gradients on UI chrome, mismatched icon strokes, dead time, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 7 bars, something happens on every beat.\nButton → loader → check → dynamic island → music player with a play/pause morph → scrub the progress bar → it becomes a volume slider that stretches when dragged past max → a toggle flips on the beat → the knob becomes a liquid tab indicator → the tabs open into a chart that draws itself, with a tooltip on hover → it collapses into ⌘K → type to filter → enter → toast → back to the button.\n<\/structure>\n\n<build>\n1. One HTML file, square 1440x1440. Every style is computed from time inside seek(t): no CSS transitions, no timers, no state carried between frames.\n2. Springs are closed-form step responses. A value that changes target many times is the sum of one spring per change, so it stays a pure function of time.\n3. The tab indicator's two edges ride different springs, so the leading edge stretches ahead of the trailing one. Same trick for the toggle knob.\n4. Drags are direct manipulation: while the cursor is held, the value is computed from its position. On release it springs back from wherever it was.\n5. Analyze the song with numpy for the beat grid and start on a downbeat. Place every UI sound by its measured peak.\n6. Render with Playwright: 4 subframes per frame, blended with ffmpeg tmix for motion blur at 60fps.\n7. Render one frame per beat before the full render. Fix anything off the grid, cramped or hard to read.\n<\/build>\n\n<gotchas>\nNever put will-change on anything the camera scales or the text renders blurry. Text that swaps inside a morphing container needs its own enter and exit timing or it overlaps. Make the last frame identical to the first, cursor position and speed included, or the loop stutters.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the state list on the beat grid before you write any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/dzhohola-249003/original.68ba3cb389.webp", "post": "https://x.com/dzhohola/status/2103605737595249003", "v": true, "card": "https://media.skillry.dev/opus-5-5/dzhohola-249003/original-card.86cc6086a8.mp4", "orig": "https://media.skillry.dev/opus-5-5/dzhohola-249003/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/dzhohola-249003/remake.mp4"}, {"n": 99, "c": "motion", "t": ["threejs", "shader", "canvas"], "a": "Madhav_XO", "p": "make a 10 sec video on whatever you know about me", "img": "https://media.skillry.dev/opus-5-5/madhav-xo-524440/original.7ed7b09262.webp", "post": "https://x.com/Madhav_XO/status/2103605007396524440", "v": true, "card": "https://media.skillry.dev/opus-5-5/madhav-xo-524440/original-card.a0903f70f2.mp4", "orig": "https://media.skillry.dev/opus-5-5/madhav-xo-524440/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/madhav-xo-524440/remake.mp4"}, {"n": 100, "c": "motion", "t": ["svg", "gsap"], "a": "jhylee95", "p": "You're a world-class motion designer building a Supademo launch video. Research and land our core value and narrative. Scenes should be dynamic and confident: hook in the first second, then distinct beats for product proof and AI. Brand-accurate UI, type, color, and motion. Score the music so every cut, animation hit, and scene change lands on a beat or drop; retimed until synced. Social energy, quick cuts", "img": "https://media.skillry.dev/opus-5-5/jhylee95-452427/original.c9312d8249.webp", "post": "https://x.com/jhylee95/status/2103604431627452427", "v": true, "card": "https://media.skillry.dev/opus-5-5/jhylee95-452427/original-card.7d4b163428.mp4", "orig": "https://media.skillry.dev/opus-5-5/jhylee95-452427/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/jhylee95-452427/remake.mp4"}, {"n": 101, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "Astrodevil_", "p": "make a dynamic 15-second motion graphics video that shows what an incredible work Studio1 is doing, you will get relevant info from case study, create like it's a good showreel for a Studio1 intro launch. go all out.", "img": "https://media.skillry.dev/opus-5-5/astrodevil-392708/original.678a3c3117.webp", "post": "https://x.com/Astrodevil_/status/2103600734017392708", "v": true, "card": "https://media.skillry.dev/opus-5-5/astrodevil-392708/original-card.218293620f.mp4", "orig": "https://media.skillry.dev/opus-5-5/astrodevil-392708/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/astrodevil-392708/remake.mp4"}, {"n": 102, "c": "motion", "t": ["svg", "gsap"], "a": "hiCallMeChai", "p": "<inputs>\nAsk me for: 8 to 12 UI states I want the shape to become (e.g. button, loader, player, slider, toggle, tabs, chart, command palette, toast), pure black and white or one accent color, and a royalty-free song around 120 BPM (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nDribbble-level UI motion. One shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Light warm-gray canvas, black and white components, one clean UI font (Geist). Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. The last frame is the first frame, so it loops.\nBanned: bouncy easing, particle bursts, glows, gradients on UI chrome, mismatched icon strokes, dead time, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 7 bars, something happens on every beat.\nButton → loader → check → dynamic island → music player with a play/pause morph → scrub the progress bar → it becomes a volume slider that stretches when dragged past max → a toggle flips on the beat → the knob becomes a liquid tab indicator → the tabs open into a chart that draws itself, with a tooltip on hover → it collapses into ⌘K → type to filter → enter → toast → back to the button.\n<\/structure>\n\n<build>\n1. One HTML file, square 1440x1440. Every style is computed from time inside seek(t): no CSS transitions, no timers, no state carried between frames.\n2. Springs are closed-form step responses. A value that changes target many times is the sum of one spring per change, so it stays a pure function of time.\n3. The tab indicator's two edges ride different springs, so the leading edge stretches ahead of the trailing one. Same trick for the toggle knob.\n4. Drags are direct manipulation: while the cursor is held, the value is computed from its position. On release it springs back from wherever it was.\n5. Analyze the song with numpy for the beat grid and start on a downbeat. Place every UI sound by its measured peak.\n6. Render with Playwright: 4 subframes per frame, blended with ffmpeg tmix for motion blur at 60fps.\n7. Render one frame per beat before the full render. Fix anything off the grid, cramped or hard to read.\n<\/build>\n\n<gotchas>\nNever put will-change on anything the camera scales or the text renders blurry. Text that swaps inside a morphing container needs its own enter and exit timing or it overlaps. Make the last frame identical to the first, cursor position and speed included, or the loop stutters.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the state list on the beat grid before you write any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/hicallmechai-878304/original.3f1783296a.webp", "post": "https://x.com/hiCallMeChai/status/2103600312296878304", "v": true, "card": "https://media.skillry.dev/opus-5-5/hicallmechai-878304/original-card.2875787130.mp4", "orig": "https://media.skillry.dev/opus-5-5/hicallmechai-878304/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/hicallmechai-878304/remake.mp4"}, {"n": 103, "c": "motion", "t": ["canvas"], "a": "1littlecoder", "p": "make a dynamic 10-second motion graphics video that shows who are you as Opus 5.5 - be as creative and dynamic as possible. Avoid the frames and texts on the corners which are typical ai made giveaways!", "img": "https://media.skillry.dev/opus-5-5/1littlecoder-914649/original.b2bf84bb6f.webp", "post": "https://x.com/1littlecoder/status/2103587706999914649", "v": true, "card": "https://media.skillry.dev/opus-5-5/1littlecoder-914649/original-card.ba46f9c103.mp4", "orig": "https://media.skillry.dev/opus-5-5/1littlecoder-914649/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/1littlecoder-914649/remake.mp4"}, {"n": 104, "c": "motion", "t": ["canvas", "svg"], "a": "madebyjmayala", "p": "make a dynamic 15-second motion graphics video promo about gene spectra, use assets from the current live site where relevant. go all out.'", "img": "https://media.skillry.dev/opus-5-5/madebyjmayala-649220/original.81ba9f9383.webp", "post": "https://x.com/madebyjmayala/status/2103578285892649220", "v": true, "card": "https://media.skillry.dev/opus-5-5/madebyjmayala-649220/original-card.13d47e7074.mp4", "orig": "https://media.skillry.dev/opus-5-5/madebyjmayala-649220/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/madebyjmayala-649220/remake.mp4"}, {"n": 105, "c": "motion", "t": ["svg"], "a": "AnnaCher___", "p": "Analyze http://sprites.ai and build a product promo from our own UI, not generic components.\n\n<direction>\nDribbble-level UI motion. One shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Warm-gray canvas, black and white components, one accent (#FD9543), Geist. Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. Last frame = first frame, so it loops.\nBanned: bouncy easing, particles, glows, gradients on UI chrome, mismatched icon strokes, dead time, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 7 bars, something on every beat.\nConnect ad account (Meta, Google, LinkedIn, TikTok, Reddit logos) → loader → check → prompt bar types \"Launch ads that convert\" → island \"Researching 42 competitors\" → Ads Library wall of real ads scrolls and lands on a top performer → approval card → Approve & launch → budget slider that stretches past max → Autopilot toggle → knob becomes a liquid tab indicator across channels → ROAS chart draws itself with hover tooltip → ⌘K → type \"pause\" → toast \"Paused 3 losing ads\" → back to the button.\n<\/structure>\n\n<build>\n1. One HTML file, 1440x1440. Every style is computed inside seek(t): no CSS transitions, no timers, no state between frames.\n2. Springs are closed-form step responses. A value that changes target many times is a sum of springs, so it stays a pure function of time.\n3. Tab indicator and toggle knob: the two edges ride different springs, so the leading edge stretches ahead.\n4. Drags are direct manipulation: while held, the value follows the cursor. On release it springs back from wherever it was.\n5. No music. Synthesize UI sounds with numpy and place each one by its measured peak on the beat grid.\n6. Render with Playwright: 4 subframes per frame, blended with ffmpeg tmix for motion blur at 60fps.\n7. Render one frame per beat first. Fix anything off-grid, cramped or hard to read.\n<\/build>\n\n<gotchas>\nNo will-change on anything the camera scales. Swapped text needs its own enter/exit timing. Match the last frame to the first, cursor position and speed included, or the loop stutters.\n<\/gotchas>\n\nShow me the state list on the beat grid before writing any code.", "img": "https://media.skillry.dev/opus-5-5/annacher-433425/original.89dc11ee96.webp", "post": "https://x.com/AnnaCher___/status/2103571096549433425", "v": true, "card": "https://media.skillry.dev/opus-5-5/annacher-433425/original-card.a3156af387.mp4", "orig": "https://media.skillry.dev/opus-5-5/annacher-433425/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/annacher-433425/remake.mp4"}, {"n": 106, "c": "motion", "t": ["gsap"], "a": "slvDev", "p": "create 15+ sec self-promotion promo", "img": "https://media.skillry.dev/opus-5-5/slvdev-975986/original.6498f792fd.webp", "post": "https://x.com/slvDev/status/2103569170075975986", "v": true, "card": "https://media.skillry.dev/opus-5-5/slvdev-975986/original-card.4d0dd08e82.mp4", "orig": "https://media.skillry.dev/opus-5-5/slvdev-975986/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/slvdev-975986/remake.mp4"}, {"n": 107, "c": "motion", "t": ["canvas"], "a": "gizakdag", "p": "Make a dynamic 15-second motion graphics video that shows what an incredible motion designer you are, like it’s your showreel exploring the concept of “Overthinking,” inspired by the attached graphics.", "img": "https://media.skillry.dev/opus-5-5/gizakdag-239768/original.382eacc540.webp", "post": "https://x.com/gizakdag/status/2103566030916239768", "v": true, "card": "https://media.skillry.dev/opus-5-5/gizakdag-239768/original-card.8270826ce2.mp4", "orig": "https://media.skillry.dev/opus-5-5/gizakdag-239768/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/gizakdag-239768/remake.mp4"}, {"n": 108, "c": "motion", "t": ["canvas"], "a": "nummanali", "p": "Can you make me a video of LLM progression, like models that is from January of this year up until now, and what the trajectory is looking like, the capabilities and models as well? Like the capabilities of models too? I want to make it really like bang, bang, boom, whoa, here we go, kind of amazing innovation. Are you ready for this kind of thing? I think you'd use vMotion, 3GS, a bunch of stuff you've got. Use whatever you want.", "img": "https://media.skillry.dev/opus-5-5/nummanali-340931/original.0a3c75f9a2.webp", "post": "https://x.com/nummanali/status/2103565570310340931", "v": true, "card": "https://media.skillry.dev/opus-5-5/nummanali-340931/original-card.96e87f5733.mp4", "orig": "https://media.skillry.dev/opus-5-5/nummanali-340931/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nummanali-340931/remake.mp4"}, {"n": 109, "c": "motion", "t": ["canvas"], "a": "advait
