_jayant", "p": "make a 20-second motion graphics manifesto for DreamFort: \"superintelligence should belong to everyone\". every frame and every sound written in code, no image or video models.", "img": "https://media.skillry.dev/opus-5-5/advait-jayant-712107/original.472a46d88f.webp", "post": "https://x.com/advait_jayant/status/2103565104243712107", "v": true, "card": "https://media.skillry.dev/opus-5-5/advait-jayant-712107/original-card.43948ec9a9.mp4", "orig": "https://media.skillry.dev/opus-5-5/advait-jayant-712107/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/advait-jayant-712107/remake.mp4"}, {"n": 110, "c": "motion", "t": ["shader", "webgl", "canvas"], "a": "abhinayguptha", "p": "Make a 20-second title sequence for a Netflix thriller that doesn't exist yet. Make it feel like it won an Emmy for main title design.", "img": "https://media.skillry.dev/opus-5-5/abhinayguptha-259981/original.b25f35f275.webp", "post": "https://x.com/abhinayguptha/status/2103565090721259981", "v": true, "card": "https://media.skillry.dev/opus-5-5/abhinayguptha-259981/original-card.30121f79f1.mp4", "orig": "https://media.skillry.dev/opus-5-5/abhinayguptha-259981/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/abhinayguptha-259981/remake.mp4"}, {"n": 111, "c": "motion", "t": ["shader", "webgl", "canvas", "css"], "a": "reflex_cloud", "p": "You're a world-class motion designer, and this is your 15-second résumé reel. Make it dynamic and confident: open with a striking hook in the first second, build through a sequence of distinct techniques (typography, shape play, camera moves, colour shifts), and land on a clean, memorable final frame. Pacing should feel like it's cut to music. Go crazy.\n\nMake it promote our brand, reflex. inc. Proceed as if you were starting with zero of my tools. Do not assume that the tools we already have are the best to use, as they might be outdated.", "img": "https://media.skillry.dev/opus-5-5/reflex-cloud-304046/original.fe1e9ca92c.webp", "post": "https://x.com/reflex_cloud/status/2103552840027304046", "v": true, "card": "https://media.skillry.dev/opus-5-5/reflex-cloud-304046/original-card.b05f06ba1f.mp4", "orig": "https://media.skillry.dev/opus-5-5/reflex-cloud-304046/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/reflex-cloud-304046/remake.mp4"}, {"n": 112, "c": "motion", "t": ["canvas", "audio"], "a": "macrohou", "p": "[gave access to Ren repo] Make a dynamic 30-second motion graphics video for Ren that shows off your motion and sound design. Go crazy.", "img": "https://media.skillry.dev/opus-5-5/macrohou-733862/original.224e4b0873.webp", "post": "https://x.com/macrohou/status/2103545787875733862", "v": true, "card": "https://media.skillry.dev/opus-5-5/macrohou-733862/original-card.0db01a72f3.mp4", "orig": "https://media.skillry.dev/opus-5-5/macrohou-733862/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/macrohou-733862/remake.mp4"}, {"n": 113, "c": "motion", "t": ["threejs", "shader", "canvas"], "a": "samuel_spitz", "p": "Create a motion graphics video that feels like the centerpiece of a world-class designer’s showreel. Treat it as your résumé: showcase your full range, push the craft as far as possible. Go all out.", "img": "https://media.skillry.dev/opus-5-5/samuel-spitz-503053/original.6b368c2158.webp", "post": "https://x.com/samuel_spitz/status/2103544855276503053", "v": true, "card": "https://media.skillry.dev/opus-5-5/samuel-spitz-503053/original-card.e8a254b50c.mp4", "orig": "https://media.skillry.dev/opus-5-5/samuel-spitz-503053/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/samuel-spitz-503053/remake.mp4"}, {"n": 114, "c": "motion", "t": ["canvas"], "a": "stewchan2", "p": "create an insightful, yet state of the art video visualization for how backlinks work for SEO", "img": "https://media.skillry.dev/opus-5-5/stewchan2-369810/original.90f3ff875a.webp", "post": "https://x.com/stewchan2/status/2103542568361369810", "v": true, "card": "https://media.skillry.dev/opus-5-5/stewchan2-369810/original-card.e6543c7bde.mp4", "orig": "https://media.skillry.dev/opus-5-5/stewchan2-369810/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/stewchan2-369810/remake.mp4"}, {"n": 115, "c": "motion", "t": ["canvas"], "a": "ghinaiya_nirmal", "p": "make your own 15-second motion reel. go all out", "img": "https://media.skillry.dev/opus-5-5/ghinaiya-nirmal-308943/original.691580442e.webp", "post": "https://x.com/ghinaiya_nirmal/status/2103540656182308943", "v": true, "card": "https://media.skillry.dev/opus-5-5/ghinaiya-nirmal-308943/original-card.da2e10d14b.mp4", "orig": "https://media.skillry.dev/opus-5-5/ghinaiya-nirmal-308943/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ghinaiya-nirmal-308943/remake.mp4"}, {"n": 116, "c": "motion", "t": ["canvas", "svg"], "a": "l3d1c", "p": "create a motion design prompt for an ad for our site\n\nPrompt 2: now apply it", "img": "https://media.skillry.dev/opus-5-5/l3d1c-752011/original.5d4b16e894.webp", "post": "https://x.com/l3d1c/status/2103536553930752011", "v": true, "card": "https://media.skillry.dev/opus-5-5/l3d1c-752011/original-card.aad99bb081.mp4", "orig": "https://media.skillry.dev/opus-5-5/l3d1c-752011/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/l3d1c-752011/remake.mp4"}, {"n": 117, "c": "motion", "t": ["threejs", "canvas"], "a": "cansincengiz_me", "p": "merak ediyorum ne kadar iyi bir hareketli grafik tasarımcısısın. Bunu bana kanıtlamak için 15 saniye sürecek bir hareketli grafik videosu istiyorum senden. Bu video \nhttp://\nlidlezz.app 'i tanıtacak ve x üzerinde 10.000 kişinin karşısına çıkacak. Elinden geleni yap", "img": "https://media.skillry.dev/opus-5-5/cansincengiz-me-424245/original.fd961b9b55.webp", "post": "https://x.com/cansincengiz_me/status/2103532681774424245", "v": true, "card": "https://media.skillry.dev/opus-5-5/cansincengiz-me-424245/original-card.8621ed9e5b.mp4", "orig": "https://media.skillry.dev/opus-5-5/cansincengiz-me-424245/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/cansincengiz-me-424245/remake.mp4"}, {"n": 118, "c": "motion", "t": ["canvas"], "a": "kikelopezdesign", "p": "Make a 20 second video about my portfolio from scratch, using only the portfolio's own resources", "img": "https://media.skillry.dev/opus-5-5/kikelopezdesign-173471/original.5bd8561469.webp", "post": "https://x.com/kikelopezdesign/status/2103527289619173471", "v": true, "card": "https://media.skillry.dev/opus-5-5/kikelopezdesign-173471/original-card.8b4bc7b311.mp4", "orig": "https://media.skillry.dev/opus-5-5/kikelopezdesign-173471/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kikelopezdesign-173471/remake.mp4"}, {"n": 119, "c": "motion", "t": ["svg"], "a": "TheGrootDev", "p": "<inputs>\nAsk me for: my featured Pokémon or starter trio, 8–12 Pokémon-themed UI states, and a royalty-free song around 120 BPM with a playful adventure or electronic feel. Confirm that the song’s license permits the intended use.Default palette: warm off-white, black, and Poké Ball red. Pokémon artwork keeps its original colors.\n<\/inputs>\n\n<direction>\nA Pokémon-inspired UI motion film with Dribbble-level polish. Imagine a beautifully designed modern Pokédex: playful, precise, and instantly http://recognizable.One shape, never cut: a Poké Ball continuously morphs into every interface component by changing its size, radius, and color. Its central button, dividing line, and outer shell become the controls and structure of each new state. Content swaps with a short blur and carefully separated enter/exit timing.\n\nA visible cursor drives every interaction with clicks, drags, and hover gestures. Use a light warm-gray canvas, clean Geist typography, consistent icon strokes, and crisp Pokémon artwork.\n\nUse tightly damped springs with only a tiny overshoot. The camera smoothly reframes each state so the interface stays large and readable. The ending returns exactly to the opening Poké Ball for a seamless loop.\n\nBanned: excessive bouncing, particle bursts, glows, gradients on UI chrome, mismatched icon strokes, dead time, generic dashboard layouts, abrupt scene changes, and unrelated floating elements.\n<\/direction>\n\n<structure>\n120 BPM, 4/4 time, 7 bars: 28 beats, approximately 14 seconds. Something intentional happens on every http://beat.Bar 1 — Poké Ball activation\n\n1. A closed Poké Ball sits centered; the cursor approaches.\n2. The cursor clicks its central button.\n3. The button becomes a circular scanning loader.\n4. The scan resolves into a check, and the shell stretches into a compact Pokédex.\n\nBar 2 — Pokémon discovery\n5. The Pokédex expands to reveal the featured Pokémon.\n6. Its name, number, and type appear in a quick stagger.\n7. The cursor clicks the cry/play control.\n8. The control morphs into pause while a compact waveform animates.\n\nBar 3 — Trainer controls\n9. The waveform flattens into a volume slider.\n10. The cursor drags its Poké Ball-shaped knob to maximum.\n11. Dragging beyond maximum elastically stretches the slider.\n12. On release, it settles and compresses into a shiny-mode toggle.\n\nBar 4 — Pokémon details\n13. The cursor flips shiny mode; the artwork changes to the correct shiny variant.\n14. The toggle knob stretches into a liquid tab indicator.\n15. The cursor selects “Stats.”\n16. The card opens into a clean Pokémon stat chart.\n\nBar 5 — Stats to search\n17. Stat bars draw themselves in sync with the beat.\n18. The cursor hovers over a bar; a readable tooltip appears.\n19. The chart retracts into the same container.\n20. The container compresses into a Pokédex search field.\n\nBar 6 — Find and select\n21. The search field expands into a command palette.\n22. A short Pokémon name is typed; matching results filter.\n23. The cursor selects a result, revealing its miniature artwork and type.\n24. Enter confirms; the palette folds into an “Added to team” toast.\n\nBar 7 — Return to the Poké Ball\n25. The toast’s confirmation mark becomes the Poké Ball’s central button.\n26. The toast contracts; its edges become the circular shell.\n27. The red upper half, white lower half, and black dividing line settle into place.\n28. The cursor returns along a smooth path, matching the opening position and velocity as the loop wraps.\n\nUse the chosen Pokémon consistently throughout. Keep visible text brief enough to read at this pace.\n<\/structure>\n\n<build>\n1. Build one self-contained HTML file with a square 1440×1440 composition. Compute every animated style from time inside seek(t): no CSS transitions, timers, or state carried between frames.\n2. Keep one persistent outer element throughout the sequence. Its internal artwork, labels, and controls may change, but the main silhouette must visibly connect every state.\n3. Use closed-form spring step responses. For repeated target changes, sum one spring response per change so animation remains a pure function of time.\n4. Give the tab indicator’s two edges different springs so the leading edge stretches ahead of the trailing edge. Apply the same technique to the toggle knob.\n5. Make drags direct manipulation: while held, values follow cursor position. On release, use a closed-form spring matching the release position and velocity.\n6. Analyze the supplied song with numpy to estimate the beat grid, verify the downbeat, and align the sequence. If the tempo differs from 120 BPM, adapt the timing to the actual music.\n7. Use licensed UI sounds and align their measured transient peaks with clicks, confirmations, and morph accents.\n8. Render with Playwright at four subframes per output frame. Blend each group of four with ffmpeg into a 60fps video for motion blur.\n9. Render one preview frame per beat before the full video. Fix anything cramped, unreadable, visually disconnected, or off the beat grid.\n10. Package artwork and fonts inside the HTML so rendering does not depend on network requests.\n<\/build><gotchas>\nNever put will-change on anything the camera scales; text can become blurry.Give outgoing and incoming content separate timing so labels never overlap during a morph.\n\nUse accurate Pokémon artwork, names, types, shiny colors, and stats. Do not invent variants or stretch character artwork when the container changes shape.\n\nKeep the main container recognizable through every transition. Pokémon artwork is content inside the morphing interface, not a replacement for the persistent shape.\n\nMatch the loop boundary exactly: geometry, content, camera, cursor position, and cursor velocity. Export the interval [0, duration) without duplicating the endpoint frame. Make the audio loop cleanly too.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the proposed Pokémon state list on the 28-beat grid before writing any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/thegrootdev-966114/original.6feef7fc7c.webp", "post": "https://x.com/TheGrootDev/status/2103516567824966114", "v": true, "card": "https://media.skillry.dev/opus-5-5/thegrootdev-966114/original-card.a7f52e3fea.mp4", "orig": "https://media.skillry.dev/opus-5-5/thegrootdev-966114/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/thegrootdev-966114/remake.mp4"}, {"n": 120, "c": "motion", "t": ["svg", "css"], "a": "charliie", "p": "make a cool instagram ad for liinks", "img": "https://media.skillry.dev/opus-5-5/charliie-334026/original.2e82ef7d21.webp", "post": "https://x.com/charliie/status/2103514073476334026", "v": true, "card": "https://media.skillry.dev/opus-5-5/charliie-334026/original-card.17833e68f1.mp4", "orig": "https://media.skillry.dev/opus-5-5/charliie-334026/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/charliie-334026/remake.mp4"}, {"n": 121, "c": "motion", "t": ["shader", "canvas", "svg"], "a": "samaote", "p": "make a dynamic lyrics motion graphics video based on the attached music, perfectly syncing the lyrics and animation to the vocals and beat. make it feel like an incredible motion designer’s showreel for a résumé. go all out.", "img": "https://media.skillry.dev/opus-5-5/samaote-124569/original.16a8bcaaa0.webp", "post": "https://x.com/samaote/status/2103510974796124569", "v": true, "card": "https://media.skillry.dev/opus-5-5/samaote-124569/original-card.f1d3069a62.mp4", "orig": "https://media.skillry.dev/opus-5-5/samaote-124569/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/samaote-124569/remake.mp4"}, {"n": 122, "c": "motion", "t": ["svg", "gsap"], "a": "LeanZubrezki", "p": "I want you to create a highly professional SaaS product launch video. Go and find some SaaS, preferably just one that people know, so it's easier to identify with it. Pick that, and then make sure to get actual assets and images and all of that stuff from the internet. Turn it into these typical, very professionally edited, motion-graphics-styled product launch videos that you see people making on Twitter when they launch new SaaS products (which are showing off the features, the benefits, and all of these things).", "img": "https://media.skillry.dev/opus-5-5/leanzubrezki-766171/original.e6da3fe4e9.webp", "post": "https://x.com/LeanZubrezki/status/2103502063950766171", "v": true, "card": "https://media.skillry.dev/opus-5-5/leanzubrezki-766171/original-card.81b819936c.mp4", "orig": "https://media.skillry.dev/opus-5-5/leanzubrezki-766171/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/leanzubrezki-766171/remake.mp4"}, {"n": 123, "c": "motion", "t": ["threejs", "canvas", "svg", "css"], "a": "onewaysidewalks", "p": "make a dynamic 15-second motion graphics video that shows what an incredible motion designer you are, like it's your showreel for the infra company https://alchemy.com, go all out!", "img": "https://media.skillry.dev/opus-5-5/onewaysidewalks-440008/original.d26cfa4030.webp", "post": "https://x.com/onewaysidewalks/status/2103500011581440008", "v": true, "card": "https://media.skillry.dev/opus-5-5/onewaysidewalks-440008/original-card.4b51e2cdaa.mp4", "orig": "https://media.skillry.dev/opus-5-5/onewaysidewalks-440008/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/onewaysidewalks-440008/remake.mp4"}, {"n": 124, "c": "motion", "t": ["canvas", "svg", "css"], "a": "andginja", "p": "make a 15-second showreel about my website. Go all out.", "img": "https://media.skillry.dev/opus-5-5/andginja-618685/original.ff108cca64.webp", "post": "https://x.com/andginja/status/2103492000733618685", "v": true, "card": "https://media.skillry.dev/opus-5-5/andginja-618685/original-card.c79b3293b9.mp4", "orig": "https://media.skillry.dev/opus-5-5/andginja-618685/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/andginja-618685/remake.mp4"}, {"n": 125, "c": "motion", "t": ["threejs", "canvas"], "a": "anas0ra", "p": "fait moi une vidéo sympa pour https://heeya.fr\" c'est impressionant", "img": "https://media.skillry.dev/opus-5-5/anas0ra-952637/original.f5978b0fca.webp", "post": "https://x.com/anas0ra/status/2103490331815952637", "v": true, "card": "https://media.skillry.dev/opus-5-5/anas0ra-952637/original-card.689f65d2d2.mp4", "orig": "https://media.skillry.dev/opus-5-5/anas0ra-952637/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/anas0ra-952637/remake.mp4"}, {"n": 126, "c": "motion", "t": ["svg"], "a": "nezbuilds", "p": "<inputs>\nAsk me for: 8 to 12 UI states I want the shape to become (e.g. button, loader, player, slider, toggle, tabs, chart, command palette, toast), pure black and white or one accent color, and a royalty-free song around 120 BPM (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nDribbble-level UI motion. One shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Light warm-gray canvas, black and white components, one clean UI font (Geist). Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. The last frame is the first frame, so it loops.\nBanned: bouncy easing, particle bursts, glows, gradients on UI chrome, mismatched icon strokes, dead time, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 7 bars, something happens on every beat.\nButton → loader → check → dynamic island → music player with a play/pause morph → scrub the progress bar → it becomes a volume slider that stretches when dragged past max → a toggle flips on the beat → the knob becomes a liquid tab indicator → the tabs open into a chart that draws itself, with a tooltip on hover → it collapses into ⌘K → type to filter → enter → toast → back to the button.\n<\/structure>\n\n<build>\n1. One HTML file, square 1440x1440. Every style is computed from time inside seek(t): no CSS transitions, no timers, no state carried between frames.\n2. Springs are closed-form step responses. A value that changes target many times is the sum of one spring per change, so it stays a pure function of time.\n3. The tab indicator's two edges ride different springs, so the leading edge stretches ahead of the trailing one. Same trick for the toggle knob.\n4. Drags are direct manipulation: while the cursor is held, the value is computed from its position. On release it springs back from wherever it was.\n5. Analyze the song with numpy for the beat grid and start on a downbeat. Place every UI sound by its measured peak.\n6. Render with Playwright: 4 subframes per frame, blended with ffmpeg tmix for motion blur at 60fps.\n7. Render one frame per beat before the full render. Fix anything off the grid, cramped or hard to read.\n<\/build>\n\n<gotchas>\nNever put will-change on anything the camera scales or the text renders blurry. Text that swaps inside a morphing container needs its own enter and exit timing or it overlaps. Make the last frame identical to the first, cursor position and speed included, or the loop stutters.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the state list on the beat grid before you write any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/nezbuilds-294391/original.2ea16dc1f9.webp", "post": "https://x.com/nezbuilds/status/2103487427365294391", "v": true, "card": "https://media.skillry.dev/opus-5-5/nezbuilds-294391/original-card.fda68d6b75.mp4", "orig": "https://media.skillry.dev/opus-5-5/nezbuilds-294391/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nezbuilds-294391/remake.mp4"}, {"n": 127, "c": "explainer", "t": ["canvas", "svg", "css"], "a": "sudo_kiran", "p": "make a dynamic 30-seconds motion graphic video about the distilbook like a product explainer the video has to be very incredible\n(product url)", "img": "https://media.skillry.dev/opus-5-5/sudo-kiran-254201/original.478ab227d6.webp", "post": "https://x.com/sudo_kiran/status/2103486573476254201", "v": true, "card": "https://media.skillry.dev/opus-5-5/sudo-kiran-254201/original-card.e666fd3566.mp4", "orig": "https://media.skillry.dev/opus-5-5/sudo-kiran-254201/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sudo-kiran-254201/remake.mp4"}, {"n": 128, "c": "3d", "t": ["threejs", "canvas"], "a": "BuildFastWithAI", "p": "Implement code to be able to navigate in a pagoda in 3D.", "img": "https://media.skillry.dev/opus-5-5/buildfastwithai-597035/original.6257b702b3.webp", "post": "https://x.com/BuildFastWithAI/status/2103483174957597035", "v": true, "card": "https://media.skillry.dev/opus-5-5/buildfastwithai-597035/original-card.ebb9fb3d0f.mp4", "orig": "https://media.skillry.dev/opus-5-5/buildfastwithai-597035/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/buildfastwithai-597035/remake.mp4"}, {"n": 129, "c": "motion", "t": ["canvas", "svg"], "a": "xelandre__", "p": "Code-driven animation: an HTML/JS page where every frame is calculated from the time, captured frame by frame with headless Chrome (Playwright), then assembled with ffmpeg into an MP4 with motion blur and code-generated sound.", "img": "https://media.skillry.dev/opus-5-5/xelandre-687413/original.cf7ca87baf.webp", "post": "https://x.com/xelandre__/status/2103473030160687413", "v": true, "card": "https://media.skillry.dev/opus-5-5/xelandre-687413/original-card.6617cb8fbc.mp4", "orig": "https://media.skillry.dev/opus-5-5/xelandre-687413/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/xelandre-687413/remake.mp4"}, {"n": 130, "c": "motion", "t": ["svg"], "a": "techyoutbe", "p": "I want you to create a highly professional SaaS product launch video. Go and find some SaaS, preferably just one that people know, so it's easier to identify with it. Pick that, and then make sure to get actual assets and images and all of that stuff from the internet. Turn it into these typical, very professionally edited, motion-graphics-styled product launch videos that you see people making on Twitter when they launch new SaaS products (which are showing off the features, the benefits, and all of these things)\n\nhttp://\nt3pacademy.gumroad.com", "img": "https://media.skillry.dev/opus-5-5/techyoutbe-588678/original.6bbd2b7bae.webp", "post": "https://x.com/techyoutbe/status/2103465227807588678", "v": true, "card": "https://media.skillry.dev/opus-5-5/techyoutbe-588678/original-card.c2dfd6cd6c.mp4", "orig": "https://media.skillry.dev/opus-5-5/techyoutbe-588678/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/techyoutbe-588678/remake.mp4"}, {"n": 131, "c": "motion", "t": ["canvas"], "a": "sudo_kiran", "p": "Go all out.", "img": "https://media.skillry.dev/opus-5-5/sudo-kiran-696074/original.201cd5baa9.webp", "post": "https://x.com/sudo_kiran/status/2103463886372696074", "v": true, "card": "https://media.skillry.dev/opus-5-5/sudo-kiran-696074/original-card.9d597ea720.mp4", "orig": "https://media.skillry.dev/opus-5-5/sudo-kiran-696074/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sudo-kiran-696074/remake.mp4"}, {"n": 132, "c": "motion", "t": ["canvas"], "a": "fire_ozgur", "p": "I want to know how good a graphic designer you are. To prove this to me, I want you to prepare a 15-second motion graphics video. I want you to do an introduction related to my account. I'm sharing my logo and my X cover image, use those too.", "img": "https://media.skillry.dev/opus-5-5/fire-ozgur-130104/original.9df58f2d55.webp", "post": "https://x.com/fire_ozgur/status/2103459971174130104", "v": true, "card": "https://media.skillry.dev/opus-5-5/fire-ozgur-130104/original-card.a8a7f5d7fd.mp4", "orig": "https://media.skillry.dev/opus-5-5/fire-ozgur-130104/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/fire-ozgur-130104/remake.mp4"}, {"n": 133, "c": "motion", "t": ["canvas", "css"], "a": "iamtanzil_", "p": "# OBLT E-bike Header\n\nA full-viewport, dark, cinematic e-bike product header for the brand **OBLT**, built in React (client component) with pure CSS and an interactive cursor-following \"x-ray\" spotlight reveal — moving the mouse wipes away the bike's exterior photo to expose its internal carbon/gearbox structure underneath. Built with React only (no animation libraries).\n\n## Tech stack (libraries actually imported)\n- React only — `useRef`, `useState`, and the `MouseEvent` type. No framer-motion, no GSAP, no icon library. All animation is hand-written CSS keyframes + an inline CSS `mask-image`.\n- SVG icon (the CTA arrow) is hand-inlined, not from a library.\n\n## Fonts & global styles\n- Single Google font, imported inside a `<style>` block:\n  ```\n  @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap');\n  ```\n- Font stack: `\"Almarai\",\"Helvetica Neue\",Helvetica,Arial,sans-serif`.\n- `-webkit-font-smoothing: antialiased`. `box-sizing: border-box` applied to the root and all descendants (scoped to `.vt-header`, never global).\n\n## Section container\n- Root `<header className=\"vt-header\">` is the mouse-tracking element (handlers: `onMouseEnter`, `onMouseMove`, `onMouseLeave`).\n- Styles: `position: relative; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; padding: 32px 56px 44px; background-color: #272727; color: #fff;`.\n- Internal vertical flow: top nav, then a flex-grow spacer \"stage\", then bottom content pinned to the base.\n\n## Structure, section by section\n\n### 1. Reveal background (`.vt-bg`, absolute inset:0, z-index 0, pointer-events:none)\nThree stacked layers:\n- **Base exterior image** (`.vt-bg-img`): the full bike exterior photo, `object-fit: cover; object-position: center;`, fills the layer. `user-select:none`, `-webkit-user-drag:none`, `referrerPolicy=\"no-referrer\"`.\n- **X-ray layer** (`.vt-bg-xray`, z-index 1): contains the bike x-ray/internal image (same cover/center sizing). This layer is masked by a radial gradient driven by cursor position (see Animations). `will-change: -webkit-mask-image, mask-image;` and `transition: -webkit-mask-image .12s linear, mask-image .12s linear;`.\n- **Veil overlay** (`.vt-bg-veil`, z-index 2): a vertical darkening gradient so text stays legible top & bottom:\n  ```\n  linear-gradient(180deg, rgba(39,38,38,.62) 0%, rgba(39,38,38,.10) 26%, rgba(39,38,38,.10) 60%, rgba(39,38,38,.82) 100%)\n  ```\n\n### 2. Top nav (`.vt-nav`, z-index 30)\n- `display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px;`.\n- **Logo** (left, `.vt-logo`): text `OBLT` followed by a `.` span. `font-size: 28px; font-weight: 700; letter-spacing: 0.5px; color: #E0E1CC;` (dot is also `#E0E1CC`).\n- **Center menu** (`.vt-menu`, gap 40px): three links — `E-bikes`, `Features`, `Connect`. Each: `font-size: 16px; font-weight: 400; letter-spacing: .3px; color: #E0E1CC; opacity: .85; transition: opacity .2s ease;` hover → opacity 1.\n- **Right cluster** (`.vt-nav-right`, gap 18px): an uppercase explore link plus a hamburger button.\n  - `.vt-explore` link text: `Explore the bike` — `font-size: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #E0E1CC;` hover → opacity .65.\n  - **Hamburger** (`.vt-burger`, hidden on desktop): 34×34px, three `#E0E1CC` bars 22×2px, radius 2px, gap 5px. On `.open`: bar 1 `translateY(7px) rotate(45deg)`, bar 2 `opacity:0`, bar 3 `translateY(-7px) rotate(-45deg)`. Transition `transform .25s ease, opacity .2s ease`.\n- **Mobile dropdown** (`.vt-mobile-menu`, rendered only when `menuOpen`): absolutely positioned below the nav (`top:100%; margin-top:16px; z-index:40`), `background: rgba(20,19,19,.97); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 8px 18px;`. Links (`E-bikes`, `Features`, `Connect`, `Explore the bike`): `color:#E0E1CC; font-size:18px; padding:14px 4px; border-bottom:1px solid rgba(255,255,255,.08)`; last link `border-bottom:none; font-weight:700`. Each link closes the menu on click.\n\n### 3. Stage spacer (`.vt-stage`, z-index 30, `flex: 1 1 0%`)\n- `display: flex; align-items: flex-start; justify-content: flex-end; padding-top: 22px;`. In the current markup it is an empty `aria-hidden` spacer (the `.vt-hint` pulsing-dot styles exist in CSS but the hint element is not rendered).\n- (Reference: `.vt-hint` styled as an uppercase 11px/600 label with a 36px circle dot, `border:1px solid rgba(46,211,176,.5); color:#2ed3b1;` running `vtPulse 1.8s ease-in-out infinite`.)\n\n### 4. Bottom content (`.vt-bottom`, z-index 30)\n12-column grid: `grid-template-columns: repeat(12, 1fr); align-items: end; gap: 18px 32px;`.\n- **Headline** (`.vt-headline`, `grid-column: 1 / span 8`): `<h1>` containing the word-stagger component. h1 style: `color: #E0E1CC; font-weight: 500; font-size: clamp(36px, 7vw, 116px); line-height: 0.85; letter-spacing: -0.07em; white-space: nowrap; margin:0;`. Text: **Ready For The Ride**.\n- **Right block** (`.vt-right`, `grid-column: 9 / span 4; align-self: end; transform: translateY(22px);`):\n  - Paragraph (verbatim): `An integrated gearbox, battery, and motor engineered in carbon and built to be seen. Every system, in the open.` Style: `font-size: 16px; line-height: 1.2; color: rgba(225,224,204,.7);` animates in via `vtFadeUp .8s cubic-bezier(.16,1,.3,1) both` with `animation-delay: .5s`.\n  - **CTA button** (`.vt-cta`): label **Reserve yours** plus a circular arrow. Pill: `color:#000; background:#E0E1CC; border:none; border-radius:9999px; padding:6px 6px 6px 22px; font-size: clamp(14px, 1vw, 16px); font-weight:500; display:inline-flex; align-items:center; gap:10px;`. Animates via `vtFadeUp .8s cubic-bezier(.16,1,.3,1) both`, `animation-delay: .7s`. Hover → `gap: 14px`. Inner circle `.circ`: 40×40px, `border-radius:50%; background:#000;` containing the SVG (stroke `#E0E1CC`); on button hover `.circ` scales to `1.1` (`transition: transform .25s ease`).\n\n## Assets (every URL)\n- Exterior photo (base layer): `https://cdn.jiro.build/ARS/OBLT%20E%20Bike/bike-exterior.png`\n- X-ray / internals photo (revealed layer): `https://cdn.jiro.build/ARS/OBLT%20E%20Bike/bike-xray-original.png`\n- CTA arrow icon: inline SVG, 16×16, `viewBox=\"0 0 24 24\"`, `stroke=\"currentColor\"`, `stroke-width=\"2.2\"`, round caps/joins, path:\n  ```\n  M5 12h14M13 6l6 6-6 6\n  ```\n\n## Animations\n\n### Cursor \"x-ray\" spotlight (signature interaction)\n- State: `hovering` (bool) and `pos` ({x,y} in px relative to the section's bounding rect). `handleMove` computes `e.clientX - rect.left`, `e.clientY - http://rect.top`.\n- Constants: `RADIUS = 165` px (spotlight radius), `FEATHER = 45` px (soft edge). Inner fully-clear radius = `RADIUS - FEATHER` = 120px.\n- The x-ray layer's `maskImage` / `WebkitMaskImage` is set inline. When hovering:\n  ```\n  radial-gradient(circle 165px at {x}px {y}px, #000 0, #000 120px, transparent 165px)\n  ```\n  When not hovering (collapsed to nothing):\n  ```\n  radial-gradient(circle 0px at 50% 50%, transparent 0, transparent 0)\n  ```\n- Mask transitions at `.12s linear` so the reveal trails the cursor smoothly. NOTE: in CSS `mask`, opaque (`#000`) areas KEEP the layer — so the circle reveals the x-ray image while the rest of that layer is hidden (showing the exterior beneath).\n\n### Headline word pull-up (`WordsPullUp` component)\n- Splits the headline on spaces; each word is an `inline-block` span (`margin-right: 0.22em`, last word 0). Each word animates `wpuUp` with `cubic-bezier(.16,1,.3,1) both`, default `duration = 0.6s`, staggered by `delayStep = 0.08s` (`animationDelay: i * 0.08s`).\n- Keyframes:\n  ```\n  @keyframes wpuUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }\n  ```\n- Optional superscript asterisk (`.wpu-ast`, `font-size:0.31em; vertical-align:top; top:0.15em; left:-0.05em;`) — not enabled here (`asterisk` defaults false).\n- Respects `@media (prefers-reduced-motion: reduce)` → `.wpu-word { animation: none; }`.\n\n### Fade-up for right block (`vtFadeUp`)\n```\n@keyframes vtFadeUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }\n```\nParagraph delay `.5s`, CTA delay `.7s`; both `.8s cubic-bezier(.16,1,.3,1) both`.\n\n### Pulse (defined for hint dot)\n```\n@keyframes vtPulse { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.12);opacity:1} }\n```\nApplied `vtPulse 1.8s ease-in-out infinite`.\n\n## Responsive\n- **≤1000px**: padding `24px 28px 32px`; nav becomes `1fr auto` (logo + right); center `.vt-menu` and `.vt-explore` hidden; hamburger shown; `.vt-bottom` collapses to single column (`gap:16px`); headline & right span full width; `.vt-right` `transform:none; align-self:start; margin-top:4px; max-width:520px`.\n- **≤600px**: padding `18px 20px 26px`; logo `font-size:22px`; headline `white-space:normal; font-size: clamp(40px, 13vw, 72px); line-height:0.92`; paragraph `font-size:15px; margin-bottom:16px`; CTA `font-size:14px; padding:5px 5px 5px 20px`; `.circ` 36×36px.\n\n## Key design principles\n- Dark stage (`#272727`) with a single warm-cream accent (`#E0E1CC`) and a teal accent (`#2ed3b1`) reserved for the (optional) pulse hint.\n- The product reveal IS the hero: cursor acts as an x-ray torch over a layered photo pair.\n- Editorial oversized headline (line-height 0.85, tight `-0.07em` tracking) anchored bottom-left; supporting copy + CTA bottom-right.\n- Staggered, eased (`cubic-bezier(.16,1,.3,1)`) entrance for hierarchy.\n\n## Common mistakes to avoid\n- Don't invert the mask logic: opaque `#000` in the radial gradient REVEALS the x-ray layer; the transparent ring hides it. Getting this backwards shows internals everywhere except under the cursor.\n- Keep `RADIUS - FEATHER` (120px) as the inner solid stop and `RADIUS` (165px) as the transparent stop — that 45px band is the soft feather.\n- Mouse coordinates must be relative to the section rect (`getBoundingClientRect`), not the viewport.\n- Mask transition is `.12s linear` only — a longer/eased transition makes the spotlight feel laggy.\n- `white-space: nowrap` on the headline is intentional on desktop; only switch to `normal` at ≤600px.\n- Scope all resets and the Almarai `@import` to the component; do not touch global `body`/`html`.\n\n## Page title\nOBLT — Ready For The Ride\n\n## Integration (build-safety — do not skip)\n- Add this section as a **new** component file with a unique name. Don't edit or overwrite any existing file except to add its import and render it.\n- Render it **after** all existing sections; keep every previously built section exactly as-is — never replace or remove them.\n- If no project exists, create a minimal React + Tailwind app; if one exists, use it as-is — don't re-scaffold or change the Tailwind/build config or version.\n- Keep it self-contained: scope its fonts and any resets to this section; never set global `body`/`html`/`*` styles or a global font.\n- Install only the libraries this section names.", "img": "https://media.skillry.dev/opus-5-5/iamtanzil-120030/original.31773009f1.webp", "post": "https://x.com/iamtanzil_/status/2103459843831120030", "v": true, "card": "https://media.skillry.dev/opus-5-5/iamtanzil-120030/original-card.ff25e7ebb1.mp4", "orig": "https://media.skillry.dev/opus-5-5/iamtanzil-120030/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/iamtanzil-120030/remake.mp4"}, {"n": 134, "c": "motion", "t": ["canvas"], "a": "Gdgtify", "p": "Create a 20.00-second kinetic spoken-word film titled “BUILD THE FLOOR.”  Treat this as an original miniature speech staged entirely through typography. Every line changes the architecture of the frame. The final declaration must stand on something the earlier words physically constructed.  Deliver one self-contained HTML file, 1080×1080, targeting 60fps, using SVG and/or Canvas. Embed all required assets.  ART DIRECTION Background #102820. Paper # F4E9D5. Structural accent # F2B544. A literary editorial world with the scale and confidence of a public monument. Use a high-contrast serif for the speech, a heavy grotesque for load-bearing words, and a restrained monospace for small timing marks. No distressed protest-poster clichés, megaphones, flags, crowds, microphones, or stock footage.  ORIGINAL SPEECH — EXACT WORDS, EXACT ORDER “We were told to wait.” “So we learned the weight of waiting.” “Then one voice made room.” “Then another.” “Now the floor belongs to us.”  Do not attribute these words to any real person. No extra slogans. The complete speech must be understandable without audio.  CENTRAL VISUAL RULE Words have assigned architectural roles. WAIT is a lintel. WAITING is a suspended load. VOICE is a support. ROOM is an opening. FLOOR is a platform. These roles must emerge from the actual letterforms, not from separate illustrations placed behind text.  STORYBOARD 0.00–3.00 “We were told to wait.” The sentence occupies a narrow horizontal opening beneath a massive WAIT. The opening slowly compresses while the sentence remains readable. The pressure comes from the layout, not camera shake.  3.00–6.50 “So we learned the weight of waiting.” Reveal the sentence in spoken phrase groups. WAITING lowers on two fine vertical rules. Those rules become suspension cables. A baseline bends under the visual load using a controlled vector deformation.  6.50–10.00 “Then one voice made room.” VOICE enters vertically and rotates into a structural support. It lifts one end of the baseline. The counter of the O in ROOM becomes an aperture. The next composition is revealed through that aperture.  10.00–12.50 “Then another.” A second support arrives. The tilted structure levels. This is the first moment of perfect horizontal alignment in the film. Use a brief stillness to make the change feel earned.  12.50–16.00 “Now the floor belongs to us.” Earlier structural words assemble into a platform. The final sentence settles onto it. US receives emphasis through shared alignment and scale, never through a separate flashy effect.  16.00–18.00 Hold the complete declaration. A slight release of tension travels through the supporting rules. No new text. No restless decorative motion.  18.00–20.00 The camera tracks beneath the completed platform. Its underside fills the frame and becomes the opening WAIT lintel. Under full occlusion, return hidden elements to their initial positions. Reveal the exact opening composition.  CHOREOGRAPHY Do not force the speech onto a dance beat. Use a cue sheet based on phrases, pauses, and emphasis. Phrase reveals should follow reading order. Allow at least one 400ms moment of absolute stillness. Use critically damped motion for settling loads. Use controlled elastic deformation for the baseline only. Make the changes in available space carry the emotional progression.  TYPE IMPLEMENTATION Use actual glyph paths for structural words. Preserve counters and legibility during deformation. For transitions between unrelated words, use occlusion or matched structural edges; do not interpolate arbitrary path points. Keep the currently spoken phrase readable before it becomes architecture.  ENGINEERING Implement window. seek(t) as a deterministic scene renderer. No accumulated physics, autonomous CSS transitions, or changing random values. Use time-remapping curves and analytic transforms. Use a 20-second periodic timeline with render(0)=render(20). Provide fixed-step access at n/60 for 1200 export frames. Audio is optional and off by default; no browser speech synthesis or autoplay dependency.  QUALITY GATE Inspect eight representative frames. Check that the speech reads in the correct order. Check that structural transformations never destroy a line before the audience can read it. Check the final platform is visibly assembled from earlier elements. Return the complete HTML implementation.", "img": "https://media.skillry.dev/opus-5-5/gdgtify-929495/original.bf87884126.webp", "post": "https://x.com/Gdgtify/status/2103458245213929495", "v": true, "card": "https://media.skillry.dev/opus-5-5/gdgtify-929495/original-card.fb7d9cdc34.mp4", "orig": "https://media.skillry.dev/opus-5-5/gdgtify-929495/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/gdgtify-929495/remake.mp4"}, {"n": 135, "c": "motion", "t": ["svg"], "a": "sanjeevn72", "p": "<inputs>\nAsk me for: 8 to 12 UI states I want the shape to become (e.g. button, loader, player, slider, toggle, tabs, chart, command palette, toast), pure black and white or one accent color, and a royalty-free song around 120 BPM (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nDribbble-level UI motion. One shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Light warm-gray canvas, black and white components, one clean UI font (Geist). Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. The last frame is the first frame, so it loops.\nBanned: bouncy easing, particle bursts, glows, gradients on UI chrome, mismatched icon strokes, dead time, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 7 bars, something happens on every beat.\nButton → loader → check → dynamic island → music player with a play/pause morph → scrub the progress bar → it becomes a volume slider that stretches when dragged past max → a toggle flips on the beat → the knob becomes a liquid tab indicator → the tabs open into a chart that draws itself, with a tooltip on hover → it collapses into ⌘K → type to filter → enter → toast → back to the button.\n<\/structure>\n\n<build>\n1. One HTML file, square 1440x1440. Every style is computed from time inside seek(t): no CSS transitions, no timers, no state carried between frames.\n2. Springs are closed-form step responses. A value that changes target many times is the sum of one spring per change, so it stays a pure function of time.\n3. The tab indicator's two edges ride different springs, so the leading edge stretches ahead of the trailing one. Same trick for the toggle knob.\n4. Drags are direct manipulation: while the cursor is held, the value is computed from its position. On release it springs back from wherever it was.\n5. Analyze the song with numpy for the beat grid and start on a downbeat. Place every UI sound by its measured peak.\n6. Render with Playwright: 4 subframes per frame, blended with ffmpeg tmix for motion blur at 60fps.\n7. Render one frame per beat before the full render. Fix anything off the grid, cramped or hard to read.\n<\/build>\n\n<gotchas>\nNever put will-change on anything the camera scales or the text renders blurry. Text that swaps inside a morphing container needs its own enter and exit timing or it overlaps. Make the last frame identical to the first, cursor position and speed included, or the loop stutters.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the state list on the beat grid before you write any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/sanjeevn72-457691/original.2285d7089e.webp", "post": "https://x.com/sanjeevn72/status/2103456358125457691", "v": true, "card": "https://media.skillry.dev/opus-5-5/sanjeevn72-457691/original-card.3d357e15d1.mp4", "orig": "https://media.skillry.dev/opus-5-5/sanjeevn72-457691/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sanjeevn72-457691/remake.mp4"}, {"n": 136, "c": "motion", "t": ["svg"], "a": "madpencil_", "p": "fun motion graphic, comic book style, 10s", "img": "https://media.skillry.dev/opus-5-5/madpencil-753990/original.516c4defa2.webp", "post": "https://x.com/madpencil_/status/2103449418460753990", "v": true, "card": "https://media.skillry.dev/opus-5-5/madpencil-753990/original-card.ccb818e304.mp4", "orig": "https://media.skillry.dev/opus-5-5/madpencil-753990/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/madpencil-753990/remake.mp4"}, {"n": 137, "c": "interactive", "t": ["canvas", "pixel", "playable"], "a": "opener_ai", "p": "Make a game like Romance of the Three Kingdoms III with a retro, pixelated classic vibe.", "img": "https://media.skillry.dev/opus-5-5/opener-ai-843891/original.9c2378e71b.webp", "post": "https://x.com/opener_ai/status/2103437714695843891", "v": true, "card": "https://media.skillry.dev/opus-5-5/opener-ai-843891/original-card.ed4c9f2059.mp4", "orig": "https://media.skillry.dev/opus-5-5/opener-ai-843891/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/opener-ai-843891/remake.mp4"}, {"n": 138, "c": "motion", "t": ["canvas"], "a": "loicRambo", "p": "make a dynamic 20-second motion graphics and animation video that shows what an incredible motion designer and animator you are, like it's your showreel for a résumé. make it about the cycle of life showing the same individual going from childhood to adolescence to the 9-5 cycle, to family life to elder life and death, then cutting ready to loop to the beginning.  go all out , use whatever you need.", "img": "https://media.skillry.dev/opus-5-5/loicrambo-980558/original.4b344cccdb.webp", "post": "https://x.com/loicRambo/status/2103428454355980558", "v": true, "card": "https://media.skillry.dev/opus-5-5/loicrambo-980558/original-card.d26e2cd8ff.mp4", "orig": "https://media.skillry.dev/opus-5-5/loicrambo-980558/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/loicrambo-980558/remake.mp4"}, {"n": 139, "c": "motion", "t": ["canvas"], "a": "hugon001", "p": "make a dynamic 15-second motion graphics video that shows what an incredible app Mentis is, like it's your showreel for a app launch. go all out. Make the text in French.", "img": "https://media.skillry.dev/opus-5-5/hugon001-609629/original.fa92a42816.webp", "post": "https://x.com/hugon001/status/2103425679618609629", "v": true, "card": "https://media.skillry.dev/opus-5-5/hugon001-609629/original-card.eb93a1b4d4.mp4", "orig": "https://media.skillry.dev/opus-5-5/hugon001-609629/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/hugon001-609629/remake.mp4"}, {"n": 140, "c": "motion", "t": ["svg"], "a": "mehul4795", "p": "Create a product launch video for ocrX Android app.", "img": "https://media.skillry.dev/opus-5-5/mehul4795-417532/original.f41414249a.webp", "post": "https://x.com/mehul4795/status/2103420457110417532", "v": true, "card": "https://media.skillry.dev/opus-5-5/mehul4795-417532/original-card.d79870c59d.mp4", "orig": "https://media.skillry.dev/opus-5-5/mehul4795-417532/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mehul4795-417532/remake.mp4"}, {"n": 141, "c": "explainer", "t": ["canvas"], "a": "Sarut0biSasuke", "p": "Render a recipe motion graphic animation using JavaScript or HTML (whatever you think will produce the best result) to show the full recipe for a White Russian from start to finish, empty glass to completed cocktail. Explainer video style, showing the ingredients and measurements as they go into the glass. It should be a 30s video.", "img": "https://media.skillry.dev/opus-5-5/sarut0bisasuke-069973/original.7731d87533.webp", "post": "https://x.com/Sarut0biSasuke/status/2103418429248069973", "v": true, "card": "https://media.skillry.dev/opus-5-5/sarut0bisasuke-069973/original-card.ba3e74cc58.mp4", "orig": "https://media.skillry.dev/opus-5-5/sarut0bisasuke-069973/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sarut0bisasuke-069973/remake.mp4"}, {"n": 142, "c": "3d", "t": ["css"], "a": "RaphaelAubryy", "p": "<inputs>\nAsk me for: the product name and a one-line promise, 3 to 5 UI moments to show, one accent color, 10 to 20 real vertical clips I own, and a royalty-free song with a clear drop (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nHigh-end minimal. One idea per shot, lots of empty space, one accent color, one clean sans (Geist or Inter) with tight tracking. Masked type reveals, match cuts, one smooth camera language. Real footage only, never placeholder cards. No full stops in on-screen text.\nBanned: shockwave rings, particle bursts, RGB split, camera shake, lens flares, neon glows, grid floors, flashing backgrounds, bouncy easing.\n<\/direction>\n\n<structure>\n10 bars at 120 BPM, 2 seconds each.\nBar 1: the hook lands word by word on the beats.\nBar 2: one hook word morphs into the product UI. A cursor types and clicks.\nThe drop: a circle opens out of the button into a dark scene.\nThen one move per bar: a wall of real clips with a scan line and 3 winners, the key output as big type, a 3D carousel of real videos with floor reflections and a motion-blurred whip onto one hero clip, the hero in a phone next to a panel that flips into results, big stats on push cuts, a 3-word ticker, a logo reveal, a fade to black.\n<\/structure>\n\n<build>\n1. One HTML file at 1920x1080. Every style is computed from time inside \nhttp://\nwindow.seek(t): no CSS animations, no timers, no state between frames.\n2. Real video: extract clips to 30fps JPEG sequences with ffmpeg and swap img sources per frame. seek awaits the image decodes.\n3. Analyze the song with numpy: tempo, beat grid, energy per bar, the drop. Calibrate the grid to the real kick hits. Every cut sits on a downbeat, every UI hit on a beat.\n4. Render with Playwright: 3 subframes per frame at t minus, at, and plus 1/240s, then blend with ffmpeg tmix for real motion blur at 60fps.\n5. Place each sound effect so its measured peak, not its file start, lands on the event. Keep the effects quiet under the music. Loudnorm to -14 LUFS.\n6. Probe 20 or more frames before the full render. Fix anything cluttered, overlapping or hard to read.\n<\/build>\n\n<gotchas>\nNever set opacity or filter on a preserve-3d element, because it flattens and both faces show. Fade its wrapper instead. Measure element positions at runtime for match cuts. Only use music and sound effects whose license allows commercial use.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me a storyboard with every timing on the beat grid before you write any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/raphaelaubryy-687877/original.0b55ce6d62.webp", "post": "https://x.com/RaphaelAubryy/status/2103413596822687877", "v": true, "card": "https://media.skillry.dev/opus-5-5/raphaelaubryy-687877/original-card.b8e0d24779.mp4", "orig": "https://media.skillry.dev/opus-5-5/raphaelaubryy-687877/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/raphaelaubryy-687877/remake.mp4"}, {"n": 143, "c": "motion", "t": ["canvas"], "a": "techhalla", "p": "You are a world-class motion designer doing a 20.00s kinetic identity bumper for TechHalla — an AI creator known for stealable workflows, not vibes. This piece must feel like the best designer in the room made a street-poster that moves. Showreel stakes: if this is weak, you don’t get hired.\n\nDURATION: exactly 20.00 seconds. LOOPABLE: frame 0 == frame last (position, opacity, cursor if any).\nFORMAT: one HTML file, 1080×1080 (square, X-native). 60fps.\nPALETTE (strict):\n- bg # 0A0A0A\n- magenta # FF2BD6\n- acid green # B8FF00\n- white # F5F5F5 only for primary readable type when needed\nNo other hues. No gradients on UI chrome. Magenta/green may misregister (print offset) by 2–4px on impact frames only.\n\nTYPE SYSTEM (use all three; never one font for everything):\n1) Display / scream: Archivo Black (or equivalent ultra-condensed black) — 1–4 words max\n2) Urban grotesque: Syne ExtraBold — secondary hits, stacked lines\n3) Mono / “prompt code”: IBM Plex Mono Medium — small labels, timestamps, fake prompt crumbs\nTracking: display −40 to −80; mono +20. Optical kerning. No cute script fonts.\n\nMESSAGE (locked — do not soften, do not add filler slogans):\nBeat hits in this exact order:\n1. STOP SCROLLING\n2. AI VIDEO ISN’T EXPENSIVE\n3. BAD PROMPTING IS\n4. WORKFLOWS > WISHES\n5. STEAL THE PROMPT\n6. @ TECHHALLA\nSupporting crumbs (mono, ≤18 chars, never full sentences): JSON · H3 · SEEDANCE · 0 KEYFRAMES · MAGNIFIC · COPY/PASTE\n\nNARRATIVE ARC (20s):\n0.0–2.5s  COLD OPEN — “STOP SCROLLING” slams in from below with spring overshoot; magenta smear trail; acid green baseline ticks across like a waveform.\n2.5–6.5s  THESIS A — “AI VIDEO ISN’T EXPENSIVE” locks to a poster grid (baseline grid 8px). Letters scramble (seeded Fisher–Yates per glyph) then snap on the beat.\n6.5–10.5s THESIS B — “BAD PROMPTING IS” replaces it via mask wipe through the letterforms (the outgoing line is the mask). Magenta/green channel split on the cut.\n10.5–14.5s PROOF FLASH — rapid kinetic stack: WORKFLOWS > WISHES, then mono crumbs orbit a central block like a terminal. One fake “prompt block” types 3 lines max, then gets crossed by an acid green strikethrough that becomes a underline for STEAL THE PROMPT.\n14.5–17.5s BRAND LOCK — @ TECHHALLA centers; display weight. A thick magenta bar and a thin acid green rule form an L-bracket mark (custom, not a logo download).\n17.5–20.0s SETTLE / LOOP — hold lockup; micro-breath (scale 1.000→1.012→1.000); last frame == first ready for loop.\n\nCONCRETE TECHNIQUES (required — implement, don’t approximate):\n1. seek(t) pure function of time. No CSS transitions. No setInterval. No React state across frames.\n2. Springs = closed-form step responses. Stack one spring per target change so motion stays deterministic.\n3. Kinetic type: per-glyph spring (y, opacity, blur). Stagger = 1/16 note at 120 BPM (125ms).\n4. Print misregistration: on accent frames only, duplicate text layer offset (±2–4px) in magenta and acid green at 40% opacity.\n5. Mask reveal: destination text revealed by animating a path mask derived from the outgoing word’s outlines.\n6. Camera: one orthographic camera; only punch-in (1.0→1.08) and horizontal smash-pans timed to beats — never random drift.\n7. Motion blur: render 4 subframes per frame, blend (tmix-style).\n8. Beat grid: 120 BPM, downbeat at t=0. Something must land on every beat for the first 16 beats; after that, every other beat is ok.\n9. Pre-pass: before full render, export one still per major beat (8 frames). Fix cramped type, orphan words, low contrast — then render.\n\nBANNED:\nGeneric AI clichés (brains, robots, neural nets, sparkles), soft gradients, bouncy cartoon easing, particle explosions, stock “futuristic HUD”, long paragraphs, narrator essay energy, Canva-deck energy, extra slogans beyond the locked message, purple/blue neon, glassmorphism.\n\nIf Astra already blew our minds… Opus 5.5 is a monster 😱", "img": "https://media.skillry.dev/opus-5-5/techhalla-498547/original.fbdb194d58.webp", "post": "https://x.com/techhalla/status/2103411244468498547", "v": true, "card": "https://media.skillry.dev/opus-5-5/techhalla-498547/original-card.062d82a4a3.mp4", "orig": "https://media.skillry.dev/opus-5-5/techhalla-498547/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/techhalla-498547/remake.mp4"}, {"n": 144, "c": "explainer", "t": ["canvas", "svg", "gsap"], "a": "TomAndrieu96707", "p": "Create a pure javascript animation. 30s-60s whimsical hand drawn collage style with appropriate audio that will explain the same story as our “about-us” page. Use assets from our repo when possible.", "img": "https://media.skillry.dev/opus-5-5/tomandrieu96707-875264/origi /opus-5-5/ishuagra02-922825/remake.mp4"}, {"n": 160, "c": "explainer", "t": ["gsap"], "a": "1stnoel_", "p": "Make a 1-minute educational video about https://readsotto.app/ with synthesized voice narration.", "img": "https://media.skillry.dev/opus-5-5/1stnoel-603851/original.418e4347c9.webp", "post": "https://x.com/1stnoel_/status/2103247530259603851", "v": true, "card": "https://media.skillry.dev/opus-5-5/1stnoel-603851/original-card.09a5a3a0ea.mp4", "orig": "https://media.skillry.dev/opus-5-5/1stnoel-603851/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/1stnoel-603851/remake.mp4"}, {"n": 161, "c": "explainer", "t": ["canvas", "svg", "gsap", "ai-image"], "a": "RetropunkAI", "p": "Render a fun motion graphic animation using the GSAP animation platform (see below) to show a brief history of The Sphere in Las Vegas from start to today (start with a minimal architecture to completed venue) - Explainer video style - Talk about how bands now play there, The Wizard of Oz film and next how on Oct 1 2026 Metallica will make their debut - and guess who is attending? We are! Should be a 30-60s video depending on the info. Use the images in the folder.\n\nSphere History:\nhttps://en.wikipedia.org/wiki/Sphere_(venue)\n\nAnimation Platforms:\nhttps://gsap.com/\n\nAsk me any questions if you need, but if you feel confident please have fun and make something awesome that will go super viral!", "img": "https://media.skillry.dev/opus-5-5/retropunkai-277590/original.08274868d0.webp", "post": "https://x.com/RetropunkAI/status/2103237989065277590", "v": true, "card": "https://media.skillry.dev/opus-5-5/retropunkai-277590/original-card.93a5d927c8.mp4", "orig": "https://media.skillry.dev/opus-5-5/retropunkai-277590/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/retropunkai-277590/remake.mp4"}, {"n": 162, "c": "motion", "t": ["canvas", "svg", "gsap", "ai-image"], "a": "jake11moran", "p": "Using HyperFrames, make a hype teaser for the product in this post - [link]. Landscape, around 27 seconds. Match the product UI, wallpaper and copy from the post's video \n\nMotion should feel slow and polished - one continuous camera over one Mac desktop, no hard cuts. Camera pushes, pulls and pans run like 1.5 to 3 seconds on gentle ease-in-out curves, nothing snappy - aim for half the speed you'd default to. Add motion blur on fast moves and a light film grain finish. Use an oversized macOS cursor. No audio. All on-screen copy lowercase like the post.\n\n1. Open on a big centered line - \"in the AI era, the hard part is\" - entering word by word from the right with an orange colorama text wipe over it (the `colorama-wipe` registry component). Hold it about a second, then scale it down into place above a spinning list.\n2. The list rotates through 30 hard things about working in the AI era - spending tokens wisely, picking the right model, managing context windows, etc - each with a real app icon. Go fast, it's not meant to be read, then land slowly on \"managing your desktop\". 0.2s after it lands a question mark pops on after it.\n3. Pull the camera back to reveal the Mac desktop as windows pile in on top of each other, arriving from behind the camera - Claude, ChatGPT, Grok, Linear, Chrome, Spotify, Slack and Claude Code in a terminal. Build these as accurate recreations of the real apps with real icons. \n4. Push back in so the windows fly past the camera, back to text - \"don't make your browser / one of them\".\n5. Pan up to a really tight framing of just the notch and the top of the wallpaper. A cursor comes up and hovers - the notch morphs into a pill with the name \"NotchBrowser\", then opens into the browser panel exactly like in the video. \n6. Click through the tabs like the video does, then click the collapse chevron so the panel retracts into the notch.\n7. End on a checklist of the post's claims with rings and ticks drawing on", "img": "https://media.skillry.dev/opus-5-5/jake11moran-414633/original.7f1e44af8c.webp", "post": "ht
