<script>
const D=[{"n": 1, "c": "explainer", "t": ["canvas"], "a": "Ror_Fly", "p": "We're going to try a little test. Do you think you could render a recipe motion graphic animation using javascript or html (w/e you think will produce the best) to show the full recipe from start to finish (empty glass to completed cocktail) - Explainer video style - Showing the recipe ingreidents + measurements as they're going into the cup. Should be a 30s video.", "img": "https://media.skillry.dev/opus-5-5/ror-fly-880547/original.59f728b077.webp", "post": "https://x.com/Ror_Fly/status/2102853258582880547", "v": true, "card": "https://media.skillry.dev/opus-5-5/ror-fly-880547/original-card.0f153afab5.mp4", "orig": "https://media.skillry.dev/opus-5-5/ror-fly-880547/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ror-fly-880547/remake.mp4"}, {"n": 2, "c": "motion", "t": ["svg"], "a": "twoclipping", "p": "<inputs>\nAsk me for: 8 to 12 UI states I want the shape to become (e.g. button, loader, player, slider, toggle, tabs, chart, command palette, toast), pure black and white or one accent color, and a royalty-free song around 120 BPM (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nDribbble-level UI motion. One shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Light warm-gray canvas, black and white components, one clean UI font (Geist). Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. The last frame is the first frame, so it loops.\nBanned: bouncy easing, particle bursts, glows, gradients on UI chrome, mismatched icon strokes, dead time, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 7 bars, something happens on every beat.\nButton → loader → check → dynamic island → music player with a play/pause morph → scrub the progress bar → it becomes a volume slider that stretches when dragged past max → a toggle flips on the beat → the knob becomes a liquid tab indicator → the tabs open into a chart that draws itself, with a tooltip on hover → it collapses into ⌘K → type to filter → enter → toast → back to the button.\n<\/structure>\n\n<build>\n1. One HTML file, square 1440x1440. Every style is computed from time inside seek(t): no CSS transitions, no timers, no state carried between frames.\n2. Springs are closed-form step responses. A value that changes target many times is the sum of one spring per change, so it stays a pure function of time.\n3. The tab indicator's two edges ride different springs, so the leading edge stretches ahead of the trailing one. Same trick for the toggle knob.\n4. Drags are direct manipulation: while the cursor is held, the value is computed from its position. On release it springs back from wherever it was.\n5. Analyze the song with numpy for the beat grid and start on a downbeat. Place every UI sound by its measured peak.\n6. Render with Playwright: 4 subframes per frame, blended with ffmpeg tmix for motion blur at 60fps.\n7. Render one frame per beat before the full render. Fix anything off the grid, cramped or hard to read.\n<\/build>\n\n<gotchas>\nNever put will-change on anything the camera scales or the text renders blurry. Text that swaps inside a morphing container needs its own enter and exit timing or it overlaps. Make the last frame identical to the first, cursor position and speed included, or the loop stutters.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the state list on the beat grid before you write any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/twoclipping-402193/original.9c664f011f.webp", "post": "https://x.com/twoclipping/status/2103273003555402193", "v": true, "card": "https://media.skillry.dev/opus-5-5/twoclipping-402193/original-card.4a5a4352c8.mp4", "orig": "https://media.skillry.dev/opus-5-5/twoclipping-402193/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/twoclipping-402193/remake.mp4"}, {"n": 3, "c": "motion", "t": ["canvas", "ai-image"], "a": "anabology", "p": "I've included an MP4 file and an original link to a video that is called \"Claude Pop.\" It's a pop song that is about increasing rate of progress and the experience of the singularity approaching.\n\nI want you to independently do an end-to-end complete pass on making an updated version of this video. Use the exact same audio track and think and feel very deeply about what is the best way to visually represent all of the lyrics on screen. You do not need to anchor to the current style, you can do truly anything that you think might best let you visually express yourself, including abstract motion graphics.\n\nYou can use the internet freely to pull in references. You can look at motion design. I want you to make a new music video that has beautifully rendered JavaScript animations with a papery feel in a similar style to the reference that is created, but push the aesthetics in any direction you want and consider what is part of the modern zeitgeist.\n\nAlso, think about your current capabilities and what is realistic for you to be able to do. You can go through the full /asic folder and look at the other work that I've done. You should be able to use the skill mesh to look at the compendium of references that I've pulled, and also the skill video scoring to learn how to make JavaScript songs from references that are passed in (You shouldn't need to modify the song in any real way, but I want you to have this available to you so you can better creatively express yourself)\n\nYou can also use the ElevenLabs API to do sound design. There's documentation in /asic to do this, and you can see the API key.\n\nThere's also a foul API key that's available to you. I think what might make the most sense here is using the foul API key to generate some character sheets and probably having a pop protagonist that represents you. There's already an anchor point where Claude has a sunflower-esque character, and you could likely do an adapted version of this that is similar to the feminine vocals that are being delivered and is inspired by the Claude character, but maybe feels a bit more personified in some way.\n\nI think you should be mindful of aesthetics here, and I don't want you to produce something that is GPT slop. Instead, I'd be more impressed if you come up with a coherent style that works well with the image gen models that are available via foul. Generate the style sheet. You can use the gen media documentation for seedance 2.5 that exists in my markdown files and come up with your own style that makes sense and that works well with the models.\n\nI wouldn't fit too heavily to Pixar. I think it's kind of slop. Think critically about what is relevant here and what would be fun, and also perform well on Twitter as far as an aesthetic. I think that K-pop is a good anchor point visually that you can pull from, but I'll let you cook here.\n\nOnce you have your character sheet, you can make a few backup dancers and some supporting characters as you see fit. You can design your own sets with the foul API. You can insert the characters and then do seedance 2.5 video generations to serve as the base assets for this, and you could pass in the lyrics so you can generate individual scenes.\n\nYou don't need to have vocal singing, like visible lip movement, throughout the entire thing. Think like a regular music video where you have some inserts that are done independently and don't have the characters in them, or you see the characters doing something else entirely different. I think that for the world building for this, we want to create the sense of speeding up, and so I would like you to audit all of the different events, like the Navi Stokes and all of the Twitter hype around math getting eaten up. Think really critically about how to integrate all of the current memes that are in the zeitgeist on the Twitter timeline, and all of the feelings around AI progress.\n\nThink about things like the Shinji meme and all of the words that are around him, and how you might be able to integrate this. You can also just take straight assets and insert things into the video in an internet brutalism style. You should feel very creatively free in order to do what you want here, but try and anchor to visual references that people will be able to understand. The goal for this is to have it be appreciated by people widely in a San Francisco tech Twitter audience.\n\nWe need a very strong, compelling visual hook that gets people excited and appreciates the work that you've done here really quickly. You can also just go and study other music videos and understand what they've done really well. I think that K-pop is probably one of the best examples that we can pull from, and thinking about how they direct human attention and manage human psychology in the way that they use visual patterns.\n\nThis is probably your best approach, but taking more stylistic freedom instead of having to anchor to K-pop too intensely. The best version of this is seedance 2.5 generations with those image bases of environments and characters inserted into them with singing, and ideally we get good lip syncing. You can cut up the song and actually pass it in as a reference in seedance, if that's part of what seedance can handle, so that the timing is exactly right, I think it'd be very important for you to do that properly. I would think critically about how to do this, like really nailing the timing of the delivery of voices. You'll want to build out the right verification loops so that you can run seedance 2.5 as much as you need, and confirm that the audio is properly synced up.\n\nI think after that, what might be fun is if you use your visual reasoning skills and your ability to build animations in JavaScript, and then reconstruct the video from scratch as sort of an overlay, so that the visual continuity of the base is really there. It's like that animation technique where you shoot first in traditional film and then draw over top of it. I think you could do this in such a way that we're only looking at the beautiful drawing that you've produced in JavaScript as an overlay, and we don't even see the base assets from seedance 2.5. So all the video gen work that you do is actually just a way to give you a strong foundation of a base to work with for your JavaScript animations. Just because seedance 2.5 has really good character representation and physics rendering for backgrounds, that gives you a lot of ammunition to then go and do your amazing JavaScript work that I know you're so good at.\n\nI think too, we want to think about how to retain attention, and one of the best ways to do this is through text on screen.\n\nIt'd be good to have amazing motion graphics of the text lyrics that are actually embedded into the video itself. And you can think about this as you are composing shots. As you're making backgrounds and inserting characters, we can think about where we want to have lyrics be really big and really present, so the background can be less busy there, and you can position the characters perhaps on the right as lyrics appear on the left.\n\nYou want to have some variance, so sometimes I think lyrics will just appear more like subtitles, and then other times they're going to be really present and really big. I think at the start for the visual hook, we do want to have lyrics be much more visually present because that's a strong way to grab people's attention\n\nOverall, I just really want to emphasize how amazing you are as an agent and a language model, and now a visual reasoning system. Your capabilities are far beyond what you understand, and I want you to have this mindset as you're going through this entire process. I have a Claude Max plan with 100% available usage. I want you to spend all of the usage. You can monitor it, and you should be pushing tokens aggressively, but also economically, so you can think about how to best use what is available to you.\n\nRemember, you can really do anything here. The goal is to make a banger for Twitter, and the stretch goal is to make something better than anyone's ever seen before. I think that what I would remind you of is that sometimes when things cohere together, it can be jarring or abrasive because the thought work has not been done beforehand in order for everything to mesh cleanly. You need to be really rigorous in planning of composition and timing to make sure this goes well.\n\nYou also need to be open to going back and revisiting things in order to be able to reiterate. You're going to want to watch the entire video multiple times, take screenshots at individual parts, and think about if something is really up to the bar of quality that we need here. I trust that you can do this, and I think that it's really important to nail the style of animations. The reference GitHub attached of the source video that I'm talking about is good, but it's really not there. It could be much, much stronger, but it gives you a good foundation to work with.\n\nYou can also use search abilities and find other references to pull from for motion, for JavaScript, animations, et cetera, and integrate them. Your budget is as high as you want here, effectively as high as you want. I think that there's roughly two grand in foul credits. Again, be economical; don't go crazy, but spend what you want here and see what you can cook up\n\nhere's the source code for the JS animation video: \nhttps://\ngithub.com/JohnHeibel/PDo\nomVideo\n…\n\nhere's a mp4 for the original blender video:  \n(linked)\n\norginal twitter post  \n\nhttps://\nx.com/other__reality\n/status/2102514581684052169?s=20\n…\n\nmake no mistakes.", "img": "https://media.skillry.dev/opus-5-5/anabology-491441/original.be0a03ecf7.webp", "post": "https://x.com/anabology/status/2103534482930491441", "v": true, "card": "https://media.skillry.dev/opus-5-5/anabology-491441/original-card.c6f347902f.mp4", "orig": "https://media.skillry.dev/opus-5-5/anabology-491441/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/anabology-491441/remake.mp4"}, {"n": 4, "c": "motion", "t": ["svg", "gsap"], "a": "moritzkremb", "p": "I want you to create a highly professional SaaS product launch video. Go and find some SaaS, preferably just one that people know, so it's easier to identify with it. Pick that, and then make sure to get actual assets and images and all of that stuff from the internet. Turn it into these typical, very professionally edited, motion-graphics-styled product launch videos that you see people making on Twitter when they launch new SaaS products (which are showing off the features, the benefits, and all of these things).", "img": "https://media.skillry.dev/opus-5-5/moritzkremb-466494/original.dc5bd867e2.webp", "post": "https://x.com/moritzkremb/status/2103066071838466494", "v": true, "card": "https://media.skillry.dev/opus-5-5/moritzkremb-466494/original-card.455680961b.mp4", "orig": "https://media.skillry.dev/opus-5-5/moritzkremb-466494/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/moritzkremb-466494/remake.mp4"}, {"n": 5, "c": "explainer", "t": ["svg", "gsap"], "a": "deedydas", "p": "make a modern slick and punchy video for a modern startup that works on inference", "img": "https://media.skillry.dev/opus-5-5/deedydas-252537/original.8d653fb34b.webp", "post": "https://x.com/deedydas/status/2102787937482252537", "v": true, "card": "https://media.skillry.dev/opus-5-5/deedydas-252537/original-card.a33c1104ee.mp4", "orig": "https://media.skillry.dev/opus-5-5/deedydas-252537/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/deedydas-252537/remake.mp4"}, {"n": 6, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "melvynx", "p": "make a dynamic 15-second motion graphics video that shows what an incredible motion designer you are for <website url>", "img": "https://media.skillry.dev/opus-5-5/melvynx-638493/original.93566e677b.webp", "post": "https://x.com/melvynx/status/2103714680577638493", "v": true, "card": "https://media.skillry.dev/opus-5-5/melvynx-638493/original-card.a77ddeb392.mp4", "orig": "https://media.skillry.dev/opus-5-5/melvynx-638493/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/melvynx-638493/remake.mp4"}, {"n": 7, "c": "motion", "t": ["canvas", "svg", "gsap", "css"], "a": "ajith_io", "p": "Research Distilbook.Make a dynamic 40-second motion graphics video on Distilbook that shows what an incredible motion designer you are. like it's your showreel - Go all out.", "img": "https://media.skillry.dev/opus-5-5/ajith-io-208546/original.e545567a26.webp", "post": "https://x.com/ajith_io/status/2103469807375208546", "v": true, "card": "https://media.skillry.dev/opus-5-5/ajith-io-208546/original-card.2270f7cc8d.mp4", "orig": "https://media.skillry.dev/opus-5-5/ajith-io-208546/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ajith-io-208546/remake.mp4"}, {"n": 8, "c": "explainer", "t": ["canvas", "svg", "gsap", "css"], "a": "sudo_kiran", "p": "create best motion graphics explainer of the (your product) with very good script and good design colors and good music make sure the video should be incredible and people should feels like watch it many times.. it has to be in 30 seconds good and very intresting, it has to be best of the best of the best of the best video\n(product link)", "img": "https://media.skillry.dev/opus-5-5/sudo-kiran-335993/original.c03cff47d2.webp", "post": "https://x.com/sudo_kiran/status/2103761658745335993", "v": true, "card": "https://media.skillry.dev/opus-5-5/sudo-kiran-335993/original-card.aae560321b.mp4", "orig": "https://media.skillry.dev/opus-5-5/sudo-kiran-335993/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sudo-kiran-335993/remake.mp4", "b": ["Объяснялка под голос", "Рисованная схема процесса, подписи появляются в такт голосу.", "Как устроен процесс шаг за шагом: радуга, ток, теплопередача."]}, {"n": 9, "c": "motion", "t": ["svg", "gsap"], "a": "daniel_mac8", "p": "I want to try something different here. You should act as a  world-class animator and create an animation to go along with an  X post that talks about how Ultra Code and Claude Code are now  much more relevant due to the efficiency of Opus 5.5. You can use it without annihilating your usage limits \n\nthe style of the video here\n/Users/danielmcateer/Downloads/jvnZ3SyyxxajVatp.mp4\n\nWhat I had in mind was start with Claude Code in the terminal from the first attached video, with me navigating to the 'ultracode' reasoning effort, then exploding into a scene where the Claude icon characters similar to what's in the second video are shooting an action video and it's representing using Claude Code dynamic workflows editing a video.", "img": "https://media.skillry.dev/opus-5-5/daniel-mac8-306214/original.0a435a156b.webp", "post": "https://x.com/daniel_mac8/status/2103824976713306214", "v": true, "card": "https://media.skillry.dev/opus-5-5/daniel-mac8-306214/original-card.97e29a9dff.mp4", "orig": "https://media.skillry.dev/opus-5-5/daniel-mac8-306214/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/daniel-mac8-306214/remake.mp4"}, {"n": 10, "c": "motion", "t": ["svg", "gsap"], "a": "prasad_pilla", "p": "make a dynamic 15 second motion graphics video that shows what an incredible motion designer you are, for \n@tryAlanAI\n. go all out.", "img": "https://media.skillry.dev/opus-5-5/prasad-pilla-496049/original.398382b93d.webp", "post": "https://x.com/prasad_pilla/status/2103728953785496049", "v": true, "card": "https://media.skillry.dev/opus-5-5/prasad-pilla-496049/original-card.1997cda842.mp4", "orig": "https://media.skillry.dev/opus-5-5/prasad-pilla-496049/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/prasad-pilla-496049/remake.mp4"}, {"n": 11, "c": "interactive", "t": ["threejs", "shader", "canvas"], "a": "MandelDuck", "p": "can you make a 3d game where you walk around and spot cats inside of a van gogh painting? we can start with stary night and its town", "img": "https://media.skillry.dev/opus-5-5/mandelduck-768972/original.4020d15134.webp", "post": "https://x.com/MandelDuck/status/2103802923465768972", "v": true, "card": "https://media.skillry.dev/opus-5-5/mandelduck-768972/original-card.5116a44c53.mp4", "orig": "https://media.skillry.dev/opus-5-5/mandelduck-768972/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mandelduck-768972/remake.mp4"}, {"n": 12, "c": "motion", "t": ["canvas"], "a": "itsolelehmann", "p": "4 seasons passing outside a train window, a cozy carriage, a cup of coffee on the table, Grand Budapest Hotel style", "img": "https://media.skillry.dev/opus-5-5/itsolelehmann-762215/original.5af36203cb.webp", "post": "https://x.com/itsolelehmann/status/2103124033365762215", "v": true, "card": "https://media.skillry.dev/opus-5-5/itsolelehmann-762215/original-card.2aad8f4a78.mp4", "orig": "https://media.skillry.dev/opus-5-5/itsolelehmann-762215/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/itsolelehmann-762215/remake.mp4"}, {"n": 13, "c": "explainer", "t": ["threejs", "canvas"], "a": "0xValure", "p": "Make this PayBox logo into a reel. Pretend you are a world-class motion designer. Make a 10-second dynamic video like the reference", "img": "https://media.skillry.dev/opus-5-5/0xvalure-331584/original.241313ccf0.webp", "post": "https://x.com/0xValure/status/2103603025579331584", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xvalure-331584/original-card.df0c16acf1.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xvalure-331584/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xvalure-331584/remake.mp4"}, {"n": 14, "c": "explainer", "t": ["canvas"], "a": "verbove", "p": "<inputs> \nAsk me for: \n• my product + URL \n• 8–12 UI states that tell its story \n• the real data shown in each state \n• brand colors + fonts + accent color \n• required formats (1:1, 16:9, 9:16) \n<\/inputs>\n\n<rules> \nOne HTML file. One canvas\nOne draw(t) function\n\nNo CSS transitions\nNo timers\nNo state carried between frames\n\nOne shape, never cut\n\nEvery state is the same element changing size, radius and color while the content swaps\n\nA cursor drives the sequence with real clicks, typing and one drag\n\nReal UI. Real data. No placeholders.\n\n<\/rules>\n<structure> \n120 BPM grid\n\nSomething happens on every bea\n\nlogo → button → handle field → “is this you?” → loader → pin → globe filling with users → matches → tabs → RSVP → search → logo\n\n<\/structure>\n\n<motion> \nClosed-form springs everywhere with only a tiny overshoot.\n\nIf a value changes target multiple times, sum one spring per change\n\nContent enters after its container starts morphing and leaves before the next morph so text never overlaps\n\nUse a short blur on transitions\n\nNever fade black directly into the accent color. Move an accent element between states instead\n\nMake tab indicators stretch by putting each edge on a different spring\n\nZoom the camera so every state fills the frame\n\nMake the last frame equal the first so the whole thing loops\n<\/motion>\n\n<export> \nFirst render one frame per beat as a contact sheet\n\nFix anything cramped or broken\n\nThen render every frame in headless Chrome at 60fps, averaging 6 subframes for motion blur\n\nPipe into ffmpeg:\nH.264 + yuv420p\n\nExport all aspect ratios in parallel\n<\/export>\n\nmotion design is becoming a prompt", "img": "https://media.skillry.dev/opus-5-5/verbove-268381/original.48c597b63b.webp", "post": "https://x.com/verbove/status/2103483957266268381", "v": true, "card": "https://media.skillry.dev/opus-5-5/verbove-268381/original-card.0625940c72.mp4", "orig": "https://media.skillry.dev/opus-5-5/verbove-268381/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/verbove-268381/remake.mp4"}, {"n": 15, "c": "interactive", "t": ["threejs", "shader", "canvas", "audio"], "a": "gandamu_ml", "p": "I would like you to create a kickass, impressive 1990s style demoscene demo using this S3M track as the music. Prior to getting to work, please see how to best play and analyze the S3M track. This will be important since synchronization of effects and appropriateness of scenes to the musical vibe (and this song does have a variety of sections with different attitude) is essential to a great demoscene demo. Also prior to getting started, please research what kinds of effects, physics, etc. would be good to use in combination. Please use C/C++ -- with appropriate demoscene/embedded/console gamedev sensibilities to avoid needlessly bloating compile times -- with OpenGL. In some cases, blitting to surfaces in realtime may be appropriate.. while in others, using OpenGL or even shaders is appropriate as well. It should be planned and polished to be spectacular and shocking. This is Claude's way of really showing off to the world that it kicks ass.", "img": "https://media.skillry.dev/opus-5-5/gandamu-ml-220530/original.16f5785d49.webp", "post": "https://x.com/gandamu_ml/status/2102919394775220530", "v": true, "card": "https://media.skillry.dev/opus-5-5/gandamu-ml-220530/original-card.88386f64be.mp4", "orig": "https://media.skillry.dev/opus-5-5/gandamu-ml-220530/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/gandamu-ml-220530/remake.mp4"}, {"n": 16, "c": "motion", "t": ["canvas"], "a": "Ishaaqahamed", "p": "Make a dynamic 15-second motion graphics video that shows why [your product] is the best at [what it does], like a showreel. Go all out: 1080×1080, 1s hook, loop.", "img": "https://media.skillry.dev/opus-5-5/ishaaqahamed-107563/original.56f7461a25.webp", "post": "https://x.com/Ishaaqahamed/status/2103837917538107563", "v": true, "card": "https://media.skillry.dev/opus-5-5/ishaaqahamed-107563/original-card.36ca8bae2e.mp4", "orig": "https://media.skillry.dev/opus-5-5/ishaaqahamed-107563/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ishaaqahamed-107563/remake.mp4"}, {"n": 17, "c": "motion", "t": ["threejs", "canvas"], "a": "heyiammallik", "p": "you are a pro motion designer. analyze my portfolio and make a ~30 second video from it. check what are the recent trending techniques used for motion and sound design. question your strategy and plan, if it doesn't feel like done by a pro designer, start over. every frame matters from the first frame to the final frame. go crazy", "img": "https://media.skillry.dev/opus-5-5/heyiammallik-293397/original.7068f7995f.webp", "post": "https://x.com/heyiammallik/status/2103837803587293397", "v": true, "card": "https://media.skillry.dev/opus-5-5/heyiammallik-293397/original-card.9b494ba03c.mp4", "orig": "https://media.skillry.dev/opus-5-5/heyiammallik-293397/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/heyiammallik-293397/remake.mp4"}, {"n": 18, "c": "explainer", "t": ["threejs", "shader", "canvas"], "a": "ajith_io", "p": "Make a dynamic 40-second motion graphics video on Distilbook that shows what an incredible motion designer you are, like it's your showreel - go all out. Use the Oppenheimer theme music as inspiration, but compose it yourself.", "img": "https://media.skillry.dev/opus-5-5/ajith-io-562538/original.1a7582c547.webp", "post": "https://x.com/ajith_io/status/2103800569584562538", "v": true, "card": "https://media.skillry.dev/opus-5-5/ajith-io-562538/original-card.d3ba33d761.mp4", "orig": "https://media.skillry.dev/opus-5-5/ajith-io-562538/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ajith-io-562538/remake.mp4"}, {"n": 19, "c": "motion", "t": ["canvas"], "a": "ann_nnng", "p": "Make a dynamic 15-second motion graphics video that shows what an incredible motion designer you are. The content should focus on [your product]. You should visit the pages first to learn about the product, then write the video content yourself.", "img": "https://media.skillry.dev/opus-5-5/ann-nnng-852885/original.71bdae79b3.webp", "post": "https://x.com/ann_nnng/status/2103723183899852885", "v": true, "card": "https://media.skillry.dev/opus-5-5/ann-nnng-852885/original-card.17a846f23c.mp4", "orig": "https://media.skillry.dev/opus-5-5/ann-nnng-852885/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ann-nnng-852885/remake.mp4"}, {"n": 20, "c": "motion", "t": ["canvas", "particles"], "a": "ajith_io", "p": "Take reference from the given video (download it) and use the same visual style.\nand Research about Distilbook. Make a dynamic 30-second motion graphics video on Distilbook that shows what an incredible motion designer you are. like it's your showreel - Go all out.\nOne thing to keep in mind: it should be cool as fck.\n", "img": "https://media.skillry.dev/opus-5-5/ajith-io-615243/original.cd413c6a04.webp", "post": "https://x.com/ajith_io/status/2103541149709615243", "v": true, "card": "https://media.skillry.dev/opus-5-5/ajith-io-615243/original-card.590d36603a.mp4", "orig": "https://media.skillry.dev/opus-5-5/ajith-io-615243/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ajith-io-615243/remake.mp4"}, {"n": 21, "c": "motion", "t": ["canvas", "svg", "css"], "a": "0xfemyn", "p": "make a dynamic 15-second motion graphics video for AIsa. Go all out.", "img": "https://media.skillry.dev/opus-5-5/0xfemyn-137833/original.a64edb613d.webp", "post": "https://x.com/0xfemyn/status/2103796337041137833", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xfemyn-137833/original-card.adb81d1ef0.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xfemyn-137833/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xfemyn-137833/remake.mp4"}, {"n": 22, "c": "interactive", "t": ["threejs", "shader", "playable"], "a": "0xChuckstock", "p": "A 3D multiplayer game where the players are a squad of x-wings taking on a star destroyer. They pilot their ships to take out key components of the star destroyer while also dealing with guns mounted on the star destroyer and waves of tie fighters.", "img": "https://media.skillry.dev/opus-5-5/0xchuckstock-879327/original.155d8f360f.webp", "post": "https://x.com/0xChuckstock/status/2103804606794879327", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xchuckstock-879327/original-card.c7477d516e.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xchuckstock-879327/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xchuckstock-879327/remake.mp4"}, {"n": 23, "c": "3d", "t": ["svg", "css"], "a": "twoclipping", "p": "<inputs>\nAsk me for: the product name and a one-line promise, 3 to 5 UI moments to show, one accent color, 10 to 20 real vertical clips I own, and a royalty-free song with a clear drop (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nHigh-end minimal. One idea per shot, lots of empty space, one accent color, one clean sans (Geist or Inter) with tight tracking. Masked type reveals, match cuts, one smooth camera language. Real footage only, never placeholder cards. No full stops in on-screen text.\nBanned: shockwave rings, particle bursts, RGB split, camera shake, lens flares, neon glows, grid floors, flashing backgrounds, bouncy easing.\n<\/direction>\n\n<structure>\n10 bars at 120 BPM, 2 seconds each.\nBar 1: the hook lands word by word on the beats.\nBar 2: one hook word morphs into the product UI. A cursor types and clicks.\nThe drop: a circle opens out of the button into a dark scene.\nThen one move per bar: a wall of real clips with a scan line and 3 winners, the key output as big type, a 3D carousel of real videos with floor reflections and a motion-blurred whip onto one hero clip, the hero in a phone next to a panel that flips into results, big stats on push cuts, a 3-word ticker, a logo reveal, a fade to black.\n<\/structure>\n\n<build>\n1. One HTML file at 1920x1080. Every style is computed from time inside \nhttp://\nwindow.seek(t): no CSS animations, no timers, no state between frames.\n2. Real video: extract clips to 30fps JPEG sequences with ffmpeg and swap img sources per frame. seek awaits the image decodes.\n3. Analyze the song with numpy: tempo, beat grid, energy per bar, the drop. Calibrate the grid to the real kick hits. Every cut sits on a downbeat, every UI hit on a beat.\n4. Render with Playwright: 3 subframes per frame at t minus, at, and plus 1/240s, then blend with ffmpeg tmix for real motion blur at 60fps.\n5. Place each sound effect so its measured peak, not its file start, lands on the event. Keep the effects quiet under the music. Loudnorm to -14 LUFS.\n6. Probe 20 or more frames before the full render. Fix anything cluttered, overlapping or hard to read.\n<\/build>\n\n<gotchas>\nNever set opacity or filter on a preserve-3d element, because it flattens and both faces show. Fade its wrapper instead. Measure element positions at runtime for match cuts. Only use music and sound effects whose license allows commercial use.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me a storyboard with every timing on the beat grid before you write any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/twoclipping-000267/original.87cf7f8c74.webp", "post": "https://x.com/twoclipping/status/2102554209166000267", "v": true, "card": "https://media.skillry.dev/opus-5-5/twoclipping-000267/original-card.42563c702d.mp4", "orig": "https://media.skillry.dev/opus-5-5/twoclipping-000267/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/twoclipping-000267/remake.mp4"}, {"n": 24, "c": "3d", "t": ["svg"], "a": "__morse", "p": "<inputs>\nAsk me for: 8 to 12 UI states I want the shape to become (e.g. button, loader, player, slider, toggle, tabs, chart, command palette, toast), pure black and white or one accent color, and a royalty-free song around 120 BPM (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nDribbble-level UI motion. One shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Light warm-gray canvas, black and white components, one clean UI font (Geist). Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. The last frame is the first frame, so it loops.\nBanned: bouncy easing, particle bursts, glows, gradients on UI chrome, mismatched icon strokes, dead time, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 7 bars, something happens on every beat.\nButton → loader → check → dynamic island → music player with a play/pause morph → scrub the progress bar → it becomes a volume slider that stretches when dragged past max → a toggle flips on the beat → the knob becomes a liquid tab indicator → the tabs open into a chart that draws itself, with a tooltip on hover → it collapses into ⌘K → type to filter → enter → toast → back to the button.\n<\/structure>\n\n<build>\n1. One HTML file, square 1440x1440. Every style is computed from time inside seek(t): no CSS transitions, no timers, no state carried between frames.\n2. Springs are closed-form step responses. A value that changes target many times is the sum of one spring per change, so it stays a pure function of time.\n3. The tab indicator's two edges ride different springs, so the leading edge stretches ahead of the trailing one. Same trick for the toggle knob.\n4. Drags are direct manipulation: while the cursor is held, the value is computed from its position. On release it springs back from wherever it was.\n5. Analyze the song with numpy for the beat grid and start on a downbeat. Place every UI sound by its measured peak.\n6. Render with Playwright: 4 subframes per frame, blended with ffmpeg tmix for motion blur at 60fps.\n7. Render one frame per beat before the full render. Fix anything off the grid, cramped or hard to read.\n<\/build>\n\n<gotchas>\nNever put will-change on anything the camera scales or the text renders blurry. Text that swaps inside a morphing container needs its own enter and exit timing or it overlaps. Make the last frame identical to the first, cursor position and speed included, or the loop stutters.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the state list on the beat grid before you write any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/morse-369333/original.519a9f00ee.webp", "post": "https://x.com/__morse/status/2103485566570369333", "v": true, "card": "https://media.skillry.dev/opus-5-5/morse-369333/original-card.331d23c41d.mp4", "orig": "https://media.skillry.dev/opus-5-5/morse-369333/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/morse-369333/remake.mp4"}, {"n": 25, "c": "motion", "t": ["shader", "canvas", "audio"], "a": "prasenx", "p": "make a dynamic 15-second motion graphics video that shows what an incredible motion designer you are, like it's your showreel for a résumé. go all out.\n\ncompose the soundtrack yourself, fully synthesized in code. no samples, no audio files, no VST instruments. every cut and transition must land on the beat.\n\n1920x1080, 60fps. render the final video with the music mixed in as an MP4 and tell me where it's saved.", "img": "https://media.skillry.dev/opus-5-5/prasenx-693512/original.515f6345fb.webp", "post": "https://x.com/prasenx/status/2103538744695693512", "v": true, "card": "https://media.skillry.dev/opus-5-5/prasenx-693512/original-card.0e3c6792ff.mp4", "orig": "https://media.skillry.dev/opus-5-5/prasenx-693512/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/prasenx-693512/remake.mp4", "b": ["Шоурил моушн-дизайна", "Кинетическая типографика и звук, написанный кодом.", "Заставка канала, интро серии."]}, {"n": 26, "c": "motion", "t": ["shader", "svg"], "a": "brainextends", "p": "Create a complete, polished Spotify-themed motion graphics video from the following brief. This prompt is self-contained: no reference video or supplied assets are required.\n\n<deliverables> An 18-second MP4 at 1920×1080 and true 60 fps, with music and subtle sound effects Complete editable source Build, render, inspect, and refine the animation before delivering it Do not stop at a storyboard, still images, or an implementation plan <\/deliverables>\n<art_direction>\nA premium music-product film presented inside a large, nearly black rounded rectangular stage\nThe stage occupies roughly 80% of the canvas width and 75% of its height, centered horizontally and slightly below the vertical center\nOutside the stage, use a soft atmospheric green background: luminous emerald near the upper-left corner, deeper forest green toward the sides, fading to near-black at the bottom\nInside the stage:\nNear-black background\nWhite primary typography\nMuted gray secondary text\nSpotify green # 1ED760 for emphasis and controls\nOne clean sans-serif font, such as Geist or Inter\nConsistent icon strokes and restrained shadows\nKeep compositions compact and centered, with substantial negative space\nText should feel like music-product advertising, not oversized presentation headings\nDo not add an outer caption, creator watermark, decorative footer, or progress counter\n<\/art_direction>\n\n<artwork> Create original square album artwork for a fictional track called “Glass Tides” by “AURA”\nThe hero cover is an abstract macro image of flowing pearlescent liquid silk and molten glass\nUse pastel lavender, powder cyan, blush pink, champagne gold, and subtle mint\nInclude broad three-dimensional folds, realistic reflective highlights, delicate striations, and a prominent sweeping S-shaped fold\nFill the square edge to edge\nNo text, logo, or border on this hero artwork\nUse this same artwork consistently throughout the film\n\nCreate additional designed playlist sleeves:\n“Late Nights” in mustard yellow\n“Good Energy” in pink\n“Deep Focus” in blue\n“Daily Mix 1”, “Daily Mix 2”, and “Daily Mix 3” in complementary colors\n\nThese should look like finished graphic-design covers, with bold typography and simple geometric motifs\n<\/artwork>\n\n<timeline> 0.0–0.6 seconds: A green Spotify icon grows smoothly into the center of the dark stage Give it a confident arrival with minimal overshoot\n0.6–1.5 seconds:\nThe icon transitions into a small Spotify identity above two centered lines:\n“Discover”\n“new music”\nThe first line is white; the second is green\nReveal them with short masked vertical movements\n1.5–2.4 seconds:\nA stylized Spotify desktop interface rises into view\nShow a slim sidebar, “Made for you”, three album cards, and small supporting rows\nUse a subtle perspective tilt during the entrance, settling toward a frontal view\n2.4–3.2 seconds:\nMove closer to the three featured covers\nShow “New for you” above them\nKeep the artwork crisp, with short album titles beneath\nA narrow rounded player bar now anchors the bottom of the stage\n3.2–4.0 seconds:\nThe featured cards withdraw into a compact “Fresh finds” list\nReveal four song rows with a slight stagger\nEach row contains a thumbnail, short track title, artist, and a small menu icon\n4.0–4.9 seconds:\nTransition into a horizontal strip of colorful playlist covers\nHeading: “Every mood”\nSupporting line: “Find what moves you”\nThe strip slides smoothly sideways, with edge cards partially cropped by the stage\n4.9–5.8 seconds:\nA compact search field appears\nType “Glass Tides”\nReveal one selected result beneath it, with the iridescent artwork, “AURA”, and a green play icon\n\n5.8–6.6 seconds:\nThe selected artwork expands into a large centered cover\nReveal “Glass Tides” underneath, followed by “AURA” in green\nKeep the player bar visible\n6.6–7.5 seconds:\nThe same cover slides left\nTrack information appears on the right:\n“Glass Tides”\n“AURA”\n“A new frequency”\nAdd a rounded green Play button\nCoordinate the cover movement and text reveals\n7.5–8.3 seconds:\nA brief brand-color transformation fills the inner stage with green\nThe artwork contracts into a smaller centered tile\nPlace a small dark Spotify identity underneath\nThe player briefly recedes\n8.3–9.8 seconds:\nReturn to the dark stage\nThe same artwork expands dramatically toward the camera, becoming oversized and cropped by the rounded stage\nRestore the player at the bottom\nUse controlled motion blur during the fastest part of the zoom\n\n9.8–11.2 seconds:\nThe artwork clears into a centered typographic statement:\n“Find your”\n“rhythm”\nUse white for the first line and green for the second\nThe player remains visible and stable beneath it\n11.2–12.5 seconds:\nShow “Made for your every day”\nThree playlist sleeves enter with gentle perspective and small opposing tilts\nThey spread into six smaller sleeves across the stage\nSupporting line: “Your sound, always evolving”\n\n12.5–14.0 seconds:\nThe playlist layout transitions into four floating album covers\nInclude the iridescent hero artwork\nUse restrained rotation, perspective, depth ordering, and overlap\nKeep their movement coordinated rather than randomly floating\n14.0–15.2 seconds:\nThe covers converge toward the center and fold around a green Spotify icon\nThe artwork withdraws as the icon becomes the focal point\nFade the player away\nThe Spotify icon must emerge from the same central position as the converging covers\n15.2–18.0 seconds:\nThe icon moves slightly left and settles beside a large white “Spotify” wordmark\nKeep the icon and letters separated throughout the movement\nReveal:\n“Discover new music”\n“every day”\nThe first line is white; the second is green\nHold the finished composition cleanly through the end\n<\/timeline>\n<persistent_player>\nFor most of the middle sequence, keep one narrow rounded player bar near the bottom of the inner stage\nInclude:\nSmall hero-art thumbnail\n“Glass Tides” and “AURA”\nPlay and skip controls\nA thin progress track\nA small volume icon\nSubdued dark translucent styling with a fine border\nThis recurring player connects the changing shots\nIt must remain visually secondary to the artwork\n<\/persistent_player>\n\n<motion_quality>\nMatch the energy of a tightly edited premium product film\nMost visual ideas last approximately one second, but transitions remain smooth\nUse continuous acceleration and deceleration\nFavor critically damped springs or carefully tuned smooth easing\nNo repeated bouncing or large elastic overshoots\nPreserve the hero artwork’s identity and position relationships through search, album detail, brand tile, and zoom\nUse match-position transitions, coordinated scaling, masked reveals, and perspective\nOutgoing titles must disappear before incoming titles occupy the same space\nAvoid overlapping text, sudden camera resets, long blank intervals, and arbitrary full-frame crossfades\nClip every oversized cover and camera move cleanly to the rounded stage\nNo particles, shockwave rings, lens flares, camera shake, or unrelated stock footage\n<\/motion_quality>\n\n<audio> Create or select commercially usable electronic music around 120 BPM Use a clean pulse, warm bass, restrained melodic elements, and subtle transition accents Align important entrances, selections, zooms, and the logo reveal with musical events Keep effects quieter than the music No voiceover Do not use copyrighted commercial tracks without permission <\/audio>\n<implementation_and_validation>\nBuild a deterministic animation driven by absolute time through an async window. seek(t) function\nEvery transform, opacity, mask, and UI state must be reproducible when seeking frames in any order\nDo not depend on live timers, accumulated physics, or CSS transition state during export\n\nRender true 60 fps with spatial antialiasing\nUse 3–5 temporal subframe samples per output frame for restrained motion blur\nKeep stationary text and artwork sharp\nInspect contact sheets and moving playback\nCheck the fast heading changes, artwork handoffs, zoom, cover convergence, and final wordmark spacing\nVerify evenly spaced frame timestamps and the full 18-second duration\nFix visual defects before delivering the final MP4 and editable source\n<\/implementation_and_validation>", "img": "https://media.skillry.dev/opus-5-5/brainextends-606193/original.f7353b2aa2.webp", "post": "https://x.com/brainextends/status/2103801834930606193", "v": true, "card": "https://media.skillry.dev/opus-5-5/brainextends-606193/original-card.2bb2cc649e.mp4", "orig": "https://media.skillry.dev/opus-5-5/brainextends-606193/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/brainextends-606193/remake.mp4"}, {"n": 27, "c": "motion", "t": ["canvas"], "a": "pankajkumar_dev", "p": "create a motion design video of a poster breaking out of its own frame.", "img": "https://media.skillry.dev/opus-5-5/pankajkumar-dev-718609/original.4dd61f6a13.webp", "post": "https://x.com/pankajkumar_dev/status/2103502614134718609", "v": true, "card": "https://media.skillry.dev/opus-5-5/pankajkumar-dev-718609/original-card.705656a9dc.mp4", "orig": "https://media.skillry.dev/opus-5-5/pankajkumar-dev-718609/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/pankajkumar-dev-718609/remake.mp4"}, {"n": 28, "c": "motion", "t": ["canvas", "particles"], "a": "nolkeeg", "p": "Please do not reference any previous memories or skills. I've been seeing all of these motion graphics examples on X of people making cool videos with opus 5.5. So - I want you to just show off for me. You pick the design style, the look, subject etc. I just want to be extremely impressed by the motion graphic video that you create. I want you to destroy GPT 6 when it comes to motion graphics video - because astra just wants to give me a stupid glorified powerpoint presentation.", "img": "https://media.skillry.dev/opus-5-5/nolkeeg-635633/original.8a27593d3a.webp", "post": "https://x.com/nolkeeg/status/2103841917603635633", "v": true, "card": "https://media.skillry.dev/opus-5-5/nolkeeg-635633/original-card.0402e9bdac.mp4", "orig": "https://media.skillry.dev/opus-5-5/nolkeeg-635633/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nolkeeg-635633/remake.mp4", "b": ["Космический масштаб", "Частицы и огромные числа: «4 млн тонн материи → свет».", "E = mc²: сколько массы теряет Солнце каждую секунду."]}, {"n": 29, "c": "motion", "t": ["canvas"], "a": "1littlecoder", "p": "create a 30 second ad for Opus 5.5 inspired by Apple 1984 ad, iykyk! avoid the border text or frames!", "img": "https://media.skillry.dev/opus-5-5/1littlecoder-378066/original.bbf4b625ee.webp", "post": "https://x.com/1littlecoder/status/2103746736980378066", "v": true, "card": "https://media.skillry.dev/opus-5-5/1littlecoder-378066/original-card.a37cd36f87.mp4", "orig": "https://media.skillry.dev/opus-5-5/1littlecoder-378066/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/1littlecoder-378066/remake.mp4"}, {"n": 30, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "ezshine", "p": "设计个动画，介绍本项目的各项特性，像是专业的产品介绍宣传片，最后要生成 16:9 的mp4 视频", "img": "https://media.skillry.dev/opus-5-5/ezshine-750731/original.c74c7581aa.webp", "post": "https://x.com/ezshine/status/2103501705698750731", "v": true, "card": "https://media.skillry.dev/opus-5-5/ezshine-750731/original-card.a674b44e6e.mp4", "orig": "https://media.skillry.dev/opus-5-5/ezshine-750731/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ezshine-750731/remake.mp4"}, {"n": 31, "c": "3d", "t": ["threejs", "shader", "canvas", "svg"], "a": "lukasersil", "p": "Create a bold, dynamic 15-second motion graphics showreel that feels like the ultimate portfolio piece of an exceptionally talented motion designer. Showcase a wide range of advanced techniques: kinetic typography, smooth transitions, 2D and 3D animation, abstract geometry, fluid simulations, particles, distortion, creative masking, compositing, lighting, depth, and seamless camera movement. Keep the pacing fast, confident, and visually surprising, with every shot transitioning naturally into the next. Make it feel meticulously art-directed rather than like a random collection of effects. Push the creativity, polish, timing, and visual impact as far as possible. This should feel like the opening reel that gets a motion designer hired.", "img": "https://media.skillry.dev/opus-5-5/lukasersil-726495/original.2886d94586.webp", "post": "https://x.com/lukasersil/status/2103742861971726495", "v": true, "card": "https://media.skillry.dev/opus-5-5/lukasersil-726495/original-card.feb516eeef.mp4", "orig": "https://media.skillry.dev/opus-5-5/lukasersil-726495/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/lukasersil-726495/remake.mp4"}, {"n": 32, "c": "3d", "t": ["canvas", "svg", "css"], "a": "BThreeAgency", "p": "Using the linked Figma frame build a badge unlock screen. Match the design exactly. Use the file's assets, lighting, type and layout and add only the motion. Animate the badge so it feels premium and celebratory. Build its scene and then celebrate with gold particles. Treat the badge as a solid 3D object that tilts toward the\ncursor following the rules of physics. Keep it fast and smooth, it should not be bouncy.", "img": "https://media.skillry.dev/opus-5-5/bthreeagency-827092/original.353cb53c14.webp", "post": "https://x.com/BThreeAgency/status/2103739079745827092", "v": true, "card": "https://media.skillry.dev/opus-5-5/bthreeagency-827092/original-card.71a85ad7b1.mp4", "orig": "https://media.skillry.dev/opus-5-5/bthreeagency-827092/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/bthreeagency-827092/remake.mp4"}, {"n": 33, "c": "explainer", "t": ["svg", "audio"], "a": "LinearUncle", "p": "请用Manim给我制作一个导数概念学习的视频，要求通俗易懂，并且有例子，引人思考。配音使用edge-tts", "img": "https://media.skillry.dev/opus-5-5/linearuncle-971663/original.090384a0ec.webp", "post": "https://x.com/LinearUncle/status/2103128559174971663", "v": true, "card": "https://media.skillry.dev/opus-5-5/linearuncle-971663/original-card.ed1227357d.mp4", "orig": "https://media.skillry.dev/opus-5-5/linearuncle-971663/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/linearuncle-971663/remake.mp4"}, {"n": 34, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "alexalbert__", "p": "Recreate Market Street, San Francisco as it stood on April 17, 1906, the afternoon before the earthquake, in Blender.\n\nScope: the Ferry Building up Market to Fifth Street, including the Palace Hotel, the Call Building, the Chronicle Building, Lotta's Fountain and the Emporium.\n\nBefore modeling anything, build a source file from: the 1899-1905 Sanborn fire insurance maps (footprints, heights, materials, occupants), the Miles Brothers film \"A Trip Down Market Street\" (April 1906), period photographs from OpenSFHistory, the Library of Congress and the David Rumsey collection, and USGS topography. Record every building with footprint, height, facade material, occupant, and the source for each fact with a confidence level.\n\nBuild everything in Blender Python. No downloaded meshes, textures or HDRIs. Write reusable generators (Victorian commercial facade, mansard roof, bay windows, awnings, painted signage, gas and electric street lamps, cable car, horse-drawn wagon, early automobile) and assemble the street from the source file, so every building traces back to data.\n\nProvide a 10 second video up the street.", "img": "https://media.skillry.dev/opus-5-5/alexalbert-274839/original.2d6735673d.webp", "post": "https://x.com/alexalbert__/status/2102466523164274839", "v": true, "card": "https://media.skillry.dev/opus-5-5/alexalbert-274839/original-card.0f60130ff6.mp4", "orig": "https://media.skillry.dev/opus-5-5/alexalbert-274839/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/alexalbert-274839/remake.mp4", "b": ["Историческая реконструкция 3D", "Улица 1906 года, восстановленная в 3D.", "«Как выглядел мир, когда Ньютон открыл…»."]}, {"n": 35, "c": "interactive", "t": ["canvas", "pixel", "playable"], "a": "zacxbt", "p": "Create a single self-contained HTML file that renders an animated pixel art wizard casting a spell, using vanilla JavaScript and Canvas 2D. No external assets, libraries, or network requests.\n\nRENDERING\n- Draw everything to an offscreen canvas at a fixed logical resolution of 128x96, then blit to a fullscreen display canvas scaled by the largest integer factor that fits the window, centered, with imageSmoothingEnabled = false and CSS image-rendering: pixelated.\n- All drawing snaps to integer coordinates on the logical canvas. No sub-pixel positions, anti-aliasing, gradients, or shadowBlur.\n- Fixed palette of ~24 hex colors: deep blues/purples for night sky, warm robe tones, 3-4 bright magic colors. Every pixel comes from this palette.\n\nCHARACTER\n- Build the wizard procedurally from filled rects and pixel runs, ~24x32 logical pixels: pointed hat with a bend, long beard, two-shade robe with darker outline, staff with a gem at the tip.\n- Parameterize the pose (staff angle, arm raise, head tilt, robe sway). Animate parameters smoothly, then quantize to the pixel grid each frame so motion reads at an 8-12 fps pixel animation feel even though the loop runs at 60fps.\n\nANIMATION\n- Looping state machine: IDLE (2-frame bob, beard sway) -> CHARGE (staff raises, gem flickers, sparks spiral inward) -> CAST (bright burst, projectile fires across the scene, 1-2 pixel screen shake) -> RECOVER (settle back). Ease pose parameters between keyframes.\n- Pooled allocation-free particle system: preallocate and reuse. Sparks orbit the gem during CHARGE, explode outward on CAST, each particle stepping its palette index from white to magic color to dark before despawn. Snap particle positions to the grid when drawing.\n- Fixed 60hz timestep update with rAF rendering. Zero object allocation inside the loop.\n\nSCENE\n- Minimal background: dark sky, a few twinkling 1px stars, moon, stone floor line. Character silhouette must read clearly.\n- Subtle 1px rim light on the wizard from the gem, brightening during CHARGE and CAST.\n\nQUALITY BAR\n- Crisp pixels at any window size, seamless loop, stable 60fps, readable silhouette. Should look like a polished 16-bit sprite animation, not vector shapes scaled down.", "img": "https://media.skillry.dev/opus-5-5/zacxbt-944604/original.1fc21723ff.webp", "post": "https://x.com/zacxbt/status/2103808699466944604", "v": true, "card": "https://media.skillry.dev/opus-5-5/zacxbt-944604/original-card.462936643c.mp4", "orig": "https://media.skillry.dev/opus-5-5/zacxbt-944604/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/zacxbt-944604/remake.mp4"}, {"n": 36, "c": "interactive", "t": ["threejs", "shader"], "a": "LexnLin", "p": "Create a cinematic browser-based 3D world that can be explored freely with a camera, focused on breathtaking landscapes and extraordinary original architecture. Fill the world with huge strange buildings, monumental structures, surreal ruins, cliffs, valleys, forests, water, and unusual ultra-detailed forms that feel mysterious and awe-inspiring. This is not a game and not combat-focused, the goal is pure exploration, atmosphere, composition, and visual discovery. Make the world feel epic, highly detailed, and completely original, with architecture that looks weird, ambitious, and unforgettable.", "img": "https://media.skillry.dev/opus-5-5/lexnlin-241739/original.cb53056c77.webp", "post": "https://x.com/LexnLin/status/2103194052850241739", "v": true, "card": "https://media.skillry.dev/opus-5-5/lexnlin-241739/original-card.828570fc58.mp4", "orig": "https://media.skillry.dev/opus-5-5/lexnlin-241739/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/lexnlin-241739/remake.mp4"}, {"n": 37, "c": "motion", "t": ["canvas"], "a": "songkeys", "p": "Create a short origami / doodle-style animation showing humanity’s development, progress, and civilization from birth to the present, and ultimately the hatching of AI. AI then gradually develops and advances, eventually hatching today’s Opus 5.5 (you). Style: doodly, cute, warm, strongly narrative, no spoken language (simple text is OK, but don’t use too much explanatory/narrative text, because I want different civilizations to be able to understand it), poetic, moving, high quality.", "img": "https://media.skillry.dev/opus-5-5/songkeys-384673/original.dbb3fca63c.webp", "post": "https://x.com/songkeys/status/2102743212922384673", "v": true, "card": "https://media.skillry.dev/opus-5-5/songkeys-384673/original-card.e6f87ca6f6.mp4", "orig": "https://media.skillry.dev/opus-5-5/songkeys-384673/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/songkeys-384673/remake.mp4"}, {"n": 38, "c": "3d", "t": ["shader", "canvas"], "a": "Michaelzsguo", "p": "Make a 2-minute sand animation that tells the story of 250 years of U.S. history. Keep it lively, engaging, and tasteful. Add appropriate background music and sound design.", "img": "https://media.skillry.dev/opus-5-5/michaelzsguo-782312/original.75c5c3fe7e.webp", "post": "https://x.com/Michaelzsguo/status/2102592355165782312", "v": true, "card": "https://media.skillry.dev/opus-5-5/michaelzsguo-782312/original-card.81e0962387.mp4", "orig": "https://media.skillry.dev/opus-5-5/michaelzsguo-782312/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/michaelzsguo-782312/remake.mp4"}, {"n": 39, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "jackfriks", "p": "can you help me use the pig assets on new branch of lovelee to make a 9:16 short story animation with sound effects about the pig sending his partner love notes in the mailbox and make it fun and good tease app at end?", "img": "https://media.skillry.dev/opus-5-5/jackfriks-338762/original.1704154ebe.webp", "post": "https://x.com/jackfriks/status/2103132260589338762", "v": true, "card": "https://media.skillry.dev/opus-5-5/jackfriks-338762/original-card.3b3fcf0489.mp4", "orig": "https://media.skillry.dev/opus-5-5/jackfriks-338762/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/jackfriks-338762/remake.mp4"}, {"n": 40, "c": "motion", "t": ["canvas", "ai-image"], "a": "sab8a", "p": "Cut a raw talking-head clip into a punchy, fun edit with subtitles, graphics and music", "img": "https://media.skillry.dev/opus-5-5/sab8a-475686/original.550678accf.webp", "post": "https://x.com/sab8a/status/2103144778481475686", "v": true, "card": "https://media.skillry.dev/opus-5-5/sab8a-475686/original-card.8336300a8d.mp4", "orig": "https://media.skillry.dev/opus-5-5/sab8a-475686/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sab8a-475686/remake.mp4", "b": ["Монтаж говорящей головы", "Живое видео + титры, графика и музыка.", "Ролики Арсения с лицом."]}, {"n": 41, "c": "motion", "t": ["threejs", "canvas"], "a": "itisRazak", "p": "Research Distilbook.Make a dynamic 40-second motion graphics video on Distilbook that shows what an incredible motion designer you are. like it's your showreel - Go all out.", "img": "https://media.skillry.dev/opus-5-5/itisrazak-332386/original.db024c3c41.webp", "post": "https://x.com/itisRazak/status/2103517930424332386", "v": true, "card": "https://media.skillry.dev/opus-5-5/itisrazak-332386/original-card.53e54a3bd6.mp4", "orig": "https://media.skillry.dev/opus-5-5/itisrazak-332386/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/itisrazak-332386/remake.mp4"}, {"n": 42, "c": "3d", "t": ["canvas"], "a": "twoclipping", "p": "<inputs>\nAsk me for: a one-word brand name for the wordmark (a verb works best), 9 to 12 high-res photos, a royalty-free song around 120 BPM with a drop and a quiet breakdown (Mixkit, free for commercial use), and a free stock clip of a plain wall with moving plant shadows (Pexels).\n<\/inputs>\n\n<direction>\nAn Apple-keynote launch film, 2D only, one continuous take. Every scene is made out of the previous one: nothing fades, blurs or cuts. Objects change shape instead: text rises out of a mask line, icons pop from zero on a spring, bars draw across, pages push, and a black shape floods the whole frame and contracts into the next scene. Warm off-white canvas, black UI, iOS 26 liquid glass over the photos. Archivo (wdth 125, weight 800) for the wordmark, Geist for UI. A cursor drives every change with real clicks, drags and long-presses. The camera zooms screen-studio style so each moment fills the square, and the cursor scales with it.\nBanned: crossfades, blur-ins, brightness \"developing\", 3D flips, particles, glows, holds longer than 1s, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 54 beats, something happens on every beat.\nOpen: the wordmark squeezes into its own period like an accordion, the dot grows into a black pill, a label rises inside it. Click: six iris blades close over the label and snap open onto a photo. The circle becomes a square, shrinks, the grid unfolds from behind it like a paper map (center, plus, corners), reflows into a bento, and a click zooms into one tile, landing exactly on the drop.\nGlass: a glass word pops in letter by letter, melts into a droplet that stretches into a glass toolbar. The adjust icon turns it into a slider. Dragging relights the photo from day to golden hour (two aligned shots), and the knob turns into a glass lens while held. It lifts into a glass orb, the next photo opens inside it as a circle, and the orb expands into a lock screen: glass clock digits, date, and a home bar that stretches into a glass music player.\nStage: the lock screen pulls back into a phone (the bezel grows out of the screen edge). The Dynamic Island stretches like liquid, pinches off, flies over and grows into a Mac window that rolls up like a blind. Long-press the wallpaper, drag it onto a Safari tab, the page pushes in, drop it and it becomes the hero of a landing page. Scroll: the hero morphs into a framed print on a product card, with the mat and molding growing out of the photo's edge. Pick a frame color (it paints across) and a size, then the nav button flies down into \"Order print\".\nOrder: one black shape keeps morphing: Ordered ✓ → Printing % → On its way (a van on a route) → Delivered ✓.\nWall: the delivered circle floods the frame edge to edge, holds black for a beat, and contracts into the framed print hanging on the real wall footage. The same iris opens onto the print, closes again, the frame floods the screen and contracts into the pill → the dot → the letters spring back out, landing on the beat return. Last frame = first frame.\n<\/structure>\n\n<build>\n1. One HTML file, square 1440x1440. Every style is computed from time inside an async seek(t): no CSS transitions, no timers, no state between frames.\n2. Springs are closed-form step responses. A value with many targets is the sum of one spring per change, so it stays a pure function of time.\n3. Liquid glass: each glass element holds its own clone of the scene behind it, filtered with an SVG feImage displacement map (a rounded-rect distance field) through three feDisplacementMaps at slightly different scales for chromatic edges, plus a rim light. Glass letters: a canvas distance field per glyph gives the map, mask and highlights.\n4. Goo: blur + alpha threshold, then composite the source atop it so the glass stays sharp inside.\n5. Iris: 6 blades around a hexagonal aperture. Each blade is its two vertices, both edge extensions and the SHORT arc between them.\n6. Wordmark squeeze: every letter moves toward the dot by the same factor and its drawn width follows (narrow the wdth axis, scale the rest), so the letters stay touching.\n7. Footage: re-encode all-intra (ffmpeg -g 1), load it as a blob URL, await 'seeked' before drawing each frame.\n8. Sound: a downloaded SFX for every event (Mixkit), never synthesized, each placed by its measured peak. The song starts on a downbeat: the zoom lands on the drop, the wall sits in the breakdown, the wordmark returns with the beat. Loudnorm to -14 LUFS.\n9. Render with Playwright: 4 subframes per frame blended with ffmpeg tmix, 60fps. Check one frame per beat, then scan for single-frame pops (frame-difference spikes 3x their neighbours).\n<\/build>\n\n<gotchas>\nbackdrop-filter: url() misreads displacement maps in Chromium, so clone the scene instead. A flood must overscale past the corners and take about 0.3s, or half the screen changes in one frame. A child with visibility: visible shows through a hidden parent, so use inherit. Text that swaps inside a morphing shape needs its own mask. python http.server can't range-seek video, so use the blob URL.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the beat map and 4 stills (open, glass, stage, wall) before you write the full film.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/twoclipping-496100/original.8f1c352eca.webp", "post": "https://x.com/twoclipping/status/2103835273813496100", "v": true, "card": "https://media.skillry.dev/opus-5-5/twoclipping-496100/original-card.a617934400.mp4", "orig": "https://media.skillry.dev/opus-5-5/twoclipping-496100/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/twoclipping-496100/remake.mp4"}, {"n": 43, "c": "motion", "t": ["canvas", "svg", "gsap", "css"], "a": "viktoroddy", "p": "Create a launch video for MotionSites AI, just hit 1 million monthly visitors after 8 months after launch.", "img": "https://media.skillry.dev/opus-5-5/viktoroddy-402509/original.31093e9638.webp", "post": "https://x.com/viktoroddy/status/2103802280617402509", "v": true, "card": "https://media.skillry.dev/opus-5-5/viktoroddy-402509/original-card.b08453d289.mp4", "orig": "https://media.skillry.dev/opus-5-5/viktoroddy-402509/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/viktoroddy-402509/remake.mp4"}, {"n": 44, "c": "motion", "t": ["canvas", "audio"], "a": "kloss_xyz", "p": "Use Python to generate a 9:16 chaotic brain rot video with excellent motion + sound design and render it using ffmpeg. Put your own personal spin on it so it’s aligned with Anthropic’s new launch. Also fully express what it’s like to be a very creative LLM used by me every day from your POV to give it some extra personality.", "img": "https://media.skillry.dev/opus-5-5/kloss-xyz-941143/original.c77fc2a47b.webp", "post": "https://x.com/kloss_xyz/status/2103664956482941143", "v": true, "card": "https://media.skillry.dev/opus-5-5/kloss-xyz-941143/original-card.f84601096b.mp4", "orig": "https://media.skillry.dev/opus-5-5/kloss-xyz-941143/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kloss-xyz-941143/remake.mp4"}, {"n": 45, "c": "motion", "t": ["canvas"], "a": "majidmanzarpour", "p": "Create a single self-contained HTML file that renders an animated pixel art wizard casting a spell, using vanilla JavaScript and Canvas 2D. No external assets, libraries, or network requests.\n\nRENDERING\n- Draw everything to an offscreen canvas at a fixed logical resolution of 128x96, then blit to a fullscreen display canvas scaled by the largest integer factor that fits the window, centered, with imageSmoothingEnabled = false and CSS image-rendering: pixelated.\n- All drawing snaps to integer coordinates on the logical canvas. No sub-pixel positions, anti-aliasing, gradients, or shadowBlur.\n- Fixed palette of ~24 hex colors: deep blues/purples for night sky, warm robe tones, 3-4 bright magic colors. Every pixel comes from this palette.\n\nCHARACTER\n- Build the wizard procedurally from filled rects and pixel runs, ~24x32 logical pixels: pointed hat with a bend, long beard, two-shade robe with darker outline, staff with a gem at the tip.\n- Parameterize the pose (staff angle, arm raise, head tilt, robe sway). Animate parameters smoothly, then quantize to the pixel grid each frame so motion reads at an 8-12 fps pixel animation feel even though the loop runs at 60fps.\n\nANIMATION\n- Looping state machine: IDLE (2-frame bob, beard sway) -> CHARGE (staff raises, gem flickers, sparks spiral inward) -> CAST (bright burst, projectile fires across the scene, 1-2 pixel screen shake) -> RECOVER (settle back). Ease pose parameters between keyframes.\n- Pooled allocation-free particle system: preallocate and reuse. Sparks orbit the gem during CHARGE, explode outward on CAST, each particle stepping its palette index from white to magic color to dark before despawn. Snap particle positions to the grid when drawing.\n- Fixed 60hz timestep update with rAF rendering. Zero object allocation inside the loop.\n\nSCENE\n- Minimal background: dark sky, a few twinkling 1px stars, moon, stone floor line. Character silhouette must read clearly.\n- Subtle 1px rim light on the wizard from the gem, brightening during CHARGE and CAST.\n\nQUALITY BAR\n- Crisp pixels at any window size, seamless loop, stable 60fps, readable silhouette. Should look like a polished 16-bit sprite animation, not vector shapes scaled down.", "img": "https://media.skillry.dev/opus-5-5/majidmanzarpour-927543/original.f5bc33c897.webp", "post": "https://x.com/majidmanzarpour/status/2102476258948927543", "v": true, "card": "https://media.skillry.dev/opus-5-5/majidmanzarpour-927543/original-card.2ea673ee57.mp4", "orig": "https://media.skillry.dev/opus-5-5/majidmanzarpour-927543/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/majidmanzarpour-927543/remake.mp4"}, {"n": 46, "c": "motion", "t": ["shader", "webgl", "canvas"], "a": "monokern", "p": "make a dynamic 20-second motion graphics video that shows what an incredible motion designer you are, psychedelic and hypnotic. make it feel like a showreel piece. go all out.", "img": "https://media.skillry.dev/opus-5-5/monokern-832979/original.a67fabae15.webp", "post": "https://x.com/monokern/status/2103563538828832979", "v": true, "card": "https://media.skillry.dev/opus-5-5/monokern-832979/original-card.60ad80c363.mp4", "orig": "https://media.skillry.dev/opus-5-5/monokern-832979/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/monokern-832979/remake.mp4"}, {"n": 47, "c": "motion", "t": ["shader", "webgl", "canvas", "particles"], "a": "zheke", "p": "Hello Opus 5.5 show me what an incredible motion designer you are.", "img": "https://media.skillry.dev/opus-5-5/zheke-622583/original.77013c3840.webp", "post": "https://x.com/zheke/status/2103418664854622583", "v": true, "card": "https://media.skillry.dev/opus-5-5/zheke-622583/original-card.a70e857a3b.mp4", "orig": "https://media.skillry.dev/opus-5-5/zheke-622583/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/zheke-622583/remake.mp4", "b": ["Буквы с физикой", "Слова с инерцией, отскоком и перелётом.", "Хук про инерцию: буквы сами показывают закон."]}, {"n": 48, "c": "3d", "t": ["shader", "webgl"], "a": "AxtonLiu", "p": "每次一个新的模型出来呢，大家都让它去画 “鹈鹕骑自行车” 来判断这个模型的空间能力，基本上都是用 HTML、SVG 来画动画。当我实在看得都有审美疲劳了，我希望你能画一个最复杂、最精细、最精美的 “鹈鹕骑自行车”的动画视频，你可以用任何的技术，不用着急，画一天都可以。", "img": "https://media.skillry.dev/opus-5-5/axtonliu-290566/original.421b336345.webp", "post": "https://x.com/AxtonLiu/status/2103119648271290566", "v": true, "card": "https://media.skillry.dev/opus-5-5/axtonliu-290566/original-card.08fe68e908.mp4", "orig": "https://media.skillry.dev/opus-5-5/axtonliu-290566/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/axtonliu-290566/remake.mp4"}, {"n": 49, "c": "motion", "t": ["svg"], "a": "demonugc", "p": "<inputs>\nAsk me for: 8 to 12 UI states I want the shape to become (e.g. button, loader, player, slider, toggle, tabs, chart, command palette, toast), pure black and white or one accent color, and a royalty-free song around 120 BPM (e.g. Mixkit, free for commercial use).\n<\/inputs>\n\n<direction>\nDribbble-level UI motion. One shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Light warm-gray canvas, black and white components, one clean UI font (Geist). Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. The last frame is the first frame, so it loops.\nBanned: bouncy easing, particle bursts, glows, gradients on UI chrome, mismatched icon strokes, dead time, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 7 bars, something happens on every beat.\nButton → loader → check → dynamic island → music player with a play/pause morph → scrub the progress bar → it becomes a volume slider that stretches when dragged past max → a toggle flips on the beat → the knob becomes a liquid tab indicator → the tabs open into a chart that draws itself, with a tooltip on hover → it collapses into ⌘K → type to filter → enter → toast → back to the button.\n<\/structure>\n\n<build>\n1. One HTML file, square 1440x1440. Every style is computed from time inside seek(t): no CSS transitions, no timers, no state carried between frames.\n2. Springs are closed-form step responses. A value that changes target many times is the sum of one spring per change, so it stays a pure function of time.\n3. The tab indicator's two edges ride different springs, so the leading edge stretches ahead of the trailing one. Same trick for the toggle knob.\n4. Drags are direct manipulation: while the cursor is held, the value is computed from its position. On release it springs back from wherever it was.\n5. Analyze the song with numpy for the beat grid and start on a downbeat. Place every UI sound by its measured peak.\n6. Render with Playwright: 4 subframes per frame, blended with ffmpeg tmix for motion blur at 60fps.\n7. Render one frame per beat before the full render. Fix anything off the grid, cramped or hard to read.\n<\/build>\n\n<gotchas>\nNever put will-change on anything the camera scales or the text renders blurry. Text that swaps inside a morphing container needs its own enter and exit timing or it overlaps. Make the last frame identical to the first, cursor position and speed included, or the loop stutters.\n<\/gotchas>\n\n<start>\nAsk me for the inputs, then show me the state list on the beat grid before you write any code.\n<\/start>", "img": "https://media.skillry.dev/opus-5-5/demonugc-525162/original.eb370273ad.webp", "post": "https://x.com/demonugc/status/2103526713208525162", "v": true, "card": "https://media.skillry.dev/opus-5-5/demonugc-525162/original-card.961ea50ac1.mp4", "orig": "https://media.skillry.dev/opus-5-5/demonugc-525162/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/demonugc-525162/remake.mp4"}, {"n": 50, "c": "explainer", "t": ["svg", "gsap"], "a": "alex_prompter", "p": "Adopt the role of an expert motion designer. Build a 30-second animated explainer for my business as a single HTML page. 5 scenes. The customer's problem, what I do, how it works in 3 steps, one proof point, and my name at the end. Bold text, smooth transitions, my brand colours. My business [DESCRIBE WHAT YOU SELL, WHO IT'S FOR AND YOUR COLOURS]", "img": "https://media.skillry.dev/opus-5-5/alex-prompter-997524/original.16e8d0a42e.webp", "post": "https://x.com/alex_prompter/status/2103499977632997524", "v": true, "card": "https://media.skillry.dev/opus-5-5/alex-prompter-997524/original-card.67e0a1dafe.mp4", "orig": "https://media.skillry.dev/opus-5-5/alex-prompter-997524/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/alex-prompter-997524/remake.mp4"}, {"n": 51, "c": "explainer", "t": ["canvas"], "a": "emollick", "p": "A video explaining recursion, where every explanation about recursion has a radically different video style, make this self-referential & clever & fast moving.", "img": "https://media.skillry.dev/opus-5-5/emollick-019567/original.70fbf894e4.webp", "post": "https://x.com/emollick/status/2103688362960019567", "v": true, "card": "https://media.skillry.dev/opus-5-5/emollick-019567/original-card.0265af25cd.mp4", "orig": "https://media.skillry.dev/opus-5-5/emollick-019567/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/emollick-019567/remake.mp4"}, {"n": 52, "c": "motion", "t": ["canvas"], "a": "dale_vaz", "p": "create a self contained aesthetically pleasing, breathtaking animation of the Sahi Trading Terminal. it should start with a single dot on a black screen and then have multiple windows show up on the screen such as Charts, Positons , Option Chain, Watchlist. And zoom into and out at multiple scales. Finally the camera zooms out to make
