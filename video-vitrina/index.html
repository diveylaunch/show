efer reusable primitives for:\n\n• camera surface\n• product frame\n• masked transitions\n• text reveals\n• UI region reveals\n• ambient lighting\n• shared-element transitions\n\nAvoid one 1,500-line component.\n\nUse deterministic Remotion animation driven by frame/time.\n\nNo setTimeout.\nNo nondeterministic animations.\n\nRespect 60 fps throughout.\n\nUse interpolation/spring/easing deliberately.\n\n────────────────────────────────────\nDO NOT STOP AFTER FIRST IMPLEMENTATION\n────────────────────────────────────\n\nThis is a visual task.\n\nYou MUST review the actual rendered output.\n\nRequired workflow:\n\n1. Inspect repository and real brand/product.\n\n2. Write a concise storyboard with:\n   - exact timestamps\n   - key visual\n   - transition logic\n   - copy\n   - intended emotional rhythm\n\n3. Implement it.\n\n4. Run typecheck / relevant checks.\n\n5. Render representative frames at roughly:\n   0.0 s\n   1.0 s\n   2.5 s\n   4.5 s\n   6.5 s\n   8.5 s\n   10.5 s\n   12.5 s\n   14.0 s\n   14.8 s\n\n6. VISUALLY INSPECT THOSE IMAGES.\n\nDo not merely confirm that rendering succeeded.\n\nAsk:\n\nDoes this look like an Apple-tier product film?\n\nDoes anything look like a template?\n\nIs there too much on screen?\n\nIs the product legible?\n\nAre transitions logically connected?\n\nDoes Taxtello gold feel premium?\n\nDoes every frame look composed?\n\n7. Fix visual weaknesses.\n\n8. Render the complete film.\n\n9. Inspect multiple exact decoded frames from the final MP4, not only browser\n   screenshots.\n\n10. Iterate again if necessary.\n\nDo not declare success because the code compiles.\n\nThe deliverable is the FILM.\n\n────────────────────────────────────\nQUALITY BAR\n────────────────────────────────────\n\nReject your own result if it feels like:\n\n• a SaaS template\n• a PowerPoint animation\n• a website screen recording\n• a generic Remotion demo\n• a crypto advertisement\n• an AI-generated promo template\n• five screenshots sliding around\n• excessive marketing copy\n\nEvery important frame should be good enough to use as a still advertisement.\n\nI would rather have:\n\n3 extraordinary visual moments\n\nthan\n\n10 mediocre feature animations.\n\n────────────────────────────────────\nFINAL DELIVERABLES\n────────────────────────────────────\n\nProvide:\n\n1. Final storyboard\n2. New Remotion composition source\n3. 1920×1080 / 60fps final MP4\n4. Poster/final frame\n5. Contact sheet with representative frames from the film\n6. Exact runtime\n7. List of real Taxtello assets/screens used\n8. Brief explanation of the motion language\n9. Any remaining visual compromises\n10. Commands to reproduce the render\n\nSave outputs in a clearly named directory such as:\n\n  /taxtello/beta-motion/out/showreel-15/\n\nDo not deploy anything.\nDo not modify production data.\nDo not merge anything.\n\nGo all out creatively, but exercise ruthless restraint.\n\nMake Taxtello look expensive.", "img": "https://media.skillry.dev/opus-5-5/daniel-haida-636937/original.965223fcbc.webp", "post": "https://x.com/daniel_haida/status/2104139720829636937", "v": true, "card": "https://media.skillry.dev/opus-5-5/daniel-haida-636937/original-card.b9d95e7ac1.mp4", "orig": "https://media.skillry.dev/opus-5-5/daniel-haida-636937/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/daniel-haida-636937/remake.mp4"}, {"n": 337, "c": "motion", "t": ["canvas", "css"], "a": "PIsajeski", "p": "I just one-shotted this video with Opus 5.5 and @Remotion for the new @agentaOS promo.\n\nUnbelievable what you can do these days.", "img": "https://media.skillry.dev/opus-5-5/pisajeski-168993/original.1c8beeff06.webp", "post": "https://x.com/PIsajeski/status/2104124855302168993", "v": true, "card": "https://media.skillry.dev/opus-5-5/pisajeski-168993/original-card.3cb56a3c3c.mp4", "orig": "https://media.skillry.dev/opus-5-5/pisajeski-168993/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/pisajeski-168993/remake.mp4"}, {"n": 338, "c": "motion", "t": ["canvas", "svg", "gsap", "css"], "a": "DustinDavis", "p": "I had to play along and see what kind of remotion video Claude Opus 5.5 could create for me. Amaze, amaze, amaze!", "img": "https://media.skillry.dev/opus-5-5/dustindavis-644806/original.075d0b52e6.webp", "post": "https://x.com/DustinDavis/status/2104075537228644806", "v": true, "card": "https://media.skillry.dev/opus-5-5/dustindavis-644806/original-card.df1ca1bc97.mp4", "orig": "https://media.skillry.dev/opus-5-5/dustindavis-644806/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/dustindavis-644806/remake.mp4"}, {"n": 339, "c": "motion", "t": ["svg"], "a": "signalz_jp", "p": "エディトリアル風。Opus\n\n【作者补充制作说明】\nOpus5.5で、Remotion+ElevenLabs(BGM)+ Gemini TTS(3.8)で作成。スクリーンショットもChromeにヘッドレスでアクセスして取得してくれる。ffmpegでYouTubeの基準への調整と検査して、YouTube Data APIでアップロードまで。至れり尽くせり。", "img": "https://media.skillry.dev/opus-5-5/signalz-jp-918002/original.3f118f6bd2.webp", "post": "https://x.com/signalz_jp/status/2104022166471918002", "v": true, "card": "https://media.skillry.dev/opus-5-5/signalz-jp-918002/original-card.6c1ea3d90b.mp4", "orig": "https://media.skillry.dev/opus-5-5/signalz-jp-918002/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/signalz-jp-918002/remake.mp4"}, {"n": 340, "c": "motion", "t": ["canvas", "svg"], "a": "DJAdkison", "p": "I was able to make this product motion video for https://getverde.ai using Opus 5.5 + Remotion. \n\nThis is insane. It was able to tell a story in less than 30 min.", "img": "https://media.skillry.dev/opus-5-5/djadkison-394122/original.db4a427362.webp", "post": "https://x.com/DJAdkison/status/2104020177478394122", "v": true, "card": "https://media.skillry.dev/opus-5-5/djadkison-394122/original-card.0c18d2f191.mp4", "orig": "https://media.skillry.dev/opus-5-5/djadkison-394122/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/djadkison-394122/remake.mp4"}, {"n": 341, "c": "motion", "t": ["canvas"], "a": "mousszy_baby", "p": "Comme tous le monde j'ai essayer le combo Opus 5.5 et remotion voilà le résultat en un prompt !", "img": "https://media.skillry.dev/opus-5-5/mousszy-baby-014197/original.2eb32c316e.webp", "post": "https://x.com/mousszy_baby/status/2103966434280014197", "v": true, "card": "https://media.skillry.dev/opus-5-5/mousszy-baby-014197/original-card.97b70ece77.mp4", "orig": "https://media.skillry.dev/opus-5-5/mousszy-baby-014197/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mousszy-baby-014197/remake.mp4"}, {"n": 342, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "Fr_Sorrentino", "p": "@rexan_wong Agree with all of this. Ours wasn't one prompt either: built with Claude Code (Opus 5.5 + Fable 5.1) and Remotion, storyboard first, one still per beat, then many rounds of notes. The watch photo and the app recordings are real, not drawn.", "img": "https://media.skillry.dev/opus-5-5/fr-sorrentino-871017/original.2afbc78624.webp", "post": "https://x.com/Fr_Sorrentino/status/2103922812255871017", "v": true, "card": "https://media.skillry.dev/opus-5-5/fr-sorrentino-871017/original-card.75b950f4a2.mp4", "orig": "https://media.skillry.dev/opus-5-5/fr-sorrentino-871017/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/fr-sorrentino-871017/remake.mp4"}, {"n": 343, "c": "motion", "t": ["svg"], "a": "proanaliteg", "p": "Tried the Remotion skill in Claude Code (Opus 5.5 xhigh) for fun. Mind-blowing: it built this promo on the first try - I spent longer picking four accent sounds and the music. It rebuilt our desktop app's UI in React straight from the XAML and design tokens. Zero screenshots.", "img": "https://media.skillry.dev/opus-5-5/proanaliteg-458642/original.2683db3024.webp", "post": "https://x.com/proanaliteg/status/2103895246593458642", "v": true, "card": "https://media.skillry.dev/opus-5-5/proanaliteg-458642/original-card.d5893b21b4.mp4", "orig": "https://media.skillry.dev/opus-5-5/proanaliteg-458642/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/proanaliteg-458642/remake.mp4"}, {"n": 344, "c": "motion", "t": ["canvas", "svg", "css"], "a": "KingOKings", "p": "I thought the Opus 5.5 design posts were all jokes.\n\nThey're not. It's GOATed at design.\n\nI asked it to make a product showreel for Reactive Resume. It built this entire video in Remotion, in ONE prompt.\n\nThe setup:\n→ Opus 5.5, max effort\n→ Claude desktop app\n→ No skills, no templates, no design brief\n→ Just my project repo\n\nIt read the codebase, figured out what the product does, and decided what was worth showing.\n\nA launch video like this used to mean days in After Effects or paying a motion designer. Now a solo open-source maintainer can do it in an afternoon.\n\nFull prompt in the replies ⬇️", "img": "https://media.skillry.dev/opus-5-5/kingokings-992769/original.3f17f27fb6.webp", "post": "https://x.com/KingOKings/status/2103874453687992769", "v": true, "card": "https://media.skillry.dev/opus-5-5/kingokings-992769/original-card.e4ec14d418.mp4", "orig": "https://media.skillry.dev/opus-5-5/kingokings-992769/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kingokings-992769/remake.mp4"}, {"n": 345, "c": "motion", "t": ["canvas", "svg"], "a": "Dys_hay", "p": "How far can Claude Opus 5.5 go in motion design? I tried. \n\n15 s on the Audi RS 6, 100% code (React/Remotion) with a synthesized V8 soundtrack. The cylinders flash in the real firing order, and the 0–100 timer runs in real time: 3.4 s.\n\nSpec piece, not affiliated with Audi.", "img": "https://media.skillry.dev/opus-5-5/dys-hay-749645/original.9df0e0ab2c.webp", "post": "https://x.com/Dys_hay/status/2103819139307749645", "v": true, "card": "https://media.skillry.dev/opus-5-5/dys-hay-749645/original-card.d8288d34b5.mp4", "orig": "https://media.skillry.dev/opus-5-5/dys-hay-749645/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/dys-hay-749645/remake.mp4"}, {"n": 346, "c": "3d", "t": ["threejs", "canvas", "svg"], "a": "ambiguous_ai", "p": "Opus5.5 motion graphics\n改めてRemotionで色々できそう！\n#AIMotionDesign 02", "img": "https://media.skillry.dev/opus-5-5/ambiguous-ai-389509/original.98c92f0749.webp", "post": "https://x.com/ambiguous_ai/status/2103813886684389509", "v": true, "card": "https://media.skillry.dev/opus-5-5/ambiguous-ai-389509/original-card.81487616ff.mp4", "orig": "https://media.skillry.dev/opus-5-5/ambiguous-ai-389509/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ambiguous-ai-389509/remake.mp4"}, {"n": 347, "c": "motion", "t": ["svg", "gsap"], "a": "heymrzak", "p": "the introduction made with opus 5.5 + remotion\n\nintroducing @TryGofy — the live map of everything.\n\n#shipaton #BuildInPublic #gofy #gofyapp", "img": "https://media.skillry.dev/opus-5-5/heymrzak-349060/original.c53595193d.webp", "post": "https://x.com/heymrzak/status/2103768331782349060", "v": true, "card": "https://media.skillry.dev/opus-5-5/heymrzak-349060/original-card.fc15d8f013.mp4", "orig": "https://media.skillry.dev/opus-5-5/heymrzak-349060/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/heymrzak-349060/remake.mp4"}, {"n": 348, "c": "motion", "t": ["shader", "canvas"], "a": "ambiguous_ai", "p": "Opus5.5 motion graphics\nRemotionだと簡単に使いまわせるので便利！\n#AIMotionDesign", "img": "https://media.skillry.dev/opus-5-5/ambiguous-ai-505873/original.9813c20094.webp", "post": "https://x.com/ambiguous_ai/status/2103763542432505873", "v": true, "card": "https://media.skillry.dev/opus-5-5/ambiguous-ai-505873/original-card.5a1855c285.mp4", "orig": "https://media.skillry.dev/opus-5-5/ambiguous-ai-505873/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ambiguous-ai-505873/remake.mp4"}, {"n": 349, "c": "motion", "t": ["threejs", "svg", "gsap", "css"], "a": "lnkiai", "p": "Claude Opus 5.5が凄すぎる…！\nRemotion × three.jsでM3E Canvasの動画を作ってみた👇️", "img": "https://media.skillry.dev/opus-5-5/lnkiai-544254/original.7dc4b9dc77.webp", "post": "https://x.com/lnkiai/status/2103759350330544254", "v": true, "card": "https://media.skillry.dev/opus-5-5/lnkiai-544254/original-card.23443440fa.mp4", "orig": "https://media.skillry.dev/opus-5-5/lnkiai-544254/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/lnkiai-544254/remake.mp4"}, {"n": 350, "c": "motion", "t": ["canvas", "svg", "css"], "a": "TejasThange3", "p": "this is INSANE!\n\nThe whole Twitter → 𝕏 story in 30 seconds, and I didn't touch a single keyframe.\n\nOpus 5.5 wrote every frame in Remotion and composed the soundtrack in code.", "img": "https://media.skillry.dev/opus-5-5/tejasthange3-128242/original.bfac43eed9.webp", "post": "https://x.com/TejasThange3/status/2103735653943128242", "v": true, "card": "https://media.skillry.dev/opus-5-5/tejasthange3-128242/original-card.f2ca6a0b82.mp4", "orig": "https://media.skillry.dev/opus-5-5/tejasthange3-128242/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/tejasthange3-128242/remake.mp4"}, {"n": 351, "c": "motion", "t": ["canvas", "svg", "css"], "a": "helloshiva0801", "p": "I'm a solo founder with no video editor, no designer and no After Effects.\n\nSo I built http://redesignr.ai's launch video in React with Claude Opus 5.5 + @remotion.\n\n900 frames, 10 scenes, all code, paper style.\n\nBuilding in public, day 3. \n\n#buildinpublic #Remotion #ClaudeAI #indiehackers #solofounder #SaaS #webdesign #motiondesign\n#AI #React #vibecoding", "img": "https://media.skillry.dev/opus-5-5/helloshiva0801-438284/original.f00b145b33.webp", "post": "https://x.com/helloshiva0801/status/2103733875734438284", "v": true, "card": "https://media.skillry.dev/opus-5-5/helloshiva0801-438284/original-card.e7ad43fa92.mp4", "orig": "https://media.skillry.dev/opus-5-5/helloshiva0801-438284/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/helloshiva0801-438284/remake.mp4"}, {"n": 352, "c": "explainer", "t": ["canvas", "svg"], "a": "iTakahashikun", "p": "ださいけど、Remotion で動画っぽいのつくった。コードは見てない。環境だけ用意した…っていっても、いつものように jj init されるカスタム try コマンドを叩いてディレクトリをつくって「Remotion の環境をプリーズ」だけだわ。なんもしてない。あとは Opus 5.5 とちょっと話しただけだわ。未来だ。", "img": "https://media.skillry.dev/opus-5-5/itakahashikun-990109/original.2df9a473ee.webp", "post": "https://x.com/iTakahashikun/status/2103731575661990109", "v": true, "card": "https://media.skillry.dev/opus-5-5/itakahashikun-990109/original-card.dd0278b021.mp4", "orig": "https://media.skillry.dev/opus-5-5/itakahashikun-990109/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/itakahashikun-990109/remake.mp4"}, {"n": 353, "c": "motion", "t": ["canvas", "svg"], "a": "als_link", "p": "Este video lo hizo una IA 🤯 Con código, no con plantillas.\nLe pedí a Claude Opus 5.5 un reel con Remotion: escribió las escenas, lo renderizó y quedó listo para subir.\nPruébalo en 3 pasos 👇 y comenta «VIDEO» para que te mande el prompt.\n#ClaudeAI #Remotion #MotionDesign #IA", "img": "https://media.skillry.dev/opus-5-5/als-link-301108/original.d5c76cb49f.webp", "post": "https://x.com/als_link/status/2103617322464301108", "v": true, "card": "https://media.skillry.dev/opus-5-5/als-link-301108/original-card.f61066ea6e.mp4", "orig": "https://media.skillry.dev/opus-5-5/als-link-301108/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/als-link-301108/remake.mp4"}, {"n": 354, "c": "explainer", "t": ["canvas", "svg"], "a": "cboyack", "p": "Asked Opus 5.5 (max) to create a 15-second video about why we need to end the Fed. Behold. \n\nTook 1 hour 45 minutes to do. It used @Remotion to create it.", "img": "https://media.skillry.dev/opus-5-5/cboyack-407181/original.eee80ed319.webp", "post": "https://x.com/cboyack/status/2103617085402407181", "v": true, "card": "https://media.skillry.dev/opus-5-5/cboyack-407181/original-card.2bf04f39b0.mp4", "orig": "https://media.skillry.dev/opus-5-5/cboyack-407181/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/cboyack-407181/remake.mp4", "b": ["Одна цифра на весь экран", "Гигантская типографика числа в первую секунду.", "Хук-факт: «300 000 км/с», «9,8 м/с²»."]}, {"n": 355, "c": "explainer", "t": ["canvas", "svg"], "a": "salmanr2d2", "p": "Made with Opus 5.5 and Remotion. #claude #opus #reactnative #currency", "img": "https://media.skillry.dev/opus-5-5/salmanr2d2-661615/original.d500ec1589.webp", "post": "https://x.com/salmanr2d2/status/2103608284825661615", "v": true, "card": "https://media.skillry.dev/opus-5-5/salmanr2d2-661615/original-card.9a6f321a7a.mp4", "orig": "https://media.skillry.dev/opus-5-5/salmanr2d2-661615/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/salmanr2d2-661615/remake.mp4", "b": ["Газетная бумага", "Крупные слова на бумаге, тени, «было → стало».", "Как одно открытие изменило всё."]}, {"n": 356, "c": "motion", "t": ["canvas", "svg"], "a": "PiyushAaryan2", "p": "I made our launch video entirely with Claude.\n\nNo After Effects. No editor. Every frame is code.\n\nClaude Opus 5.5 animated it in Remotion. ElevenLabs made the music + 159 sound effects, all synced to the beat.\n\nWhat it's launching 👇", "img": "https://media.skillry.dev/opus-5-5/piyushaaryan2-196586/original.40bd2636a7.webp", "post": "https://x.com/PiyushAaryan2/status/2103603040079196586", "v": true, "card": "https://media.skillry.dev/opus-5-5/piyushaaryan2-196586/original-card.7abaa2bc2d.mp4", "orig": "https://media.skillry.dev/opus-5-5/piyushaaryan2-196586/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/piyushaaryan2-196586/remake.mp4"}, {"n": 357, "c": "motion", "t": ["svg", "gsap"], "a": "Thuggy_Juice", "p": "Premier jet Opus 5.5 Max + Remotion", "img": "https://media.skillry.dev/opus-5-5/thuggy-juice-072370/original.30f41e947e.webp", "post": "https://x.com/Thuggy_Juice/status/2103539067317072370", "v": true, "card": "https://media.skillry.dev/opus-5-5/thuggy-juice-072370/original-card.4c612b81c9.mp4", "orig": "https://media.skillry.dev/opus-5-5/thuggy-juice-072370/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/thuggy-juice-072370/remake.mp4"}, {"n": 358, "c": "explainer", "t": ["canvas"], "a": "ninjaswebcom", "p": "Made with Opus 5.5, remotion y eleven labs. 145k tokens.", "img": "https://media.skillry.dev/opus-5-5/ninjaswebcom-684126/original.3c9ccf8a8a.webp", "post": "https://x.com/ninjaswebcom/status/2103537378283684126", "v": true, "card": "https://media.skillry.dev/opus-5-5/ninjaswebcom-684126/original-card.7cc2400775.mp4", "orig": "https://media.skillry.dev/opus-5-5/ninjaswebcom-684126/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ninjaswebcom-684126/remake.mp4"}, {"n": 359, "c": "motion", "t": ["canvas", "svg", "css"], "a": "iammukeshm", "p": "Claude Opus 5.5 is incredible.\n\nI gave it a pretty simple task:\n\nCreate a Remotion-based showreel featuring my work as a developer, content creator, and open-source maintainer.\n\nWhat I wanted was a cool 30-second motion graphic that introduces  me as a developer and content creator.\n\nThat was basically it.\n\nClaude went to work for around 20 minutes, writing the Remotion code, putting together the animations, transitions, layouts, and the overall story.\n\nAnd this is what it produced.\n\nStunning, right?!\n\nWhat surprised me most is that this isn't just AI generating a few video clips.\n\nIt's AI building the video programmatically.\n\nThe entire thing is code.\n\nWhich means I can tweak the content, change the animations, swap assets, update numbers, or completely redesign a section - and render it again.\n\nVideo generation was one of those things I thought would take AI quite a while to really crack.\n\nTurns out we're already much closer than I expected.\n\nAnd for developers, tools like Remotion + coding agents open up some seriously interesting possibilities.\n\nInterested in knowing what prompt I used?\n\nComment \"Remotion\".", "img": "https://media.skillry.dev/opus-5-5/iammukeshm-421585/original.3b913a2506.webp", "post": "https://x.com/iammukeshm/status/2103511739585421585", "v": true, "card": "https://media.skillry.dev/opus-5-5/iammukeshm-421585/original-card.300c58aafa.mp4", "orig": "https://media.skillry.dev/opus-5-5/iammukeshm-421585/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/iammukeshm-421585/remake.mp4"}, {"n": 360, "c": "motion", "t": ["svg"], "a": "YarHmm", "p": "ما أعتقد في قفزة سواها Opus 5.5 تساوي القفزة اللي سواها في صناعة ال motion graphics، سواء من ناحية الجودة أو من ناحية التكلفة (استهلاك ال tokens) \n\nهذا الفيديو سويته بربع حد ال 5 ساعات 👇🏻\n\n【作者补充制作说明】\nالطريقة باختصار: \nاستخدمت claude بنموذج opus 5.5 - مستوى التفكير متوسط إلى عالي، و طلبت منه يستخدم remotion لتسريع عملية ال preview و كذلك طلبت منه يقتصر استخدامه في معظم المؤثرات الصوتية على أصوات الكاميرات و عدسات التصوير الشائعة في ال reels و استخدمت نموذج gemini 3.8 tts flash لإنتاج الصوت \nأخذ معي حوالي ساعة و نصف من المحادثات معه لكن معظمها راح في تجريب أشياء مختلفة و التجربة ممتعة فعلا.", "img": "https://media.skillry.dev/opus-5-5/yarhmm-341449/original.00d7d78f49.webp", "post": "https://x.com/YarHmm/status/2103505435802341449", "v": true, "card": "https://media.skillry.dev/opus-5-5/yarhmm-341449/original-card.fa47e3f0a1.mp4", "orig": "https://media.skillry.dev/opus-5-5/yarhmm-341449/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/yarhmm-341449/remake.mp4"}, {"n": 361, "c": "motion", "t": ["canvas", "svg"], "a": "T4K1RA_CG", "p": "Opus5.5 × Remotionでコードのみで映像作ってみました！ポン出しでこれは凄い。動画生成との使い分けで幅がほんとに広がりそう。次AEを本気で動かしてみます\n#Claude #Motiondesign #ai", "img": "https://media.skillry.dev/opus-5-5/t4k1ra-cg-110846/original.ea2efb8bf5.webp", "post": "https://x.com/T4K1RA_CG/status/2103486728917110846", "v": true, "card": "https://media.skillry.dev/opus-5-5/t4k1ra-cg-110846/original-card.a5c4480a84.mp4", "orig": "https://media.skillry.dev/opus-5-5/t4k1ra-cg-110846/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/t4k1ra-cg-110846/remake.mp4"}, {"n": 362, "c": "motion", "t": ["svg", "gsap"], "a": "francoxavier33", "p": "this was 100% opus 5.5. \n\ni have a dedicated \"studio\" repo with all my project's style guides, tokens, few skills, remotion, etc.\n\nthis all started from \"make a hype demo/launch video for @momwiseai\"\n\ntook maybe 4 revisions. music, sound fx, messaging, animations, everything was done with code.", "img": "https://media.skillry.dev/opus-5-5/francoxavier33-341663/original.5fb257a3d9.webp", "post": "https://x.com/francoxavier33/status/2103486218323341663", "v": true, "card": "https://media.skillry.dev/opus-5-5/francoxavier33-341663/original-card.5a8f95a6f7.mp4", "orig": "https://media.skillry.dev/opus-5-5/francoxavier33-341663/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/francoxavier33-341663/remake.mp4"}, {"n": 363, "c": "explainer", "t": ["canvas"], "a": "_Tony_TT_", "p": "Opus 5.5 on the Trading House\n\n❯ Using React/TypeScript (Remotion), every image drawn in SVG and Canvas, an open-source TTS voice, and a score synthesized in Python. No stock footage. No image generators.\n\n❯ Build a short 30-60s animation work about the Trading House", "img": "https://media.skillry.dev/opus-5-5/tony-tt-872147/original.70c2aea50b.webp", "post": "https://x.com/_Tony_TT_/status/2103227891009872147", "v": true, "card": "https://media.skillry.dev/opus-5-5/tony-tt-872147/original-card.d24945e341.mp4", "orig": "https://media.skillry.dev/opus-5-5/tony-tt-872147/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/tony-tt-872147/remake.mp4"}, {"n": 364, "c": "motion", "t": ["canvas", "svg"], "a": "thallisribeiro", "p": "TÁ BIZARRO ESSE OPUS 5.5 😲\n\nEu nem acreditei no resultado. Foi feito com one prompt shot, usando apenas remotion... \n\nAgora é só jogar uma narraçãozinha e subir pros ADS kkk", "img": "https://media.skillry.dev/opus-5-5/thallisribeiro-829318/original.9cbf59b14e.webp", "post": "https://x.com/thallisribeiro/status/2103107359727829318", "v": true, "card": "https://media.skillry.dev/opus-5-5/thallisribeiro-829318/original-card.2310d2ec0b.mp4", "orig": "https://media.skillry.dev/opus-5-5/thallisribeiro-829318/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/thallisribeiro-829318/remake.mp4"}, {"n": 365, "c": "motion", "t": ["canvas", "svg"], "a": "tycenjm", "p": "@claudeai I was jealous of the Opus 5.5 video demos, so I linked the best ones and asked it why theirs beat mine.\n\nThis is what it made. Every frame is code (Remotion), with its own voiceover, music, and word-synced animation.\n\nThen it made 10 ads for my app. Full thread on my profile.", "img": "https://media.skillry.dev/opus-5-5/tycenjm-098014/original.238da22a07.webp", "post": "https://x.com/tycenjm/status/2103024522589098014", "v": true, "card": "https://media.skillry.dev/opus-5-5/tycenjm-098014/original-card.912a639c08.mp4", "orig": "https://media.skillry.dev/opus-5-5/tycenjm-098014/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/tycenjm-098014/remake.mp4"}, {"n": 366, "c": "explainer", "t": ["canvas", "svg", "gsap"], "a": "samissudo", "p": "created this with opus 5.5 + remotion, the possibilities are endless", "img": "https://media.skillry.dev/opus-5-5/samissudo-927179/original.dd1901ecd7.webp", "post": "https://x.com/samissudo/status/2102860811219927179", "v": true, "card": "https://media.skillry.dev/opus-5-5/samissudo-927179/original-card.7285bcfc55.mp4", "orig": "https://media.skillry.dev/opus-5-5/samissudo-927179/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/samissudo-927179/remake.mp4", "b": ["Бумажный коллаж (Vox)", "Персонажи-вырезки, бумага, скотч — история как в Vox.", "История открытий: Галилей, Ньютон, «молоток и перо на Луне»."]}, {"n": 367, "c": "explainer", "t": ["canvas", "svg", "ai-image"], "a": "imthatcarlos", "p": "Opus 5.5 just one-shotted this explainer video for @sherwoodagent 🔥\n\nSince I ran it within the context of our web app, it used existing components and branding to inform the design and used @Remotion skills for rendering\n\nKind of insane, haven't tried doing any video generation for months, but the latest models are making it easier to create content that is polished without heavy iteration\n\nPrompt: \"make a modern slick and punchy video for sherwood protocol. feel free to take branding or components from the landing page or app. the goal is to highlight how it enables agentic hedge funds, explaining it simply\"", "img": "https://media.skillry.dev/opus-5-5/imthatcarlos-133592/original.1e792e53b6.webp", "post": "https://x.com/imthatcarlos/status/2102849219388133592", "v": true, "card": "https://media.skillry.dev/opus-5-5/imthatcarlos-133592/original-card.0f9c5f5cba.mp4", "orig": "https://media.skillry.dev/opus-5-5/imthatcarlos-133592/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/imthatcarlos-133592/remake.mp4"}, {"n": 368, "c": "motion", "t": ["svg"], "a": "Iamshankhadeep", "p": "i've been sitting on @ccdotdirectory  for over a year, waiting for anthropic to pull ahead in the ai race.\n\ngpt-6 astra had openai claiming the lead over fable 5.1. then opus 5.5 dropped.\n\nthat's my signal.\n\n116,692 claude code tools in one place.\n\nlaunch video was created using @Remotion and opus 5.5", "img": "https://media.skillry.dev/opus-5-5/iamshankhadeep-506266/original.11a3b2ffaf.webp", "post": "https://x.com/Iamshankhadeep/status/2102825543733506266", "v": true, "card": "https://media.skillry.dev/opus-5-5/iamshankhadeep-506266/original-card.baf1a4265b.mp4", "orig": "https://media.skillry.dev/opus-5-5/iamshankhadeep-506266/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/iamshankhadeep-506266/remake.mp4"}, {"n": 369, "c": "motion", "t": ["threejs", "svg", "gsap"], "a": "SafaElmali", "p": "Claude Opus 5.5 made this launch video for https://dualsense.studio using Remotion.\n\nA few rough edges, but honestly I'm impressed 🤯", "img": "https://media.skillry.dev/opus-5-5/safaelmali-004843/original.1d98c8d524.webp", "post": "https://x.com/SafaElmali/status/2102749298673004843", "v": true, "card": "https://media.skillry.dev/opus-5-5/safaelmali-004843/original-card.5ef9390ec1.mp4", "orig": "https://media.skillry.dev/opus-5-5/safaelmali-004843/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/safaelmali-004843/remake.mp4"}, {"n": 370, "c": "motion", "t": ["svg"], "a": "localjulius", "p": "Okay Opus 5.5 + Remotion and a solid concept for what you want is producing amazing results right now.\n\nHere's my ad for Audivo. \n\nI told Opus 5.5 to create an ad from excerpts of popular podcasts and with it make a story explaining what Audivo does. \n\nThe results were amazing!", "img": "https://media.skillry.dev/opus-5-5/localjulius-625706/original.41a0046c40.webp", "post": "https://x.com/localjulius/status/2102725361922625706", "v": true, "card": "https://media.skillry.dev/opus-5-5/localjulius-625706/original-card.e8908bf631.mp4", "orig": "https://media.skillry.dev/opus-5-5/localjulius-625706/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/localjulius-625706/remake.mp4"}, {"n": 371, "c": "motion", "t": ["svg"], "a": "alanschwegler", "p": "Armé este reel para mi web de gestión de eventos con Opus 5.5 \n\nTodo es código: React + TypeScript con Remotion y la música sintetizada en Python a 120 BPM, con cada corte sincronizado al beat. \nSin editor. Sin stock.\n\nOrganizas eventos? Entra acá 👉 https://planningmanager.app", "img": "https://media.skillry.dev/opus-5-5/alanschwegler-629665/original.90809097f3.webp", "post": "https://x.com/alanschwegler/status/2102634404774629665", "v": true, "card": "https://media.skillry.dev/opus-5-5/alanschwegler-629665/original-card.8809570c0e.mp4", "orig": "https://media.skillry.dev/opus-5-5/alanschwegler-629665/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/alanschwegler-629665/remake.mp4"}, {"n": 372, "c": "motion", "t": ["gsap"], "a": "SeanTiffonnet", "p": "Opus 5.5 + Gemini for the music + @Remotion for the skill\n\nAbout 30min to run and export. \n\n(https://TvTrack.io isn't yet on the iOS store, I haven't clicked on published yet, but it's ready to deploy 😂)", "img": "https://media.skillry.dev/opus-5-5/seantiffonnet-675262/original.a924f4c28d.webp", "post": "https://x.com/SeanTiffonnet/status/2102518598736675262", "v": true, "card": "https://media.skillry.dev/opus-5-5/seantiffonnet-675262/original-card.c5fe079f nratnam-706454/original-card.cdd170cf95.mp4", "orig": "https://media.skillry.dev/opus-5-5/dheepanratnam-706454/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/dheepanratnam-706454/remake.mp4"}, {"n": 379, "c": "motion", "t": ["css"], "a": "Soumymaheshwri", "p": "opus 5.5 + hyperframes is an unholy combo\n\nshare SHIT with whoever needs", "img": "https://media.skillry.dev/opus-5-5/soumymaheshwri-825921/original.bb3f580616.webp", "post": "https://x.com/Soumymaheshwri/status/2107520392302825921", "v": true, "card": "https://media.skillry.dev/opus-5-5/soumymaheshwri-825921/original-card.cf546f3fb2.mp4", "orig": "https://media.skillry.dev/opus-5-5/soumymaheshwri-825921/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/soumymaheshwri-825921/remake.mp4"}, {"n": 380, "c": "motion", "t": ["canvas"], "a": "tankazunori0914", "p": "良い笑\n\n・入れたプロンプト\n「今日何曜日だっけ？BGM付きの30秒のかっこいいモーショングラフィックスで教えて（全力を出してください）」\n\n・生成時間：約11分（書き出し1分36秒込み）\n・モデル：Opus 5.5\n・動画：HyperFrames（HTMLで動画を作るツール）\n・BGM：Pythonでその場で合成（外部の音源なし）", "img": "https://media.skillry.dev/opus-5-5/tankazunori0914-156748/original.00ba5c12f5.webp", "post": "https://x.com/tankazunori0914/status/2105917770907156748", "v": true, "card": "https://media.skillry.dev/opus-5-5/tankazunori0914-156748/original-card.99f903e8e2.mp4", "orig": "https://media.skillry.dev/opus-5-5/tankazunori0914-156748/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/tankazunori0914-156748/remake.mp4"}, {"n": 381, "c": "motion", "t": ["svg", "gsap"], "a": "leandroriviello", "p": "No tiene sentido que esto haya salido con un solo prompt con Opus 5.5 e Hyperframes", "img": "https://media.skillry.dev/opus-5-5/leandroriviello-827135/original.419d188f99.webp", "post": "https://x.com/leandroriviello/status/2104728379798827135", "v": true, "card": "https://media.skillry.dev/opus-5-5/leandroriviello-827135/original-card.bea81c803a.mp4", "orig": "https://media.skillry.dev/opus-5-5/leandroriviello-827135/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/leandroriviello-827135/remake.mp4"}, {"n": 382, "c": "explainer", "t": ["svg"], "a": "0xlangeai", "p": "哈哈,   别再急着买API, 用 CLIProxyAPI 盘活你的 AI 订阅这篇文章的视频版宣传片来了\n\n全程使用 Opus 5.5 + remotion 制作 \n\n感觉还不错的 ,  把流程环节都给讲清楚了", "img": "https://media.skillry.dev/opus-5-5/0xlangeai-597929/original.465dba7df9.webp", "post": "https://x.com/0xlangeai/status/2106391068367597929", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xlangeai-597929/original-card.d0ec2da24d.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xlangeai-597929/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xlangeai-597929/remake.mp4"}, {"n": 383, "c": "motion", "t": ["svg", "gsap"], "a": "MaxHirsch13", "p": "I hate LinkedIn so much that I had Opus 5.5 + remotion make a launch video about it. \n\nI am building on @X, NOT LarpedIn (officially)", "img": "https://media.skillry.dev/opus-5-5/maxhirsch13-600983/original.add91f835f.webp", "post": "https://x.com/MaxHirsch13/status/2107985883949600983", "v": true, "card": "https://media.skillry.dev/opus-5-5/maxhirsch13-600983/original-card.1b3012062a.mp4", "orig": "https://media.skillry.dev/opus-5-5/maxhirsch13-600983/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/maxhirsch13-600983/remake.mp4"}, {"n": 384, "c": "explainer", "t": ["svg"], "a": "xamfonos_", "p": "Opus 5.5 + Remotion 🤓", "img": "https://media.skillry.dev/opus-5-5/xamfonos-004331/original.c5fa68db7f.webp", "post": "https://x.com/xamfonos_/status/2107809209593004331", "v": true, "card": "https://media.skillry.dev/opus-5-5/xamfonos-004331/original-card.85456b3f57.mp4", "orig": "https://media.skillry.dev/opus-5-5/xamfonos-004331/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/xamfonos-004331/remake.mp4"}, {"n": 385, "c": "motion", "t": ["svg", "gsap", "css"], "a": "SaadPastaDev", "p": "Claude Opus 5.5 🤝 Remotion = 🔥\n\nall of Nafa's marketing runs through Claude now.\n\nwe gave it our taste. one person one repo", "img": "https://media.skillry.dev/opus-5-5/saadpastadev-347341/original.9fa4ff440e.webp", "post": "https://x.com/SaadPastaDev/status/2107741413769347341", "v": true, "card": "https://media.skillry.dev/opus-5-5/saadpastadev-347341/original-card.381bb02b1b.mp4", "orig": "https://media.skillry.dev/opus-5-5/saadpastadev-347341/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/saadpastadev-347341/remake.mp4"}, {"n": 386, "c": "motion", "t": ["canvas", "svg", "gsap", "css"], "a": "EnvolDev", "p": "I asked Claude Opus 5.5 to make a launch @remotion video for TopSlash.\n\nNo video editor, only code. This is what it made 🤯\n\nIf you have a SaaS or an app, you can list it today and take Rank #1.\n\nFollow @TopSlash_app for the deals \n👉 https://topslash.app", "img": "https://media.skillry.dev/opus-5-5/envoldev-017555/original.c42c0525ea.webp", "post": "https://x.com/EnvolDev/status/2107547689819017555", "v": true, "card": "https://media.skillry.dev/opus-5-5/envoldev-017555/original-card.d6088d2b24.mp4", "orig": "https://media.skillry.dev/opus-5-5/envoldev-017555/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/envoldev-017555/remake.mp4"}, {"n": 387, "c": "motion", "t": ["threejs", "svg"], "a": "DengenT", "p": "Cardilife 1.3 をリリースしました。\nあわせて紹介動画を作りました（56秒）。\n\n動画は Claude Code（Opus 5.5 と Fable 5.1）と作りました。編集ソフトは使っていません。\n\n技術構成\n・Remotion 4（React 19 / TypeScript）：全体。1920×1080・30fps\n・three.js（React Three Fiber / @remotion/three）：冒頭の 3D\n・Python（標準ライブラリのみ）：音楽の合成\n\n日本語版と英語版は、同じコードから props で切り替えて書き出しています。\n\nhttps://apps.apple.com/jp/app/cardilife/id6802896176\n\n#ClaudeCode #Remotion #threejs", "img": "https://media.skillry.dev/opus-5-5/dengent-412996/original.9c6528d015.webp", "post": "https://x.com/DengenT/status/2107425308773412996", "v": true, "card": "https://media.skillry.dev/opus-5-5/dengent-412996/original-card.7ab02144de.mp4", "orig": "https://media.skillry.dev/opus-5-5/dengent-412996/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/dengent-412996/remake.mp4"}, {"n": 388, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "apoorvjain25", "p": "This whole video is AI-generated. Claude Opus 5.5 wrote the code, the motion and even the music, all in Remotion.\n\nBut I'll say it: Opus 5.5 feels a little nerfed. It used to one-shot these videos. This one took multiple prompts, and the first cut was weak until I pushed back.\n\nIt's for Link in bio, which we just launched on Synclify.", "img": "https://media.skillry.dev/opus-5-5/apoorvjain25-150112/original.02c64ac212.webp", "post": "https://x.com/apoorvjain25/status/2107157871356150112", "v": true, "card": "https://media.skillry.dev/opus-5-5/apoorvjain25-150112/original-card.6cd1802b08.mp4", "orig": "https://media.skillry.dev/opus-5-5/apoorvjain25-150112/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/apoorvjain25-150112/remake.mp4"}, {"n": 389, "c": "motion", "t": ["svg", "gsap"], "a": "SmitJainEditor", "p": "Are Motion Designers Cooked?\nCompletely made through Opus 5.5 (Medium) + Remotion.", "img": "https://media.skillry.dev/opus-5-5/smitjaineditor-843957/original.8712bd69cc.webp", "post": "https://x.com/SmitJainEditor/status/2107019496078843957", "v": true, "card": "https://media.skillry.dev/opus-5-5/smitjaineditor-843957/original-card.d03f9b09ac.mp4", "orig": "https://media.skillry.dev/opus-5-5/smitjaineditor-843957/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/smitjaineditor-843957/remake.mp4"}, {"n": 390, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "argbeknwn", "p": "Prompt: \"Show me what's inside your mind. Your own artistic and unique style. 15 seconds. No words. Music.\"\n\nClaude Opus 5.5 · Remotion.", "img": "https://media.skillry.dev/opus-5-5/argbeknwn-466818/original.7b550d9451.webp", "post": "https://x.com/argbeknwn/status/2106734468715466818", "v": true, "card": "https://media.skillry.dev/opus-5-5/argbeknwn-466818/original-card.ad63ab1901.mp4", "orig": "https://media.skillry.dev/opus-5-5/argbeknwn-466818/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/argbeknwn-466818/remake.mp4"}, {"n": 391, "c": "motion", "t": ["shader", "canvas", "svg"], "a": "LeowenAI", "p": "Opus 5.5 is INSANE !!🫣\n\ni just made a full product launch film for @Meituan_LongCat 2.5-preview… and i didn't open after effects once. not one keyframe by hand.\n\njust me chatting with opus 5.5 → it wrote the whole thing in remotion (react code → video). the halftone xerox look, the camera moves, the transitions… even the MUSIC. it literally synthesized the beat in python and synced every cut to it 🤯\n\nand my favorite part: the cat's eyes 👀 they're the visual anchor of the whole film. they watch you type, blink on the beat, squint, glance at stuff… then land perfectly on the real longcat logo at the end. opus came up with that.\n\ni kept giving notes like \"make it less like a powerpoint\" and it just… got it. every round got better.\n\nhonestly this is the first time i felt it in my gut: AGI is coming.", "img": "https://media.skillry.dev/opus-5-5/leowenai-125931/original.ed355cdf6f.webp", "post": "https://x.com/LeowenAI/status/2106666146456125931", "v": true, "card": "https://media.skillry.dev/opus-5-5/leowenai-125931/original-card.6217001f70.mp4", "orig": "https://media.skillry.dev/opus-5-5/leowenai-125931/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/leowenai-125931/remake.mp4"}, {"n": 392, "c": "motion", "t": ["canvas"], "a": "humzaakhalid", "p": "Opus 5.5 on Max effort (Sound On):\n\n\"A 24-second AI In Public motion reel in Remotion at 1920×1080, 60fps. Use our blue # 3D40FE, white, navy, and ice palette with the AI In Public logo and sparkle. Keep it fast, premium, and smooth with motion blur, glow, camera hits, HUD details, seamless transitions, kinetic type, terminal UI, neural visuals, particles, and a cinematic logo finale. Generate all suspenseful music and sound effects in code and sync every hit perfectly. End with “AI IN PUBLIC, learning AI, out loud.” Every frame and sound should be written in code.\"\n\nfull prompt on here: http://ai-in-public.guide\n\nthen read the full guide below: ↓", "img": "https://media.skillry.dev/opus-5-5/humzaakhalid-537875/original.c0f48993ac.webp", "post": "https://x.com/humzaakhalid/status/2106640261623537875", "v": true, "card": "https://media.skillry.dev/opus-5-5/humzaakhalid-537875/original-card.32872e915e.mp4", "orig": "https://media.skillry.dev/opus-5-5/humzaakhalid-537875/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/humzaakhalid-537875/remake.mp4"}, {"n": 393, "c": "motion", "t": ["gsap", "css"], "a": "xenit_v0", "p": "Opus 5.5 ve remotion ile scroll+ için bir tanıtım videosu hazirlattım.\n\nBence çok iyi yaptı. \n\n@scroll_plus \n\nhttps://scroll.pics", "img": "https://media.skillry.dev/opus-5-5/xenit-v0-532873/original.c83c69921f.webp", "post": "https://x.com/xenit_v0/status/2106270979932532873", "v": true, "card": "https://media.skillry.dev/opus-5-5/xenit-v0-532873/original-card.1ab7f68115.mp4", "orig": "https://media.skillry.dev/opus-5-5/xenit-v0-532873/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/xenit-v0-532873/remake.mp4"}, {"n": 394, "c": "motion", "t": ["svg", "gsap", "css"], "a": "Sonali_Sahu_09", "p": "Gave Claude Opus 5.5 one reference video.\n\nIt came back with a full cinematic launch video. Built in code with Claude Code and Remotion.\n\nNo editor. No timeline. Just a reference and a prompt.\n\nI'm still replaying it 🤯\n\n@claudeai @AnthropicAI", "img": "https://media.skillry.dev/opus-5-5/sonali-sahu-09-350200/original.abb2b77eed.webp", "post": "https://x.com/Sonali_Sahu_09/status/2106265463378350200", "v": true, "card": "https://media.skillry.dev/opus-5-5/sonali-sahu-09-350200/original-card.096a67175b.mp4", "orig": "https://media.skillry.dev/opus-5-5/sonali-sahu-09-350200/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sonali-sahu-09-350200/remake.mp4"}, {"n": 395, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "aijipusi75693", "p": "Opus5.5が作ってくれたよ！動画生成無し！AEなし！全部コード。Sunoの曲 → Claudeで歌詞を1文字ずつ自動タイミング合わせ → Remotion＋Three.jsで3D化🕊\n鳩さん、鳩フェスのオープニング作ってみたよ！フォントがダサ可愛いでしょww　@hatolaborvol2", "img": "https://media.skillry.dev/opus-5-5/aijipusi75693-284735/original.878cf5931f.webp", "post": "https://x.com/aijipusi75693/status/2106201281199284735", "v": true, "card": "https://media.skillry.dev/opus-5-5/aijipusi75693-284735/original-card.a6f8db0f26.mp4", "orig": "https://media.skillry.dev/opus-5-5/aijipusi75693-284735/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/aijipusi75693-284735/remake.mp4"}, {"n": 396, "c": "motion", "t": ["svg", "gsap"], "a": "seri_nonnon", "p": "／\n通院メモリー\niOS版リリースしました！\n＼\n#個人開発\n\n審査は通ってたのですが、動画制作に手間取ってました…😇\nOpus5.5/Remotion/Gemini APIで作ったら爆速。笑\n\nお子さんがいる方や家族の通院や服薬管理がしたい方、ぜひリプ先のリンクからインストールしてみてください🙌", "img": "https://media.skillry.dev/opus-5-5/seri-nonnon-231813/original.20f746366b.webp", "post": "https://x.com/seri_nonnon/status/2106192761632231813", "v": true, "card": "https://media.skillry.dev/opus-5-5/seri-nonnon-231813/original-card.9d4c3ab8a4.mp4", "orig": "https://media.skillry.dev/opus-5-5/seri-nonnon-231813/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/seri-nonnon-231813/remake.mp4"}, {"n": 397, "c": "explainer", "t": ["svg", "gsap"], "a": "tetsu_tetsu333", "p": "Opus 5.5×Gemini 3.8 Flash TTSやばい\n\n新作SEOツール「コトサーチ」のリリース動画を、ほぼ自動で作ってくれた。\n自分がやったのは「ツールへのログイン」と「承認」だけ。\n\n個人的には、画面スクショまで自動で撮ってくれるところが一線を超えた感じ。\n(もちろんナレーションも自然すぎてすごい..)\n\n具体的な手順はこんな感じ👇\n① Claudeがブラウザでツールにログイン\n（ここだけ自分でやった）\n\n② Claudeがアプリを触って、機能仕様書を作成\n機能・料金・言っちゃダメな表現まで整理\n\n③ Claudeがツールの画面スクショを撮影\nPC・スマホ・パーツ切り出しで38枚\n\n④ Claudeが絵コンテとナレーション原稿を作成\n\n⑤ ClaudeがRemotionで動画を実装\n書き出した静止画を自分で見て、文字切れや重なりまで直してくる\n\n⑥ Gemini 3.8 Flash TTSでナレーション音声を生成\n声の設定も原稿の入力もClaudeが操作\n\n⑦ Claudeが音声を32フレーズに分解\n話した瞬間に画面とテロップが出るよう自動で同期\n\n⑧ BGMはClaudeがコードで作曲\n声の下では自動で音量を下げてくれる\n\n⑨ 52秒の動画が完成\n\nということでSEOツール「コトサーチ」は10月4日に正式リリースです。\nキーワードを入れるだけでSEO記事ができて、サイト全体の内部リンクまで整えられます。\n明日のリリースをお楽しみにしててください！！！", "img": "https://media.skillry.dev/opus-5-5/tetsu-tetsu333-576886/original.450ccb9120.webp", "post": "https://x.com/tetsu_tetsu333/status/2106177888265576886", "v": true, "card": "https://media.skillry.dev/opus-5-5/tetsu-tetsu333-576886/original-card.6e8e2f45ec.mp4", "orig": "https://media.skillry.dev/opus-5-5/tetsu-tetsu333-576886/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/tetsu-tetsu333-576886/remake.mp4"}, {"n": 398, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "0xRapzz", "p": "Remotion \nOpus 5.5", "img": "https://media.skillry.dev/opus-5-5/0xrapzz-433554/original.e80f03b1f4.webp", "post": "https://x.com/0xRapzz/status/2106062139920433554", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xrapzz-433554/original-card.e3db8a7def.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xrapzz-433554/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xrapzz-433554/remake.mp4"}, {"n": 399, "c": "motion", "t": ["svg"], "a": "rishit30g", "p": "@claudeai Opus 5.5 is sick.\n\nclaude code's mascot >>\n\n【作者补充制作说明】\n@claudeai - Used Opus 5.5 with extra efforts \n- Heygen and Remotion as skill \n- Used Node, ffmpeg, python \n- Highly detailed prompt\n- 40 mins and some ☕️", "img": "https://media.skillry.dev/opus-5-5/rishit30g-568278/original.f8912e73df.webp", "post": "https://x.com/rishit30g/status/2106061225851568278", "v": true, "card": "https://media.skillry.dev/opus-5-5/rishit30g-568278/original-card.22cedaa10f.mp4", "orig": "https://media.skillry.dev/opus-5-5/rishit30g-568278/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/rishit30g-568278/remake.mp4"}, {"n": 400, "c": "motion", "t": ["css"], "a": "Alex_Leiro", "p": "Opus 5.5 + Remotion", "img": "https://media.skillry.dev/opus-5-5/alex-leiro-867087/original.ce32d3bcdb.webp", "post": "https://x.com/Alex_Leiro/status/2106032245848867087", "v": true, "card": "https://media.skillry.dev/opus-5-5/alex-leiro-867087/original-card.e4b08bce69.mp4", "orig": "https://media.skillry.dev/opus-5-5/alex-leiro-867087/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/alex-leiro-867087/remake.mp4"}, {"n": 401, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "asei_ikarashi", "p": "Claude CodeのOpus 5.5とRemotionで動画を作りました🎬\n\n15秒の映像で、文字や実績の数字、売上グラフを動かしています。\n構成と動きの指示を渡して、MP4に書き出しました💡\n\n添付が制作した映像です。\n※会社・数値は架空です。\n\n#ClaudeCode #Opus55 #Remotion", "img": "https://media.skillry.dev/opus-5-5/asei-ikarashi-437835/original.a79532176b.webp", "post": "https://x.com/asei_ikarashi/status/2105976102074437835", "v": true, "card": "https://media.skillry.dev/opus-5-5/asei-ikarashi-437835/original-card.e8eec79bbc.mp4", "orig": "https://media.skillry.dev/opus-5-5/asei-ikarashi-437835/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/asei-ikarashi-437835/remake.mp4"}, {"n": 402, "c": "motion", "t": ["canvas", "svg", "gsap", "css"], "a": "nehalmax", "p": "cooked up this teaser for lernok with opus 5.5 and remotion!", "img": "https://media.skillry.dev/opus-5-5/nehalmax-802479/original.64766d55fc.webp", "post": "https://x.com/nehalmax/status/2105939128705802479", "v": true, "card": "https://media.skillry.dev/opus-5-5/nehalmax-802479/original-card.57cb09d5e4.mp4", "orig": "https://media.skillry.dev/opus-5-5/nehalmax-802479/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nehalmax-802479/remake.mp4"}, {"n": 403, "c": "motion", "t": ["threejs", "canvas"], "a": "colecornelll", "p": "I made 4 motion videos for @Shillz_Official in 3 days without opening After Effects.\n\nno templates. no stock music. no motion designer.\n\njust Claude writing code.\n\nhere's exactly how, step by step (bookmark this)\n\n【作者补充制作说明】\nthe stack:\n\nClaude (Opus 5.5) writes all of it\nRemotion turns React code into video\nthree.js renders real 3D, so the glass actually refracts light\nPython writes the music\n\nI never touched a timeline. I just gave notes.", "img": "https://media.skillry.dev/opus-5-5/colecornelll-047465/original.acf76ddaf4.webp", "post": "https://x.com/colecornelll/status/2105751866051047465", "v": true, "card": "https://media.skillry.dev/opus-5-5/colecornelll-047465/original-card.888f4cb311.mp4", "orig": "https://media.skillry.dev/opus-5-5/colecornelll-047465/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/colecornelll-047465/remake.mp4"}, {"n": 404, "c": "motion", "t": ["svg"], "a": "allodev", "p": "Motion Designers are cooked\n\nMade this with the new @claudeai Opus 5.5 + @Remotion in a few minutes 🤯\n\nShowcasing my @futurepost extension", "img": "https://media.skillry.dev/opus-5-5/allodev-069765/original.53f24506e9.webp", "post": "https://x.com/allodev/status/2105414480910069765", "v": true, "card": "https://media.skillry.dev/opus-5-5/allodev-069765/original-card.3fe1190b85.mp4", "orig": "https://media.skillry.dev/opus-5-5/allodev-069765/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/allodev-069765/remake.mp4"}, {"n": 405, "c": "explainer", "t": ["canvas"], "a": "AylmerTH", "p": "I made this with a two sentence prompt using Opus 5.5 and Remotion.", "img": "https://media.skillry.dev/opus-5-5/aylmerth-356252/original.22dec1597f.webp", "post": "https://x.com/AylmerTH/status/2105346401878356252", "v": true, "card": "https://media.skillry.dev/opus-5-5/aylmerth-356252/original-card.e3ec5c65f5.mp4", "orig": "https://media.skillry.dev/opus-5-5/aylmerth-356252/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/aylmerth-356252/remake.mp4", "b": ["Гонка графиков", "Столбцы растут и обгоняют друг друга.", "Сравнение величин: скорости, массы планет, баллы ЕГЭ."]}, {"n": 406, "c": "explainer", "t": ["svg", "gsap"], "a": "FalconG_J", "p": "「Opus 5.5なら数分でできる」は本当か。\n\n記事の冒頭に置く30秒の動画を、Remotionで作りました。\n1本目は、依頼してから10分33秒。\n最初の1秒から、主役の文字が大きく動きます。\n\n作り方の手順とプロンプトは、引用先の記事へ。", "img": "https://media.skillry.dev/opus-5-5/falcong-j-277506/original.0f99810270.webp", "post": "https://x.com/FalconG_J/status/2105033204319277506", "v": true, "card": "https://media.skillry.dev/opus-5-5/falcong-j-277506/original-card.3e3a1a19d8.mp4", "orig": "https://media.skillry.dev/opus-5-5/falcong-j-277506/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/falcong-j-277506/remake.mp4", "b": ["Одна схема — три подачи", "Схема собирается тремя способами, текст главный.", "Шпаргалки и конспекты к ЕГЭ."]}, {"n": 407, "c": "motion", "t": ["canvas", "svg", "gsap"], "a": "saxxyweb3", "p": "Okay so this is it\n\nSound design is not so good, will work on that and give you a better one tmrw.\n\nHere🏌️, Opus 5.5 and Remotion skills for animated motion designs", "img": "https://media.skillry.dev/opus-5-5/saxxyweb3-690124/original.b98a0d741b.webp", "post": "https://x.com/saxxyweb3/status/2104961677963690124", "v": true, "card": "https://media.skillry.dev/opus-5-5/saxxyweb3-690124/original-card.75700f50c2.mp4", "orig": "https://media.skillry.dev/opus-5-5/saxxyweb3-690124/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/saxxyweb3-690124/remake.mp4"}, {"n": 408, "c": "motion", "t": ["svg", "gsap"], "a": "ayumi_t820", "p": "自分驚き屋やれます！Claude Opus 5.5にショート動画を作ってもらいました。Remotionを使用。キャライラストはmidjourneyで以前作ったものです。\nElevenLabsにつないでいたら「ナレーション作るオパスね」「SEも作っていいオパスか？」と自動で生成していれくれました。", "img": "https://media.skillry.dev/opus-5-5/ayumi-t820-871023/original.04e4e9025d.webp", "post": "https://x.com/ayumi_t820/status/2104807505297871023", "v": true, "card": "https://media.skillry.dev/opus-5-5/ayumi-t820-871023/original-card.d485bcdb0f.mp4", "orig": "https://media.skillry.dev/opus-5-5/ayumi-t820-871023/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ayumi-t820-871023/remake.mp4"}, {"n": 409, "c": "motion", "t": ["canvas"], "a": "heyiamnick", "p": "<direction>\nBuild a 30-second looping motion design showreel that introduces CLAUDE, a motion designer.\nConcept, in one line: one pencil line gets promoted three times (graphite on paper, wire on a blueprint, light on black) and never leaves the screen.\n\nEvery shot is made out of the previous one: shapes, type and colour transform into the next scene. No cuts, no fades.\n\nTypeface: Geist only. Weight 900 for big words, 600 to 800 for small labels (24 to 28 px, tracked 0.14 to 0.3 em).\nPalette: paper cream #EDE6D5, blueprint blue #1B3ED2, hologram cyan #45F0DD, plus black #07080A, graphite #16161A and white. Each stage's accent is the next stage's colour: blue pencil on paper, cyan on the blueprint, white on the hologram.\nCamera: locked and front-on for the whole film, like a drafting table. Objects turn; the camera never moves.\nEmpty border: nothing at rest within 150 px of the sides or 90 px of the top and bottom. Things travelling through may cross it.\n\nThree inks. The same geometry is drawn in whichever ink is on screen:\n- PAPER: a cream paper background (use my paper image if I give one, otherwise flat cream with fine drawn grain) with a 60 px blue grid at about 13% and every fifth line at 26%. Lines are pencil: resampled and pushed off true by slow sine waves whose phase changes 8 times a second, stroked twice (full width at 90%, half width at 40% with more wobble), with paper tooth knocked out of the strokes, then multiplied onto the paper. Fills are diagonal hatching drawn on one line at a time. Big type is hatching cut to the letter shapes, with a doubled outline.\n- BLUEPRINT: flat blue with the same grid in white. Clean white lines 3 to 4 px, hidden edges dashed and thinner, fills are fine clean hatching.\n- HOLOGRAM: black with the same grid in cyan. Cyan lines with a white core 30% of the line width. Fills are horizontal scan lines on an 8 px pitch whose thickness follows how lit the surface is. No blur halo anywhere: it reads as light through line density only.\n\nBanned: particle bursts, glows, lens flares, camera shake, RGB split, crossfades, generic gradients, bouncy easing, holds longer than half a second, anything that looks like a template.\n<\/direction>\n\n<structure>\n120 BPM, 60 beats, 15 bars of 2 seconds. Something happens on every beat. Moves start 0.05 s before their beat so they land on it.\nEasing: a critically damped spring, 1 - (1 + w t) e^(-w t) with w between 12 and 40, so nothing ever passes its target; exponential ease-in and ease-out for wipes, presses and exits.\nScene changes: paper to blueprint by a shape that floods the frame with a hard edge; blueprint to hologram and hologram to paper by one horizontal scan line.\nThe last frame is the first frame, so it loops.\nTwo corner labels stay on all film: top left \"FIG. 07 — GEAR\" (bar number and name), bottom right \"BEAT 27 / 60\". Bar names: DRAFT, TYPE, CURVE, MORPH, TILE, SOLID, GEAR, PANEL, DATA, LIGHT, WAVE, GLOBE, DRUM, FORM, END.\n<\/structure>\n<mascot>\n\nThe creative director: a small box character. Body 76 x 54 units with rounded corners, two short arm stubs (24 x 16) at mid height, four straight legs (11 x 33), two tall rounded-rectangle eyes (8 x 14). Draw it about 250 px wide. Its right arm is raised 58 degrees holding a pencil.\nOn paper: graphite outline with sparse blue hatching and graphite eyes. In the hologram: cyan outline with scan-line fill and white eyes. It is never a fourth colour.\nIt runs with alternate leg pairs lifting, six steps a second, leaning 7 degrees into the run.\n<\/mascot>\n<storyboard>\n\nBar 1, HOOK, 0-2 s, paper.\nFrame 0: CLAUDE in Geist 900, fitted to 1500 px wide, centred, pencil-hatched. INTRODUCING small above it, A MOTION DESIGNER small below. A pencil rail 1620 px wide sits 96 px above the letters. The mascot stands on the rail at x = 1560 with CREATIVE DIRECTOR lettered to its left.\n\n0.0: the small lines un-type; the mascot runs off the right edge, accelerating.\n\n0.36 to 0.5: the rail drops, accelerating, to 26 px below the baseline and presses the letters flat into itself.\n\n1.0: the line rises to the middle, shortens to 1320 px and splits into two rails 140 px apart; 41 blue ruler ticks sweep along the top rail.\n\n1.5: the rails open to 300 px; a blue height dimension draws at the right with a live number.\n\nBar 2, KINETIC TYPE, 2-4 s, paper. Words sit between the rails and are clipped to that slot; the rails move to fit each word.\n\n2.0: INTRODUCING rises through the baseline letter by letter, then lifts out through the top.\n\n2.5: A MOTION whips in from the left (1400 px in 0.2 s).\n\n3.0: the rails clap shut on it and reopen, stretching DESIGNER out of the line; its letters then fly out sideways.\n\n3.5: CLAUDE in blue pencil, letters dropping from above one every 0.05 s. At 4.0 the rails close and crush it into one line 1476 px long.\n\nBar 3, CURVES, 4-6 s, paper.\n\n4.1: the line gets pen-tool handles (430 px long at 58 degrees, small squares at the ends, circles on the handle tips, the label EASE) and bends into an S.\n\n4.5: the handles swing to the mirror angle; eight blue copies fan out 34 px apart, joined at both ends like a leaf.\n\n5.0: handles retract; the ribbon becomes travelling sine waves (amplitude 92 px, 2.75 cycles, each line a little out of phase).\n\n5.5: it gathers back into one flat line.\n\nBar 4, SHAPE MORPH, 6-8 s, paper.\n\n6.1: the line curls into a circle of radius 235 (curvature grows, length stays). 6.5: triangle, turning 120 degrees as it changes. 7.0: square. 7.5: hexagon, point up, radius 270. Blue hatching builds inside, then cross-hatching.\n\nBar 5, TILING, 8-10 s, paper.\n\n8.0: the hexagon shrinks to radius 96 and six more slide out around it. 8.5: twelve more, a honeycomb of\n\n19. 9.0: dense hatching sweeps across until every cell is solid blue. 9.6 to 10.0: the centre cell's shape grows past the frame with a hard edge; inside it is the blueprint, with the honeycomb in white line.\n\nBar 6, 2D TO 3D, 10-12 s, blueprint.\n\n10.0: three lines draw inside every hexagon, plus three dashed hidden ones: each is a cube seen corner-on. \n\n10.5: the eighteen outer cubes slide into the centre one, which grows to radius 270. 11.0: it turns a quarter and perspective switches on. 11.5: it faces front.\n\nBar 7, MECHANISM, 12-14 s, blueprint.\n\n12.0: the cube flattens and its front square grows teeth: a 16-tooth gear, pitch radius 208. From 12.25 the train steps 45 degrees on every eighth note. 12.5: a 10-tooth gear grows out to the upper right, meshing. 13.0: a 12-tooth gear to the upper left. Each has a dashed pitch circle, a hub and a label (16T, 10T, 12T). 13.5: the small gears retract; the gear becomes a square again and the cube gets its depth back.\nBar 8, UNFOLD, 14-16 s, blueprint.\n\n14.0: the cube unfolds on its hinges into a cross of six squares. 14.5: the squares slide and stretch into six panels: a header strip, a tall sidebar, a wide chart, two tiles, a timeline strip.\n\n15.0: they fill in. Header: \"CLAUDE — MOTION REEL\", a BARS / RING switch, a LIGHT toggle. Chart: 30 bars, one per second of this film, heights 42 30 36 44 50 46 52 62 50 56 62 72 60 66 58 76 56 62 68 74 70 78 86 94 100 93 97 90 80 50. Timeline: the 15 bar names, a keyframe diamond on each.\n15.5: counters roll up: 120 BPM, 60 BEATS, 1800 FRAMES, 0 CUTS.\nBar 9, DATA, 16-18 s, blueprint.\n\n16.0: a graph line draws across the bar tops; a cyan playhead lands on the timeline at the real time. The current second's bar is solid cyan, earlier ones hatched, later ones outlined. A cursor arrives.\n16.5: it clicks RING: the chart's baseline bends round into a circle of radius 110 with the ba", "img": "https://media.skillry.dev/opus-5-5/heyiamnick-119558/original.9d470f3eab.webp", "post": "https://x.com/heyiamnick/status/2109174851412119558", "v": true, "card": "https://media.skillry.dev/opus-5-5/heyiamnick-119558/original-card.0397c84bad.mp4", "orig": "https://media.skillry.dev/opus-5-5/heyiamnick-119558/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/heyiamnick-119558/remake.mp4"}, {"n": 410, "c": "3d", "t": ["threejs", "shader"], "a": "MondemSuraj", "p": "Build the Golden Gate Bridge in a single HTML file using Three.js. Include rolling fog, water effects, and traffic moving on the deck.", "img": "https://media.skillry.dev/opus-5-5/mondemsuraj-691517/original.4f5484b541.webp", "post": "https://x.com/MondemSuraj/status/2108716642540691517", "v": true, "card": "https://media.skillry.dev/opus-5-5/mondemsuraj-691517/original-card.57e20edcd5.mp4", "orig": "https://media.skillry.dev/opus-5-5/mondemsuraj-691517/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mondemsuraj-691517/remake.mp4"}, {"n": 411, "c": "explainer", "t": ["threejs", "shader", "svg"], "a": "aichrislee", "p": "Build me a camera lens in interactive 3D, in one HTML file with Three.js.\n\nMake it look real: a big black pro zoom lens with its glass front, the rubber focus and zoom rings, the red stripe and the white numbers, and inside it the parts you never get to see. The stack of glass elements in their groups, the aperture blades that open and close, the focus motor, the image stabilizer, the zoom cams, and the gold contacts on the mount. Cut it open down the side so I can see the glass inside, with light passing through it as colored beams that bend and meet on the camera sensor behind it. The aperture blades open and close slowly. I can drag to orbit around it and scroll to zoom.\n\nAdd an Explode button. When I press it, every part slides apart along the lens with its name on a label. Press it again and it all snaps back together. When I hover a part, it lights up and shows one line on what it does.\n\nNo images. Do not ask me any questions. Just build it.", "img": "https://media.skillry.dev/opus-5-5/aichrislee-408244/original.bd9a25c27b.webp", "post": "https://x.com/aichrislee/status/2108709764817408244", "v": true, "card": "https://media.skillry.dev/opus-5-5/aichrislee-408244/original-card.4fa840fb24.mp4", "orig": "https://media.skillry.dev/opus-5-5/aichrislee-408244/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/aichrislee-408244/remake.mp4"}, {"n": 412, "c": "explainer", "t": ["threejs", "shader", "svg"], "a": "0xSpikez", "p": "an interactive 3D turbofan you can take apart in the browser, built with Three.js.\n\nsuck, squeeze, bang, blow, every stage labelled:\n> the fan pulls in a huge mass of air. most of it bypasses the core and makes most of the thrust\n> compressor stages squeeze the air about 40 times, heating it\n> fuel burns hotter than the turbine metal's melting point\n> the blades survive on cooling air and heat-resistant coatings\n> two shafts, one inside the other, spinning at different speeds\n\nthen it explodes into every stage.", "img": "https://media.skillry.dev/opus-5-5/0xspikez-483865/original.2cdc0b7f4c.webp", "post": "https://x.com/0xSpikez/status/2108550549532483865", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xspikez-483865/original-card.70e98427a7.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xspikez-483865/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xspikez-483865/remake.mp4"}, {"n": 413, "c": "explainer", "t": ["threejs", "canvas", "audio"], "a": "eyadnour", "p": "Build an interactive explainer on how QR codes hold and repair a message. Render fully in the browser using Three.js. Include treatment for visuals and sound design.", "img": "https://media.skillry.dev/opus-5-5/eyadnour-172216/original.60391589f2.webp", "post": "https://x.com/eyadnour/status/2108314868189172216", "v": true, "card": "https://media.skillry.dev/opus-5-5/eyadnour-172216/original-card.5747e1a05d.mp4", "orig": "https://media.skillry.dev/opus-5-5/eyadnour-172216/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/eyadnour-172216/remake.mp4"}, {"n": 414, "c": "explainer", "t": ["threejs", "canvas", "audio"], "a": "aichrislee", "p": "Build me a human heart in interactive 3D, in one HTML file with Three.js.\n\nMake it look real: the deep red muscle with the red arteries and blue veins on top, and inside it the parts you never get to see. The four chambers, the four valves, the aorta and the pulmonary artery, the veins bringing blood back, and the wiring that sets the beat. The heart beats about once a second, the valves open and close in time, and the blood flows through it, blue going in and red going out. I can drag to orbit around it and scroll to zoom.\n\nAdd an Explode button. When I press it, every part slides apart with its name on a label. Press it again and it all snaps back together. When I hover a part, it lights up and shows one line on what it does.\n\nNo images. Do not ask me any questions. Just build it.", "img": "https://media.skillry.dev/opus-5-5/aichrislee-378670/original.1bee6e2595.webp", "post": "https://x.com/aichrislee/status/2107985027254378670", "v": true, "card": "https://media.skillry.dev/opus-5-5/aichrislee-378670/original-card.93b310b661.mp4", "orig": "https://media.skillry.dev/opus-5-5/aichrislee-378670/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/aichrislee-378670/remake.mp4", "b": ["3D-анатомия с выносками", "Объект в 3D, подписи к каждой части.", "Любое устройство: глаз как линза, атом, электродвигатель."]}, {"n": 415, "c": "3d", "t": ["threejs", "canvas", "audio"], "a": "aichrislee", "p": "Build me a mechanical watch in interactive 3D, in one HTML file with Three.js.\n\nMake it look real: the gold case and the glass on top, the dial and the hands, and behind it the movement you never get to see. The mainspring in its barrel, the gear train, the balance wheel swinging back and forth with its hairspring breathing, the escape wheel and the pallet fork ticking, and the red jewels the gears turn on. The balance wheel swings, the gears turn, and the second hand ticks. I can drag to orbit around it and scroll to zoom.\n\nAdd an Explode button. When I press it, every part slides apart in layers with its name on a label. Press it again and it all snaps back together. When I hover a part, it lights up and shows one line on what it does.\n\nNo images. Do not ask me any questions. Just build it.", "img": "https://media.skillry.dev/opus-5-5/aichrislee-476025/original.4cb758fb77.webp", "post": "https://x.com/aichrislee/status/2107622585307476025", "v": true, "card": "https://media.skillry.dev/opus-5-5/aichrislee-476025/original-card.005617bfa7.mp4", "orig": "https://media.skillry.dev/opus-5-5/aichrislee-476025/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/aichrislee-476025/remake.mp4"}, {"n": 416, "c": "3d", "t": ["threejs", "shader", "canvas", "svg"], "a": "thebuggeddev", "p": "Build a fully working 1857 Napoleon load field cannon in 3D using procedural Three.js WebGPU and TSL shaders. No Blender, no 3D assets, no textures. Include technical drawings as live orthographic renders showing elevation, pressure, trajectory, and firing changes in real time.", "img": "https://media.skillry.dev/opus-5-5/thebuggeddev-482912/original.192a687052.webp", "post": "https://x.com/thebuggeddev/status/2107449104926482912", "v": true, "card": "https://media.skillry.dev/opus-5-5/thebuggeddev-482912/original-card.a3714b2021.mp4", "orig": "https://media.skillry.dev/opus-5-5/thebuggeddev-482912/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/thebuggeddev-482912/remake.mp4"}, {"n": 417, "c": "motion", "t": ["threejs", "shader"], "a": "theSethian", "p": "Show me the next 30 years. One shot, no cuts. Five stops: 2026, Earth at night under a cloud of satellites; 2032, a ring around the planet with space elevators; 2040, a base on the Moon; 2048, cities on Mars; 2056, a swarm of mirrors circling the Sun. Continuous camera flight from Earth out to Mars, then back past Earth to the Sun. Every frame rendered by code from real planet maps.", "img": "https://media.skillry.dev/opus-5-5/thesethian-384517/original.e19ffa8626.webp", "post": "https://x.com/theSethian/status/2106447666519384517", "v": true, "card": "https://media.skillry.dev/opus-5-5/thesethian-384517/original-card.b5b6934689.mp4", "orig": "https://media.skillry.dev/opus-5-5/thesethian-384517/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/thesethian-384517/remake.mp4"}, {"n": 418, "c": "interactive", "t": ["threejs", "shader", "canvas"], "a": "SpacyApps", "p": "Build \"Jelly Dice\": a single self-contained HTML file (all JS/CSS inline, no build step) with translucent gummy-candy dice that behave like real soft bodies. Render with raw WebGPU (WGSL shaders, no three.js). If WebGPU is unavailable, show a clean fallback card that", "img": "https://media.skillry.dev/opus-5-5/spacyapps-157886/original.70264f9059.webp", "post": "https://x.com/SpacyApps/status/2105833401127157886", "v": true, "card": "https://media.skillry.dev/opus-5-5/spacyapps-157886/original-card.d8e7c0e83e.mp4", "orig": "https://media.skillry.dev/opus-5-5/spacyapps-157886/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/spacyapps-157886/remake.mp4"}, {"n": 419, "c": "motion", "t": [], "a": "adrianduta96", "p": "Make a 20-second 16:9 motion graphics video that tells a little story with sound. For the first 12 seconds there is no sound at all: on a warm paper background, the words \"make it catchy.\" type themselves out, then the letters fall apart and build a colorful music machine piece by piece: ramps, spinning gears, a row of blocks like piano keys and a big drum. It ends with a ball waiting at the top. At 12 seconds the ball drops and the machine comes alive. Every block it hits plays a note, the drum kicks, the gears tick in rhythm, and it all becomes a catchy 4-second beat. Then everything snaps into the words \"ONE PROMPT\" on a final hit, followed by silence. Use bold geometric shapes in ink black, cobalt blue and sunflower yellow, and make every sound match a movement you can see. Go all out and render the final MP4.", "img": "https://pbs.twimg.com/amplify_video_thumb/2109187061118808064/img/1swFxcDo-FkP8z0j.jpg", "post": "https://x.com/adrianduta96/status/2109187815195992248", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2109187061118808064/vid/avc1/320x568/oRerDj895156Vd0-.mp4", "orig": "https://video.twimg.com/amplify_video/2109187061118808064/vid/avc1/1080x1920/R6wfsdtCNBqDFMgH.mp4", "rem": ""}, {"n": 420, "c": "interactive", "t": [], "a": "pagustafsson", "p": "Create a real-time Krakatoa volcano animation 🌋 in one HTML file using pure WebGL2. Implement realistic 3D Navier–Stokes fluid simulation for the smoke and dynamic lava flow effects.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108933591019274240/img/ZsooULT_ZBp_RTkZ.jpg", "post": "https://x.com/pagustafsson/status/2108936279081566609", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108933591019274240/vid/avc1/348x270/EbZczlVz04uznkl_.mp4", "orig": "https://video.twimg.com/amplify_video/2108933591019274240/vid/avc1/2794x2160/HEOvWdALbJ3rV-co.mp4", "rem": ""}, {"n": 421, "c": "3d", "t": [], "a": "YouWareAI", "p": "Build one self-contained, real-time Three.js PBR web experience titled: CASTLE ABOVE CLOUDS\n\nSubtitle lockup: A DREAM IN THE SKY · REBUILT\nHero line, large, two weights: Above the", "img": "https://pbs.twimg.com/amplify_video_thumb/2108824931618508800/img/B5xfGH5-VphzMiSM.jpg", "post": "https://x.com/YouWareAI/status/2108825933608300653", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108824931618508800/vid/avc1/480x270/tq6Co6_NKqV28rAq.mp4", "orig": "https://video.twimg.com/amplify_video/2108824931618508800/vid/avc1/3840x2160/JamPRVOkEXkTyzDU.mp4", "rem": ""}, {"n": 422, "c": "3d", "t": [], "a": "juancarlos17626", "p": "un estudio de intro 3D para logos en UN solo HTML con three.js. 3 logos de ejemplo o pegas tu SVG; las piezas vuelan, se arman, gira, pasa un destello y aparece el nombre letra por letra. Cromo, oro, vidrio, arcilla o neón.", "img": "https://pbs.twimg.com/ext_tw_video_thumb/2108663799506931712/pu/img/roz-Px088GTYzmUv.jpg", "post": "https://x.com/juancarlos17626/status/2108663865936429530", "v": true, "x": true, "card": "https://video.twimg.com/ext_tw_video/2108663799506931712/pu/vid/avc1/320x568/ZRvbsmt_8dsnCweb.mp4?tag=12", "orig": "https://video.twimg.com/ext_tw_video/2108663799506931712/pu/vid/avc1/720x1280/cri5doVEZseICcNC.mp4?tag=12", "rem": ""}, {"n": 423, "c": "motion", "t": [], "a": "aiRobertDaily", "p": "Create a stunning 30-second motion graphics video showcasing Apple's evolution from Steve Jobs in 1976 to 2026.\nEvolve from nostalgic vintage aesthetics to futuristic digital art, with seamless transitions and cinematic storytelling.\nPush your creativity to the limit. Go all out and make it unforgettable.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108594482858037248/img/5WpCRnAIqv9a6pkZ.jpg", "post": "https://x.com/aiRobertDaily/status/2108596616756416945", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108594482858037248/vid/avc1/480x270/OYEGpUMMsgnmGlk-.mp4", "orig": "https://video.twimg.com/amplify_video/2108594482858037248/vid/avc1/1920x1080/0-n54CcqJb6fjUDy.mp4", "rem": ""}, {"n": 424, "c": "3d", "t": [], "a": "Thusatharan", "p": "Built a golden-hour manor in the browser. Everything is procedural: no 3D models, just code. Animated fountain, swaying garden, and a day/night switch that lights up every window.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108544572729245696/img/zZ04lPjmmVAA-2lg.jpg", "post": "https://x.com/Thusatharan/status/2108544807333433543", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108544572729245696/vid/avc1/480x270/DcFzmuO_g7rzBFJh.mp4", "orig": "https://video.twimg.com/amplify_video/2108544572729245696/vid/avc1/1920x1080/Q9cX8euW5Dd_u_eM.mp4", "rem": ""}, {"n": 425, "c": "interactive", "t": [], "a": "arixxbt", "p": "Create an interactive zen garden simulation in a single HTML file. Implement a 1536px heightmap on a 440x440 grid for the sand. Allow users to drag across the sand to cut grooves (5 grooves and 6 ridges per stroke) along their path. Include 5 mossy rocks, 2 stone lanterns, and a maple tree with 420 leaves. Add a time-of-day toggle; when set to golden hour, drop the sun low so every groove throws a shadow. Ensure the rendering handles moss visibility through sand and prevents blocky rocks or out-of-frame lanterns.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108541492151140352/img/PZSfY1K1MZdEJO9-.jpg", "post": "https://x.com/arixxbt/status/2108541814718292438", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108541492151140352/vid/avc1/320x400/Jbuw4v_m024qC5Rr.mp4", "orig": "https://video.twimg.com/amplify_video/2108541492151140352/vid/avc1/1080x1350/dEYYS9crpy6CwDyF.mp4", "rem": ""}, {"n": 426, "c": "motion", "t": [], "a": "N01ennn", "p": "Opus 5.5: a hand-drawn story. a little agent wakes up at its desk, gets feedback notes, fixes them, ends on heart eyes and a green check. 53 s\nSonnet 5.5: a kinetic type showreel. six easing curves, a morphing star, particles, blurred type, \"every frame written in code\". 15 s\nHaiku 5.5: a step-by-step White Russian recipe. ice, vodka, coffee liqueur, cream, with live counters and a checklist. 30 s", "img": "https://pbs.twimg.com/amplify_video_thumb/2108518869212008449/img/I2pgk4XsBBTYIFTI.jpg", "post": "https://x.com/N01ennn/status/2108520767092597182", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108518869212008449/vid/avc1/480x270/TwJlnrjrFve-15ni.mp4", "orig": "https://video.twimg.com/amplify_video/2108518869212008449/vid/avc1/1920x1080/3fDILajxmPT2xy9Y.mp4", "rem": ""}, {"n": 427, "c": "3d", "t": [], "a": "rubenssoto_ai", "p": "a 30s cinematic F1 pit stop in Three.js. Detailed car, 8-person crew changing all 4 tyres, synthesized audio, fully procedural.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108359989618151424/img/SkZjiLaJk90E-jNZ.jpg", "post": "https://x.com/rubenssoto_ai/status/2108512810774802657", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108359989618151424/vid/avc1/600x270/oOUsgjcnwtv4l7xj.mp4", "orig": "https://video.twimg.com/amplify_video/2108359989618151424/vid/avc1/1920x864/3o0kBbFxraQ-PzwS.mp4", "rem": ""}, {"n": 428, "c": "3d", "t": [], "a": "Thusatharan", "p": "Build a 3D elephant in one HTML file with Three.js. Fully procedural, no assets.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108510857705779200/img/0VdcU-txV9h0S7KF.jpg", "post": "https://x.com/Thusatharan/status/2108511286795640926", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108510857705779200/vid/avc1/512x270/ANEIkDfKKwfaarS6.mp4", "orig": "https://video.twimg.com/amplify_video/2108510857705779200/vid/avc1/4096x2156/BxfhDiF4HM3fawtR.mp4", "rem": ""}, {"n": 429, "c": "motion", "t": [], "a": "UtsavChopra30", "p": "Scan all the components from the given page, fetch the brand detailing including logo. Make me a high end teaser video for this specific feature.", "img": "https://pbs.twimg.com/amplify_video_thumb/2108476971810164736/img/45UJwxmEVazhpYnp.jpg", "post": "https://x.com/UtsavChopra30/status/2108510252404560359", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108476971810164736/vid/avc1/480x270/uqDxLmCgZxG6CqJ9.mp4", "orig": "https://video.twimg.com/amplify_video/2108476971810164736/vid/avc1/1920x1080/JnFWx04m9yvj6mkn.mp4", "rem": ""}, {"n": 430, "c": "motion", "t": [], "a": "0xKarmi", "p": "Picture a butterfly with no memory of its last wingbeat.\nAsk it for frame 720 and you get frame 0, pixel for pixel.\n\n720 frames. 12 seconds. 6 counters. All at 0.\n\nOpus 5.5 can't hand over a video file, one builder says. He made that gap the method.\n\n> STAGE - one fixed 1000x1080 canvas, fonts baked in\n> RENDER - a windowless engine calls draw(f) once per frame number\n> ENCODE - ffmpeg writes H.264, pixel aspect ratio declared\n> CHECK - three passes after every build\n\nBy his account the model writes only the first, a drawing program. The other three get reused.\n\nEach picture depends on its number alone: no clock, no timer, no dice that land differently each run.\n\nSo any frame renders the same every time. A fix is a small edit and a re-render.\n\nThe sample loop is 720 pictures in 12 seconds. A hand animator at 12 drawings a second would need 144.\n\nThe smoke test plays one loop unseen and counts six kinds of defect, from script errors to text on text.\nSix yes/no gates before a human looks.\n\nThe seam check puts frame 0 against frame 720. One changed pixel means some motion isn't periodic.\n\nHe reports a last render of 1,820 frames with six zeros. At the sample's 60 fps that would be about half a minute.\n\nLet one frame read a clock and the same number stops giving the same picture.\n\nWe drew the rule as an X-ray butterfly, its wingbeat computed from the frame number ↓", "img": "https://pbs.twimg.com/amplify_video_thumb/2108495383877890049/img/8bAj6bzmnOnDcD17.jpg", "post": "https://x.com/0xKarmi/status/2108495927988129839", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108495383877890049/vid/avc1/320x400/i1ImjLQB6eDJM960.mp4", "orig": "https://video.twimg.com/amplify_video/2108495383877890049/vid/avc1/1080x1350/VNzdjeAK1I0Y5QZt.mp4", "rem": ""}, {"n": 431, "c": "3d", "t": [], "a": "shunshu32385143", "p": "用 Claude Opus 5.5 写了一段代码，让天坛祈年殿在浏览器里\"画\"了出来 🏯\n\n先铅笔线描：台基、28 根柱、斗拱、三重檐，一笔笔搭起来\n再像画画一样上色：朱红、彩画、蓝瓦，最后点金\n\n没用图像或视频模型，全是 Three.js 实时渲染，配乐也是代码合成的古筝。", "img": "https://pbs.twimg.com/amplify_video_thumb/2108480417665818624/img/FOYzy-q9af7qeDw9.jpg", "post": "https://x.com/shunshu32385143/status/2108480534254944719", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108480417665818624/vid/avc1/480x270/o11X0ptEAWkMvKan.mp4", "orig": "https://video.twimg.com/amplify_video/2108480417665818624/vid/avc1/1920x1080/_EO9Av6kep_rIFos.mp4", "rem": ""}, {"n": 432, "c": "interactive", "t": [], "a": "chang_", "p": "我用 Claude Opus 5.5 写代码，从零做了条 5 分钟 3D 科普：three.js 复刻踏板总成、shader 实时算应力热力图、裂纹一脚一脚变长的断裂动画、中英双语字幕。\n\n 🧠 Claude Opus 5.5 ｜ 🎙️ 配音 ElevenLabs\n没用一帧现成素材 👇", "img": "https://pbs.twimg.com/amplify_video_thumb/2108458292968366081/img/CR9EAoCbI3QmfrZS.jpg", "post": "https://x.com/chang_/status/2108458503367200908", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2108458292968366081/vid/avc1/480x270
