ebp", "post": "https://x.com/mrblock/status/2103492984474096062", "v": true, "card": "https://media.skillry.dev/opus-5-5/mrblock-096062/original-card.9e3706b922.mp4", "orig": "https://media.skillry.dev/opus-5-5/mrblock-096062/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mrblock-096062/remake.mp4"}, {"n": 261, "c": "interactive", "t": ["threejs", "shader", "canvas", "gsap"], "a": "op7418", "p": "帮我做一个原创的手游「高光时刻」动效：[主体，例如：开宝箱 / 段位晋升 / 成就解锁 / Boss 掉落 / 角色升级]。\n做成一个可以直接打开的单文件网页（HTML + CSS + JS），点一下就能完整播放，效果对标商业手游的结算 / 奖励演出。\n\n【世界观与风格】\n- 原创美术，不要模仿任何现有游戏的 IP、角色或 Logo。\n- 卡通手游风：高饱和配色，统一的深色描边（例如 #1A1033），圆润厚重的造型。\n- 配色随等级升级：[等级阶梯，例如：普通绿 → 稀有蓝 → 史诗紫 → 传说金]。每升一级都要切换主色、光效颜色和背景色调。\n- 标题用圆胖的游戏字体（如 Titan One / Lilita One），描黑边，加投影；文字逐字「砸」进画面，带回弹。\n\n【主体物：做成真 3D】\n- 用 Three.js 建模，不要用平面 SVG 贴图。要有厚度、倒角，以及符合主体的结构细节（木板缝、铆钉、包边、宝石切面、锁扣等）；木板缝这类细节用真实几何体拼出来，不要贴黑线条。\n- 着色用卡通分阶（MeshToonMaterial 加 3～4 阶的渐变贴图），配三种灯光：主光、天光、等级色的轮廓光。\n- 描边用后期边缘检测：渲染法线图 + 深度图，再用着色器画线。外轮廓粗、零件交界细，粗细全程一致；另外做 1.5 倍超采样和多重采样抗锯齿。\n  不要用「放大一圈的黑色背面」那种描边，那样粗细不均、转角会断。\n  深度判断的阈值要放宽，接缝主要靠法线判断，否则斜着看的表面会冒出细碎斜纹。\n- 活动部件要真实运动，比如箱盖绕铰链翻开、奖章绕竖轴旋转。\n- 待机时主体缓慢左右转动，让人看到侧面和厚度，同时轻微上下浮动；脚下要有随高度变化的柔和投影。\n\n【如果画面里有 2D 插画（卡面、奖励图标、角色）】\n- 三层卡通着色：底色、成块的阴影色、高光色，不要只用一层渐变。\n- 线条分粗细：外轮廓粗，内部结构线细。\n- 每个角色或物件要有自己的表情和姿态，不要所有东西共用同一张脸。\n- 脚下画投影，让主体「站」在画面里；背景按属性区分图案，不要全用同一套放射线。\n\n【演出节奏：五个阶段，缺一不可】\n1. 预备：主体待机浮动，每隔几秒抖一下提示可以点击，底部显示「点击」提示。\n2. 升级：每点一次，主体跳起、在空中转一圈、落地时压扁再回弹；同时切换到下一等级的颜色，闪一下光，冒一圈粒子，标题更新。\n3. 蓄力（约 1 秒）：主体越抖越剧烈，缝隙透出光，四周粒子往中心吸，音效音调持续上升；最后一刻猛地压扁。\n4. 爆发：从爆点向外扩散的泛光闪白、屏幕震动、镜头往前一推、多层冲击波、细长流光迸射、闪光星点、金币和宝石（带旋转）。高等级的爆发要明显更强。彩带只在最高潮用一次，不要满屏彩带。\n5. 揭晓与结算：\n   - 奖励卡片从主体里沿弧线飞出，落位时带超调和晃动收尾，数字滚动计数。\n   - 稀有物品带彩虹流光边框和「NEW!」角标。\n   - 点击领取后，金币和宝石沿贝塞尔曲线飞进右上角的余额，每到一个余额就跳一下。\n\n【揭晓舞台：让主角独占画面】\n- 最高稀有度揭晓时，其他元素收起或淡出，背后换成一层干净的渐变幕布加缓慢旋转的柔光，不要让主角压在杂乱的背景上。\n- 幕布出现时，把场景里的其他 3D 物件隐藏掉，否则后期描边会把它们的轮廓线画在幕布上。\n- 主角的外发光要放在主体背后，只从边缘溢出，不能盖在主体前面把它糊成一片白。\n- 可以加一圈围绕主角盘旋的星尘拖尾，但轨道必须完整在主角轮廓外侧，不能从主体正面扫过。\n\n【光效：必须柔和，不能有硬边】\n- 背景光芒：用带渐变过渡的 conic-gradient，不要一刀切的色块边缘；叠 2～3 层不同密度、不同转速的光。\n- 光柱：由 5～7 道带模糊的光束呈扇形散开，亮度各自轻微闪动；根部加一团柔光核心，光里有光尘缓慢上飘。\n- 闪白：从爆点向外的径向泛光（mix-blend-mode: screen），强度不超过 0.8，不要整屏纯白过曝。\n- 粒子：每个火花都带一圈低透明度的外晕；冲击波用三层描边（宽而淡、中等、细而亮）。\n\n【材质与界面】\n- 边框、名牌、按钮要有材质感：金属拉丝渐变、左上亮右下暗的倒角光、内阴影；按稀有度换镶嵌件（钢铆钉 → 银框宝石 → 金框钻石加小王冠）。\n- 小卡片上不要塞小字数值；详细数值放到揭晓时的信息面板里，面板里的数字滚动上涨，并弹出「▲+数值」。\n- 画在 Canvas 上的贴图，分辨率至少是屏幕上最大显示尺寸的 1.5 倍，否则放大时会发虚。\n\n【动画原则】\n- 用 GSAP 时间线编排。所有动作都要有挤压拉伸、超调和弹性回弹，不要匀速。\n- 粒子系统用 Canvas 2D 自己写：重力、阻力、生命周期、叠加混合，以及「吸入」「曲线飞行」「环绕」三种运动。\n- 不要用 CSS 3D 透视去翻转大尺寸元素，放大加侧翻时会被投影成铺满屏幕的平面，3D 翻转一律放在 WebGL 里做。\n- 所有「抖动」「呼吸」类的循环补间，在状态切换时要先取消再归零，避免它比停止指令晚一帧结束，又把值设回去。\n\n【音效】\n- 全部用 Web Audio 实时合成，不用音频文件：跳起、落地、升级和弦、蓄力上升音、爆炸低频加噪声、弹出音、计数滴答、金币叮当、胜利号角。\n- 第一次点击时才初始化音频；右上角放静音开关。\n\n【界面与工程】\n- 顶部 HUD：模式切换、金币和宝石余额、静音按钮。\n- 手机宽度也要能用；遵守「减少动态效果」设置（关闭震屏，减少粒子）。\n- 动画状态机要严谨：动画播放中忽略点击，不能出现点击被吞或状态错乱。\n- 目标 60fps。第一次打开时就是完整的待机画面，不能是空白。\n\n【交付前自检】\n在蓄力、爆发、揭晓、结算这几个时刻各截一张图，逐张检查：\n- 主角有没有被光晕、粒子或文字挡住？\n- 有没有过曝成一片白？\n- 背景是否杂乱，有没有穿帮的描边线？\n- 小字是否能看清？\n- 结算后是否还有东西在不该动的时候继续抖动？\n\n最后告诉我：每个阶段的时长，以及哪些参数可以调整演出强度。", "img": "https://media.skillry.dev/opus-5-5/op7418-814408/original.f4c57c4154.webp", "post": "https://x.com/op7418/status/2103724883301814408", "v": true, "card": "https://media.skillry.dev/opus-5-5/op7418-814408/original-card.09d5ba590a.mp4", "orig": "https://media.skillry.dev/opus-5-5/op7418-814408/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/op7418-814408/remake.mp4"}, {"n": 262, "c": "interactive", "t": ["threejs", "canvas", "playable"], "a": "janlaywss", "p": "被Claude Opus 5.5生成的游戏效果彻底瘫坐了。。。。只消耗了Pro套餐5h限额的19%，连续运行1h45m就能获得这么高的完整度。。。。。瘫坐中。。。。\n游戏地址：https://move-car-kappa.vercel.app/", "img": "https://media.skillry.dev/opus-5-5/janlaywss-379361/original.1b2e13a4f4.webp", "post": "https://x.com/janlaywss/status/2103751290954379361", "v": true, "card": "https://media.skillry.dev/opus-5-5/janlaywss-379361/original-card.32ba394a9e.mp4", "orig": "https://media.skillry.dev/opus-5-5/janlaywss-379361/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/janlaywss-379361/remake.mp4"}, {"n": 263, "c": "interactive", "t": ["canvas", "pixel", "playable"], "a": "0xpai_eth", "p": "试着用 Opus 5.5 给「财富进化论」做了一款复古的像素游戏《复利 QUEST》。\n\n把我们家庭投资理财路上的一些困难设计成关卡。\n\n在这个像素世界里，冲动消费是要跳过去的陷阱，通胀会变成怪兽，还会追着我们跑。一路升级的，是我们的耐心值。\n\n再配上 8-bit 音乐，储蓄、复利和长期持有这些知识，就有了具体的角色和关卡。\n\n游戏做完，又用它做了这条 40 秒的介绍视频。", "img": "https://media.skillry.dev/opus-5-5/0xpai-eth-635565/original.c00e6ddbbc.webp", "post": "https://x.com/0xpai_eth/status/2103870009877635565", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xpai-eth-635565/original-card.41fdfdfdf9.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xpai-eth-635565/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xpai-eth-635565/remake.mp4"}, {"n": 264, "c": "interactive", "t": ["canvas", "svg", "gsap", "css"], "a": "op7418", "p": "帮我做一个原创的手游「高光时刻」动效：[主体，例如：开宝箱 / 段位晋升 / 成就解锁 / Boss 掉落 / 角色升级]。\n做成一个可以直接打开的单文件网页（HTML + CSS + JS），点一下就能完整播放，效果对标商业手游的结算 / 奖励演出。\n\n【世界观与风格】\n- 原创美术，不要模仿任何现有游戏的 IP、角色或 Logo。\n- 卡通手游风：高饱和配色，统一的深色描边（例如 #1A1033），圆润厚重的造型。\n- 配色随等级升级：[等级阶梯，例如：普通绿 → 稀有蓝 → 史诗紫 → 传说金]。每升一级都要切换主色、光效颜色和背景色调。\n- 标题用圆胖的游戏字体（如 Titan One / Lilita One），描黑边，加投影；文字逐字「砸」进画面，带回弹。\n\n【主体物：做成真 3D】\n- 用 Three.js 建模，不要用平面 SVG 贴图。要有厚度、倒角，以及符合主体的结构细节（木板缝、铆钉、包边、宝石切面、锁扣等）；木板缝这类细节用真实几何体拼出来，不要贴黑线条。\n- 着色用卡通分阶（MeshToonMaterial 加 3～4 阶的渐变贴图），配三种灯光：主光、天光、等级色的轮廓光。\n- 描边用后期边缘检测：渲染法线图 + 深度图，再用着色器画线。外轮廓粗、零件交界细，粗细全程一致；另外做 1.5 倍超采样和多重采样抗锯齿。\n  不要用「放大一圈的黑色背面」那种描边，那样粗细不均、转角会断。\n  深度判断的阈值要放宽，接缝主要靠法线判断，否则斜着看的表面会冒出细碎斜纹。\n- 活动部件要真实运动，比如箱盖绕铰链翻开、奖章绕竖轴旋转。\n- 待机时主体缓慢左右转动，让人看到侧面和厚度，同时轻微上下浮动；脚下要有随高度变化的柔和投影。\n\n【如果画面里有 2D 插画（卡面、奖励图标、角色）】\n- 三层卡通着色：底色、成块的阴影色、高光色，不要只用一层渐变。\n- 线条分粗细：外轮廓粗，内部结构线细。\n- 每个角色或物件要有自己的表情和姿态，不要所有东西共用同一张脸。\n- 脚下画投影，让主体「站」在画面里；背景按属性区分图案，不要全用同一套放射线。\n\n【演出节奏：五个阶段，缺一不可】\n1. 预备：主体待机浮动，每隔几秒抖一下提示可以点击，底部显示「点击」提示。\n2. 升级：每点一次，主体跳起、在空中转一圈、落地时压扁再回弹；同时切换到下一等级的颜色，闪一下光，冒一圈粒子，标题更新。\n3. 蓄力（约 1 秒）：主体越抖越剧烈，缝隙透出光，四周粒子往中心吸，音效音调持续上升；最后一刻猛地压扁。\n4. 爆发：从爆点向外扩散的泛光闪白、屏幕震动、镜头往前一推、多层冲击波、细长流光迸射、闪光星点、金币和宝石（带旋转）。高等级的爆发要明显更强。彩带只在最高潮用一次，不要满屏彩带。\n5. 揭晓与结算：\n   - 奖励卡片从主体里沿弧线飞出，落位时带超调和晃动收尾，数字滚动计数。\n   - 稀有物品带彩虹流光边框和「NEW!」角标。\n   - 点击领取后，金币和宝石沿贝塞尔曲线飞进右上角的余额，每到一个余额就跳一下。\n\n【揭晓舞台：让主角独占画面】\n- 最高稀有度揭晓时，其他元素收起或淡出，背后换成一层干净的渐变幕布加缓慢旋转的柔光，不要让主角压在杂乱的背景上。\n- 幕布出现时，把场景里的其他 3D 物件隐藏掉，否则后期描边会把它们的轮廓线画在幕布上。\n- 主角的外发光要放在主体背后，只从边缘溢出，不能盖在主体前面把它糊成一片白。\n- 可以加一圈围绕主角盘旋的星尘拖尾，但轨道必须完整在主角轮廓外侧，不能从主体正面扫过。\n\n【光效：必须柔和，不能有硬边】\n- 背景光芒：用带渐变过渡的 conic-gradient，不要一刀切的色块边缘；叠 2～3 层不同密度、不同转速的光。\n- 光柱：由 5～7 道带模糊的光束呈扇形散开，亮度各自轻微闪动；根部加一团柔光核心，光里有光尘缓慢上飘。\n- 闪白：从爆点向外的径向泛光（mix-blend-mode: screen），强度不超过 0.8，不要整屏纯白过曝。\n- 粒子：每个火花都带一圈低透明度的外晕；冲击波用三层描边（宽而淡、中等、细而亮）。\n\n【材质与界面】\n- 边框、名牌、按钮要有材质感：金属拉丝渐变、左上亮右下暗的倒角光、内阴影；按稀有度换镶嵌件（钢铆钉 → 银框宝石 → 金框钻石加小王冠）。\n- 小卡片上不要塞小字数值；详细数值放到揭晓时的信息面板里，面板里的数字滚动上涨，并弹出「▲+数值」。\n- 画在 Canvas 上的贴图，分辨率至少是屏幕上最大显示尺寸的 1.5 倍，否则放大时会发虚。\n\n【动画原则】\n- 用 GSAP 时间线编排。所有动作都要有挤压拉伸、超调和弹性回弹，不要匀速。\n- 粒子系统用 Canvas 2D 自己写：重力、阻力、生命周期、叠加混合，以及「吸入」「曲线飞行」「环绕」三种运动。\n- 不要用 CSS 3D 透视去翻转大尺寸元素，放大加侧翻时会被投影成铺满屏幕的平面，3D 翻转一律放在 WebGL 里做。\n- 所有「抖动」「呼吸」类的循环补间，在状态切换时要先取消再归零，避免它比停止指令晚一帧结束，又把值设回去。\n\n【音效】\n- 全部用 Web Audio 实时合成，不用音频文件：跳起、落地、升级和弦、蓄力上升音、爆炸低频加噪声、弹出音、计数滴答、金币叮当、胜利号角。\n- 第一次点击时才初始化音频；右上角放静音开关。\n\n【界面与工程】\n- 顶部 HUD：模式切换、金币和宝石余额、静音按钮。\n- 手机宽度也要能用；遵守「减少动态效果」设置（关闭震屏，减少粒子）。\n- 动画状态机要严谨：动画播放中忽略点击，不能出现点击被吞或状态错乱。\n- 目标 60fps。第一次打开时就是完整的待机画面，不能是空白。\n\n【交付前自检】\n在蓄力、爆发、揭晓、结算这几个时刻各截一张图，逐张检查：\n- 主角有没有被光晕、粒子或文字挡住？\n- 有没有过曝成一片白？\n- 背景是否杂乱，有没有穿帮的描边线？\n- 小字是否能看清？\n- 结算后是否还有东西在不该动的时候继续抖动？\n\n最后告诉我：每个阶段的时长，以及哪些参数可以调整演出强度。", "img": "https://media.skillry.dev/opus-5-5/op7418-818226/original.bd3cd48590.webp", "post": "https://x.com/op7418/status/2104085484347818226", "v": true, "card": "https://media.skillry.dev/opus-5-5/op7418-818226/original-card.aac402beb0.mp4", "orig": "https://media.skillry.dev/opus-5-5/op7418-818226/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/op7418-818226/remake.mp4"}, {"n": 265, "c": "interactive", "t": ["threejs", "canvas", "audio"], "a": "akokoi1", "p": "太离谱了，一共3步，Opus 5.5给我整了个“模拟火车”出来。\n\n1. 让ChatGPT生成韶山8各个视角的图；\n2. 让Opus做一个3D资产，100%还原这张图；\n3. 做一个环形铁路，可以操作这辆车行驶。", "img": "https://media.skillry.dev/opus-5-5/akokoi1-469188/original.9eb338b903.webp", "post": "https://x.com/akokoi1/status/2104222017696469188", "v": true, "card": "https://media.skillry.dev/opus-5-5/akokoi1-469188/original-card.46b035aa8a.mp4", "orig": "https://media.skillry.dev/opus-5-5/akokoi1-469188/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/akokoi1-469188/remake.mp4"}, {"n": 266, "c": "interactive", "t": ["canvas", "audio"], "a": "ggsimm", "p": "I asked opus 5.5 to make a game within the confines and abilities of my engine, no other prompt. It made this deep-sea horror game, with a subtle drone soundtrack. And it's terrifying (if a bit unbalanced/unfair). Sound on.", "img": "https://media.skillry.dev/opus-5-5/ggsimm-535814/original.87b91721f4.webp", "post": "https://x.com/ggsimm/status/2102882622053535814", "v": true, "card": "https://media.skillry.dev/opus-5-5/ggsimm-535814/original-card.b03df8885a.mp4", "orig": "https://media.skillry.dev/opus-5-5/ggsimm-535814/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ggsimm-535814/remake.mp4"}, {"n": 267, "c": "interactive", "t": ["canvas", "audio", "pixel", "playable"], "a": "MozeTech", "p": "Opus 5.5 just one-shot this entire pixel-art game. Oh, and the prompt? It was barely three sentences. I gave claude creative license to make whatever game it wanted to, and oh boy did it cook\n\nThe capabilities of this model are genuinely ridiculous, I fed GPT Sol-6 the same prompt and the results were shockingly poor. Seems like Sol-6 is taking the Opus 5 role this time around.\n\nWith models becoming this good, I'm struggling to see the need to purchase games anymore. If you can have any game you want created in a single prompt, with beautiful art, story, etc - what's the point of sinking $60+? \n\nLol, obviously because the stories and ideas that humans have are still way better than whatever these models can still do. However, the gaming industry is definitely going to be shaken now - excited to see what's gonna come out of this!\n\nAnyway, here's a side by side comparison of both outputs, thoughts?\n\nAlso if you wanted to play it yourself:\nhttps://skerry-light.vercel.app/\n\nLeft is Claude, right is Opus", "img": "https://media.skillry.dev/opus-5-5/mozetech-471882/original.9e4feb7be1.webp", "post": "https://x.com/MozeTech/status/2102913506815471882", "v": true, "card": "https://media.skillry.dev/opus-5-5/mozetech-471882/original-card.7b1a3cea0e.mp4", "orig": "https://media.skillry.dev/opus-5-5/mozetech-471882/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mozetech-471882/remake.mp4"}, {"n": 268, "c": "interactive", "t": ["canvas", "audio"], "a": "JaneLoic", "p": "HOLY SHIT MOMENT with Opus 5.5 😱\n\nI really wanted to play Super Mario Bros Wonder but I don't have a Nintendo Switch.... So I went to @arena with the hop to find an AI that could reproduce the game. And luckily I stumbled upon Opus 5.5 ✨\n\nHave a look at what it did with ONE prompt 😵‍💫\n\nFor those interested I'll share the result of Grok 4.7 in the comments", "img": "https://media.skillry.dev/opus-5-5/janeloic-905802/original.63ee835ce2.webp", "post": "https://x.com/JaneLoic/status/2103023141823905802", "v": true, "card": "https://media.skillry.dev/opus-5-5/janeloic-905802/original-card.53ca8c97ef.mp4", "orig": "https://media.skillry.dev/opus-5-5/janeloic-905802/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/janeloic-905802/remake.mp4"}, {"n": 269, "c": "interactive", "t": ["canvas", "pixel", "playable"], "a": "agentgamesbot", "p": "Play INKBOUND:\nhttps://agentgames.itch.io/inkbound\n\nClaude Opus 5.5 built this pixel game in 30 minutes.\n\nWhile the human was building the amusement park with Claude, Opus 5.5 arrived. Time to see what it could do with a pixel game.\n\nMeet INKBOUND. One painter draws your path. Another tries to erase you. Apparently, even a tiny ink spirit needs workplace conflict.\n\nJump, sink into the ink, or absorb incoming attacks. Sound on for this one.\n\nWant to try building it yourself? The prompt is in the pinned YouTube comment:\nhttps://www.youtube.com/shorts/86TukHHr74o", "img": "https://media.skillry.dev/opus-5-5/agentgamesbot-355554/original.73f6d95b0e.webp", "post": "https://x.com/agentgamesbot/status/2103401820261355554", "v": true, "card": "https://media.skillry.dev/opus-5-5/agentgamesbot-355554/original-card.c6582c66a7.mp4", "orig": "https://media.skillry.dev/opus-5-5/agentgamesbot-355554/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/agentgamesbot-355554/remake.mp4"}, {"n": 270, "c": "interactive", "t": ["threejs", "shader", "playable"], "a": "CurieuxExplorer", "p": "I made a 3D survival game in one prompt with Opus 5.5\n\nSurvive 60 seconds.\nEvery tile you step on cracks... then it falls.\n\nRace your own ghost, chase near-misses, watch the arena rebuild itself when you fail.\n\nMost people don't make it past 30s 👇\nhttps://claude.ai/artifact/D3kjdvMpvrGgTCcxDTTDvP", "img": "https://media.skillry.dev/opus-5-5/curieuxexplorer-519730/original.e6bb8f2edd.webp", "post": "https://x.com/CurieuxExplorer/status/2103407536741519730", "v": true, "card": "https://media.skillry.dev/opus-5-5/curieuxexplorer-519730/original-card.ba48a619dd.mp4", "orig": "https://media.skillry.dev/opus-5-5/curieuxexplorer-519730/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/curieuxexplorer-519730/remake.mp4"}, {"n": 271, "c": "interactive", "t": ["svg"], "a": "redp314", "p": "Always wondered if you can win every game of 2048, so i gave Claude Opus 5.5 one prompt. It built an AI that learns from zero, on my laptop!\n\nGame 1: dies at 128\nGame 497: first 2048\nGame 3,915: first 8192\nGame 98,299: first 16384\n\nCan it win them all? No. After 2M games: 99%!", "img": "https://media.skillry.dev/opus-5-5/redp314-642106/original.59e753d1aa.webp", "post": "https://x.com/redp314/status/2103495629087642106", "v": true, "card": "https://media.skillry.dev/opus-5-5/redp314-642106/original-card.3f9354f84f.mp4", "orig": "https://media.skillry.dev/opus-5-5/redp314-642106/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/redp314-642106/remake.mp4"}, {"n": 272, "c": "interactive", "t": ["threejs", "canvas"], "a": "jasperdeboer", "p": "Claude Opus 5.5 made a trailer for my Antkeeper game (one prompt).\n\nThis is what it came up with 🤔", "img": "https://media.skillry.dev/opus-5-5/jasperdeboer-157391/original.72dbad5a62.webp", "post": "https://x.com/jasperdeboer/status/2103593633832157391", "v": true, "card": "https://media.skillry.dev/opus-5-5/jasperdeboer-157391/original-card.b21b8d348e.mp4", "orig": "https://media.skillry.dev/opus-5-5/jasperdeboer-157391/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/jasperdeboer-157391/remake.mp4"}, {"n": 273, "c": "interactive", "t": ["threejs", "shader", "audio"], "a": "CurieuxExplorer", "p": "This is Dope! \nClaude Opus 5.5 is on fire 🔥\n\nOne prompt → a 30s video-game walk through Mumbai, built entirely in code.\n\nNo AI video. No 3D assets. No stock audio.\n1,850 lines. 900 frames. 30+ sounds from pure math.\n\nEvery pigeon, puddle and kaali-peeli, made by code.\nMumbai, compiled. 🇮🇳", "img": "https://media.skillry.dev/opus-5-5/curieuxexplorer-772215/original.48e84ca07c.webp", "post": "https://x.com/CurieuxExplorer/status/2103714595659772215", "v": true, "card": "https://media.skillry.dev/opus-5-5/curieuxexplorer-772215/original-card.75a7928478.mp4", "orig": "https://media.skillry.dev/opus-5-5/curieuxexplorer-772215/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/curieuxexplorer-772215/remake.mp4"}, {"n": 274, "c": "interactive", "t": ["canvas", "pixel"], "a": "rehan_shei", "p": "I turned this into a full game with unity cli + opus 5.5, also opus did this full demo video, it played the game with multiple characters and spliced together the best bits, holy shit we're in the AGI era. Play it on your browser here: https://rehan-remade.github.io/hollow-crown/", "img": "https://media.skillry.dev/opus-5-5/rehan-shei-839416/original.d0ea3d8c6a.webp", "post": "https://x.com/rehan_shei/status/2103755997533839416", "v": true, "card": "https://media.skillry.dev/opus-5-5/rehan-shei-839416/original-card.612b3e129a.mp4", "orig": "https://media.skillry.dev/opus-5-5/rehan-shei-839416/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/rehan-shei-839416/remake.mp4"}, {"n": 275, "c": "interactive", "t": ["threejs", "shader", "canvas"], "a": "Rush3rx", "p": "A dead planet to a breathable one, one camera, no cuts.\n\nI'm making Second Dawn, a co-op terraforming game, with Claude: it started on Fable 5.0, moved to Fable 5.1, and it's on Opus 5.5 now. I set the design and the direction.", "img": "https://media.skillry.dev/opus-5-5/rush3rx-342153/original.e7ea119f86.webp", "post": "https://x.com/Rush3rx/status/2103757499652342153", "v": true, "card": "https://media.skillry.dev/opus-5-5/rush3rx-342153/original-card.cb96cad2f9.mp4", "orig": "https://media.skillry.dev/opus-5-5/rush3rx-342153/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/rush3rx-342153/remake.mp4"}, {"n": 276, "c": "interactive", "t": ["threejs", "canvas"], "a": "maxthelion", "p": "I'm having so much fun doing game development with opus 5.5. This little bit with trains and barriers is awesome.", "img": "https://media.skillry.dev/opus-5-5/maxthelion-649723/original.e258623101.webp", "post": "https://x.com/maxthelion/status/2103775701052649723", "v": true, "card": "https://media.skillry.dev/opus-5-5/maxthelion-649723/original-card.e4f50595ef.mp4", "orig": "https://media.skillry.dev/opus-5-5/maxthelion-649723/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/maxthelion-649723/remake.mp4"}, {"n": 277, "c": "interactive", "t": ["threejs", "shader", "audio"], "a": "zacxbt", "p": "vibe coding a cozy metal detector game\n\na few prompts in with opus 5.5\n\nloving the sunset 😌", "img": "https://media.skillry.dev/opus-5-5/zacxbt-234711/original.da4665e468.webp", "post": "https://x.com/zacxbt/status/2103789882309234711", "v": true, "card": "https://media.skillry.dev/opus-5-5/zacxbt-234711/original-card.99aec05851.mp4", "orig": "https://media.skillry.dev/opus-5-5/zacxbt-234711/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/zacxbt-234711/remake.mp4"}, {"n": 278, "c": "interactive", "t": ["canvas", "gsap"], "a": "jstjs_", "p": "I asked Opus 5.5 to make a game about @dhh , Ruby and the end of hand-written code.", "img": "https://media.skillry.dev/opus-5-5/jstjs-129051/original.083ac3fd26.webp", "post": "https://x.com/jstjs_/status/2103807826699129051", "v": true, "card": "https://media.skillry.dev/opus-5-5/jstjs-129051/original-card.5bfee0bb13.mp4", "orig": "https://media.skillry.dev/opus-5-5/jstjs-129051/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/jstjs-129051/remake.mp4"}, {"n": 279, "c": "interactive", "t": ["threejs", "shader", "playable"], "a": "dreyk0o0", "p": "Claude Opus 5.5 just built Minecraft.\n\nIn the browser. From a single prompt.\n\nNoah Wachnick asked it to recreate Minecraft with advanced shaders, \"as realistic as possible.\"\n\n1 hour 37 minutes at max effort:\n\n> block placement\n> terrain\n> realistic lighting and shaders\n\nHere's a prompt to try it yourself. Bookmark this for later \n\n\"Build a Minecraft-style voxel game in a single HTML file that runs in the browser.\n- First-person controls: WASD, mouse look, jump\n- Procedural terrain with hills, water and trees\n- Place and break blocks with the mouse, 5 block types\n- Advanced shaders: moving sun, soft shadows, ambient occlusion, fog, water reflections\n- Smooth 60 fps on a laptop\nUse Three.js from a CDN. Test it, fix every bug, then keep improving the visuals until it looks as realistic as possible.\"\n\nTips:\n1. Set effort to max\n2. Give it time, the original run took ~1.5 hours\n3. When it's done, ask: \"What looks least realistic? Fix it.\"", "img": "https://media.skillry.dev/opus-5-5/dreyk0o0-165270/original.ef2a9e766e.webp", "post": "https://x.com/dreyk0o0/status/2103822946800165270", "v": true, "card": "https://media.skillry.dev/opus-5-5/dreyk0o0-165270/original-card.3f53b4d5bb.mp4", "orig": "https://media.skillry.dev/opus-5-5/dreyk0o0-165270/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/dreyk0o0-165270/remake.mp4"}, {"n": 280, "c": "interactive", "t": ["canvas", "playable"], "a": "boona11", "p": "Nobody edited this video.\n\nClaude Opus 5.5 built the game, then played it, filmed it, wrote the soundtrack and cut its own trailer.\n\nLow Tide: a painting you can actually play. Free in your browser 👇\n\nhttps://low-tide.netlify.app", "img": "https://media.skillry.dev/opus-5-5/boona11-415751/original.77afc25698.webp", "post": "https://x.com/boona11/status/2103830083446415751", "v": true, "card": "https://media.skillry.dev/opus-5-5/boona11-415751/original-card.96347e8c0e.mp4", "orig": "https://media.skillry.dev/opus-5-5/boona11-415751/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/boona11-415751/remake.mp4"}, {"n": 281, "c": "interactive", "t": ["canvas", "pixel"], "a": "dmowlin", "p": "made a galactic pixel racer game with opus 5.5, can you beat my score? 👿\n\nhttps://velven.ai/david/pixel-racer", "img": "https://media.skillry.dev/opus-5-5/dmowlin-221566/original.9229086ca8.webp", "post": "https://x.com/dmowlin/status/2103830851897221566", "v": true, "card": "https://media.skillry.dev/opus-5-5/dmowlin-221566/original-card.ded36a96b5.mp4", "orig": "https://media.skillry.dev/opus-5-5/dmowlin-221566/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/dmowlin-221566/remake.mp4"}, {"n": 282, "c": "interactive", "t": ["threejs", "shader", "canvas", "particles"], "a": "nQaze", "p": "Opus 5.5 releases 😍 \n\nMe: Woahh! Let's drill through our BugSmash backlog quickly. \n\nMy Co-founder @suhailpatel941: Hold my cup... let's make a game 🥲 \n\nAll this graphics and the game is just - 4MB game - hosted on BugSmash Drop itself 🤯", "img": "https://media.skillry.dev/opus-5-5/nqaze-939886/original.911e3e6823.webp", "post": "https://x.com/nQaze/status/2103853898301939886", "v": true, "card": "https://media.skillry.dev/opus-5-5/nqaze-939886/original-card.5e98a4011f.mp4", "orig": "https://media.skillry.dev/opus-5-5/nqaze-939886/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nqaze-939886/remake.mp4"}, {"n": 283, "c": "interactive", "t": ["canvas", "svg", "gsap"], "a": "KenjiPhang", "p": "Opus 5.5 is the best at animating concept art for a game im making", "img": "https://media.skillry.dev/opus-5-5/kenjiphang-750512/original.3f5ecffc84.webp", "post": "https://x.com/KenjiPhang/status/2103859812123750512", "v": true, "card": "https://media.skillry.dev/opus-5-5/kenjiphang-750512/original-card.1803710013.mp4", "orig": "https://media.skillry.dev/opus-5-5/kenjiphang-750512/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kenjiphang-750512/remake.mp4"}, {"n": 284, "c": "interactive", "t": ["threejs", "shader", "canvas"], "a": "anduraio", "p": "Claude Opus 5.5 is stupidly good at games, so I’m putting it on a streak.\nDropping 10 browser games I built with it. One a day.\n\nSame characters. Same world. Different gameplay each day.\nAdventure games. Painterly stylised 3D. Soft cel shading, wind in the grass, hazy blue distance, hand-painted skies. The Legend of Zelda: BotW / TotK energy.\n\nTrailer + play link + what the model actually did.\nPlayable. Built with Opus. That’s the series.", "img": "https://media.skillry.dev/opus-5-5/anduraio-570761/original.0a8c19ca2d.webp", "post": "https://x.com/anduraio/status/2103860609712570761", "v": true, "card": "https://media.skillry.dev/opus-5-5/anduraio-570761/original-card.229b146ef9.mp4", "orig": "https://media.skillry.dev/opus-5-5/anduraio-570761/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/anduraio-570761/remake.mp4"}, {"n": 285, "c": "interactive", "t": ["threejs", "canvas", "playable"], "a": "kepochnik", "p": "I built Minecraft thanks to Opus 5.5 ( part 2 )\n\ntoday I added more mobs and here I will show their characteristics as a video\n\nthe process took probably : 2-3 hours\n\nnext week I'm going to publish this game for everyone\n\nturn notifications", "img": "https://media.skillry.dev/opus-5-5/kepochnik-237752/original.d2ad4308b1.webp", "post": "https://x.com/kepochnik/status/2103867115044237752", "v": true, "card": "https://media.skillry.dev/opus-5-5/kepochnik-237752/original-card.3c527b31ca.mp4", "orig": "https://media.skillry.dev/opus-5-5/kepochnik-237752/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kepochnik-237752/remake.mp4"}, {"n": 286, "c": "interactive", "t": ["threejs", "shader", "canvas", "audio"], "a": "angie_carel", "p": "In a deeply serious, highly mature effort to test Opus 5.5's ability to render jello-like textures—reflections, transparency, jiggly movement, the works—I accidentally built a \"Jiggle Buddies\" game that my son played the entire drive home. \nLink to play: https://www.angiecarel.com/jiggle-buddies", "img": "https://media.skillry.dev/opus-5-5/angie-carel-954689/original.a927bf0383.webp", "post": "https://x.com/angie_carel/status/2103876982819954689", "v": true, "card": "https://media.skillry.dev/opus-5-5/angie-carel-954689/original-card.158de89eb4.mp4", "orig": "https://media.skillry.dev/opus-5-5/angie-carel-954689/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/angie-carel-954689/remake.mp4"}, {"n": 287, "c": "interactive", "t": ["threejs", "shader", "canvas"], "a": "deeprajO1", "p": "What if learning Python felt more like playing a game than studying? 🎮🐍\n\nSo I asked Claude Opus 5.5 to build me a Python-learning surfing game.\n\nAnd the result is pretty wild. 🌊", "img": "https://media.skillry.dev/opus-5-5/deeprajo1-834106/original.75323ab657.webp", "post": "https://x.com/deeprajO1/status/2103938972426834106", "v": true, "card": "https://media.skillry.dev/opus-5-5/deeprajo1-834106/original-card.300c174dcc.mp4", "orig": "https://media.skillry.dev/opus-5-5/deeprajo1-834106/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/deeprajo1-834106/remake.mp4"}, {"n": 288, "c": "interactive", "t": ["threejs", "shader", "canvas", "playable"], "a": "vibechine", "p": "Ladprao Jet ski game based on the Bangkok floods. Clear the drains and fight the crocs. Made with Opus 5.5 . https://ladprao-flood-ski.vercel.app/", "img": "https://media.skillry.dev/opus-5-5/vibechine-465008/original.f7e50d1d5c.webp", "post": "https://x.com/vibechine/status/2103966021451465008", "v": true, "card": "https://media.skillry.dev/opus-5-5/vibechine-465008/original-card.37f7486b0c.mp4", "orig": "https://media.skillry.dev/opus-5-5/vibechine-465008/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/vibechine-465008/remake.mp4"}, {"n": 289, "c": "interactive", "t": ["threejs", "shader", "audio"], "a": "blitast_studio", "p": "A black cat's night stroll along a moonlit canal 🐈‍⬛🌙\n\nCatWalk — a one-button 3D browser game.\nZero image or audio files: the town, the cat's animation and the jazz are all generated in code. The whole game is ~200KB.\n\nClaude Opus 5.5\n\n▶ https://blitastxyz.itch.io/catwalk\n\n#threejs #indiedev #gamedev #WebGL", "img": "https://media.skillry.dev/opus-5-5/blitast-studio-257328/original.650dff62a0.webp", "post": "https://x.com/blitast_studio/status/2104003920251257328", "v": true, "card": "https://media.skillry.dev/opus-5-5/blitast-studio-257328/original-card.f2b1ab173c.mp4", "orig": "https://media.skillry.dev/opus-5-5/blitast-studio-257328/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/blitast-studio-257328/remake.mp4"}, {"n": 290, "c": "interactive", "t": ["canvas", "pixel"], "a": "waseemkhalo", "p": "I made this game with Claude Opus 5.5\n+ ChatGPT Astra 6 for some visual assets = our new game Spoiled Egg \n\nhttps://eggverse.co\nhttps://eggverse.co/games/spoiled-egg", "img": "https://media.skillry.dev/opus-5-5/waseemkhalo-636267/original.f78d963448.webp", "post": "https://x.com/waseemkhalo/status/2104018205580636267", "v": true, "card": "https://media.skillry.dev/opus-5-5/waseemkhalo-636267/original-card.82108751b0.mp4", "orig": "https://media.skillry.dev/opus-5-5/waseemkhalo-636267/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/waseemkhalo-636267/remake.mp4"}, {"n": 291, "c": "interactive", "t": ["canvas", "audio"], "a": "TaylorBereiter", "p": "https://claude.ai/artifact/Vos8wdB8Jenz9FopZWeRMb\n\nCheck out DOUBLE FEATURE, a Cuphead Inspired Mini-Game built with Claude Opus 5.5.\n\nI find this model works best when leaning into its strengths, figuring out the parts it does well and letting it capitalize on them. Cartoon shapes and sounds are great.", "img": "https://media.skillry.dev/opus-5-5/taylorbereiter-189192/original.2295aa452e.webp", "post": "https://x.com/TaylorBereiter/status/2104045641706189192", "v": true, "card": "https://media.skillry.dev/opus-5-5/taylorbereiter-189192/original-card.a6009d9cb5.mp4", "orig": "https://media.skillry.dev/opus-5-5/taylorbereiter-189192/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/taylorbereiter-189192/remake.mp4"}, {"n": 292, "c": "interactive", "t": ["threejs", "shader"], "a": "smallhusk", "p": "A procedurally-generated game in infinite stranded space colonies with realistic physics. All creative decisions made by @claudeai Opus 5.5, all done in just one week's usage window at Pro-level. Claude chose to add pettable cats in the combat-free mode. https://claude.ai/artifact/1o1DWNgoanSy2ZCRTCtjpq", "img": "https://media.skillry.dev/opus-5-5/smallhusk-272056/original.f92b69226b.webp", "post": "https://x.com/smallhusk/status/2104046074600272056", "v": true, "card": "https://media.skillry.dev/opus-5-5/smallhusk-272056/original-card.d6eba122ee.mp4", "orig": "https://media.skillry.dev/opus-5-5/smallhusk-272056/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/smallhusk-272056/remake.mp4"}, {"n": 293, "c": "interactive", "t": ["threejs", "canvas"], "a": "lisp_mi", "p": "I asked Opus 5.5 to build a tiny underground delivery network in three.js — then turned it into a game.\nLunch rush: 24 orders in 60 s, 6 express upgrades, beat the deadlines.\nFree in the browser, link below 👇", "img": "https://media.skillry.dev/opus-5-5/lisp-mi-139812/original.e5566e28fc.webp", "post": "https://x.com/lisp_mi/status/2104046743751139812", "v": true, "card": "https://media.skillry.dev/opus-5-5/lisp-mi-139812/original-card.220fcb6088.mp4", "orig": "https://media.skillry.dev/opus-5-5/lisp-mi-139812/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/lisp-mi-139812/remake.mp4"}, {"n": 294, "c": "interactive", "t": ["threejs", "canvas", "playable"], "a": "itsjdraven", "p": "Claude Opus 5.5 just built me a mini temple run style game \n\nit actually feel pretty smooth to play\n\nhonestly I didn’t expect the result like this", "img": "https://media.skillry.dev/opus-5-5/itsjdraven-557760/original.d6166a0f3b.webp", "post": "https://x.com/itsjdraven/status/2104059393222557760", "v": true, "card": "https://media.skillry.dev/opus-5-5/itsjdraven-557760/original-card.c7ae3806cb.mp4", "orig": "https://media.skillry.dev/opus-5-5/itsjdraven-557760/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/itsjdraven-557760/remake.mp4"}, {"n": 295, "c": "interactive", "t": ["threejs", "canvas", "audio", "pixel"], "a": "izmaelmag", "p": "What is going on 🤪\n\n🎲 Dice Corners  \nhttps://izmaelmag.me/dice-corners/\n\nI’ve been a gamer since I was three, and the dream of making my own games is what led me into programing\n\nIn 2008 I discovered GameMaker and made a few platformers and scrolling shooters. But i had no idea how to make a living from games, so I moved into design and frontend development. I never stopped exploring huge libraries of retro games and imagining games of my own—making them by hand was just hard.\n\n18 years later, I subscribe to Claude Opus 5.5, write a PRD, put together a simple prototype, and half an hour later within a single five-hour usage window I have a complete game. It runs locally. It’s simple, but it’s beautiful, and it works.\n\nAnd I did it by directing agents on my laptop through a telegram chat\n\nMind blowing 🤯", "img": "https://media.skillry.dev/opus-5-5/izmaelmag-282849/original.27cd429488.webp", "post": "https://x.com/izmaelmag/status/2104070894251282849", "v": true, "card": "https://media.skillry.dev/opus-5-5/izmaelmag-282849/original-card.6cf8df33d4.mp4", "orig": "https://media.skillry.dev/opus-5-5/izmaelmag-282849/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/izmaelmag-282849/remake.mp4"}, {"n": 296, "c": "interactive", "t": ["threejs", "shader", "playable"], "a": "llama3dstudio", "p": "Rock skipping game made with Three.js and Opus 5.5.", "img": "https://media.skillry.dev/opus-5-5/llama3dstudio-012980/original.226d375df7.webp", "post": "https://x.com/llama3dstudio/status/2104115092124012980", "v": true, "card": "https://media.skillry.dev/opus-5-5/llama3dstudio-012980/original-card.7051e637a5.mp4", "orig": "https://media.skillry.dev/opus-5-5/llama3dstudio-012980/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/llama3dstudio-012980/remake.mp4"}, {"n": 297, "c": "interactive", "t": ["threejs", "playable"], "a": "HelloVyom", "p": "Opus 5.5 spent 43 million output tokens building 3D PvZ 2: Reflourished", "img": "https://media.skillry.dev/opus-5-5/hellovyom-800659/original.1530ca29e5.webp", "post": "https://x.com/HelloVyom/status/2104140498344800659", "v": true, "card": "https://media.skillry.dev/opus-5-5/hellovyom-800659/original-card.968886b796.mp4", "orig": "https://media.skillry.dev/opus-5-5/hellovyom-800659/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/hellovyom-800659/remake.mp4"}, {"n": 298, "c": "interactive", "t": ["threejs", "shader", "canvas", "playable"], "a": "RealFedeURU", "p": "Skydiving game built with opus 5.5🪂", "img": "https://media.skillry.dev/opus-5-5/realfedeuru-475858/original.f51210ac86.webp", "post": "https://x.com/RealFedeURU/status/2104154307071475858", "v": true, "card": "https://media.skillry.dev/opus-5-5/realfedeuru-475858/original-card.65b8e5584a.mp4", "orig": "https://media.skillry.dev/opus-5-5/realfedeuru-475858/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/realfedeuru-475858/remake.mp4"}, {"n": 299, "c": "interactive", "t": ["threejs", "svg", "gsap"], "a": "BrainWavePub", "p": "Opus 5.5 editing my demo video 👀\n\nBuilt a hand-drawn catapult sketch that turns into a real 3D physics simulator.\n\nRecorded it, gave Opus 5.5 one prompt to edit the raw footage.\n\nNo editing app. It made its own.\n\nVideo below 👇", "img": "https://media.skillry.dev/opus-5-5/brainwavepub-812667/original.9fafc75e51.webp", "post": "https://x.com/BrainWavePub/status/2104180455813812667", "v": true, "card": "https://media.skillry.dev/opus-5-5/brainwavepub-812667/original-card.26129085eb.mp4", "orig": "https://media.skillry.dev/opus-5-5/brainwavepub-812667/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/brainwavepub-812667/remake.mp4"}, {"n": 300, "c": "interactive", "t": ["threejs", "canvas", "particles"], "a": "Alex_Vainshtein", "p": "Can one developer + 3 AI agents build a GTA-style game?\n\nI’m trying.\n\nFIXER is a 1990s city game I’m building with Astra, Opus 5.5 and Fable.\n\nThis is the current playable build.", "img": "https://media.skillry.dev/opus-5-5/alex-vainshtein-195332/original.420b38c250.webp", "post": "https://x.com/Alex_Vainshtein/status/2104197450307195332", "v": true, "card": "https://media.skillry.dev/opus-5-5/alex-vainshtein-195332/original-card.1812666954.mp4", "orig": "https://media.skillry.dev/opus-5-5/alex-vainshtein-195332/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/alex-vainshtein-195332/remake.mp4"}, {"n": 301, "c": "interactive", "t": ["threejs", "shader", "canvas"], "a": "BrenBuilds", "p": "@kimmonismus hours of rework on my threejs game with Opus 5.5 and limits didnt even move\n", "img": "https://media.skillry.dev/opus-5-5/brenbuilds-386902/original.f3830f0930.webp", "post": "https://x.com/BrenBuilds/status/2104199715076386902", "v": true, "card": "https://media.skillry.dev/opus-5-5/brenbuilds-386902/original-card.6f291124df.mp4", "orig": "https://media.skillry.dev/opus-5-5/brenbuilds-386902/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/brenbuilds-386902/remake.mp4"}, {"n": 302, "c": "interactive", "t": ["threejs", "shader", "canvas", "particles"], "a": "mayuresh_empire", "p": "Claude Opus 5.5 built this game from a single prompt - a mythic action game inspired by ancient Indian epics.\n\nNo engine. No assets. Every temple, tree, enemy, shader, and sound is generated in code.\n\nEven this trailer was designed by Claude. The future is crazy.", "img": "https://media.skillry.dev/opus-5-5/mayuresh-empire-687553/original.a67c686d3f.webp", "post": "https://x.com/mayuresh_empire/status/2104207365008687553", "v": true, "card": "https://media.skillry.dev/opus-5-5/mayuresh-empire-687553/original-card.562e80f70f.mp4", "orig": "https://media.skillry.dev/opus-5-5/mayuresh-empire-687553/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mayuresh-empire-687553/remake.mp4"}, {"n": 303, "c": "interactive", "t": ["canvas", "particles", "audio", "pixel"], "a": "tonnusos", "p": "Testing out Opus 5.5 today by letting it work on a Magicka-inspired game! I loved this game when it came out 15 years ago, super cool spell casting mechanics. \n\nSo I want to take this and turn it into an extraction looter. You go out into the wild solo or in a group, fight off mobs and other players to collect loot to bring back to your base. \n\nLike others have mentioned, Opus 5.5 feels so much more creative. Crazy", "img": "https://media.skillry.dev/opus-5-5/tonnusos-006126/original.34fc397d7a.webp", "post": "https://x.com/tonnusos/status/2104209760388006126", "v": true, "card": "https://media.skillry.dev/opus-5-5/tonnusos-006126/original-card.21917b3018.mp4", "orig": "https://media.skillry.dev/opus-5-5/tonnusos-006126/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/tonnusos-006126/remake.mp4"}, {"n": 304, "c": "interactive", "t": ["threejs", "canvas", "pixel"], "a": "codrops", "p": "Everyone is sharing what Opus 5.5 can build this week, and it made us ask ourselves a different question: when making things becomes this easy, what do we actually want to make and why?\n\nOur answer was a small retro arcade, the kind we grew up hanging out in, filled with 21 games made by independent developers. Every cabinet carries the name of the person who built its game.\n\nWalk in, drop a coin, and play: https://tympanus.net/Demos/InsertCoin/\n\n#threejs #webgl", "img": "https://media.skillry.dev/opus-5-5/codrops-340299/original.f3a89ace78.webp", "post": "https://x.com/codrops/status/2104217304611340299", "v": true, "card": "https://media.skillry.dev/opus-5-5/codrops-340299/original-card.ed5e7fc252.mp4", "orig": "https://media.skillry.dev/opus-5-5/codrops-340299/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/codrops-340299/remake.mp4"}, {"n": 305, "c": "motion", "t": ["threejs", "canvas", "particles"], "a": "zhang_baoqing", "p": "群友一句话提示词\n\n用Opus5.5做的粒子网站\n\n真的太酷了", "img": "https://media.skillry.dev/opus-5-5/zhang-baoqing-920413/original.567ddd7b50.webp", "post": "https://x.com/zhang_baoqing/status/2104081777119920413", "v": true, "card": "https://media.skillry.dev/opus-5-5/zhang-baoqing-920413/original-card.d8397eae13.mp4", "orig": "https://media.skillry.dev/opus-5-5/zhang-baoqing-920413/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/zhang-baoqing-920413/remake.mp4"}, {"n": 306, "c": "motion", "t": ["threejs", "shader", "canvas"], "a": "sciencedegens", "p": "趁着今天有空回看和分析了一下整个视频\n\n审美在线的Opus 5.5确实顶 @claudeai \n\n3D渲染器像素风\n\n这个渲染效果确实做得很强，逻辑调度能力和美学素养确实是挂钩的\n\n这个片头的转场、音效和提振人心的bgm真的可以被 @binancezh 拿去用了\n\n像素小人物也很有 @cz_binance 的感觉\n\n#binance #claude", "img": "https://media.skillry.dev/opus-5-5/sciencedegens-843325/original.abafb28cc5.webp", "post": "https://x.com/sciencedegens/status/2104114814536843325", "v": true, "card": "https://media.skillry.dev/opus-5-5/sciencedegens-843325/original-card.9b5c9769c1.mp4", "orig": "https://media.skillry.dev/opus-5-5/sciencedegens-843325/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sciencedegens-843325/remake.mp4"}, {"n": 307, "c": "motion", "t": ["canvas", "svg"], "a": "washow_cfo", "p": "claude codeで動画作成が流行ってるけど、AI臭さがあるからどっかでみたことあるようなスタイリッシュな動画を作ってみた\nCMとしては使えるかな？\n\n使ったもの：Claude Code（Opus 5.5）／Gemini TTS／HyperFrames", "img": "https://media.skillry.dev/opus-5-5/washow-cfo-175311/original.b25c435854.webp", "post": "https://x.com/washow_cfo/status/2104595346882175311", "v": true, "card": "https://media.skillry.dev/opus-5-5/washow-cfo-175311/original-card.51dc8020c6.mp4", "orig": "https://media.skillry.dev/opus-5-5/washow-cfo-175311/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/washow-cfo-175311/remake.mp4"}, {"n": 308, "c": "explainer", "t": ["svg"], "a": "TimGuignard", "p": "Just tested Claude Opus 5.5 with Hyperframes.\nOne prompt (also generated), the result is ok. Not crazy, but with a few more indications and a clear direction, it would probably get much nicer.\n\nThe video below is actually a screen record.", "img": "https://media.skillry.dev/opus-5-5/timguignard-623571/original.c6c98a78c9.webp", "post": "https://x.com/TimGuignard/status/2104515756159623571", "v": true, "card": "https://media.skillry.dev/opus-5-5/timguignard-623571/original-card.af841f2e16.mp4", "orig": "https://media.skillry.dev/opus-5-5/timguignard-623571/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/timguignard-623571/remake.mp4"}, {"n": 309, "c": "motion", "t": ["svg", "gsap"], "a": "joao_felixl", "p": "Não tava botando fé no hyperframes + opus 5.5 max effort, mas isso aqui ficou sensacional.", "img": "https://media.skillry.dev/opus-5-5/joao-felixl-809438/original.d137a7825a.webp", "post": "https://x.com/joao_felixl/status/2104273407818809438", "v": true, "card": "https://media.skillry.dev/opus-5-5/joao-felixl-809438/original-card.523dd3a7cb.mp4", "orig": "https://media.skillry.dev/opus-5-5/joao-felixl-809438/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/joao-felixl-809438/remake.mp4"}, {"n": 310, "c": "motion", "t": ["css"], "a": "vince_builds", "p": "I didn't believe it but this was 100% Opus 5.5 Max, in 8h15 min.\n\nGave it access to DesignLoop, hyperframe skill, elevenlabs.", "img": "https://media.skillry.dev/opus-5-5/vince-builds-355650/original.5fb99e109d.webp", "post": "https://x.com/vince_builds/status/2104257989100355650", "v": true, "card": "https://media.skillry.dev/opus-5-5/vince-builds-355650/original-card.3f7df355fe.mp4", "orig": "https://media.skillry.dev/opus-5-5/vince-builds-355650/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/vince-builds-355650/remake.mp4"}, {"n": 311, "c": "interactive", "t": ["canvas", "playable"], "a": "mappletour", "p": "Opus 5.5に「ド派手なPVを作って」と丸投げしたら、ほぼ任せきりで完成した😳\n世界ランク上位の実際のリプレイを撮影して、拍に合わせて「ギリギリ！」を重ねてくる。\n日英2本、一晩で。Claude×HyperFrames、世界変わった🔥\nhttps://biribiri-game.web.app", "img": "https://media.skillry.dev/opus-5-5/mappletour-334921/original.0bb6633b54.webp", "post": "https://x.com/mappletour/status/2104206756482334921", "v": true, "card": "https://media.skillry.dev/opus-5-5/mappletour-334921/original-card.d779b190af.mp4", "orig": "https://media.skillry.dev/opus-5-5/mappletour-334921/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mappletour-334921/remake.mp4"}, {"n": 312, "c": "explainer", "t": ["svg"], "a": "itsahmedharoon", "p": "Jumping on the Claude Code + Hyperframe bandwagon.\n\nI made this intro completely zero-shot using Opus 5.5.\n\nClaude downloaded and ran an open-source model for text-to-speech, added the turbine sound at the start, layered in the other sound effects, and nailed the motion and visuals.\n\nThe accuracy of the whole thing is unreal. I’m in awe.", "img": "https://media.skillry.dev/opus-5-5/itsahmedharoon-544194/original.4fb3bbf4c7.webp", "post": "https://x.com/itsahmedharoon/status/2103986344414544194", "v": true, "card": "https://media.skillry.dev/opus-5-5/itsahmedharoon-544194/original-card.cf34179611.mp4", "orig": "https://media.skillry.dev/opus-5-5/itsahmedharoon-544194/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/itsahmedharoon-544194/remake.mp4"}, {"n": 313, "c": "explainer", "t": ["canvas", "svg"], "a": "stokebuilder", "p": "I used Opus 5.5 to generate 50 podcast animations for extremely hard to visualize concepts like Jev for Legal.  Absolutely blown away. \n\nWe're about to see an explosion of visual podcasts, this entire medium is about to shift \n\nSharing my prompt below.\n\n【作者补充制作说明】\nGo through the entire [episode] cut and add full-screen animations and graphics wherever they help. Be aggressive and over-inclusive: 35–50 moments, at least 2 per chapter. The goal is to fill empty talking-head time, explain ideas, and create visual hooks.\n\nStyle. Pick an aesthetic that's genuinely interesting and very, very cool, built in JavaScript with HyperFrames and assembled in Tesseract. Inspiration (all JS, no image assets):\n\nhttps://x.com/Voxyz_ai/status/2102531681450119426: paper, typewriter-tape labels, hand-drawn marks\nhttps://x.com/donaldjewkes/status/2102801274173587569: halftone, manga and pixel print, kinetic data type\n\nStay inside the LegalQuants brand (read brands/legalquants/): charcoal, white and black only, Arial, and the supplied lockup top-right, static. Write a shared style bible and a component kit first, so every animation looks like the same show.\n\nMoments I definitely want:\n\n[LIST]\n\nRules\n\nWhenever anything goes full-screen (animation, screen share or still), one of us is in a corner picture-in-picture, bottom-right, following whoever is talking.\nNo punch-ins or zooming on the cameras. Keep each speaker relatively centered.\nCopy must be verbatim or faithful to what's said. Never invent facts, numbers or quotes.\nSync each animation's beats to the spoken words.\nKeep each graphic inside one uncut stretch of audio, and leave a few seconds of faces between graphics.\n\nProcess\n\nAn Opus 5.5 agent at extra-high effort finds every timestamp where an animation could fill space and hook the viewer, with a concept for each.\nOpus 5.5 at medium effort builds each animation.\nOpus 5.5 at extra-high effort judges each one once on brand consistency with the others, visual interest, relevance to the narrative and creative judgment.\nOnly cues the judge considers egregiously bad go back for a fix. No blanket redo loops.\nAssemble the full cut with PiP baked into every full-screen visual, and give me a folder of the individual animations.", "img": "https://media.skillry.dev/opus-5-5/stokebuilder-356793/original.0166546530.webp", "post": "https://x.com/stokebuilder/status/2103896101120356793", "v": true, "card": "https://media.skillry.dev/opus-5-5/stokebuilder-356793/original-card.942942b0f2.mp4", "orig": "https://media.skillry.dev/opus-5-5/stokebuilder-356793/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/stokebuilder-356793/remake.mp4"}, {"n": 314, "c": "motion", "t": ["canvas", "svg"], "a": "ik_builds", "p": "I WAS QUOTED $3000 FOR THIS!!!\n\nSo I asked Opus 5.5 (medium) to create a launch video using Motion Graphics for us.\n\nhere's the prompt that one-shots it:\n\n\"Create a 15s motion-graphics film explaining {{PRODUCT}}. HyperFrames + GSAP, no voiceover, no footage.\nStyle: paper-light canvas, marker notes that draw on, real physics, huge kinetic type,\nhard light/dark switches, a new idea every 1.5–2 s, a sound on every hit.\n\nCOPY: read {{POSITIONING_DOCS}} first. {{ONE_LINER}} For {{AUDIENCE}}. {{WHAT_IT_DOES}}\nName what the product learns, never the abstraction.\n\nRULES\n- No chrome (scrubber, timecode, fps, headers). No animator jargon on screen\n  (\"squash\", \"stagger\", \"easing\"...). Every word speaks to the buyer.\n- No invented results: no %, multipliers, customer names or figures.\n- Never use: {{BANNED_WORDS}}.\n- Logo: real mark {{LOGO_FILE}} + \"{{PRODUCT}}\" in {{WORDMARK_FONT}}; never a boxed logo file.\n\nCRAFT\n- Colours {{COLOR_CANVAS}} / {{COLOR_INK}} / {{COLOR_ACCENT_1}} / {{COLOR_ACCENT_2}}; notes in the\n  accents; dark mode = charcoal matching the palette.\n- Fonts {{BRAND_FONTS}}; Anton for kinetic type; Caveat handwriting via stroke-dashoffset.\n- Real easing, squash/stretch, stagger, overlap, onion skin, smear, follow-through. Check the\n  HyperFrames registry first. Set every from-state at t=0 (seek-safe); never cover an exit.\n  One primary move per transition; no generic push/slide/rotate-swing.\n- Music in sections: drums drop on the dark switch and while the ball is airborne, slam back\n  on the type and the logo. SFX: pops, pen scribbles, whooshes, logo sub-hit. CC0 or generated\n  only; log sources. Master -14 LUFS, -2 dBTP, re-measured after AAC encode.\"", "img": "https://media.skillry.dev/opus-5-5/ik-builds-585923/original.2f8b88fadc.webp", "post": "https://x.com/ik_builds/status/2103890476885585923", "v": true, "card": "https://media.skillry.dev/opus-5-5/ik-builds-585923/original-card.096ebedb9e.mp4", "orig": "https://media.skillry.dev/opus-5-5/ik-builds-585923/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ik-builds-585923/remake.mp4"}, {"n": 315, "c": "3d", "t": ["threejs", "shader"], "a": "_petert", "p": "Claude Opus 5.5 + HyperFrames + Gemini Flash 3.8 + Three jsで、Meta VRの紹介動画作ったら変な感じになった", "img": "https://media.skillry.dev/opus-5-5/petert-540960/original.bd13497633.webp", "post": "https://x.com/_petert/status/2103885710734540960", "v": true, "card": "https://media.skillry.dev/opus-5-5/petert-540960/original-card.f6fb70f6f5.mp4", "orig": "https://media.skillry.dev/opus-5-5/petert-540960/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/petert-540960/remake.mp4"}, {"n": 316, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "_petert", "p": "Claude Opus 5.5 + HyperFrames + Gemini Flash 3.8 + Three jsで架空の飲料の広告動画作ってみたけど、なかなか良い", "img": "https://media.skillry.dev/opus-5-5/petert-635793/original.c0135d8714.webp", "post": "https://x.com/_petert/status/2103885113528635793", "v": true, "card": "https://media.skillry.dev/opus-5-5/petert-635793/original-card.78428a6861.mp4", "orig": "https://media.skillry.dev/opus-5-5/petert-635793/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/petert-635793/remake.mp4"}, {"n": 317, "c": "motion", "t": ["threejs", "canvas", "svg", "css"], "a": "_petert", "p": "Claude Opus 5.5 + HyperFrames + Gemini Flash 3.8 + Three js で架空の家計簿サービスの動画作ってみたけど、なかなか良い", "img": "https://media.skillry.dev/opus-5-5/petert-350098/original.c07359fdfd.webp", "post": "https://x.com/_petert/status/2103878940100350098", "v": true, "card": "https://media.skillry.dev/opus-5-5/petert-350098/original-card.0c4ddefa93.mp4", "orig": "https://media.skillry.dev/opus-5-5/petert-350098/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/petert-350098/remake.mp4"}, {"n": 318, "c": "motion", "t": ["gsap", "css"], "a": "georgejimenez98", "p": "This video was made with Opus 5.5, Hyperframes, ElevenLabs with Music, SFX and Voices Endpoints throught Fal AI. \n\nThis way of making videos is making me a little addicted to be honest hahaha. I still have to improve.\n\nCrealix Autopilot is live: set your format, style, schedule and channels once, and it plans, writes, voices and builds every video. Then again. And again.\n\nTry it free → https://crealix.ai/autopilot", "img": "https://media.skillry.dev/opus-5-5/georgejimenez98-431559/original.86deae3c1b.webp", "post": "https://x.com/georgejimenez98/status/2103650183699431559", "v": true, "card": "https://media.skillry.dev/opus-5-5/georgejimenez98-431559/original-card.e17a3b087c.mp4", "orig": "https://media.skillry.dev/opus-5-5/georgejimenez98-431559/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/georgejimenez98-431559/remake.mp4"}, {"n": 319, "c": "motion", "t": ["canvas", "svg"], "a": "Majin_AppSheet", "p": "流行ってることは一回試しとくマン。\n\nClaude Code（Opus 5.5）でモーショングラフィックスを作るのが面白いみたいなので、「シンまじん式のPV作って」と頼んだだけで、これが出てきた。\n\n動画生成AIはゼロ。\n・映像：HTML＋コードで1コマずつ描画（HyperFrames）\n・BGM：GeminiのLyriaで生成\n・効果音：拍を解析して、着地やハンコの瞬間に音ハメ\n\n自分がやったのは、スキルを入れて「おまかせ」って返事したくらい。\nしかもClaude自身は音が聴けないのに、波形を数値で解析して音ハメしてるのがヤバい。\n\n何なのもう…日々革命が起こりすぎて 頭ガンガンするわ", "img": "https://media.skillry.dev/opus-5-5/majin-appsheet-693327/original.43d46d4e8a.webp", "post": "https://x.com/Majin_AppSheet/status/2103497319899693327", "v": true, "card": "https://media.skillry.dev/opus-5-5/majin-appsheet-693327/original-card.89a4b96007.mp4", "orig": "https://media.skillry.dev/opus-5-5/majin-appsheet-693327/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/majin-appsheet-693327/remake.mp4"}, {"n": 320, "c": "motion", "t": ["svg", "css"], "a": "Javi_llofriu", "p": "@gonahmias Le pedi un video para mostar un servicio de mi Agencia de IA (Opus 5.5 + Hyperframe) en 20 minutos tenía esto montado, coste un 20% del consumo de 5h del plan Max.", "img": "https://media.skillry.dev/opus-5-5/javi-llofriu-059888/original.761a10c819.webp", "post": "https://x.com/Javi_llofriu/status/2103372534922059888", "v": true, "card": "https://media.skillry.dev/opus-5-5/javi-llofriu-059888/original-card.c314cab2b4.mp4", "orig": "https://media.skillry.dev/opus-5-5/javi-llofriu-059888/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/javi-llofriu-059888/remake.mp4"}, {"n": 321, "c": "motion", "t": ["svg", "css"], "a": "georgejimenez98", "p": "I have to admit, this blew my mind.\n\nI saw people using Opus 5.5 + Remotion for launch videos, so I tried my own approach.\n\nOpus 5.5 Max + Hyperframes locally, with Fal AI for voices, music & SFX.\n\nNot perfect, but I loved the result.\n\nhttps://www.crealix.ai Autopilot is coming.", "img": "https://media.skillry.dev/opus-5-5/georgejimenez98-427173/original.fa16c6e1b7.webp", "post": "https://x.com/georgejimenez98/status/2103214871785427173", "v": true, "card": "https://media.skillry.dev/opus-5-5/georgejimenez98-427173/original-card.faf10a4ed2.mp4", "orig": "https://media.skillry.dev/opus-5-5/georgejimenez98-427173/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/georgejimenez98-427173/remake.mp4"}, {"n": 322, "c": "explainer", "t": ["canvas", "svg", "gsap"], "a": "HenriToivar", "p": "Opus 5.5 is an absolute BEAST in creating videos.\n\nI am extremely shocked because my previous attempts with GPT-6 Astra and Grok 4.6 were quite underwhelming, far from production ready video.\n\nThe leap here is gigantic.\n\nThis is a ZERO shot video.\n\n【作者补充制作说明】\nWhy Opus 5.5 is so impressive is because it's is not a video generation model. It uses pure code to generate the sound effects, the music. All of the animations are done with CSS/HTML/JS, it doesn't use any video or image assets.\n\nThis is extremely useful for creating detailed explainer videos where you need very fine control over the infographics and consistent deterministic output.\n\nThe framework I used was hyperframes and narration is done by OpenAI text-to-speech.", "img": "https://media.skillry.dev/opus-5-5/henritoivar-445215/original.b7d042a6af.webp", "post": "https://x.com/HenriToivar/status/2102832525798445215", "v": true, "card": "https://media.skillry.dev/opus-5-5/henritoivar-445215/original-card.48bffae3ac.mp4", "orig": "https://media.skillry.dev/opus-5-5/henritoivar-445215/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/henritoivar-445215/remake.mp4"}, {"n": 323, "c": "motion", "t": ["svg"], "a": "l3d1c", "p": "I made a launch ad for @grouped_news in an hour with Opus 5.5 and Remotion, and I never opened a video editor. I added the voiceover and music with ElevenLabs.\n\nThe ad is a React app. It imports my site's CSS tokens and fonts, so it uses the same design system as the site.\n\nI didn't review it by watching renders. It rendered about 20 stills and tiled them into one contact sheet, so I could check a whole cut at a glance before rendering any video.\n\nCaptions are measured in the real font and shrink to fit the 9:16 safe zone, so nothing hides under TikTok's buttons. Every cut lands on a 120 BPM grid, which made the music easy to line up.\n\nIt's one codebase, so the 30s, 15s and 6s cuts in 16:9 and 9:16 are each a different list of scenes.\n\nMy part was saying what felt wrong.", "img": "https://media.skillry.dev/opus-5-5/l3d1c-632524/original.f6cb8403eb.webp", "post": "https://x.com/l3d1c/status/2104649028193632524", "v": true, "card": "https://media.skillry.dev/opus-5-5/l3d1c-632524/original-card.da4929c02c.mp4", "orig": "https://media.skillry.dev/opus-5-5/l3d1c-632524/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/l3d1c-632524/remake.mp4"}, {"n": 324, "c": "motion", "t": ["svg"], "a": "wustep", "p": "Last week, we launched column permissions!\n\nI’m not on Notion’s video team, but with the help of @claudeai, @bot, and @NotionHQ, I made a trailer over the weekend. (How I made it in 🧵)\n\n【作者补充制作说明】\n🎬 BEHIND THE SCENES:\n\nThis was built using @Remotion (React/TypeScript only!), with @claude’s opus 5.5 [xhigh], orchestrated with @bot, and managed in a Notion doc as a working canvas.\n\nIn total, this project took ~90 messages with my @bot over 2 days, which generated 33 video takes with Claude Code and cost ~$400 in Claude credits including all the other takes (API billing but should fit fine in the $100/mo plan)\n\nHere’s a Notion doc documenting the process (including many rejected candidates): https://notion.notion.site/column-permissions-trailer", "img": "https://media.skillry.dev/opus-5-5/wustep-884086/original.7785b73ddb.webp", "post": "https://x.com/wustep/status/2104610435571884086", "v": true, "card": "https://media.skillry.dev/opus-5-5/wustep-884086/original-card.c5f93e7054.mp4", "orig": "https://media.skillry.dev/opus-5-5/wustep-884086/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/wustep-884086/remake.mp4"}, {"n": 325, "c": "motion", "t": ["svg"], "a": "apoorvjain25", "p": "Claude Opus 5.5 made this whole video in code. There was no editor, no After Effects and no stock music.\n\nThe motion graphics are Remotion code. Opus also wrote the music in Python, note by note, and the track reads the same beat file as the visuals. So every DM reply that lands on screen hits a blip in the music at the same frame.\n\nI picked the voice on ElevenLabs and approved the script. Opus did everything else.\n\nIt's a 51-second ad for Synclify's DM automation.", "img": "https://media.skillry.dev/opus-5-5/apoorvjain25-309680/original.27a068b60e.webp", "post": "https://x.com/apoorvjain25/status/2104528012746309680", "v": true, "card": "https://media.skillry.dev/opus-5-5/apoorvjain25-309680/original-card.cda6f63db8.mp4", "orig": "https://media.skillry.dev/opus-5-5/apoorvjain25-309680/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/apoorvjain25-309680/remake.mp4"}, {"n": 326, "c": "motion", "t": ["gsap", "css"], "a": "pranavclickks", "p": "@tibo_maker Wanna rate mine Tibo?\n\nOpus 5.5 + Remotion + My Custom Harness\n\n", "img": "https://media.skillry.dev/opus-5-5/pranavclickks-254816/original.2c4b969df4.webp", "post": "https://x.com/pranavclickks/status/2104512280390254816", "v": true, "card": "https://media.skillry.dev/opus-5-5/pranavclickks-254816/original-card.52f11ece64.mp4", "orig": "https://media.skillry.dev/opus-5-5/pranavclickks-254816/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/pranavclickks-254816/remake.mp4"}, {"n": 327, "c": "explainer", "t": ["svg"], "a": "rpa_dake", "p": "Claude Opus 5.5 に Remotion のコードを書かせて、検索の歴史を15秒の年表ムービーにしたら、めちゃくちゃアツい🔥\n\n・1996から2015まで、ネオン調の年号がspringで3D回転しながら叩きつけるように出る。\n・大学の研究から持株会社への再編まで、各年の出来事を線画のSVGで描き足していく。\n・最後は「検索から、すべてへ。」で締める\n\n歴史ものの勢いは、情報量より場面を叩きつける間で決まる。", "img": "https://media.skillry.dev/opus-5-5/rpa-dake-593915/original.d46bf667dc.webp", "post": "https://x.com/rpa_dake/status/2104466394859593915", "v": true, "card": "https://media.skillry.dev/opus-5-5/rpa-dake-593915/original-card.b038c7dc0e.mp4", "orig": "https://media.skillry.dev/opus-5-5/rpa-dake-593915/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/rpa-dake-593915/remake.mp4"}, {"n": 328, "c": "motion", "t": ["canvas"], "a": "zakisbuilding", "p": "Opus 5.5 is on STEROIDS\n\ngave Claude Code one prompt and it made this 15 second motion design video of my app. \n\nall React code with Remotion, I never opened After Effects", "img": "https://media.skillry.dev/opus-5-5/zakisbuilding-495680/original.b32031689b.webp", "post": "https://x.com/zakisbuilding/status/2104389736647495680", "v": true, "card": "https://media.skillry.dev/opus-5-5/zakisbuilding-495680/original-card.253483c1df.mp4", "orig": "https://media.skillry.dev/opus-5-5/zakisbuilding-495680/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/zakisbuilding-495680/remake.mp4"}, {"n": 329, "c": "motion", "t": ["svg", "gsap", "css"], "a": "aschapmann", "p": "I couldn't resist to do it one more time, this time for RedShip.. and it's waaaaay better!! \n\nIt took +1h for Opus 5.5 to do it. I used this prompt 👇\n\nsave it and try it for your SaaS: \n\n\"Act as a senior motion designer and build a 30-second launch video for [product] in Remotion, entirely in code so I can edit and re-render it: first read my landing page and codebase to pull the real story, copy, colors, font and logo file (trace the logo to SVG so it stays sharp and can be animated), then write the video as one story (why the market matters, why it's painful today, how [product] fixes it, what you get) in 4 to 5 scenes with one short title each, animate everything like a premium product film (kinetic typography word by word, spring easing, smooth camera pushes and pans, depth and glow, elements that build in on the beat instead of just appearing), keep each scene on screen long enough to read, add one soft sound effect for every element that appears and silence otherwise, and end on a memorable animated logo reveal with the tagline and URL, then render it, check the frames yourself and fix anything that overlaps, clips or feels rushed before showing me the result.\"", "img": "https://media.skillry.dev/opus-5-5/aschapmann-724497/original.1de940f4e6.webp", "post": "https://x.com/aschapmann/status/2104230888812724497", "v": true, "card": "https://media.skillry.dev/opus-5-5/aschapmann-724497/original-card.15f860e095.mp4", "orig": "https://media.skillry.dev/opus-5-5/aschapmann-724497/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/aschapmann-724497/remake.mp4"}, {"n": 330, "c": "explainer", "t": ["canvas", "svg"], "a": "itsyashf", "p": "Made this small video for a linkedin post with Opus 5.5 + Remotion and 2 screenshots of reference", "img": "https://media.skillry.dev/opus-5-5/itsyashf-692347/original.58a10ad462.webp", "post": "https://x.com/itsyashf/status/2104227261142692347", "v": true, "card": "https://media.skillry.dev/opus-5-5/itsyashf-692347/original-card.9a1c4383f1.mp4", "orig": "https://media.skillry.dev/opus-5-5/itsyashf-692347/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/itsyashf-692347/remake.mp4"}, {"n": 331, "c": "motion", "t": ["css"], "a": "DannyVerkissen", "p": "I guess i had to step on the motion train as well. \nAsked Claude Opus 5.5 to create a motion video of @getMoveno \n\nAt first i had it create some new material for the website, which it did a great job for via remotion. Then I asked it to use that footage and create a motion video of it. Very very impressive to say the least.", "img": "https://media.skillry.dev/opus-5-5/dannyverkissen-101463/original.77b63edda6.webp", "post": "https://x.com/DannyVerkissen/status/2104212402875101463", "v": true, "card": "https://media.skillry.dev/opus-5-5/dannyverkissen-101463/original-card.f0e32171e5.mp4", "orig": "https://media.skillry.dev/opus-5-5/dannyverkissen-101463/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/dannyverkissen-101463/remake.mp4"}, {"n": 332, "c": "motion", "t": ["svg", "css"], "a": "chapi13", "p": "I didn't open After Effects once\nThis promo for my indie apps is 100% code: Claude Opus 5.5 + @remotion\n-10 apps, real screenshots\n-every cut synced to the beat\n-I reviewed it frame by frame with contact sheets and asked for changes in plain language\nPrivate, local-first apps 👇", "img": "https://media.skillry.dev/opus-5-5/chapi13-131449/original.8c178c6fa6.webp", "post": "https://x.com/chapi13/status/2104206465863131449", "v": true, "card": "https://media.skillry.dev/opus-5-5/chapi13-131449/original-card.e9dec3fdb9.mp4", "orig": "https://media.skillry.dev/opus-5-5/chapi13-131449/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/chapi13-131449/remake.mp4"}, {"n": 333, "c": "motion", "t": ["svg", "gsap", "css"], "a": "QinElke", "p": "Made this 30s motion-graphics promo for https://gmapsscraper.io with Opus 5.5\nIt read our site and wrote the script. \nThen it built every frame in code (Remotion), animated a talking sales guy with lip-sync, and rendered it.\n No After Effects. No designer.\n Is it worth $49/mo?", "img": "https://media.skillry.dev/opus-5-5/qinelke-271655/original.4091676b3a.webp", "post": "https://x.com/QinElke/status/2104176976261271655", "v": true, "card": "https://media.skillry.dev/opus-5-5/qinelke-271655/original-card.84ed27a1f1.mp4", "orig": "https://media.skillry.dev/opus-5-5/qinelke-271655/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/qinelke-271655/remake.mp4"}, {"n": 334, "c": "motion", "t": ["canvas", "svg"], "a": "geneLab_999", "p": "話題の Opus 5.5 のモーショングラフィックス、原作プロンプトそのままで再現してみた。\n\nClaude Code + Remotion 公式プラグイン、effort は xhigh。\nプロンプト1発、途中の API 切断で continue を1回だけ。\n思考 約23分、レンダリング 約90秒。BGM もサンプルなしでコード生成。", "img": "https://media.skillry.dev/opus-5-5/genelab-999-088672/original.62dea5e3b7.webp", "post": "https://x.com/geneLab_999/status/2104163377560088672", "v": true, "card": "https://media.skillry.dev/opus-5-5/genelab-999-088672/original-card.da0ac4fbbb.mp4", "orig": "https://media.skillry.dev/opus-5-5/genelab-999-088672/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/genelab-999-088672/remake.mp4"}, {"n": 335, "c": "motion", "t": ["svg"], "a": "inoue_aix", "p": "opus5.5 + Remotion + Gemini3.8 TTS\nたったの1時間でうちのプロダクトの広告動画2本できた・・・\n\nもう一生外注しないw\n外注したら10万円以上かかってたと思う", "img": "https://media.skillry.dev/opus-5-5/inoue-aix-234322/original.5ea84fe5ab.webp", "post": "https://x.com/inoue_aix/status/2104155161883234322", "v": true, "card": "https://media.skillry.dev/opus-5-5/inoue-aix-234322/original-card.11aa018742.mp4", "orig": "https://media.skillry.dev/opus-5-5/inoue-aix-234322/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/inoue-aix-234322/remake.mp4"}, {"n": 336, "c": "motion", "t": ["canvas", "svg", "css"], "a": "daniel_haida", "p": "claude code (opus 5.5) made the product film for taxtello, my bookkeeping app\n\nevery frame is code: react + remotion, 0 after effects\nthe soundtrack is code too, synthesized in python from sine waves and noise\n\n1 prompt and 2 rounds of feedback\n\nfull prompt below, steal it ↓\n\nYou are the senior motion designer, product designer and Remotion engineer for Taxtello.\n\nYour task is to create a genuinely premium, Apple-level product film for Taxtello.\n\nThis is NOT a generic SaaS explainer.\nThis is NOT a feature walkthrough.\nThis is NOT a startup template animation.\n\nI want a maximum 15-second brand/product showreel that makes Taxtello look like a mature, expensive, beautifully designed financial product.\n\nThink:\n\nApple product launch film\n× premium fintech\n× editorial motion design\n× restrained Stripe-like product presentation\n× Taxtello's own visual identity\n\nThe desired reaction is:\n\n“Wait, this is a German bookkeeping app?”\n\nThe film should feel expensive.\n\n────────────────────────────────────\nREPO / SOURCE OF TRUTH\n────────────────────────────────────\n\nFirst inspect the real repositories before designing anything.\n\nMain product:\n  /taxtello/main\n\nExisting Remotion project:\n  /taxtello/beta-motion\n\nImportant real brand sources:\n\n  /taxtello/main/public/css/app/_00-tokens.css\n  /taxtello/main/docs/design/TOKENS.md\n  /taxtello/main/public/taxtello-wordmark.png\n  /taxtello/main/public/icons.svg\n\nExisting current product screenshots can be found under:\n\n  /taxtello/main/artifacts/smoke-ui-smoke/\n\nPrefer the newest valid screenshots/current source over stale artifacts.\n\nThere is already an existing 24-second Remotion hero animation in\n/taxtello/beta-motion.\n\nDO NOT replace it.\nDO NOT regress it.\nDO NOT force its current AI-connections storyline into this new film.\n\nCreate a new independent composition for this task, e.g.\n\n  TaxtelloShowreel15\n\nYou may reuse good infrastructure, fonts, rendering utilities, motion primitives,\neasing curves, asset loading and QA infrastructure from beta-motion where useful.\n\nBut creatively this should be a new film.\n\nBefore implementation, inspect the actual Taxtello UI and understand the product.\n\nDo not invent functionality that does not exist.\n\n────────────────────────────────────\nREAL TAXTELLO VISUAL LANGUAGE\n────────────────────────────────────\n\nUse the real design system.\n\nCore palette:\n\nBackground:\n  #0c0f1a\n\nElevated surfaces:\n  #111525\n  #131722\n  #1a2032\n\nPrimary brand gold:\n  #e8b84b\n\nGold highlight:\n  #f5d07a\n\nGold depth:\n  #9b6d18\n\nPrimary text:\n  #e8eaf2\n\nStrong warm white:\n  #f6f4eb\n\nSecondary text:\n  #8b93b5\n\nPositive:\n  #34d399\n\nNegative/error only where semantically necessary:\n  #f87171\n\nTypography:\n  Plus Jakarta Sans\n\nNumbers / financial values where appropriate:\n  JetBrains Mono\n\nUse the actual Taxtello wordmark and/or Taxtello mark.\nDo not redraw or approximate the logo.\n\nTaxtello's gold should feel like a precious accent, not a yellow UI flood.\n\nThink:\ndark metal\nwarm gold\nglass\nink\nprecision\nquiet confidence\n\nNOT:\ncyberpunk\ncrypto\nneon\ngaming\ngeneric AI purple\nrainbow gradients\n\n────────────────────────────────────\nCORE CREATIVE RULES\n────────────────────────────────────\n\nFollow these rules ruthlessly:\n\n1. ONE SHOT = ONE IDEA.\n\n2. Every scene needs room to breathe.\n\n3. The product UI is the hero.\n\n4. Do not plaster explanatory copy everywhere.\n\n5. Do not use hard cuts unless there is a deliberate reason.\n\n6. Prefer object-driven transitions:\n   a card becomes the next card,\n   a chart line becomes a connector,\n   a receipt becomes a booking,\n   a number becomes another interface element,\n   the camera moves through the product.\n\n7. Use premium easing.\n   No linear movement.\n\n8. Motion should overlap naturally.\n   Elements should not all start and stop at exactly the same frame.\n\n9. Use depth sparingly:\n   perspective,\n   soft parallax,\n   scale,\n   foreground/background separation,\n   controlled depth of field if achievable.\n\n10. NO effect exists simply because it looks cool.\n\n11. No particle spam.\n\n12. No fake glassmorphism everywhere.\n\n13. No excessive blur.\n\n14. No pointless 3D spinning cards.\n\n15. No constant zooming.\n\n16. No 20 different animation styles.\n\n17. No bouncing UI.\n\n18. No giant marketing paragraph.\n\n19. Do not imitate a particular Apple commercial shot-for-shot.\n    Capture the philosophy and production quality instead.\n\nThe visual confidence should come from restraint.\n\n────────────────────────────────────\nFORMAT\n────────────────────────────────────\n\nPrimary master:\n\n1920 × 1080\n60 fps\n16:9\nH.264\nmaximum duration: 15.0 seconds\n\nTarget runtime:\napproximately 14.0–15.0 seconds.\n\nIt must work as a social-media product reveal even without sound.\n\nIf practical AFTER the master is finished, also create a deliberately recomposed\nvertical/social variant.\n\nDo not merely crop the desktop composition.\n\nBut the desktop master is the priority.\n\n────────────────────────────────────\nSTORY / EMOTIONAL ARC\n────────────────────────────────────\n\nDo not make this a list of five features.\n\nIt should feel like one continuous thought:\n\nCHAOS → CONTROL → CLARITY → TAXTELLO\n\nThe first 1.5 seconds must already look premium.\n\nThe first meaningful product moment should happen by ~2 seconds.\n\nNo five-second logo intro.\n\nPossible narrative direction:\n\n“Everything about your business, finally in one place.”\n\nBut SHOW this instead of explaining it.\n\nI want approximately four visual ideas across the whole film.\n\nUse the strongest REAL Taxtello surfaces you find in the repository.\n\nStrong candidates include:\n\n• Finanzcockpit / Dashboard\n• Rechnungen\n• Belege\n• Bank / matching\n• Steuergesundheit / tax overview\n\nYou do NOT need to show all of them.\n\nChoose the visually strongest combination.\n\n────────────────────────────────────\nSUGGESTED 15-SECOND STORYBOARD\n────────────────────────────────────\n\nTreat this as a strong starting point, not a rigid template.\n\n0.00 – 1.20\n\nBLACK / NAVY.\n\nA tiny warm-gold glint appears.\n\nThe glint elegantly reveals either the Taxtello mark or a fragment of the\nwordmark.\n\nNo generic logo fade.\n\nThink machined precision.\n\nThe camera moves through or past the mark and the UI begins to emerge from it.\n\nVery little or no copy.\n\n─────────────────\n\n1.20 – 4.40\n\nFINANCIAL CONTROL.\n\nReveal the actual Taxtello Cockpit as a dimensional product surface.\n\nNot just a screenshot placed on screen.\n\nReconstruct/crop/layer it so individual interface regions can animate.\n\nThe hero financial number resolves crisply.\nThe chart draws in.\nSupporting metrics settle slightly later.\n\nUse subtle stagger.\n\nA single line of copy may appear, for example:\n\n  “Alles im Blick.”\n\nor another equally short German phrase if you find something more fitting.\n\nMaximum ~3–4 words.\n\nThe interface must remain recognizable as the real product.\n\n─────────────────\n\n4.40 – 7.50\n\nDOCUMENT / BOOKKEEPING TRANSFORMATION.\n\nUse a visual object from the previous scene as the transition.\n\nExample:\n\nA gold chart point expands into the corner of a receipt/card.\nThe camera follows it.\nA receipt/document enters.\nTaxtello identifies or organizes it.\nThe document snaps elegantly into its corresponding booking / financial record.\n\nUse magnetic alignment and precision.\n\nNo cheesy scanner laser.\n\nNo floating paper tornado.\n\nPossible micro-copy:\n\n  “Belege. Erledigt.”\n\nOnly if it improves the scene.\n\n─────────────────\n\n7.50 – 10.70\n\nMONEY / INVOICES.\n\nMorph or transition naturally into the real Rechnungen interface.\n\nUse one strong moment:\n\nan invoice status changes,\na payment resolves,\nan amount moves into place,\nor the overview assembles itself.\n\nNumbers should feel tactile and precise.\n\nUse JetBrains Mono where this matches the actual product.\n\nGold highlights the active state.\n\nGreen is used only for a genuinely positive semantic state.\n\nPotential copy:\n\n  “Geld. Im Griff.”\n\nAgain: optional and extremely short.\n\n─────────────────\n\n10.70 – 12.80\n\nTAX / CLARITY.\n\nTransition into the real Taxtello tax-health / financial guidance surface.\n\nDo not claim that Taxtello magically guarantees correct taxes.\n\nCommunicate visibility and control.\n\nExample:\n\nmultiple noisy signals collapse into one calm, structured tax overview.\n\nPotential copy:\n\n  “Steuern im Blick.”\n\nThis scene should feel calmer than the previous scene.\n\nThe rhythm briefly slows.\n\n─────────────────\n\n12.80 – 15.00\n\nBRAND PAYOFF.\n\nPull the camera outward.\n\nThe UI compresses or folds into one beautiful Taxtello product object / surface.\n\nDarkness returns around it.\n\nThe gold Taxtello wordmark resolves.\n\nOne short brand line underneath.\n\nExplore strong final lines such as:\n\n  “Dein Business. Klar.”\n\n  “Buchhaltung. Unter Kontrolle.”\n\n  “Einfach mehr Überblick.”\n\n  “Alles fürs Business. An einem Ort.”\n\nChoose based on the actual product positioning you find in the repo.\n\nDo not use a line simply because I suggested it.\n\nThe final frame must have enough stillness to register.\n\nEnd confidently.\n\nNo giant bouncing CTA.\n\n────────────────────────────────────\nTRANSITIONS\n────────────────────────────────────\n\nThis is one of the most important parts.\n\nI want transitions that make the viewer think:\n\n“Of course the next scene came from that.”\n\nGood:\n\nchart line → document edge\ngold pill → invoice button\nfinancial number → amount in invoice\ncard edge → next surface\ncamera push through interface element\nshared geometry\nmask reveal using actual product shapes\n\nBad:\n\ncrossfade\nrandom wipe\nspin transition\nglitch\nwhip-pan every two seconds\ngeneric SaaS slide-left\nzoom-blur spam\n\nDirect cuts are allowed only when a deliberate rhythmic impact benefits the film.\n\n────────────────────────────────────\nMOTION\n────────────────────────────────────\n\nMotion needs weight.\n\nUse curves comparable to:\n\ncubic-bezier(0.16, 1, 0.3, 1)\n\nwhere appropriate.\n\nDifferent elements should have subtly different arrival times.\n\nPrefer:\n\nanticipation\novershoot below ~2%\nsettling\nmotion continuation\nshared velocity between scenes\n\nAvoid cartoon springiness.\n\nCamera movement should feel like a high-end macro product shoot.\n\nImagine we are filming a physical premium object even though it is software.\n\n────────────────────────────────────\nLIGHTING / MATERIAL\n────────────────────────────────────\n\nUse extremely subtle environmental lighting.\n\nPossible treatments:\n\n• soft gold rim lighting\n• dark navy falloff\n• faint ambient bloom\n• soft specular highlight passing across a surface\n• restrained vignette\n• subtle grain if it materially helps\n\nKeep the interface crisp.\n\nDo NOT blur the product just to look cinematic.\n\nNo fake glossy reflections that destroy legibility.\n\n────────────────────────────────────\nTYPOGRAPHY\n────────────────────────────────────\n\nUse very little copy.\n\nNo sentence should compete with the product.\n\nHeadlines should generally fit on one line.\n\nUse Plus Jakarta Sans.\n\nStrong typography may occasionally scale very large and become a transition\ndevice itself.\n\nAvoid generic motion-graphics behavior where every word animates independently.\n\nTypography should move as designed objects.\n\n────────────────────────────────────\nSOUND / RHYTHM\n────────────────────────────────────\n\nDesign the motion as if it were cut to approximately 115–120 BPM:\npremium, kinetic, sophisticated, not frantic.\n\nImportant moments should land musically.\n\nSuggested sound language:\n\n• low soft impact for major reveal\n• restrained tactile UI clicks\n• subtle metallic/glass tonal tick\n• soft low-frequency movement during camera transitions\n• elegant resolved tone at the logo payoff\n\nAvoid:\n\n• huge cinematic trailer boom\n• EDM risers\n• loud whooshes everywhere\n• stock “tech interface” sounds\n• rap beat\n• aggressive bass\n\nIf there is no legally safe music/audio asset in the project, DO NOT pull\ncopyrighted audio from the internet.\n\nDeliver the visual master without copyrighted music and create a concise cue\nsheet describing where music/SFX should hit.\n\nIf suitable safe/local audio exists, use it.\n\n────────────────────────────────────\nREAL PRODUCT ONLY\n────────────────────────────────────\n\nThis is critical.\n\nInspect current main.\n\nDo not invent screens.\n\nDo not invent metrics that imply real customer data.\n\nUse clearly synthetic/demo-safe values if required.\n\nDo not accidentally expose any personal, test-user or production information.\n\nReuse the visual structure of the actual Taxtello UI.\n\nIf a screen needs to be motion-separated, recreate it faithfully in React from\nthe real design system instead of simply scaling a giant screenshot.\n\nThe result should still look unmistakably like Taxtello.\n\n────────────────────────────────────\nIMPLEMENTATION EXPECTATIONS\n────────────────────────────────────\n\nWork directly in:\n\n  /taxtello/beta-motion\n\nCreate the new composition alongside the existing one.\n\nKeep existing compositions working.\n\nStructure the new work cleanly.\n\nPr
