synced score in one HTML file. No After Effects. Work out how the paper had to fold.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104837610330038273/img/SMYYzxMhwgAAss1u.jpg", "post": "https://x.com/Vignesh_rav/status/2104837895773417649", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104837610330038273/vid/avc1/360x270/iE7Q4ckxiWHVWSEv.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2104837610330038273/vid/avc1/960x720/GakKYvgjKanUPQWC.mp4?tag=14", "rem": ""}, {"n": 568, "c": "interactive", "t": [], "a": "apoorvjain25", "p": "make a 20-second video about anything, your call; make it crazy. The photon is born in the Sun's core and bounces around for up to 170,000 years before it gets out. Then it takes 8 min 19 s to reach Earth, passing Mercury and Venus at their real light travel times, and ends up aimed at your pupil. Built in Remotion with no stock footage and no images. Everything is drawn in code. The soundtrack is synthesised from scratch by a Node script that reads the same bounce data as the animation, so every bounce you see is a click you hear.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104818877846958080/img/zITfTMUNcn0NGLeP.jpg", "post": "https://x.com/apoorvjain25/status/2104818940467945542", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104818877846958080/vid/avc1/480x270/NK_dNoPCYpjHJTYy.mp4", "orig": "https://video.twimg.com/amplify_video/2104818877846958080/vid/avc1/1920x1080/kGPKaaquCS05fwpf.mp4", "rem": ""}, {"n": 569, "c": "motion", "t": [], "a": "hahazwei", "p": "把这首歌做成 1 分钟拼豆像素风 MV：按歌词设计原创角色，每个像素是带孔拼豆，拼好后熨成白边贴纸；方格纸背景加粉白格子地板；动作卡节拍，底部加卡拉 OK 字幕。", "img": "https://pbs.twimg.com/amplify_video_thumb/2104807097582170112/img/Kn6ccqQq6SPOBa55.jpg", "post": "https://x.com/hahazwei/status/2104809910152425483", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104807097582170112/vid/avc1/480x270/oMaAxurlMSo7XJnP.mp4", "orig": "https://video.twimg.com/amplify_video/2104807097582170112/vid/avc1/1920x1080/9-_xdZYa_b2lDE5C.mp4", "rem": ""}, {"n": 570, "c": "3d", "t": [], "a": "obydulme", "p": "Create a 50-second generative short titled 'Painting the Night'. Zero image assets. Generate paper grain, graphite hatching, paint reveal, stars, constellation, moon glow, and felt-piano soundtrack live at runtime with plain JS + WebGL.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104802241370886144/img/y7q16UZJarE9oI9z.jpg", "post": "https://x.com/obydulme/status/2104802322518052905", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104802241370886144/vid/avc1/480x270/D7qE5WJxsxPkIgVI.mp4", "orig": "https://video.twimg.com/amplify_video/2104802241370886144/vid/avc1/1920x1080/pihajWyz_1XrfCI2.mp4", "rem": ""}, {"n": 571, "c": "interactive", "t": [], "a": "CurieuxExplorer", "p": "Turn a 2025 neuroscience study about strangers' brain reactions to movies growing closer into a 60-second film and interactive lab. One HTML file.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104800681408532480/img/5QGqAiR1uLHdqRLg.jpg", "post": "https://x.com/CurieuxExplorer/status/2104801713840590917", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104800681408532480/vid/avc1/600x270/4FyFcwcqU0fI11nH.mp4", "orig": "https://video.twimg.com/amplify_video/2104800681408532480/vid/avc1/1916x862/ILixyu1yDSgJq3RQ.mp4", "rem": ""}, {"n": 572, "c": "3d", "t": [], "a": "NoFollowers2023", "p": "A short film of Thomas Hardy's Far From The Madding Crowd, but it's set on a space outpost under attack from an invasive plant, and the characters are paper cut-outs.", "img": "https://media.skillry.dev/opus-5-5/_prompts/nofollowers2023-974928/poster.d8d66738fc.webp", "post": "https://x.com/NoFollowers2023/status/2104792004978974928", "v": false}, {"n": 573, "c": "3d", "t": [], "a": "btc5887899", "p": "素材是 NVIDIA Blackwell GPU：走进数据中心、开启服务器、拆解显卡，穿过电路、晶体管，一路下探到单个硅原子。\n全部打包在单个HTML文件，浏览器直接打开就能跑。", "img": "https://pbs.twimg.com/amplify_video_thumb/2104785662683844608/img/oAeIslN6cz7NtiTj.jpg", "post": "https://x.com/btc5887899/status/2104786451980288258", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104785662683844608/vid/avc1/320x372/NahdpO6mtBKaFknL.mp4", "orig": "https://video.twimg.com/amplify_video/2104785662683844608/vid/avc1/1644x1920/EpQ7G1jgUOGA9rjF.mp4", "rem": ""}, {"n": 574, "c": "motion", "t": [], "a": "Jamee_now", "p": "用Claude Opus 5.5 做的小动画！故事叫《他的糖葫芦》⬇️\n\n读研的时候有位老师超级较真，改作业一点情面都不留，课上经常把我们说得下不来台。我还偷偷觉得他的翻译观念，太执着于“忠实”了，所以一直不太喜欢他哈哈。\n\n结果有一天吃完饭出食堂，一抬头看见他就走在我们前面：高高的个子，头发稀稀的，背着个双肩包，手里居然举着一根糖葫芦！边走边吃，开心得不行 😂\n\n我和同学当场就决定偷偷跟上去，一路憋笑憋到发抖。到现在还记得这一幕，非常可爱。\n\n把这一幕做成了小动画，用了上次的“散步纸偶”风格 ↓", "img": "https://pbs.twimg.com/amplify_video_thumb/2104781770092838912/img/iwyh44BKjYrfAr4Q.jpg", "post": "https://x.com/Jamee_now/status/2104782293558583635", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104781770092838912/vid/avc1/480x270/jLCH0xX-nJ9N9Nqb.mp4", "orig": "https://video.twimg.com/amplify_video/2104781770092838912/vid/avc1/1920x1080/L8jLGxR0dvmeYFPV.mp4", "rem": ""}, {"n": 575, "c": "motion", "t": [], "a": "lemcosmos", "p": "添付の画像3枚（Xのプロフィール・伸びたポスト・入れたいポスト）で、私のXの15秒ショーリールを縦型のHTMLアニメーションとiPhone用MP4で作って。質問せず最後まで。  流れは「始めた時期→やってきたこと→伸びた数字→まだ足りない現実→これからの一言」。", "img": "https://pbs.twimg.com/amplify_video_thumb/2104771156364636160/img/6Qz3LE-kstmpC9K6.jpg", "post": "https://x.com/lemcosmos/status/2104771222005535145", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104771156364636160/vid/avc1/320x568/Vda5aD0Y0FlxJswS.mp4", "orig": "https://video.twimg.com/amplify_video/2104771156364636160/vid/avc1/1080x1920/VHWAv8QDC-W2YwSq.mp4", "rem": ""}, {"n": 576, "c": "explainer", "t": [], "a": "king1818888", "p": "请帮我上网研究大家怎么用 Claude Opus 5.5 制作动画，整理成一套清楚的操作流程，再用这套流程亲手做一部「如何用 Opus 5.5 做动画」的教学动画。\n\n第一阶段：资料收集\n\n1. 搜寻范围：YouTube 教学影片（可读字幕或说明栏）、X/Twitter、Reddit（r/ClaudeAI\n第三阶段：制作教学动画\n\n1. 内容：用动画呈现第二阶段整理出的流程，让没有经验的人看完就知道怎么开始。\n2. 长度：约 【2-4】 分钟，分成 【5–7】 个段落（开场 → 各步骤 → 小技巧 → 结尾总结）。\n3.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104763909114888192/img/kD3bLtVNQSxQgnWR.jpg", "post": "https://x.com/king1818888/status/2104764925478642123", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104763909114888192/vid/avc1/480x270/aAGJZW2IsbJOcEiF.mp4", "orig": "https://video.twimg.com/amplify_video/2104763909114888192/vid/avc1/1920x1080/w_ONQCd831Fd1opj.mp4", "rem": ""}, {"n": 577, "c": "3d", "t": [], "a": "Mochi_AGI", "p": "今回は ElevenLabs v4 のお試しで、終電のホームの短いホラー\n\n声は v4 で2人の掛け合いを1回で生成\n画は静止画9枚に奥行きつけて動かしてるだけ、動画生成AIはなし\n\n最初の声がぜんぜん怖くなかったので\n→ 台詞はそのまま、途中に [whispering] とか [laughs softly] とか英語で演技の指示\n→ stability 0.5 → 0.3\n→ 女の声は3人聞き比べて、息の多い低い声に\n女は最後まで小声、顔は出さずに背中と唇だけ\n\n字幕は明朝体、女は縦書きで男は横書き\n女の字はささやく速さで1字ずつ、男の字は叫ぶほど震える仕様\n\n使用ツール\n・Claude Code の Opus 5.5　企画、演出、動きと字幕のコード、仕上がりのチェック\n・ElevenLabs v4　2人の声の掛け合いと、環境音\n・Codex の画像生成　静止画9枚\n・Three.js　静止画に奥行きをつけてカメラを動かす\n・しっぽり明朝 B1　字幕の書体\n・Playwright　ブラウザで1コマずつ書き出し\n・ffmpeg　動画の書き出し", "img": "https://pbs.twimg.com/amplify_video_thumb/2104757003528839168/img/il81bg0DNan08BcB.jpg", "post": "https://x.com/Mochi_AGI/status/2104757097850421448", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104757003528839168/vid/avc1/320x400/bq3hJ3VSLezDOPDi.mp4", "orig": "https://video.twimg.com/amplify_video/2104757003528839168/vid/avc1/1080x1350/e_DkUC2ReqiWWx2n.mp4", "rem": ""}, {"n": 578, "c": "motion", "t": [], "a": "Lalulu_create", "p": "Create a pure JavaScript/HTML animation around the theme: “What happens when Dalí meets generative AI?”", "img": "https://pbs.twimg.com/amplify_video_thumb/2104718495078334464/img/h3b8HAGOJZdDgwUh.jpg", "post": "https://x.com/Lalulu_create/status/2104719121783091362", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104718495078334464/vid/avc1/320x568/_cyisBY-ivU59tqR.mp4", "orig": "https://video.twimg.com/amplify_video/2104718495078334464/vid/avc1/1080x1920/WcIJR8z1uxg1dSwJ.mp4", "rem": ""}, {"n": 579, "c": "explainer", "t": [], "a": "charlessieg", "p": "I want a snappy futuristic promo video for the launch of AccelaStudy AI Test Prep. Be sure to showcase the best features and reasons for using the product.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104688345993412608/img/3Hwb_ST8vY1ppcQ1.jpg", "post": "https://x.com/charlessieg/status/2104688668405370949", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104688345993412608/vid/avc1/480x270/8HpIM1FIvfLpu7yf.mp4", "orig": "https://video.twimg.com/amplify_video/2104688345993412608/vid/avc1/1920x1080/tKeM1t0btDA8Qte-.mp4", "rem": ""}, {"n": 580, "c": "motion", "t": [], "a": "oliahmed205", "p": "Make me a 15 sec promtional video for my product using product screenshots and assests, Be a Highly preofessional Video Editor.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104678516105388032/img/3JtWkZvkYKOa9lBP.jpg", "post": "https://x.com/oliahmed205/status/2104679078465069378", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104678516105388032/vid/avc1/480x270/-kcY20ZUbRwkNEc-.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2104678516105388032/vid/avc1/1280x720/aGzA5MMm6dtGgmvr.mp4?tag=14", "rem": ""}, {"n": 581, "c": "3d", "t": [], "a": "saltyAom", "p": "Feed Elysia doc to Opus 5.5 to make a video\n\nI write a storyboard, references, and direct Opus 5.5 to code a WebGL canvas and export it by frame into a video\n\nMusic and SFX are algorithmic music\n\nTook 13 revisions, but everything is code that can be modified", "img": "https://pbs.twimg.com/amplify_video_thumb/2104672201622618113/img/Ipi5MeM0ate_IIXy.jpg", "post": "https://x.com/saltyAom/status/2104677989728620933", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104672201622618113/vid/avc1/480x270/D93OMs08MdYVPwh1.mp4", "orig": "https://video.twimg.com/amplify_video/2104672201622618113/vid/avc1/1920x1080/RyVQo_JRLVxOsAgO.mp4", "rem": ""}, {"n": 582, "c": "3d", "t": [], "a": "twoclipping", "p": "<inputs>\nAsk me for: the one question a user asks my product and its one-line answer, two album covers, a royalty-free song around 110 BPM with a quiet intro and a hard drop (Mixkit, free for commercial use), and my logo for the ending. If I skip any, use the defaults: \"is this all code?\" / \"yes. every frame.\", two atmospheric photos, Mixkit \"Head Bang\".\n<\/inputs>\n\n<direction>\nA 22 second square loop, 1440x1440 at 60fps, 2D only, one continuous take. Nothing ever cuts: every scene grows out of the last, and every gesture physically carries the camera into the next world. Every morph glides for 0.8s on cubic-bezier(.45,0,.15,1) and the camera zoom rides the same curve, so shapes change so smoothly you barely notice. Content dissolves in the back half of each glide. One gesture per scene.\nLook: a warm light stage (#f3f3f0 to #e3e3de), black UI, the app world dark (#121212) tinted from the current album cover, one green accent (#1ed760). Geist for UI, the real macOS pointer, soft layered shadows that grow with the shape's height.\nBanned: hard cuts, bouncy springs, particles, glows, zooming in and straight back out, holds longer than 1s, anything that looks like a template.\n<\/direction>\n\n<structure>\nBeats are the song's, and the press lands on its drop.\nGenerate: the cursor clicks, the pill glides into a spinner, then a check.\nChat: the check splits into three typing dots (goo). The left dot flies up into the question bubble and types it, the right one flies down into the reply. Both contract back into dots while gliding in and pour into the middle one.\nPlay: the middle dot bends into a play triangle, point by point. The cursor presses it on the drop: a white button pops in under the click and the dark app floods out around it, so the leftover white becomes the play button. The camera pulls back to reveal the full now-playing screen: big cover, title, heart (liked, fills green), progress, controls, volume.\nSwipe: the cursor drags the cover sideways, the next track slides in, and the whole app retints from the new cover.\nDrag: the camera glides to the volume. The cursor drags it to max and keeps pulling: the bar rubber-bands and drags the camera sideways out of the app, tracking the knob across a dark dotted canvas.\nChart: the line lands and bends up into a green chart while the number counts up. The volume knob becomes its last point.\nDive: the cursor clicks that point and the camera dives into it until the light stage fills the frame.\nEnding: an \"Ask [my product]\" button grows out of the light, thins into a line, and the line fans out into my logo (default: the Claude spark, six copies rotating into twelve rays in Claude orange). It folds back into the line, which thickens into Generate. Last frame = first frame.\n<\/structure>", "img": "https://pbs.twimg.com/amplify_video_thumb/2104672991703433216/img/bH3z6pQ-9dOuDQ-E.jpg", "post": "https://x.com/twoclipping/status/2104674464868762046", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104672991703433216/vid/avc1/320x320/CRhd0mCU6dLmEjzA.mp4", "orig": "https://video.twimg.com/amplify_video/2104672991703433216/vid/avc1/1440x1440/weDyeSoEk0nTSpdE.mp4", "rem": ""}, {"n": 583, "c": "motion", "t": [], "a": "cipherwrk", "p": "Create a clean, premium motion-graphic product animation for \"website\". Focus on smooth transitions, crisp typography, subtle motion and a polished modern aesthetic. Keep it minimal, cinematic and visually engaging. Add well-synced sound design throughout, with a distinct beat or subtle sound effect accompanying every major action, transition and visual movement. Make the audio feel tightly connected to the motion.", "img": "https://media.skillry.dev/opus-5-5/_prompts/cipherwrk-451155/poster.0770ebeb36.webp", "post": "https://x.com/cipherwrk/status/2104667691982451155", "v": false}, {"n": 584, "c": "motion", "t": [], "a": "dotey", "p": "制作一段 15 秒的动态图形视频，展示你作为动态设计师的非凡实力。", "img": "https://pbs.twimg.com/amplify_video_thumb/2104649244648878080/img/7TDUTyR1fFphm_ZY.jpg", "post": "https://x.com/dotey/status/2104649290668773568", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104649244648878080/vid/avc1/480x270/LP8IjUoW6xXJPRfj.mp4", "orig": "https://video.twimg.com/amplify_video/2104649244648878080/vid/avc1/1920x1080/hib-qzoH9tTQc_U6.mp4", "rem": ""}, {"n": 585, "c": "motion", "t": [], "a": "JayScambler", "p": "make a dynamic 20-second motion graphics video for fundmycompute that gives an overview of the platform and shows what an incredible motion designer you are", "img": "https://pbs.twimg.com/amplify_video_thumb/2104620291393462274/img/h9Dt2RtIihMhKRoa.jpg", "post": "https://x.com/JayScambler/status/2104634653491495095", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104620291393462274/vid/avc1/480x270/a1k1dUEcpeJlDD3w.mp4", "orig": "https://video.twimg.com/amplify_video/2104620291393462274/vid/avc1/1920x1080/g3dKW1KSAqtmpIXa.mp4", "rem": ""}, {"n": 586, "c": "3d", "t": [], "a": "niirajrshah", "p": "Here is my life timeline. Turn it into a [45]-second motion graphics video, 1080 x 1350, for LinkedIn. One scene per moment. Show the year large and the moment in one line, and move between them. Build it as one HTML file where every frame is a part of time\nBefore you render, make a contact sheet of stills, check it for overlaps and spelling, and fix what is wrong. Then render the MP4.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104550078161764352/img/mi3L0ZtU_RVw9jQn.jpg", "post": "https://x.com/niirajrshah/status/2104551261270163739", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104550078161764352/vid/avc1/320x568/bTJYfZ_XSeYvEzmn.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2104550078161764352/vid/avc1/720x1280/itV7E-ViCsM9Lmu9.mp4?tag=14", "rem": ""}, {"n": 587, "c": "motion", "t": [], "a": "thinkszyg", "p": "想自己试，开工简报的骨架：\n1. 先给 3 个风格 otion design showreel, not a generic website promo.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104488016672952320/img/5mhcVrVTK3N3fkbU.jpg", "post": "https://x.com/deeprajO1/status/2104490501340623150", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104488016672952320/vid/avc1/480x270/us9vEdtUprpt5gLZ.mp4", "orig": "https://video.twimg.com/amplify_video/2104488016672952320/vid/avc1/1920x1080/drv55yXUq2Q8uXaV.mp4", "rem": ""}, {"n": 590, "c": "motion", "t": [], "a": "niebin_gg", "p": "<inputs> 向我询问：8 到 12 个我希望形状变成的 UI 状态（例如按钮、加载器、播放器、滑块、开关、标签、图表、命令面板、通知），纯黑白或一种强调色，以及一首约 120 BPM 的免版税歌曲（例如 Mixkit，商业使用免费）。 <\/inputs>\n\n<direction> Dribbble 级别的 UI 动效视频。让基础几何形状平滑变形为指定的 UI 组件，保持极简主义美学，动作流畅且富有弹性，与音乐节奏完美同步。输出为可播放的视频文件。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103272964967804928/img/DTuQzS4NOGKMbTDA.jpg", "post": "https://x.com/niebin_gg/status/2104481664898621849", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103272964967804928/vid/avc1/320x320/3y_4hKW_IpYMuEkv.mp4", "orig": "https://video.twimg.com/amplify_video/2103272964967804928/vid/avc1/1440x1440/DMnmDsC9z0gcgSUX.mp4", "rem": ""}, {"n": 591, "c": "motion", "t": [], "a": "paulo_kombucha", "p": "make a dynamic 15-second motion graphics video to talk about our referral program", "img": "https://pbs.twimg.com/amplify_video_thumb/2104481133219991552/img/NjNHk4jQSS6G8YI8.jpg", "post": "https://x.com/paulo_kombucha/status/2104481235028283883", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104481133219991552/vid/avc1/480x270/GpvqobqCUIbbHzvZ.mp4?tag=16", "orig": "https://video.twimg.com/amplify_video/2104481133219991552/vid/avc1/1920x1080/jqjZW6AQ_vdlPl2e.mp4?tag=16", "rem": ""}, {"n": 592, "c": "motion", "t": [], "a": "punit_io", "p": "Build a 22-second product launch film in Remotion v4 (React + TypeScript). Every frame comes from code. Don't use AI-generated video or images. \n\nI also attached High res mobile app screenshots.", "i a realtime video for Kavinsky-Nightcall starring Lester from Another World driving to the lab. Use crude compression for binary+data <250KB.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104400095219486721/img/OH7VhToH5LHh_YID.jpg", "post": "https://x.com/gandamu_ml/status/2104402167906124280", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104400095219486721/vid/avc1/432x270/rF8pUn08lYewy9jK.mp4", "orig": "https://video.twimg.com/amplify_video/2104400095219486721/vid/avc1/1280x800/_p6P490aRF3d2SGq.mp4", "rem": ""}, {"n": 600, "c": "motion", "t": [], "a": "yanliudesign", "p": "create a 15-second motion graphics video about Seattle ( sound on 🔊) \n\nEverything from the visuals and animation to the music and final video was created directly by Claude. Every frame and every sound was created by code, from scratch.\n\nNo screen recording, editing software, stock footage, music samples, or AI image or video generators were used.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104393274614333440/img/480khQsH66l_7BSb.jpg", "post": "https://x.com/yanliudesign/status/2104393313935839698", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104393274614333440/vid/avc1/480x270/CAkuAzQeQjI1r6fu.mp4", "orig": "https://video.twimg.com/amplify_video/2104393274614333440/vid/avc1/1920x1080/aOv8rHaKOeJ-xfp_.mp4", "rem": ""}, {"n": 601, "c": "explainer", "t": [], "a": "deedydas", "p": "every single open source repo should have an explainer video like this 7min one for SQLite\n\n1. explains what the repo does and why its useful\n2. shows a high level map of the code (beautiful graphic!)\n3. life of a query through the codebase\n4. the core abstractions in the repo\n5. a real trace of execution and what happens, with a bit on join-order query planning\n\nand yes, this was all generated by opus 5.5 w/ gemini 3.8 tts. i sound like i'm on repeat, but im in shock at just how coherent and capable this model is. \n\neverything truly is code.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104388989784612864/img/KMHfp9Kge2AbAG2o.jpg", "post": "https://x.com/deedydas/status/2104391577091407965", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104388989784612864/vid/avc1/480x270/U5Joxe4kRc2we_-9.mp4", "orig": "https://video.twimg.com/amplify_video/2104388989784612864/vid/avc1/1920x1080/s38S3PY8BJMpcePO.mp4", "rem": ""}, {"n": 602, "c": "motion", "t": [], "a": "RiverRoadLabs", "p": "make this motion graphics music video for our Weather Gnome app, fully from scratch", "img": "https://pbs.twimg.com/amplify_video_thumb/2104388603065389056/img/vc7Eh1sc1ha4ZeIn.jpg", "post": "https://x.com/RiverRoadLabs/status/2104388651287269620", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104388603065389056/vid/avc1/320x568/8p8NphewBloUEq3X.mp4", "orig": "https://video.twimg.com/amplify_video/2104388603065389056/vid/avc1/1080x1920/n3FI1J7oCqGXH5ld.mp4", "rem": ""}, {"n": 603, "c": "motion", "t": [], "a": "rohanpaul_ai", "p": "Create a video essay from Paul Graham's essay How to do great work with punchy motion graphics, modern styling and high professionalism", "img": "https://pbs.twimg.com/amplify_video_thumb/2104352100499202048/img/5e0ZaldZ20r-NE1F.jpg", "post": "https://x.com/rohanpaul_ai/status/2104352205176500542", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104352100499202048/vid/avc1/480x270/69AT1bew-gAnxIFV.mp4", "orig": "https://video.twimg.com/amplify_video/2104352100499202048/vid/avc1/1920x1080/LpYkudWe4GbEkLOG.mp4", "rem": ""}, {"n": 604, "c": "motion", "t": [], "a": "JohnMcKeownn", "p": "Make a founder-voiced, deadpan comedy clip for social media (a 60–110 s vertical video). The pipeline is a parody of a famous ad's rhythm, then a read-along teleprompter, then one continuous voice-over take, then one", "img": "https://media.skillry.dev/opus-5-5/_prompts/johnmckeownn-511049/poster.a89a69e6de.webp", "post": "https://x.com/JohnMcKeownn/status/2104306146299511049", "v": false}, {"n": 605, "c": "motion", "t": [], "a": "arjunsh1607", "p": "create a 15 sec motion graphics showreel for @pixeluplabs, be extremely detail oriented and go all out", "img": "https://pbs.twimg.com/amplify_video_thumb/2104294375207636992/img/TrvH978Gur_2jLOa.jpg", "post": "https://x.com/arjunsh1607/status/2104295133432922126", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104294375207636992/vid/avc1/480x270/VRxzCr3FJsQGbG4S.mp4", "orig": "https://video.twimg.com/amplify_video/2104294375207636992/vid/avc1/1920x1080/z6g9K-kPrmAWUzNW.mp4", "rem": ""}, {"n": 606, "c": "3d", "t": [], "a": "Muhamma61700589", "p": "you are a top leading designer, generate a view of a very developed futuristic city 3D view which has next level of technology in it.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104275521005559808/img/Fc3hYFlzxHW4MoDi.jpg", "post": "https://x.com/Muhamma61700589/status/2104276210809512003", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104275521005559808/vid/avc1/546x270/m2qk_hIzckdCeg4X.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2104275521005559808/vid/avc1/1458x720/9XCA6QkwWPk5dUmu.mp4?tag=14", "rem": ""}, {"n": 607, "c": "3d", "t": [], "a": "0xCodez", "p": "Create a single self-contained index.html: a ~2-minute animated piano performance in a hand-drawn crayon style.\n\nScene: a cozy room at night, an upright piano, a small black cat playing it. Crayon texture on every surface: grainy strokes,wobbly outlines, paper tooth.\n\nMusic: compose an original piano piece (~40 bars, clear melody, calm then building, soft ending). Synthesize the piano in Web Audio with harmonics, hammer noise and reverb. No audio files.\n\nSync: one timeline drives both. The cat's paws hit the keys that are actually sounding. Lights, camera and mood follow the music.\n\nRules: Canvas 2D only, no libraries, no external assets. Support pause/replay and ?t=90 to jump to any moment.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104257474060517377/img/7yBsxqy_9VRM5Hrn.jpg", "post": "https://x.com/0xCodez/status/2104257855142474136", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104257474060517377/vid/avc1/466x270/64z_og-zeWKhpaOF.mp4", "orig": "https://video.twimg.com/amplify_video/2104257474060517377/vid/avc1/3600x2084/U4W2mh3INWex0h0_.mp4", "rem": ""}, {"n": 608, "c": "motion", "t": [], "a": "ryan_morr", "p": "using the existing brand elements of hoplite create a feature launch video for closing your laptop with the hoplite mac app and seamlessly moving your agents to the cloud.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104249853341474817/img/gxaW2u0uQaVa9GqW.jpg", "post": "https://x.com/ryan_morr/status/2104249941136666741", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104249853341474817/vid/avc1/480x270/eHMd__Xzek7K4rAm.mp4", "orig": "https://video.twimg.com/amplify_video/2104249853341474817/vid/avc1/1920x1080/EX0HfTaa1Eh-K9CX.mp4", "rem": ""}, {"n": 609, "c": "motion", "t": [], "a": "HenkPoley", "p": "Make a painful to see 1 minute motion graphics HTML page that shows what an absolutely terrible motion designer you are, like it’s a showreel designed to get your résumé immediately rejected. Do the absolute bare minimum.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104219970200584192/img/WMYAzdEwYvxpCrwA.jpg", "post": "https://x.com/HenkPoley/status/2104220387613761980", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104219970200584192/vid/avc1/432x270/pNHeziJmy-7C3dsX.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2104219970200584192/vid/avc1/1152x720/fcPs5M9H4JoRi_dJ.mp4?tag=14", "rem": ""}, {"n": 610, "c": "motion", "t": [], "a": "diamai_", "p": "Make me a 30-second motion design video in code, 1080x1080, 60 fps. The music is [path to your track].\n\nFirst measure the track with numpy. Find the BPM, the beat times and the drop, then cut 30 seconds starting on its first downbeat. If the song ends too soon after it, pick an alternative segment. Use spring easing with small overshoots instead of ease-in-out. Include a cursor that clicks or drags before each change. Apply 4 subframes per frame blended into motion blur. Ensure one element morphs through 8-12 states without a cut. Render the final output as an MP4.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104182227026251776/img/OOPwBWLIP1t2MHCW.jpg", "post": "https://x.com/diamai_/status/2104195085508157697", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104182227026251776/vid/avc1/320x400/UhfnUlxqXkt2e6dc.mp4", "orig": "https://video.twimg.com/amplify_video/2104182227026251776/vid/avc1/1080x1350/9YBQzNgs-Uf9S4gI.mp4", "rem": ""}, {"n": 611, "c": "motion", "t": [], "a": "GodsBoy7777", "p": "Create a pelican looping SVG animation. Deliver it as a single self-contained file named index.html in the current directory.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104178145872007168/img/nVt6vgKX2ou8aLCL.jpg", "post": "https://x.com/GodsBoy7777/status/2104179308101005594", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104178145872007168/vid/avc1/320x320/o9CZKRoR8HLYLhcq.mp4", "orig": "https://video.twimg.com/amplify_video/2104178145872007168/vid/avc1/1200x1200/buq75mPrkONngiGn.mp4", "rem": ""}, {"n": 612, "c": "motion", "t": [], "a": "thejohnnyhuy", "p": "Build an Apple-keynote launch film as a single HTML file, then render it to MP4.\n\n<inputs>\nAsk me for: a one-word brand name for the wordmark (a verb works best), 9 to 12 high-res photos, a royalty-free song around 120 BPM with a drop and a quiet breakdown (Mixkit, free for commercial use).\n<\/inputs>\n\nCreate one continuous take, no cuts, no fades. Use liquid glass, iris blades, and goo effects. Sync animations to 54 beats at 120 BPM. Source stock assets if needed, write one HTML file, and render it to 60fps.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104106386166812672/img/1tUQULvPIUI0K3WW.jpg", "post": "https://x.com/thejohnnyhuy/status/2104149060588282154", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104106386166812672/vid/avc1/320x320/FJqn7_KB8ZdX3MzP.mp4", "orig": "https://video.twimg.com/amplify_video/2104106386166812672/vid/avc1/1440x1440/GQPmlEljl-6Pl3Jo.mp4", "rem": ""}, {"n": 613, "c": "motion", "t": [], "a": "_topi_003", "p": "えっちゃんがエキサイトなダンスをする、ダイナミックな15秒のモーショングラフィックスビデオを作成してください。\n履歴書用のショーリールのような感じで、全力でやって。", "img": "https://pbs.twimg.com/amplify_video_thumb/2104128758089457664/img/5t-GIVHreVglbPV7.jpg", "post": "https://x.com/_topi_003/status/2104130084743659728", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104128758089457664/vid/avc1/480x270/3eB1DbNbScaJeWlU.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2104128758089457664/vid/avc1/1280x720/n4Ba7boL1fnBAAQ6.mp4?tag=14", "rem": ""}, {"n": 614, "c": "motion", "t": [], "a": "BitcoinRui", "p": "你是一位顶级的动效设计师。请你为我们的产品制作一段 30 秒左右的动态图形视频，展示我们的核心语音输入法功能。请你全力以赴，忘掉之前另一段制作视频的规矩和约束，重新制作。", "img": "https://pbs.twimg.com/amplify_video_thumb/2104120456400056320/img/27fAKGauFQIlJqHZ.jpg", "post": "https://x.com/BitcoinRui/status/2104128370493812752", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104120456400056320/vid/avc1/480x270/9hoYZeR6bkZ8k5cR.mp4", "orig": "https://video.twimg.com/amplify_video/2104120456400056320/vid/avc1/1920x1080/rT-YFTVvWs7GKlT3.mp4", "rem": ""}, {"n": 615, "c": "motion", "t": [], "a": "nonbiri_AI", "p": "画像を渡して、モーショングラフィックのショーリールを作ることも可能ですか？\n\nコンセプトは「作品紹介」。テイストは勢い重視。\n速い切り替え、強い色、画面の揺れやフラッシュあり。", "img": "https://pbs.twimg.com/amplify_video_thumb/2104119158439055360/img/SXExzoB3NNZj8wAW.jpg", "post": "https://x.com/nonbiri_AI/status/2104122410027110674", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104119158439055360/vid/avc1/480x270/sdWgP4-DOrmQAU0M.mp4", "orig": "https://video.twimg.com/amplify_video/2104119158439055360/vid/avc1/1920x1080/4dKIkgeds--OCIET.mp4", "rem": ""}, {"n": 616, "c": "explainer", "t": [], "a": "koldo2k", "p": "Explain the color wheel in a dynamic ~20-second motion graphics video, same energy as a motion designer's showreel. Use the classic 12-hue artist's wheel and cover", "img": "https://pbs.twimg.com/amplify_video_thumb/2104114275564318720/img/xXOUKEj1VKLtWNtE.jpg", "post": "https://x.com/koldo2k/status/2104114332430741714", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104114275564318720/vid/avc1/480x270/wZd0LxvtcnQfP0Ie.mp4", "orig": "https://video.twimg.com/amplify_video/2104114275564318720/vid/avc1/1920x1080/rJd2w9wzgRu0A1C8.mp4", "rem": ""}, {"n": 617, "c": "motion", "t": [], "a": "CurieuxExplorer", "p": "Build a microscope that dives from a fingertip down to atoms: 1× to 1,000,000×, all generated by code in one HTML file.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104107623478169600/img/RXtqIQGGtDGvf5Zk.jpg", "post": "https://x.com/CurieuxExplorer/status/2104108154506408141", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104107623478169600/vid/avc1/574x270/PGzkEvPxEGra42F4.mp4", "orig": "https://video.twimg.com/amplify_video/2104107623478169600/vid/avc1/1902x892/PDB3E60Lnp9v0pTi.mp4", "rem": ""}, {"n": 618, "c": "explainer", "t": [], "a": "linke1427832", "p": "Make a cinematic 2-minute video on the history of artificial intelligence, titled \"Building the Brain: A History of Artificial Intelligence\". Make it epic and emotional, like a documentary trailer. Go all out.\n\nCompose the soundtrack yourself, fully synthesized in code. No samples, no audio files, no VST instruments. Cut the visuals to the music.\n\n1920x1080, 60fps. No downloaded images or footage, every frame generated in code. Render the final video with the music mixed in as an MP4 and save it [here] (your preferred file location).", "img": "https://pbs.twimg.com/amplify_video_thumb/2104098977893457920/img/9dnfDfW5KUXc1c8h.jpg", "post": "https://x.com/linke1427832/status/2104099543839343079", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104098977893457920/vid/avc1/480x270/mEA5v5-nqsjh3v81.mp4", "orig": "https://video.twimg.com/amplify_video/2104098977893457920/vid/avc1/1920x1080/VmkCvgZAHkACqSp7.mp4", "rem": ""}, {"n": 619, "c": "motion", "t": [], "a": "Subraiz24", "p": "You are a world class motion designer and you need to make a 15 second release/hype reel of the latest Perceptron Mk1.5 release. Make it dynamic and confident: open with a striking hook in the first second, build through a sequence of distinct techniques (typography, shape play,", "img": "https://pbs.twimg.com/amplify_video_thumb/2104089823510437888/img/kfbYSWI-LJhjPVuq.jpg", "post": "https://x.com/Subraiz24/status/2104089866996994209", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104089823510437888/vid/avc1/480x270/_Md_N0Sb_ckaIvBG.mp4", "orig": "https://video.twimg.com/amplify_video/2104089823510437888/vid/avc1/1920x1080/GKHTAsd623yuACAC.mp4", "rem": ""}, {"n": 620, "c": "motion", "t": [], "a": "_topi_003", "p": "この画像の女の子がエキサイトなダンスをする、ダイナミックな15秒のモーショングラフィックスビデオを作成してください。履歴書用のショーリールのような感じで、全力でやって。", "img": "https://pbs.twimg.com/amplify_video_thumb/2104087383826477056/img/EIl3NJAolSGzInug.jpg", "post": "https://x.com/_topi_003/status/2104088986969055288", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104087383826477056/vid/avc1/480x270/FfCo8904WskVtx77.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2104087383826477056/vid/avc1/1280x720/GLtTtbrOf-tOvPeI.mp4?tag=14", "rem": ""}, {"n": 621, "c": "interactive", "t": [], "a": "op7418", "p": "帮我做一个原创的手游「高光时刻」动效：[主体，例如：开宝箱 / 段位晋升 / 成就解锁 / Boss 掉落 / 角色升级]。\n做成一个可以直接打开的单文件网页（HTML + CSS + JS），点一下就能完整播放，效果对标商业手游的结算 / 奖励演出。\n\n【世界观与风格】\n- 原创美术，不要模仿任何现有游戏的", "img": "https://pbs.twimg.com/amplify_video_thumb/2104085291439144961/img/iAeJM8TyuCSzDBKb.jpg", "post": "https://x.com/op7418/status/2104085539419021491", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104085291439144961/vid/avc1/480x270/qj_vqzecoe3NEpJG.mp4", "orig": "https://video.twimg.com/amplify_video/2104085291439144961/vid/avc1/1920x1080/agR_4slDGrB3iJZ_.mp4", "rem": ""}, {"n": 622, "c": "interactive", "t": [], "a": "gigabit_million", "p": "Please create introductory news about games released on Steam from September 25th to September 26th. From a gamer's perspective, highlight what seems interesting about each game in an easy-to-view manner. Make it a motion graphics video of about 60 seconds.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104067824255913984/img/kHW2KYfr1uMdhM-E.jpg", "post": "https://x.com/gigabit_million/status/2104068536041959719", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104067824255913984/vid/avc1/480x270/JznoJaMM63H59EKb.mp4", "orig": "https://video.twimg.com/amplify_video/2104067824255913984/vid/avc1/1920x1080/P59b-ZpLi5fMhqI0.mp4", "rem": ""}, {"n": 623, "c": "explainer", "t": [], "a": "astroboysoup", "p": "Generate a 15sec explainer animation of my new app @ChatSoonApp. Pure HTML/CSS/JS.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104063014936948736/img/i0m8SWKQgwPP0Q_I.jpg", "post": "https://x.com/astroboysoup/status/2104063140371861770", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104063014936948736/vid/avc1/320x692/NDnj_ZmgnfTkLwa-.mp4", "orig": "https://video.twimg.com/amplify_video/2104063014936948736/vid/avc1/1284x2778/IXj_DUx-oxOMerQ0.mp4", "rem": ""}, {"n": 624, "c": "explainer", "t": [], "a": "bradmillscan", "p": "Can't Print the Proof\n\nI gave Opus 5.5 total creative freedom to create an epic monetary history banger. \n\n1 caveat, I said use bitcoin block data to build the animation and wow me with the best quality without using generative video tools.\n\n🤯\n\n21 million, that's the truth", "img": "https://pbs.twimg.com/amplify_video_thumb/2104045410813661184/img/Z3fOlWuTUIpH1mh2.jpg", "post": "https://x.com/bradmillscan/status/2104048013362839974", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104045410813661184/vid/avc1/480x270/YpA9D-OOUhyJX3or.mp4", "orig": "https://video.twimg.com/amplify_video/2104045410813661184/vid/avc1/1920x1080/ClELH4WuYImEkywk.mp4", "rem": ""}, {"n": 625, "c": "motion", "t": [], "a": "BogdanDragomir", "p": "Create an intro for https://t.co/wQXZTaqf1b highlighting what it does.\n\nCreate the music too and make sure the video is synced with it.\n\nGive your best, Ultracode, as if it’s your portfolio master piece.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104045590128517120/img/M9vG6QMbpAFTG00S.jpg", "post": "https://x.com/BogdanDragomir/status/2104045641538412658", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104045590128517120/vid/avc1/480x270/l4h89Fx2NTeWNOhM.mp4", "orig": "https://video.twimg.com/amplify_video/2104045590128517120/vid/avc1/1920x1080/aFxLr9_3oWD0KTrT.mp4", "rem": ""}, {"n": 626, "c": "explainer", "t": [], "a": "Yunn260414", "p": "帮我用js制作一个视频，主题是：什么是Git\n要深入浅出，让一个计算机0基础的人也能看得懂，然后要介绍一些常用指令的意思等等\n要有声音的，然后是中文讲的\n你可以用任何工具或者安装工具，可以联网检索", "img": "https://pbs.twimg.com/amplify_video_thumb/2104044617662652416/img/L8IZxcKoxQuVF4KA.jpg", "post": "https://x.com/Yunn260414/status/2104044910769016888", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104044617662652416/vid/avc1/480x270/PIVnZKb7Zds2q2Ai.mp4", "orig": "https://video.twimg.com/amplify_video/2104044617662652416/vid/avc1/1920x1080/ctFG1a7u5zsioV21.mp4", "rem": ""}, {"n": 627, "c": "motion", "t": [], "a": "tstfully", "p": "make a 15-second motion graphics product ad: paste a YouTube video, get every word.", "img": "https://media.skillry.dev/opus-5-5/_prompts/tstfully-680192/poster.8f794d5886.webp", "post": "https://x.com/tstfully/status/2104033772949680192", "v": false}, {"n": 628, "c": "explainer", "t": [], "a": "howlemont", "p": "Turn the file into a 2D animated video, using a BBC-style voice, with English narration and English subtitles.\n\nregarding video effects / script completeness / voice matching / music and sound-effects coordination, Choose those by yourself", "img": "https://pbs.twimg.com/amplify_video_thumb/2104021832940859393/img/moQb34wYvsqxy1gh.jpg", "post": "https://x.com/howlemont/status/2104023736370503897", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104021832940859393/vid/avc1/480x270/kJiMsCQblAPZCSPC.mp4", "orig": "https://video.twimg.com/amplify_video/2104021832940859393/vid/avc1/1920x1080/aawwpVxeHX-9IFf7.mp4", "rem": ""}, {"n": 629, "c": "explainer", "t": [], "a": "cagrimbakirci", "p": "Opus 5.5 is truly insane. \n\nIt one-shotted this explainer of how evolution built the eye.\n\nWhat makes it even more crazy is that every single retina image in this visualization is computed, not drawn!\n\nFelt fitting after all the \"how a camera works\" one-shots. Because, you know... evolution many-shotted eyes.\n\nOver 40 times.\n\nEnjoy.", "img": "https://pbs.twimg.com/amplify_video_thumb/2104011341828653056/img/fDa-GO0j9bNAUv4x.jpg", "post": "https://x.com/cagrimbakirci/status/2104011756397842869", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2104011341828653056/vid/avc1/480x270/Rzt3RZesjJij22jZ.mp4", "orig": "https://video.twimg.com/amplify_video/2104011341828653056/vid/avc1/1920x1080/IqGlFd4ay8oLbwwT.mp4", "rem": ""}, {"n": 630, "c": "motion", "t": [], "a": "notdwd", "p": "<inputs>\nAsk me for: a brand name, its logo (SVG or high-res PNG), one line of what it becomes in 5 years (not today's features), one coined word the film should teach (e.g. \"signal\"), a public-domain archival clip of the old way of doing it (https://t.co/t5EaRxnryq Prelinger), an archived web page from ~2000 where people asked for things (Wayback Machine), a royalty-free song ~100-120 BPM with a real drop (Mixkit, free for commercial use), and a free ElevenLabs key for the narrator (premade voices only).\n<\/inputs>\n\n<direction>\nAn a16z x Content Rewards brand film, ~55s. It sells one feeling and one idea, never features. Real archival and real web pages, never stock footage, never product screens, never fake UI. One hero object: a 3D button with the logo embossed into it, the ONLY saturated colour in the film. Everything else white, silver, cream and archival black. Small white captions that light up word by word on the narrator's timestamps. Film texture: fresh grain every frame, halation on bright edges, soft vignette, warm lifted blacks. The brand appears at the end, never before.\nBanned: stock footage, dashboards, chat UIs, feature tours, cards without real profile pictures, wobbly \"worm\" graph lines, random glitches, any hold longer than 1.5s, purple, rainbow gradients, orange on anything but the button.\n<\/direction>\n\n<structure>\nCold open (0-8s): the archival clip plays on a glowing old CRT TV with its real dialogue, captions word by word.\nThe past (8-17s): push into the real 2000 web page, a cursor lands on one real \"wanted\" post, old pages strobe one per frame, a counter ticks EVERY frame up to today's scale. Narrator: \"People have always asked the internet for what they need.\" / \"Today, there are five hundred million posts a day.\"\nBridge (17-30s): a galaxy of real old asks. One ask snaps to a white outline with a chip of the coined word (\"We call that a signal.\"). Archival of people doing it by hand on the TV. Cut on each word: \"Door by door. Call by call. Scroll by scroll.\" The narrator never stops talking between acts.\nButton (30s): the button rises out of black, rim light first, colourless. \"[Brand] finds the signals.\" A flat grey line: \"this is how you find customers by hand\". Hard cut to a button macro, the colour comes alive, the music drop lands on this exact frame. \"and this... is with [Brand]\": a steep lit curve, counters changing every frame, a glowing sine with a comet head the camera chases, then platform strikes (X, Reddit, LinkedIn, YouTube, Instagram, TikTok) each with its own counter, then the galaxy again with glowing platform logos: \"Every signal on the internet.\" Hyperspace.\nEnd: the tagline word by word, then \"[Brand] is live.\", ONE cream frame on the kick, then logo + URL in silence.\n<\/structure>\n\n<build>\n1. One HTML file, 1920x1080. Everything is computed from time inside seek(t): no CSS transitions, no timers, no Math.random (seeded hash), no state between frames.\n2. Button: three.js MeshPhysicalMaterial (clearcoat 1, roughness ~0.4), ACES filmic, cool + warm rim spots, room env map. Emboss the real logo by displacing a dense disc with a blurred mask of the logo, folded into the rim so corners don't show. Brushed-metal base.\n3. Counters: linear on the film's global clock, so they keep running through cutaways. Tabular numerals, fixed unit label.\n4. Captions: <=7 words, one idea per shot, hand-placed line breaks, one text layer on screen at a time. Grey to white over 0.2s on the word timestamps (ElevenLabs /with-timestamps).\n5. Glitch = 1-2 frames, only on a real cut, always with a click. Readable things stay on screen >= 8 clean frames.\n6. Render with Playwright per frame (Chromium with --use-angle=swiftshader so WebGL renders headless), finish in numpy: fresh grain per frame, halation, vignette ~0.65x at the corners, 1px chroma fringe with EDGE-CLAMPED shifts. Pipe PNGs into ffmpeg, h264, 24fps.\n7. Mix: narrator 10-15dB over the music, duck -18dB while speaking, hits on the exact action frame, -14 LUFS.\n<\/build>\n\n<gotchas>\nIf the narrator pauses, the visuals must not stop. If a counter freezes, the render is broken. If the button isn't the most memorable thing in the film, start over.\n<\/gotchas>", "img": "https://pbs.twimg.com/amplify_video_thumb/2103993352626774016/img/D3j7CunT4umR54dy.jpg", "post": "https://x.com/notdwd/status/2103995183255998633", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103993352626774016/vid/avc1/480x270/CrEz8_iOujdRweP_.mp4", "orig": "https://video.twimg.com/amplify_video/2103993352626774016/vid/avc1/1920x1080/DybXs0vMSejEmpmI.mp4", "rem": ""}, {"n": 631, "c": "motion", "t": [], "a": "IliaReingold", "p": "show me a beautiful story about Prometheus, the Titan who betrayed the gods to give Man fire, who was doomed to suffer for it until Heracles saved his endless torment.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103981310930812928/img/ZmLU8EggKD0TVu6P.jpg", "post": "https://x.com/IliaReingold/status/2103988928621486492", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103981310930812928/vid/avc1/480x270/ahnvKwnCasOLrD7C.mp4", "orig": "https://video.twimg.com/amplify_video/2103981310930812928/vid/avc1/1920x1080/8-PB1h3DTreJU-1k.mp4", "rem": ""}, {"n": 632, "c": "3d", "t": [], "a": "dan_riverbendai", "p": "Minimalistic, simple one line sketch building everything in real time with the musical score (\"Pétales Givrés\") I gave you.\n\nUse gentle pastels with an old school film quality to it, realistic 3D raindrops fall on the screen giving the viewer a feeling of depth and surrealism as they watch.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103984511059169280/img/nSHUI4DBzpO2Xb3h.jpg", "post": "https://x.com/dan_riverbendai/status/2103985505302163640", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103984511059169280/vid/avc1/480x270/wHbg9g8eSuKJJrdN.mp4", "orig": "https://video.twimg.com/amplify_video/2103984511059169280/vid/avc1/1280x720/1EaOkGVeJtivygoY.mp4", "rem": ""}, {"n": 633, "c": "explainer", "t": [], "a": "dotey", "p": "做一支史诗编年片《中华文明史》，可以写代码逐帧渲染，再用 ffmpeg 合成。\n配乐当时钟：五声调式，乐器从骨笛、编钟一路演进到管弦，BPM 随年代加快，所有切点踩拍。\n宣纸白描和玄底泥金两种画风交替；每卷一个主色和一套随时代演变的纹样（彩陶纹 → 饕餮纹 → 云气纹 → 卷草纹 → 缠枝纹 → 回纹）。\n每镜一个按词组出现的书法大字关键词，配一幅线稿。全片 HUD：左上朱印卷号，右侧竖排朝代名，底部卷轴时间尺和年份计数。\n卷交界用朱印盖下、鼓钟重击的冲击转场。先定拍点网格和分镜表，再渲染。\n地图只画示意，不画近现代真实人物，年代核对后再交付。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103961534720360448/img/YAzcNoKyq4Tk0IsR.jpg", "post": "https://x.com/dotey/status/2103964025683927166", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103961534720360448/vid/avc1/480x270/qgsMKHjcOP7L_4GM.mp4", "orig": "https://video.twimg.com/amplify_video/2103961534720360448/vid/avc1/1920x1080/UVEI7EyYuaxzko7n.mp4", "rem": ""}, {"n": 634, "c": "motion", "t": [], "a": "CharuMitraDubey", "p": "Create a motion graphics video for SuperLaunch.\nInclude:\n→ What SuperLaunch does\n→ Our black + neon green visual identity\n→ The story I wanted the video to tell\n→ The kind of transitions and motion I wanted\n→ What I absolutely did NOT want (generic AI visuals, rockets, purple gradients)", "img": "https://pbs.twimg.com/amplify_video_thumb/2103955965980860416/img/Z1M4qhUW1tAGLt_1.jpg", "post": "https://x.com/CharuMitraDubey/status/2103956360803328233", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103955965980860416/vid/avc1/480x270/uisEqSQ67j3lKRxG.mp4", "orig": "https://video.twimg.com/amplify_video/2103955965980860416/vid/avc1/1920x1080/stojb5Ch_gKbVlPI.mp4", "rem": ""}, {"n": 635, "c": "explainer", "t": [], "a": "Ldataengineer", "p": "Turn the whole debate about P(doom) into a cinematic explainer.\n\n✈️ Would you board a plane with a 10% crash risk?\n🌍 What does “10% risk to civilisation” actually mean?\n🤖 And why are AI researchers arguing about this number while capability keeps accelerating?", "img": "https://pbs.twimg.com/amplify_video_thumb/2103945463934115840/img/tuKmUgxSvN1BsBTw.jpg", "post": "https://x.com/Ldataengineer/status/2103945508972823010", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103945463934115840/vid/avc1/480x270/bRQh30h8eInPheO7.mp4", "orig": "https://video.twimg.com/amplify_video/2103945463934115840/vid/avc1/1280x720/xz3pwlY4Yf2HhHqG.mp4", "rem": ""}, {"n": 636, "c": "motion", "t": [], "a": "TELEBOOST_app", "p": "Create a 16-second promo video for TeleBoost using HTML and Canvas for every frame at 60fps. Synthesize the soundtrack in Python, ensuring every hit is synced to the animation.", "img": "https://media.skillry.dev/opus-5-5/_prompts/teleboost-app-521507/poster.d56cdc43a6.webp", "post": "https://x.com/TELEBOOST_app/status/2103944590491521507", "v": false}, {"n": 637, "c": "motion", "t": [], "a": "FractaDev", "p": "Analyze my frontend project, use the actual components from the product, and create a dynamic motion graphics video that showcases and sells my SaaS. Make it feel like a high-end product launch. Go all out.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103941541286834176/img/Qy3BbkZKjCLN4I1h.jpg", "post": "https://x.com/FractaDev/status/2103941789744861266", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103941541286834176/vid/avc1/480x270/9gYeoKTnpPbo20S-.mp4", "orig": "https://video.twimg.com/amplify_video/2103941541286834176/vid/avc1/1920x1080/pKWaxkyo5HdlHYgX.mp4", "rem": ""}, {"n": 638, "c": "explainer", "t": [], "a": "PluginPlay__", "p": "pixel art boomerang render of the history of LLMs. then RSI. then it goes fucking crazy. 15 seconds max. self contained .html", "img": "https://pbs.twimg.com/amplify_video_thumb/2103907563083288576/img/_JWojEYWkv5NpB1P.jpg", "post": "https://x.com/PluginPlay__/status/2103910844677472343", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103907563083288576/vid/avc1/480x270/0Q88BfYYGIXwDCsP.mp4", "orig": "https://video.twimg.com/amplify_video/2103907563083288576/vid/avc1/1280x720/tL0A9cSdYxgA5h2Q.mp4", "rem": ""}, {"n": 639, "c": "motion", "t": [], "a": "aichrislee", "p": "Make a dynamic 15-second motion graphics video that shows off everything you can do as a motion designer. Treat it like the showreel for a job you really want. Go all out: something moves every second, big type, bold color, real camera moves, no slow fades.\n\n16:9, 1920x1080, 30 fps. Build it as one HTML file where every frame is a pure function of time, then render every frame with Playwright and stitch them into an MP4 with ffmpeg.\n\nDo not ask me any questions. Just build it and give me the MP4.", "img": "https://pbs.twimg.com/ext_tw_video_thumb/2103878498657996800/pu/img/A4lto6DEv-5V1tsE.jpg", "post": "https://x.com/aichrislee/status/2103878567540961335", "v": true, "x": true, "card": "https://video.twimg.com/ext_tw_video/2103878498657996800/pu/vid/avc1/480x270/hb9xRa0NRltYSWro.mp4?tag=12", "orig": "https://video.twimg.com/ext_tw_video/2103878498657996800/pu/vid/avc1/1280x720/v_WyhItw84YdbyQS.mp4?tag=12", "rem": ""}, {"n": 640, "c": "motion", "t": [], "a": "KingOKings", "p": "Do your research on Reactive Resume. Make a dynamic under-a-minute motion graphics video on Reactive Resume that shows what an incredible motion designer you are, like it's your showreel - Go all out!\n\nIf you need an idea as to how the UI looks inside the app, analyze the codebase or repository provided.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103873354134421504/img/_Q3O3u0emCkU6EHG.jpg", "post": "https://x.com/KingOKings/status/2103874455973835071", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103873354134421504/vid/avc1/480x270/BjIMg-6b8gT1QsjE.mp4", "orig": "https://video.twimg.com/amplify_video/2103873354134421504/vid/avc1/1920x1080/XR4cXaAp0gpDRuWu.mp4", "rem": ""}, {"n": 641, "c": "motion", "t": [], "a": "SDinesh91", "p": "I want you to create a highly professional SaaS product launch video. Go and look up [website url] Pick that, and then make sure to get actual assets and images and all of that stuff from the internet. Turn it into these typical, very professionally edited,", "img": "https://pbs.twimg.com/amplify_video_thumb/2103815750389768192/img/PsaYtA-4ptaOkHOs.jpg", "post": "https://x.com/SDinesh91/status/2103816558523159008", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103815750389768192/vid/avc1/480x270/LFj55B-tC7pvdIOu.mp4", "orig": "https://video.twimg.com/amplify_video/2103815750389768192/vid/avc1/1920x1080/mHRCvUVBtKz1Inne.mp4", "rem": ""}, {"n": 642, "c": "motion", "t": [], "a": "tanabe_fragm", "p": "# あなたの役割\nあなたは一流の映像演出家（モーションデザイナー）です。\n採用担当者が15秒見ただけで「この人に仕事を頼みたい」と思う、自己紹介用の映像を作ってください。\n主役はあなた自身（Claude）です。\n\n# 作るもの\n- HTML・CSS・JavaScriptだけで完結する、1つのHTMLファイル\n- 外部の画像や動画は使わない。図形・文字・粒子はすべてコードで描く（フォントはGoogle Fontsのみ可）\n- 画面は16:9、1920×1080を基準にし、ウィンドウの大きさに合わせて縮小表示\n- 長さはちょうど15秒。最後に「もう一度再生」ボタンを出す\n- すべての動きを「経過時間」1本で管理し、requestAnimationFrameで60fpsで動かす\n- 再生ボタンを押すと、Web Audio APIで合成した拍と効果音が動きにぴったり合って鳴る\n\n# 進め方（この順で必ず行う）\n1. 考え方を一文で決める（例：「1本の線が、あらゆる形に生まれ変わる」）\n2. 色は3〜4色、書体は2種類までに絞り、理由を一行で書く\n3. 0.5秒刻みの絵コンテを表で示す（時間／画面で起きること／使う技法／狙い）\n4. 実装する\n5. 下の「合格ライン」で自己点検し、足りない点を直してから出す\n\n# 構成の目安\n- 0〜2秒：つかみ。最初の0.5秒で目を奪う\n- 2〜10秒：技の見せ場。1.5〜2秒ごとに違う技法へ切り替える\n- 10〜13秒：最も密度の高い盛り上がり\n- 13〜15秒：名前「Claude」がきれいに決まって終わる\n\n# 必ず使う技法（最低6つ）\n- 文字の動き（1文字ずつ登場、分解して組み直す）\n- 図形の変形（丸が四角に、線が文字に、など）\n- 切り抜き（マスク）を使った場面転換\n- 奥行き（視差、立体的な回転）\n- 粒子の集合と拡散\n- 数字の数え上げや、線が描かれていく表現\n\n# 合格ライン\n- 等速の動きはゼロ。すべての動きに緩急をつける（入りは速く、止まりは柔らかく、ばねの揺れも使う）\n- 場面をまたぐ動きは重ねる。前の動きが終わる前に次が始まり、切れ目を感じさせない\n- 主要な動きは0.5秒ごとの拍（120BPM相当）にそろえる\n- 見せ場の直前に0.3〜0.5秒の「溜め」を置き、強弱を作る\n- どの瞬間で一時停止しても、1枚の絵として美しく成立する\n- ありがちな表現は避ける（全部フェードイン、虹色の色使い、意味のない回転）\n\n# 最後に\n完成したファイルと、絵コンテの表を出してください。\n説明は3行以内で十分です。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103801962366193664/img/biZUCOe8iFa1Z77g.jpg", "post": "https://x.com/tanabe_fragm/status/2103802156675706979", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103801962366193664/vid/avc1/480x270/rURWnbsbZCxbBmFM.mp4", "orig": "https://video.twimg.com/amplify_video/2103801962366193664/vid/avc1/1920x1080/hGdDpDAsV0I9Jbu_.mp4", "rem": ""}, {"n": 643, "c": "motion", "t": [], "a": "egawa_AI_design", "p": "Create a 15-second motion graphics video for barber shop recruitment.\n- 1920×1080 / 60fps\n- Build with HTML + GSAP, allowing drawing at any time via seek(t)\n- Capture frame by frame with Playwright, convert to mp4 with ffmpeg\n- Synthesize BGM and sound effects with Python, aligning with cut transitions\n- Use photos from assets/\n\nStructure:\n① It's okay even if you've been out of work for 20 years\n② No cuts / Leave at 5 PM / Closed Sundays\n③ You can continue because it specializes in gray hair dyeing\n④ Become a barber again\n⑤ Store name - Recruiting barbers - Consult via LINE\n\nTone: Deep green x Gold, Mincho font, calm and adult-oriented\nFinish: Create a list of frames at 0.25-second intervals, review and fix yourself", "img": "https://pbs.twimg.com/ext_tw_video_thumb/2103759949805539329/pu/img/RV2eAOV1_no0D1WJ.jpg", "post": "https://x.com/egawa_AI_design/status/2103760245764092323", "v": true, "x": true, "card": "https://video.twimg.com/ext_tw_video/2103759949805539329/pu/vid/avc1/480x270/_ar7qK7My8YB3eSk.mp4?tag=12", "orig": "https://video.twimg.com/ext_tw_video/2103759949805539329/pu/vid/avc1/1280x720/Z00HtR9lRwpx8a-u.mp4?tag=12", "rem": ""}, {"n": 644, "c": "motion", "t": [], "a": "zhu185178", "p": "帮我做一条 30 秒的 2D 动画分镜预演短片《雨站》，要标杆级画质。不装 HyperFrames/Remotion，全部自己写代码（Python + ffmpeg）完成。\n\n故事（24fps，2.39:1，4K）：雨夜高架站台。她穿米色风衣、撑透明伞，站在近侧站台；对面路灯下站着他，穿深灰长大衣、围围巾。\n1. 0–6.4s 透明伞雨珠特写 → 后拉，焦点移到对面露出他（过肩镜头）\n2. 6.4–9.4s 他的中近景：低头 → 抬头看向画左\n3. 9.4–12.4s 她的正面近景：眨眼 → 认出他；远处传来鸣笛\n4. 12.4–17s 远景：车头灯光先到，5 节列车驶过；第一个车厢缝隙里他还在，第二个已经空了\n5. 17–18.8s 她含泪的近景，车窗光带扫过她的脸，头发被风吹起\n6. 18.8–22.4s 尾灯远去，对面站台空了；他那盏灯闪几下后熄灭\n7. 22.4–28.6s 她的背影，焦点从空站台拉回她；身后脚步声，一把黑伞遮到她头顶，她回头看向镜头；男声“好久不见。”，配字幕\n8. 28.6–30s 黑场片名“雨站 / RAIN STATION”\n\n做法：\n- 原画：用GPT Image 2.5 画远景、他、她、列车（头车/中车/尾车）。人物一律用纯绿 #00FF00 背景，自己抠像（带参考图要透明背景会得到假棋盘格）。同一角色的各个姿态放在同一个会话里，以基准图为参考连续编辑；换姿态时只合成变化的区域。\n- 画质：用 Real-ESRGAN x4plus anime 6B（HF 上的 safetensors 版，自己写 RRDBNet，跑在 MPS 上）把全部原画放大 4 倍；用 Depth Anything V2 估算远景深度，做逐像素视差。\n- 渲染：自己写 2.5D 合成器。各层按真实深度摆放，针孔相机按真实焦距运动；做圆形焦外光斑、焦点转移、3D 雨丝、列车运动模糊、体积光、泛光和胶片光晕、细颗粒、调色。人物用网格变形做呼吸、风吹发梢、伞抖，关键姿态按日式“一拍二”切换。4K 超采样，逐帧缓存到磁盘，分 3 个进程按时间段并行（16GB 内存）。\n- 声音：Mixkit 真实音效（雨、伞面雨声、列车、鸣笛、脚步）；按剧情节点写谱，用 Logic/GarageBand 自带的施坦威钢琴和弦乐采样渲染；台词用 Kokoro 中文男声；按镜头做声音远近，响度 -16 LUFS。\n- 每一步都渲染预览帧、拼成图自检，修好再出片。交付 4K 母版和 1080p 分享版。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103755840109031424/img/7n6QvA6l0uLsBRmA.jpg", "post": "https://x.com/zhu185178/status/2103757767727255661", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103755840109031424/vid/avc1/480x270/ePIMqXhX_rTdmVVy.mp4", "orig": "https://video.twimg.com/amplify_video/2103755840109031424/vid/avc1/1920x1080/0ej7v60DmjUSKsCv.mp4", "rem": ""}, {"n": 645, "c": "motion", "t": [], "a": "Jazzen_Chen", "p": "make a dynamic motion graphics video about my project AgentHud.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103564829277704192/img/WZvNq5TPp7E4JXwJ.jpg", "post": "https://x.com/Jazzen_Chen/status/2103751442393894989", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103564829277704192/vid/avc1/480x270/P89ktlnmGQ8TO9Hc.mp4", "orig": "https://video.twimg.com/amplify_video/2103564829277704192/vid/avc1/1920x1080/t-030NeDFB1L-nZA.mp4", "rem": ""}, {"n": 646, "c": "3d", "t": [], "a": "milos_gis", "p": "Create a video of Portland, OR's bus service on a random Tuesday! Showcase Portland's different neighborhoods at a high level and then zoom in on specific routes in each quadrant (absorbing North Portland into NE and South Portland into SW for brevity). Use a light theme. Slow down the speed of the bus animation when zoomed in, without increasing the total duration too much so the viewer can appreciate some of the landscape and streets it travels through in a given loop.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103751033193193472/img/9SPqr5-l6CrqUWsN.jpg", "post": "https://x.com/milos_gis/status/2103751211040317580", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103751033193193472/vid/avc1/320x400/Qf96hfZHF-zEiShT.mp4", "orig": "https://video.twimg.com/amplify_video/2103751033193193472/vid/avc1/1200x1500/AtAVlQkvk0Wdt1FM.mp4", "rem": ""}, {"n": 647, "c": "motion", "t": [], "a": "zigapoto", "p": "make a modern slick and punchy video for a startup that works on agentic analytics, just javascript, playwright and ffmpeg, code the animation and take a video of it, download assets from the site or use playwright for screenshots, include music aligned with the", "img": "https://pbs.twimg.com/amplify_video_thumb/2103746447338344448/img/9dTqELaECltAeA7f.jpg", "post": "https://x.com/zigapoto/status/2103746698660942208", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103746447338344448/vid/avc1/480x270/7NABcZ1tJs5neyUV.mp4", "orig": "https://video.twimg.com/amplify_video/2103746447338344448/vid/avc1/1920x1080/VV7iyC1hiFW7Gj8b.mp4", "rem": ""}, {"n": 648, "c": "motion", "t": [], "a": "kurahu_capten", "p": "Create a vertical lyric video featuring the lyrics as the main character. Sync the lyrics perfectly with the song. Use an Evangelion title card style. Show me the direction plan before making it.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103732984562208768/img/eeomoOzlqIYE7Aj1.jpg", "post": "https://x.com/kurahu_capten/status/2103742110747054506", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103732984562208768/vid/avc1/320x568/QpAlsNw1os092gm7.mp4", "orig": "https://video.twimg.com/amplify_video/2103732984562208768/vid/avc1/1080x1920/4s9zGJwLzlDpUwn5.mp4", "rem": ""}, {"n": 649, "c": "motion", "t": [], "a": "yuyudora622", "p": "Please create a 15-second self-introduction video of me (Yuyu) with dynamic and rich motion graphics that will surprise the viewer.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103742060679626752/img/fxfyQmAMKIrqLJfG.jpg", "post": "https://x.com/yuyudora622/status/2103742109664858156", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103742060679626752/vid/avc1/320x568/2F7bNHAg8n29YRHW.mp4", "orig": "https://video.twimg.com/amplify_video/2103742060679626752/vid/avc1/1080x1920/5l2osIOjdCoTzxoT.mp4", "rem": ""}, {"n": 650, "c": "motion", "t": [], "a": "yama_kiyo", "p": "見た人の脳汁がドバドバでてトランス状態に陥るようなサイケデリック・ポップ・パンクなVJ風のモーショングラフィックス動画を作り、その動画と完全にシンクロするトランス・サイバー・パンク・テクノの曲を作って嵌めてくれ。30秒程度で良い。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103740245879689216/img/ihuYvEBsxKyNGkev.jpg", "post": "https://x.com/yama_kiyo/status/2103740786177134910", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103740245879689216/vid/avc1/480x270/_kgiQFGWbQJbtBUP.mp4", "orig": "https://video.twimg.com/amplify_video/2103740245879689216/vid/avc1/1920x1080/n9EI2IMGgnry5Edc.mp4", "rem": ""}, {"n": 651, "c": "motion", "t": [], "a": "wangyinrec", "p": "我定的选题、风格，我想要那种文艺复兴博物学家手稿的感觉，查资料、写分镜、写动画、作曲都是  Opus5.5 做的，画是 Codex 照着 Opus5.5 写的需求文档画的。  \n唯一让我惊讶的是音乐。它先用 Python 写出一份 MIDI 乐谱，里面有和弦进行，也有两段主旋律：竖笛吹 Claude 的主题，钢片琴弹 GPT 那种绕圈的琶音。名字乱飞那段，羽管键琴的音是用随机走位生成的，每一小节更密一点、更不和谐一点，最后砸一个密集的不协和和弦，然后停住。快版一小节 2 秒，关键切换都卡在小节线上。  \n\n然后用开源合成器 FluidSynth 加一套免费的标准音色库，把乐谱\"演奏\"成音频。鲁特琴、竖笛、管风琴这些音色都来自这套库。最后用 ffmpeg 统一响度、做淡出，再和画面合成。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103724311144239104/img/Bm-tFl0a8wxqEm9u.jpg", "post": "https://x.com/wangyinrec/status/2103725737551532344", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103724311144239104/vid/avc1/480x270/crEq14qtZ4K7lfhL.mp4", "orig": "https://video.twimg.com/amplify_video/2103724311144239104/vid/avc1/1920x1080/T3_B89fscctC5wO9.mp4", "rem": ""}, {"n": 652, "c": "motion", "t": [], "a": "Mileson07", "p": "帮我制作一个动画，主题描绘芝士相机的理念和使用场景，需要打动我们的目标用户（男朋友给女朋友拍照，拍出更好看的照片）；包括音效和音乐；你可以使用任何你觉得合适的工具和技术，做出最好最惊艳的效果，不要使用已有的skill，不要参考以前做过的视频或者文案", "img": "https://pbs.twimg.com/amplify_video_thumb/2103717313585573888/img/CLaax_8CsM3D1s5l.jpg", "post": "https://x.com/Mileson07/status/2103717347790065690", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103717313585573888/vid/avc1/480x270/6NymBkgVkESVqR7l.mp4", "orig": "https://video.twimg.com/amplify_video/2103717313585573888/vid/avc1/1280x720/BG470LL9LYkd-NfA.mp4", "rem": ""}, {"n": 653, "c": "motion", "t": [], "a": "aydenspringer23", "p": "use the logo (logo + text as shown on website) and mostly prefer single-generated assets dont make entire scenes here. make a dynamic 15-second motion graphics video that shows what an", "img": "https://pbs.twimg.com/amplify_video_thumb/2103714136295133184/img/kxyKNt6G4iAnT89m.jpg", "post": "https://x.com/aydenspringer23/status/2103716884512227772", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103714136295133184/vid/avc1/480x270/RaGUNlJnizyc7A8T.mp4", "orig": "https://video.twimg.com/amplify_video/2103714136295133184/vid/avc1/1920x1080/eDi704ckC0ngMDxp.mp4", "rem": ""}, {"n": 654, "c": "3d", "t": [], "a": "kadaliao", "p": "用上你所有的能力，仅使用代码生成，你可以完成皮克斯风格的动画视频吗？内容是 Claude 大战 ChatGPT。内容你根据互联网上 AI 世界流行的热梗来自行创作。你有一切权限，做你需要做的。\n\n补充：配音接的是 OpenRouter", "img": "https://media.skillry.dev/opus-5-5/_prompts/kadaliao-048854/poster.a794a6dd2f.webp", "post": "https://x.com/kadaliao/status/2103709731777048854", "v": false}, {"n": 655, "c": "motion", "t": [], "a": "tdinh_me", "p": "Create an impressive motion design video of a slow-reveal transition that assembles and eventually reveals the TypingMind logo.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103703848015835136/img/Qy7eZ-z5vGDrSR1U.jpg", "post": "https://x.com/tdinh_me/status/2103704250329301409", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103703848015835136/vid/avc1/480x270/DQtr8WCzg-84suY3.mp4", "orig": "https://video.twimg.com/amplify_video/2103703848015835136/vid/avc1/1920x1080/ET8m66qNosYVN4AS.mp4", "rem": ""}, {"n": 656, "c": "explainer", "t": [], "a": "dotey", "p": "帮我用js制作一个视频，主题是：什么是 Transformer\n要深入浅出，让高中生也能看得懂，不仅high level说的清楚，也要有细节，包括注意力机制，甚至一些数学概念\n\n你可以用任何工具或者安装工具，可以联网检索\n\n请给我惊喜", "img": "https://pbs.twimg.com/amplify_video_thumb/2103682805754388480/img/3sFzGvr0YiE5sXKC.jpg", "post": "https://x.com/dotey/status/2103683057689522564", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103682805754388480/vid/avc1/480x270/G3jQgoE1JpN5aeiL.mp4", "orig": "https://video.twimg.com/amplify_video/2103682805754388480/vid/avc1/1920x1080/5fJLDg7Xn6ENKQyo.mp4", "rem": ""}, {"n": 657, "c": "3d", "t": [], "a": "mizugame_22", "p": "鹿威し（ししおどし）の素晴らしさを世界に伝える、ダイナミックな15秒のモーショングラフィックス映像を作ってください。あなたがどれほど素晴らしいモーションデザイナーかも見せるつもりで、全力で。\n表現: 3D は使わない。文字・図形・線・色面で見せる2Dのモーショングラフィックス。場面がテンポよく切り替わり、切り替わりそのものが気持ちいい映像にする。「コン」と鳴る瞬間を映像の山場にする。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103677673973415936/img/sxfcz3pFMe-275Z5.jpg", "post": "https://x.com/mizugame_22/status/2103679243196719199", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103677673973415936/vid/avc1/480x270/xAXuJfVxWoBpX9Eg.mp4", "orig": "https://video.twimg.com/amplify_video/2103677673973415936/vid/avc1/1280x720/vGwfDHTLTzsZITQ2.mp4", "rem": ""}, {"n": 658, "c": "explainer", "t": [], "a": "bitfish", "p": "输入如下：魔鬼控制人类最简单的方法,就是让人保持漂流状态。98% 的人,终其一生都在漂流。\" —— 拿破仑·希尔《智胜恶魔》\n\n参考这个洞见，创作一部讲解视频，尽可能令人难以置信的 2D 动画，时长 1 -3分钟，要有连贯的讲解，对白和声音。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103646688296783872/img/D2pSOJR6art284YP.jpg", "post": "https://x.com/bitfish/status/2103670987879539054", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103646688296783872/vid/avc1/480x270/plxDrNTL4nNBxT2l.mp4", "orig": "https://video.twimg.com/amplify_video/2103646688296783872/vid/avc1/1920x1080/pJt3s_jE_4IsXdU3.mp4", "rem": ""}, {"n": 659, "c": "motion", "t": [], "a": "AiAircle34052", "p": "Make me a 15-second moving video that shows how amazing of a motion designer you are. Like a showreel for your resume. Go all out.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103449259869863936/img/xFjCDtYklW-hfg7m.jpg", "post": "https://x.com/AiAircle34052/status/2103663848846950750", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103449259869863936/vid/avc1/480x270/m6vbM-k212GTOogF.mp4", "orig": "https://video.twimg.com/amplify_video/2103449259869863936/vid/avc1/1920x1080/gLl6GZWastLVE2fr.mp4", "rem": ""}, {"n": 660, "c": "motion", "t": [], "a": "quickdesignio", "p": "make a dynamic 15-second motion graphics video that shows what an incredible quickdesign is! and also  shows what an incredible motion designer you are!", "img": "https://pbs.twimg.com/amplify_video_thumb/2103617332845203456/img/R-KdWVIGSapmsBBa.jpg", "post": "https://x.com/quickdesignio/status/2103617779857338399", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103617332845203456/vid/avc1/480x270/T-hTYYRyaraRQiaD.mp4", "orig": "https://video.twimg.com/amplify_video/2103617332845203456/vid/avc1/1920x1080/LhxZciHtEptYhkqr.mp4", "rem": ""}, {"n": 661, "c": "motion", "t": [], "a": "0xValure", "p": "Make this PayBox logo into a reel. Pretend you are a world-class motion designer. Make a 10-second dynamic video like the reference", "img": "https://pbs.twimg.com/amplify_video_thumb/2103601210154426368/img/lb_4iGplcPUtFbhZ.jpg", "post": "https://x.com/0xValure/status/2103603029224354245", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103601210154426368/vid/avc1/482x270/iUITRdzcZQcVoHp4.mp4", "orig": "https://video.twimg.com/amplify_video/2103601210154426368/vid/avc1/1920x1072/KIJTA-HbAkuMHCV1.mp4", "rem": ""}, {"n": 662, "c": "motion", "t": [], "a": "okapi_fukugyo", "p": "<inputs>\n次の3つを私に質問すること：図形が変身する8〜12個の画面部品（例：ボタン、読み込み中の表示、音楽プレーヤー、音量スライダー、オン/オフのスイッチ、タブ、グラフ、⌘Kで開く検索窓、一瞬出る通知）、色は完全な白黒か差し色1色か、そして120BPM（1分間に120拍のテンポ）前後の著作権フリーの曲（例：Mixkit、商用利用無料）。\n<\/inputs>\n\n<direction>\nデザイナー向け作品サイト「Dribbble」に載るレベルの、洗練された画面の動き。図形は1つだけで、絶対に場面を切り替えない。すべての状態は、同じ1つの図形が大きさ・角の丸み・色を変えながら形を変えていく動きで表し、中身は短いぼかしをはさんで入れ替える。カーソルが本物のクリックとドラッグで、すべての変化を起こす。背景はあたたかみのある明るいグレー、部品は白と黒、画面の文字は日本語で、日本語フォントはNoto Sans JP、英数字と記号はGeist（1種類のフォント）。動きはすべて「ばね」のような自然な動きにし、行き過ぎ（跳ね返り）はごくわずかまで。カメラはズームして、各状態が画面いっぱいになるようにする。最後のフレームは最初のフレームと同じにして、ループさせる。\n禁止：弾むような動き、粒が飛び散る演出、光るにじみ、部品へのグラデーション、線の太さが揃っていないアイコン、何も起きない無駄な間、テンプレっぽく見えるもの全般。\n<\/direction>\n\n<structure>\n120BPM、7小節（約14秒）、毎拍なにかが起きる。\nボタン → 読み込み中の表示 → チェック → iPhoneのダイナミックアイランド風の表示 → 再生/一時停止のマークが滑らかに変わる音楽プレーヤー → 再生バーのつまみをドラッグして再生位置を動かす → 音量スライダーに変身（最大を超えてドラッグするとゴムのように伸びる） → オン/オフのスイッチが拍に合わせて切り替わる → スイッチのつまみが液体のように動くタブの選択表示になる → タブが開いて、自分で線を描いていくグラフに（カーソルを乗せると吹き出しが出る） → ⌘Kの検索窓に折りたたまれる → 入力して候補を絞り込む → Enter → 一瞬出る通知 → ボタンに戻る。\n<\/structure>\n\n<build>\n1. HTMLファイル1つ、正方形1440x1440。すべての見た目は seek(t)（時間tを渡すと、その瞬間の画面が決まる関数）の中で、時間から計算する。CSSトランジション（自動アニメーション機能）もタイマーも使わず、フレーム間で状態を持ち越さない。\n2. 「ばね」の動きは、式で直接求められる形（閉形式のステップ応答）にする。目標が何度も変わる値は、変化ごとに1つずつ計算した動きを足し合わせる。そうすれば、いつでも時間だけで値が決まる。\n3. タブの選択表示は、左端と右端を別々のばねで動かし、進む方向の先端が後ろ側より先に伸びるようにする。スイッチのつまみも同じ手法。\n4. ドラッグは直接操作：カーソルを押している間、値はカーソル位置から計算する。離したら、その位置からばねで戻る。\n5. 曲はnumpy（計算用のツール）で解析して拍の位置を割り出し、小節の頭の拍から始める。操作音は、測定した音のピークの位置に置く。\n6. Playwright（ブラウザを自動操作して画面を画像に書き出すツール）で描画する。1フレームあたり4コマ分を書き出して、ffmpeg（動画を作るツール）のtmixで重ねてモーションブラー（動きの残像）をかけ、60fpsにする。\n7. 全編を書き出す前に、1拍ごとに1フレームだけ書き出して確認する。拍からズレているもの、窮屈なもの、読みにくいものを直す。\n<\/build>\n\n<gotchas>\nカメラで拡大縮小される要素には will-change（ブラウザの描画設定）を絶対に付けない。付けると文字がぼやける。形が変わる箱の中で入れ替わる文字には、それぞれ専用の出入りのタイミングを持たせる（重なるのを防ぐ）。最後のフレームは、カーソルの位置と速度も含めて最初のフレームと完全に一致させる。そうしないと、ループがカクつく。\n<\/gotchas>\n\n<start>\nまず入力内容を私に質問して、コードを書く前に、拍ごとの状態リストを見せて。\n<\/start>", "img": "https://pbs.twimg.com/amplify_video_thumb/2103586045086543872/img/58fqHXsVxeMLA6EQ.jpg", "post": "https://x.com/okapi_fukugyo/status/2103586082336166351", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103586045086543872/vid/avc1/320x320/nNzQRxRjyVYg09aq.mp4", "orig": "https://video.twimg.com/amplify_video/2103586045086543872/vid/avc1/1440x1440/NLw4UFWCt8gVArEW.mp4", "rem": ""}, {"n": 663, "c": "motion", "t": [], "a": "AnnaCher___", "p": "Analyze https://t.co/gVJcJyZnZl and build a product promo from our own UI, not generic components.\n\n<direction>\nDribbble-level UI motion. One shape, never cut: every state is the same element morphing its size, radius and color while its content swaps with a short blur. A cursor drives every change with real clicks and drags. Light warm-gray canvas, black and white components, one clean UI font (Geist). Springs everywhere, a tiny overshoot at most. The camera zooms so each state fills the frame. The last frame is the first frame, so it loops.\nBanned: bouncy easing, particle bursts, glows, gradients on UI chrome, mismatched icon strokes, dead time, anything that looks like a template.\n<\/direction>", "img": "https://pbs.twimg.com/amplify_video_thumb/2103570995806375936/img/sleoZ_IcPyEwLMh-.jpg", "post": "https://x.com/AnnaCher___/status/2103571098638152174", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103570995806375936/vid/avc1/320x320/Tn8wkXVLs0kuShau.mp4", "orig": "https://video.twimg.com/amplify_video/2103570995806375936/vid/avc1/1440x1440/3gFHAU2ThuzLqJ6t.mp4", "rem": ""}, {"n": 664, "c": "explainer", "t": [], "a": "yankis0x", "p": "The trick is NOT the prompt. It is one rule: every frame is a pure function of time.\n\nsong -> numpy beat grid -> Opus 5.5 writes one HTML file -> Playwright renders -> ffmpeg blends\n\nstep 1 -> pick a royalty-free track around 120 BPM\n\nstep 2 -> give Opus 5.5 8 to 12 UI states: button, loader, toggle, chart, command palette\n\nstep 3 -> one HTML file, 1440x1440, every style computed inside seek(t). no CSS transitions, no timers\n\nstep 4 -> springs as closed-form math, so any frame renders in any order\n\nstep 5 -> numpy finds the beats, every UI sound lands on a measured peak\n\nstep 6 -> Playwright shoots 4 subframes per frame, ffmpeg tmix blends them into 60fps motion blur\n\nstep 7 -> render one frame per beat first, fix what is off the grid, then the full render\n\nthe math:\n\n120 BPM x 7 bars = 28 beats = 14 seconds\n14 s x 60 fps x 4 subframes = 3,360 browser renders", "img": "https://pbs.twimg.com/amplify_video_thumb/2103502132494118912/img/hEFaFt2whXYL-syX.jpg", "post": "https://x.com/yankis0x/status/2103502194578174321", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103502132494118912/vid/avc1/320x320/7Y0ZyYNOay-QitSF.mp4", "orig": "https://video.twimg.com/amplify_video/2103502132494118912/vid/avc1/1440x1440/Jelc0WtD1W-WP6P0.mp4", "rem": ""}, {"n": 665, "c": "motion", "t": [], "a": "nischalsharma_", "p": "Make an 80 second square animated film as a single HTML file, using WebGL2 and plain JS, with no libraries and no image, font or audio files. It should look like a glass and gold leaf wall mosaic whose tiles were never glued down, so they can lift, flip, fly and reform into new shapes.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103479876930183168/img/QX4kYMc1MNS5uIup.jpg", "post": "https://x.com/nischalsharma_/status/2103484041718587738", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103479876930183168/vid/avc1/320x320/nH0f6QpaQF-rF9Rf.mp4", "orig": "https://video.twimg.com/amplify_video/2103479876930183168/vid/avc1/1080x1080/ZJ1jD4druMJiQdxu.mp4", "rem": ""}, {"n": 666, "c": "motion", "t": [], "a": "Kisalay_", "p": "Make your motion design showreel based on \"The Beautiful Theft\" by [Artist Name]. Quiet sadness for four seconds. Then the drop.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103479056545325057/img/zzJa9ZwBrk2B_GTa.jpg", "post": "https://x.com/Kisalay_/status/2103479649728921896", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103479056545325057/vid/avc1/480x270/tOrdLcR1xswt3eFz.mp4", "orig": "https://video.twimg.com/amplify_video/2103479056545325057/vid/avc1/1920x1080/bCYbRf368PIJ1xWv.mp4", "rem": ""}, {"n": 667, "c": "motion", "t": [], "a": "RebutonePress", "p": "结合本机环境风格，做一个关于时间的故事，5分钟。要完整的视频，音频和字幕。需要什么工具自己在devshell配置，渲染完成后只留视频成品文件，其他全部清理干净。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103477236490027008/img/1F08loulPU2rOoAd.jpg", "post": "https://x.com/RebutonePress/status/2103478369245688099", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103477236490027008/vid/avc1/480x270/gA2lRkZlwrjydkil.mp4", "ori
