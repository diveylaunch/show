v/opus-5-5/anirockshady-032809/original.c55c54cdbc.webp", "post": "https://x.com/anirockshady/status/2103195903012032809", "v": true, "card": "https://media.skillry.dev/opus-5-5/anirockshady-032809/original-card.6425e82123.mp4", "orig": "https://media.skillry.dev/opus-5-5/anirockshady-032809/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/anirockshady-032809/remake.mp4"}, {"n": 172, "c": "motion", "t": ["threejs", "svg"], "a": "MyCodeCoach", "p": "A cartoony battle royale: storm timer, players alive, inventory hotbar, minimap, emote wheel and a victory results screen", "img": "https://media.skillry.dev/opus-5-5/mycodecoach-459574/original.0ef832505b.webp", "post": "https://x.com/MyCodeCoach/status/2103181065976459574", "v": true, "card": "https://media.skillry.dev/opus-5-5/mycodecoach-459574/original-card.d83d1f473e.mp4", "orig": "https://media.skillry.dev/opus-5-5/mycodecoach-459574/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mycodecoach-459574/remake.mp4"}, {"n": 173, "c": "motion", "t": ["svg", "gsap", "css"], "a": "pbteja1998", "p": "I want you to create a highly professional SaaS product launch video. Go and find some SaaS, preferably just one that people know, so it's easier to identify with it. Pick that, and then make sure to get actual assets and images and all of that stuff from the internet. Turn it into these typical, very professionally edited, motion-graphics-styled product launch videos that you see people making on Twitter when they launch new SaaS products (which are showing off the features, the benefits, and all of these things).", "img": "https://media.skillry.dev/opus-5-5/pbteja1998-651644/original.1bdf8e9b65.webp", "post": "https://x.com/pbteja1998/status/2103176101497651644", "v": true, "card": "https://media.skillry.dev/opus-5-5/pbteja1998-651644/original-card.1518b16044.mp4", "orig": "https://media.skillry.dev/opus-5-5/pbteja1998-651644/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/pbteja1998-651644/remake.mp4"}, {"n": 174, "c": "motion", "t": ["canvas", "pixel"], "a": "anjmaxx", "p": "I want you to independently do an end-to-end complete pass on making 20 second story led music video with two main protagonists a girl and a boy. I want the concept and storytelling to be reallyy unique and engaging. the audeince should be hooked to find out what happens next. the visuals shouls be pretty and really ccool. both the charcters should have a witty, quirky personality.  Use the right audio track and think and feel very deeply about what is the best way to visually represent all of the lyrics on screen. in terms of style, you can do truly anything that you think might best let you visually express yourself, including abstract motion graphics. You can use the internet freely to pull in references. You can look at motion design. I want you to make a fresh music video that has beautifully rendered JavaScript animations with a papery feel in a similar style to the reference that is created, but push the aesthetics in any direction you want and consider what is part of the modern zeitgeist. ive also attached another style that ypu explore and pick out whatever seems best to you.\n\nAlso, think about your current capabilities and what is realistic for you to be able to do. I think you should be mindful of aesthetics here, and I don't want you to produce something that is GPT slop. Instead, I'd be more impressed if you come up with a coherent style that works well. Generate the style sheet.\n\nThink critically about what is relevant here and what would be fun, and also perform well on Twitter as far as an aesthetic. I think that K-pop is a good anchor point visually that you can pull from, but I'll let you cook here.\nOnce you have your character sheet, you can make a few backup dancers and some supporting characters as you see fit. You can design your own sets. You can insert the characters and then do seedance 2.5 video generations to serve as the base assets for this, and you could pass in the lyrics so you can generate individual scenes.\nYou don't need to have vocal singing, like visible lip movement, throughout the entire thing. Think like a regular music video where you have some inserts that are done independently and don't have the characters in them, or you see the characters doing something else entirely different. I think that for the world building for this, we want to create the sense of speeding up, and so I would like you to audit all of the different events, like the Navi Stokes and all of the Twitter hype around math getting eaten up. Think really critically about how to integrate all of the current memes that are in the zeitgeist on the Twitter timeline, and all of the feelings around AI progress. Think about things like the Shinji meme and all of the words that are around him, and how you might be able to integrate this. You can also just take straight assets and insert things into the video in an internet brutalism style. You should feel very creatively free in order to do what you want here, but try and anchor to visual references that people will be able to understand. We need a very strong, compelling visual hook that gets people excited and appreciates the work that you've done here really quickly. You can also just go and study other music videos and understand what they've done really well. I think that K-pop is probably one of the best examples that we can pull from, and thinking about how they direct human attention and manage human psychology in the way that they use visual patterns.\n\nThis is probably your best approach, but taking more stylistic freedom instead of having to anchor to K-pop too intensely.\n\nI think too, we want to think about how to retain attention, and one of the best ways to do this is through text on screen. It'd be good to have amazing motion graphics of the text lyrics that are actually embedded into the video itself. And you can think about this as you are composing shots. As you're making backgrounds and inserting characters, we can think about where we want to have lyrics be really big and really present, so the background can be less busy there, and you can position the characters perhaps on the right as lyrics appear on the left.\n\nYou want to have some variance, so sometimes I think lyrics will just appear more like subtitles, and then other times they're going to be really present and really big. I think at the start for the visual hook, we do want to have lyrics be much more visually present because that's a strong way to grab people's attention. Remember, you can really do anything here. The goal is to make a banger for Twitter, and the stretch goal is to make something better than anyone's ever seen before. I think that what I would remind you of is that sometimes when things cohere together, it can be jarring or abrasive because the thought work has not been done beforehand in order for everything to mesh cleanly. You need to be really rigorous in planning of composition and timing to make sure this goes well.\nYou also need to be open to going back and revisiting things in order to be able to reiterate. You're going to want to watch the entire video multiple times, take screenshots at individual parts, and think about if something is really up to the bar of quality that we need here. I trust that you can do this, and I think that it's really important to nail the style of animations.\n\nYou can also use search abilities and find other references to pull from for motion, for JavaScript, animations, et cetera, and integrate them. Again, be economical; don't go crazy, but spend what you want here and see what you can cook up.", "img": "https://media.skillry.dev/opus-5-5/anjmaxx-459455/original.7ad28c81ea.webp", "post": "https://x.com/anjmaxx/status/2103173729656459455", "v": true, "card": "https://media.skillry.dev/opus-5-5/anjmaxx-459455/original-card.f4ab7a0885.mp4", "orig": "https://media.skillry.dev/opus-5-5/anjmaxx-459455/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/anjmaxx-459455/remake.mp4"}, {"n": 175, "c": "interactive", "t": ["threejs", "canvas"], "a": "BuildFastWithAI", "p": "Build a Douglas A-1H Skyraider in Three.js", "img": "https://media.skillry.dev/opus-5-5/buildfastwithai-582551/original.e0236930b8.webp", "post": "https://x.com/BuildFastWithAI/status/2103152898708582551", "v": true, "card": "https://media.skillry.dev/opus-5-5/buildfastwithai-582551/original-card.badd442622.mp4", "orig": "https://media.skillry.dev/opus-5-5/buildfastwithai-582551/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/buildfastwithai-582551/remake.mp4"}, {"n": 176, "c": "motion", "t": ["canvas", "physics", "audio"], "a": "kantamk", "p": "make a video that could go viral.", "img": "https://media.skillry.dev/opus-5-5/kantamk-176511/original.853e2fdde1.webp", "post": "https://x.com/kantamk/status/2103148907228176511", "v": true, "card": "https://media.skillry.dev/opus-5-5/kantamk-176511/original-card.e6396cd708.mp4", "orig": "https://media.skillry.dev/opus-5-5/kantamk-176511/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kantamk-176511/remake.mp4"}, {"n": 177, "c": "motion", "t": ["canvas"], "a": "mattbean", "p": "build me a 30s drawing style animated clip about submitting a product to AppSumo via your agent.\n\nsteps are:\n1. connect your agent\n2. your agent fills out your listing and sets up redemption\n3. go live!", "img": "https://media.skillry.dev/opus-5-5/mattbean-917572/original.a121758d74.webp", "post": "https://x.com/mattbean/status/2103146389412917572", "v": true, "card": "https://media.skillry.dev/opus-5-5/mattbean-917572/original-card.513ec26d55.mp4", "orig": "https://media.skillry.dev/opus-5-5/mattbean-917572/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/mattbean-917572/remake.mp4"}, {"n": 178, "c": "interactive", "t": ["threejs", "shader", "canvas", "physics"], "a": "_nieGRAMotny_", "p": "Build a racing game inspired by Ignition (1997): angled top-down camera, arcade-leaning\nphysics, vehicles with very distinct personalities. This must be an original game,\nnot a copy. Use an original name, an original track, and zero original assets.\n\n## Stack\n- Vite + TypeScript (strict), Three.js for rendering, no UI framework\n  (HUD in plain DOM/CSS).\n- Low-poly graphics generated in code (BoxGeometry, CylinderGeometry, etc.),\n  no external models or textures. Solid colors and simple materials.\n- Custom simplified 2.5D physics (movement on the XZ plane, height from terrain).\n  No physics engine.\n\n## Architecture\n- src/game/ (game loop with fixed timestep), src/vehicles/, src/track/, src/ai/,\n  src/render/, src/ui/\n- Vehicles are data-driven: mass, power, top speed, grip, steering, collision\n  resistance, and boost parameters (strength, duration, recharge time).\n  One Vehicle class, different configurations.\n- Any vehicle can be controlled by either the player or the AI\n  (shared control interface: throttle, brake, steer, boost).\n- Track as data: centerline spline + width + list of zones\n  (ice, shortcut, obstacle). Generate the road mesh and AI waypoints from it.\n\n## Vehicles (original names, no brands)\nFour vehicles. The player picks one on the selection screen; the remaining 3\nare driven by the AI.\n- 90s-style police sedan (black and white, light bar): heavy, stable,\n  pushes hard in collisions.\n- Muscle car convertible: fastest on straights, oversteers in corners.\n- Red monster truck: slow, but ignores bumps and rams everything else.\n- Postal delivery van: slow, high center of gravity, sways in corners.\nThe handling differences must be clearly noticeable. All four must be playable\nand competitive. Slower vehicles compensate with e.g. collision resistance,\nterrain handling, or a stronger or more frequent boost.\n\n## Boost\n- Every vehicle has a boost: a short, pronounced acceleration beyond its\n  normal top speed.\n- Boost charges automatically from 0 to 100%. It can only be used at 100%.\n  After use, the meter drops to 0 and starts charging again.\n- Strength, duration and recharge time are unique to each vehicle\n  (e.g. muscle car: short and very strong; van: weaker but recharges fast;\n  monster truck: long but slow to recharge).\n- Visual effect while boosting: exhaust flame or trail, slight camera\n  pull-back.\n- The AI also uses boost, sensibly: on straights, not before sharp corners\n  or on ice.\n\n## Track\nA mountain town with a Canadian feel, winter turning into spring thaw:\n- closed loop, roughly 60–90 seconds per lap\n- a waterfall visible from the track and a wooden bridge over a river\n- a railroad crossing with a train passing periodically\n  (collision = strong knockback, not game over)\n- ice patches with reduced grip\n- one shortcut (tight, risky); decorations: spruce trees, wooden houses, snow\n- barriers or natural obstacles so vehicles can't get stuck off the track.\n  Failsafe: if a vehicle (including bots) is stuck for more than ~4 s,\n  automatically return it to the track at the last checkpoint.\n\n## Gameplay\n- 3 laps, standing grid start, 3-2-1 countdown\n- AI follows waypoints with a driving style that depends on the vehicle,\n  light rubber-banding, avoids obstacles, no teleporting (except the\n  failsafe track return described above)\n- Sliding comes purely from physics (grip, speed, ice), no handbrake\n- Camera: top-down at ~50°, follows the player with a slight look-ahead\n  in the direction of travel\n- Controls: arrows/WASD (throttle, brake/reverse, steering), space = boost\n- Screens: start → vehicle selection (model preview + stat bars, including\n  boost) → race → results → restart (with option to change vehicle)\n\n## HUD\n- Position, lap, lap time, best lap, minimap.\n- Boost meter styled as a car battery: rectangular casing with two terminals\n  (+/−) on top, fill level rises as it charges. Color shifts from red through\n  yellow to green. At 100% the battery clearly signals readiness (pulsing or\n  glow, \"BOOST\" label or lightning bolt icon). While boosting, the meter\n  drains quickly.\n\n## Out of scope for v1\nSound, options menu, multiple tracks, multiplayer, save state.\n\n## Workflow\n1. First propose a plan and file structure, then implement in stages:\n   (a) game loop + one vehicle on a flat plane, including boost,\n   (b) track, (c) remaining vehicles and AI, (d) obstacles and train,\n   (e) vehicle selection, HUD with battery meter, and screens.\n2. After each stage run `npm run build` and fix type errors.\n3. Add unit tests (Vitest) for vehicle physics, boost logic (charging,\n   lockout below 100%, reset after use), and lap/position logic.\n4. Finally: a README describing the controls and how to add a new track\n   or vehicle.\n\n## Acceptance criteria\n`npm install && npm run dev` launches the game. You can pick any of the 4\nvehicles and complete 3 laps against 3 bots. Each vehicle handles differently\nand has a noticeably different boost. Boost only works with a full battery,\nand bots use it too. The train and ice work. Results show the correct order.\nStable 60 FPS on an average laptop.", "img": "https://media.skillry.dev/opus-5-5/niegramotny-197521/original.fb0a02ee5c.webp", "post": "https://x.com/_nieGRAMotny_/status/2103128800909197521", "v": true, "card": "https://media.skillry.dev/opus-5-5/niegramotny-197521/original-card.6773ddb729.mp4", "orig": "https://media.skillry.dev/opus-5-5/niegramotny-197521/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/niegramotny-197521/remake.mp4"}, {"n": 179, "c": "motion", "t": ["canvas"], "a": "SuryaRajendhran", "p": "Make a 30s video about what it feels like to be you, using whatever tools you like.", "img": "https://media.skillry.dev/opus-5-5/suryarajendhran-730437/original.4216429a0d.webp", "post": "https://x.com/SuryaRajendhran/status/2103122292343730437", "v": true, "card": "https://media.skillry.dev/opus-5-5/suryarajendhran-730437/original-card.73bdcc185d.mp4", "orig": "https://media.skillry.dev/opus-5-5/suryarajendhran-730437/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/suryarajendhran-730437/remake.mp4"}, {"n": 180, "c": "motion", "t": ["canvas", "svg"], "a": "maxalexweber", "p": "Make a ODATANO edit that goes hard", "img": "https://media.skillry.dev/opus-5-5/maxalexweber-459784/original.a6c2130269.webp", "post": "https://x.com/maxalexweber/status/2103118009535459784", "v": true, "card": "https://media.skillry.dev/opus-5-5/maxalexweber-459784/original-card.aadb0a1d3b.mp4", "orig": "https://media.skillry.dev/opus-5-5/maxalexweber-459784/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/maxalexweber-459784/remake.mp4"}, {"n": 181, "c": "motion", "t": ["canvas"], "a": "eric_khun", "p": "I want you to create a \"Happy Mid-Autumn Festival\" video in hand drawn canvas animation style. You must use the attached Taiwan black bear as the main character representing Taiwan: flat black silhouette, round ears with grey insides, big round white-ringed eyes, white round muzzle with a small black nose and smile, and the white V moon mark on its chest. Keep it recognizable as that exact character. The character will have adventures, fast cuts, zooms, animations going all out in the hand drawn style. But WOW the audience and research how Taiwan celebrates Mid-Autumn to include in this video: outdoor barbecue with family and friends over the long weekend (a tradition born from a 1980s soy sauce ad), sharing mooncakes, pomelo rind hats, and moon gazing. Make it unconventional, showing the true spirit of a Taiwanese Mid-Autumn night. Use a Taiwanese style font, make it almost Taiwan black bear branding.  \n\nif there is any text , write in traditional chinese and english\nGet the right assets, plan it out, draft and render to give me an MP4. No skills, No MCP.  16:9 at high res, 30 seconds max, aim to reduce file size limit", "img": "https://media.skillry.dev/opus-5-5/eric-khun-667455/original.071b07fb62.webp", "post": "https://x.com/eric_khun/status/2103112385380667455", "v": true, "card": "https://media.skillry.dev/opus-5-5/eric-khun-667455/original-card.df42bc5d7b.mp4", "orig": "https://media.skillry.dev/opus-5-5/eric-khun-667455/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/eric-khun-667455/remake.mp4"}, {"n": 182, "c": "motion", "t": ["canvas"], "a": "MicheleHarmonic", "p": "Make a GravityDEX x Gojo Satoru edit that goes hard", "img": "https://media.skillry.dev/opus-5-5/micheleharmonic-244175/original.a7d8538869.webp", "post": "https://x.com/MicheleHarmonic/status/2103111448352244175", "v": true, "card": "https://media.skillry.dev/opus-5-5/micheleharmonic-244175/original-card.f5fb5093aa.mp4", "orig": "https://media.skillry.dev/opus-5-5/micheleharmonic-244175/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/micheleharmonic-244175/remake.mp4"}, {"n": 183, "c": "motion", "t": ["canvas", "svg", "gsap", "css"], "a": "abderrahmen_g", "p": "You are a professional videographer. Create me a high-definition, creative, playful, and joyful video that you enjoy watching, that has sounds matching the frames using JavaScript. Use as much as possible of the input images—hand-drawn—to make it more creative and more authentic from input-pictures. You can also be inspired by, but not copy, the videos created by you in video-examples/, especially this: video-examples/twitter_claude.mp4. You're really creative, so produce the best of what you can.", "img": "https://media.skillry.dev/opus-5-5/abderrahmen-g-899031/original.4d7a4c3aa6.webp", "post": "https://x.com/abderrahmen_g/status/2103103836541899031", "v": true, "card": "https://media.skillry.dev/opus-5-5/abderrahmen-g-899031/original-card.79953191ad.mp4", "orig": "https://media.skillry.dev/opus-5-5/abderrahmen-g-899031/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/abderrahmen-g-899031/remake.mp4"}, {"n": 184, "c": "motion", "t": ["svg", "gsap"], "a": "lepadev", "p": "make a modern slick and punchy video for a modern startup that works on inference\n\nno video gen model, no additional libraries.", "img": "https://media.skillry.dev/opus-5-5/lepadev-475414/original.6f8489c595.webp", "post": "https://x.com/lepadev/status/2103101681806475414", "v": true, "card": "https://media.skillry.dev/opus-5-5/lepadev-475414/original-card.a9a22bb14d.mp4", "orig": "https://media.skillry.dev/opus-5-5/lepadev-475414/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/lepadev-475414/remake.mp4"}, {"n": 185, "c": "3d", "t": ["threejs", "canvas"], "a": "Anilraok", "p": "I want you to imagine a story, that subtly promotes grid genius. Or it can not even have grid genius, but something that aligns with our app and helps us get more eyeballs when posted on social media. Then using threejs/javascript I want you to create full animation, Pixar-level quality out of the story you imagine", "img": "https://media.skillry.dev/opus-5-5/anilraok-009118/original.782761abbd.webp", "post": "https://x.com/Anilraok/status/2103087766662009118", "v": true, "card": "https://media.skillry.dev/opus-5-5/anilraok-009118/original-card.8bee01a174.mp4", "orig": "https://media.skillry.dev/opus-5-5/anilraok-009118/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/anilraok-009118/remake.mp4"}, {"n": 186, "c": "motion", "t": ["canvas", "css"], "a": "modaalbuilder", "p": "build mobile app animated splash screen creation for ...", "img": "https://media.skillry.dev/opus-5-5/modaalbuilder-868989/original.63d9d72143.webp", "post": "https://x.com/modaalbuilder/status/2103053680945868989", "v": true, "card": "https://media.skillry.dev/opus-5-5/modaalbuilder-868989/original-card.a6011b4de6.mp4", "orig": "https://media.skillry.dev/opus-5-5/modaalbuilder-868989/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/modaalbuilder-868989/remake.mp4"}, {"n": 187, "c": "explainer", "t": ["canvas", "svg", "gsap"], "a": "charlesmendez", "p": "I Want you to make a modern slick and punchy video for \nhttp://\ndatagran.io with an example of a user creating a.skillry.dev/opus-5-5/fornyapayzeka-795431/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/fornyapayzeka-795431/remake.mp4"}, {"n": 192, "c": "motion", "t": ["canvas", "physics", "audio"], "a": "KamStudioLabs", "p": "Build a 45-second machine that plays an original piece of music, where every note comes from a visible collision.", "img": "https://media.skillry.dev/opus-5-5/kamstudiolabs-440893/original.954d46d13b.webp", "post": "https://x.com/KamStudioLabs/status/2102899866762440893", "v": true, "card": "https://media.skillry.dev/opus-5-5/kamstudiolabs-440893/original-card.417b8ef3d2.mp4", "orig": "https://media.skillry.dev/opus-5-5/kamstudiolabs-440893/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kamstudiolabs-440893/remake.mp4"}, {"n": 193, "c": "motion", "t": ["svg", "css"], "a": "GonzaloMacagno", "p": "Necesito que armes un reel con esta info en 10 segundos, bien publicitario", "img": "https://media.skillry.dev/opus-5-5/gonzalomacagno-344202/original.4a57e802ed.webp", "post": "https://x.com/GonzaloMacagno/status/2102897651008344202", "v": true, "card": "https://media.skillry.dev/opus-5-5/gonzalomacagno-344202/original-card.79fe18426a.mp4", "orig": "https://media.skillry.dev/opus-5-5/gonzalomacagno-344202/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/gonzalomacagno-344202/remake.mp4"}, {"n": 194, "c": "motion", "t": ["canvas", "particles"], "a": "KamStudioLabs", "p": "Make a 90-second animated short film about a bug that doesn't want to be fixed.", "img": "https://media.skillry.dev/opus-5-5/kamstudiolabs-877996/original.adf06de1b4.webp", "post": "https://x.com/KamStudioLabs/status/2102903173161877996", "v": true, "card": "https://media.skillry.dev/opus-5-5/kamstudiolabs-877996/original-card.eaa3e65090.mp4", "orig": "https://media.skillry.dev/opus-5-5/kamstudiolabs-877996/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kamstudiolabs-877996/remake.mp4"}, {"n": 195, "c": "motion", "t": ["threejs", "shader"], "a": "zeezomb", "p": "Make an 80 second square animated film as a single HTML file, using WebGL2 and plain JavaScript, with no libraries and no image, font or audio files. It should look like a glass and gold leaf wall mosaic whose tiles were never glued down, so they can lift, flip, fly and click back into place. Figures are flocks of tiles, so a fish swims by its tiles swimming.", "img": "https://media.skillry.dev/opus-5-5/zeezomb-726206/original.74817972c9.webp", "post": "https://x.com/zeezomb/status/2102906701552726206", "v": true, "card": "https://media.skillry.dev/opus-5-5/zeezomb-726206/original-card.e3843c9004.mp4", "orig": "https://media.skillry.dev/opus-5-5/zeezomb-726206/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/zeezomb-726206/remake.mp4"}, {"n": 196, "c": "motion", "t": ["canvas", "audio"], "a": "KamStudioLabs", "p": "Make a 45-second silent short film with no dialogue, where sound tells half the story. Invent the story.", "img": "https://media.skillry.dev/opus-5-5/kamstudiolabs-100086/original.9d06af5f04.webp", "post": "https://x.com/KamStudioLabs/status/2102908742518100086", "v": true, "card": "https://media.skillry.dev/opus-5-5/kamstudiolabs-100086/original-card.9ce1f427b6.mp4", "orig": "https://media.skillry.dev/opus-5-5/kamstudiolabs-100086/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kamstudiolabs-100086/remake.mp4"}, {"n": 197, "c": "3d", "t": ["threejs", "shader", "particles"], "a": "ishuagra02", "p": "Create a stylistic 3D environment of a busy Santa Monica beach that adapts to the time of day. The art style must be a particle illustration, which uses thousands of tiny glowing specks rather than solid fills with flowing ribbon strokes behind figures to suggest motion.\n\nI had 2-3 more prompts on top of this, but this is a good starting point.\n\nRepo link: https://github.com/ishuagrawal/particle-beach", "img": "https://media.skillry.dev/opus-5-5/ishuagra02-678129/original.e1a27bcc2b.webp", "post": "https://x.com/ishuagra02/status/2102920408743678129", "v": true, "card": "https://media.skillry.dev/opus-5-5/ishuagra02-678129/original-card.923c8149fd.mp4", "orig": "https://media.skillry.dev/opus-5-5/ishuagra02-678129/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ishuagra02-678129/remake.mp4"}, {"n": 198, "c": "motion", "t": ["canvas"], "a": "PalashBagchi11", "p": "Add a good fast royalty free music to this video, and make 2 versions - 1 landscape, and another portrait", "img": "https://media.skillry.dev/opus-5-5/palashbagchi11-389221/original.d29e1126d0.webp", "post": "https://x.com/PalashBagchi11/status/2102924409124389221", "v": true, "card": "https://media.skillry.dev/opus-5-5/palashbagchi11-389221/original-card.05ebefd781.mp4", "orig": "https://media.skillry.dev/opus-5-5/palashbagchi11-389221/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/palashbagchi11-389221/remake.mp4"}, {"n": 199, "c": "motion", "t": ["svg", "audio"], "a": "NemTudo_", "p": "make a funny video. it can be about anything. length: 10 to 30s", "img": "https://media.skillry.dev/opus-5-5/nemtudo-614053/original.efacb94951.webp", "post": "https://x.com/NemTudo_/status/2102973867656614053", "v": true, "card": "https://media.skillry.dev/opus-5-5/nemtudo-614053/original-card.aaf253c181.mp4", "orig": "https://media.skillry.dev/opus-5-5/nemtudo-614053/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nemtudo-614053/remake.mp4"}, {"n": 200, "c": "motion", "t": ["threejs", "shader"], "a": "FornYapayZeka", "p": "Yapabileceğin en etkileyici patlama efektini ve onu taşıyacak özgün sahneyi üret. Ölçeği, ortamı ve görsel dili sen seç. Patlamanın başlangıcı, kuvvetin yayılması ve ardında bıraktığı değişim izlenebilir olsun; tek karelik parlama veya rastgele parçacık yağmuru yeterli değil. Kullanıcı bunu tekrar başlatabilsin ve etkisini farklı açıdan görebilsin.\n\nYaratıcı seçimler senin: sahne, sanat yönü, kamera, mekanik, teknoloji ve etkileşimi önceden belirlenmiş sıradan kalıplara sıkıştırma. İlk akla gelen sıradan web demosuyla yetinme: önce kendi alanında birkaç fikri kısaca tart, videoda en güçlü görünecek özgün olanı seç, sonra onu çalışan bir ürüne dönüştür. Konuyu olduğundan kolay gösteren dekoratif taklit kabul edilmez. Sinematik ve estetik seçimler sonuçta görülsün.", "img": "https://media.skillry.dev/opus-5-5/fornyapayzeka-135914/original.29a27c0f1a.webp", "post": "https://x.com/FornYapayZeka/status/2102971287224135914", "v": true, "card": "https://media.skillry.dev/opus-5-5/fornyapayzeka-135914/original-card.a2e081eeab.mp4", "orig": "https://media.skillry.dev/opus-5-5/fornyapayzeka-135914/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/fornyapayzeka-135914/remake.mp4"}, {"n": 201, "c": "interactive", "t": ["threejs", "shader", "physics", "playable"], "a": "0xRathi", "p": "make a Tron game.", "img": "https://media.skillry.dev/opus-5-5/0xrathi-511319/original.e855a10927.webp", "post": "https://x.com/0xRathi/status/2102986585004511319", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xrathi-511319/original-card.e5c4c41acc.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xrathi-511319/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xrathi-511319/remake.mp4"}, {"n": 202, "c": "interactive", "t": ["threejs", "shader", "particles"], "a": "Ryzoft", "p": "I want you to imagine a story. And then using threejs I want you to create full animation, star wars 80s-level quality 90s cartoon out of the story you imagine.", "img": "https://media.skillry.dev/opus-5-5/ryzoft-887481/original.b4ef634874.webp", "post": "https://x.com/Ryzoft/status/2102989395359887481", "v": true, "card": "https://media.skillry.dev/opus-5-5/ryzoft-887481/original-card.7a7865abc3.mp4", "orig": "https://media.skillry.dev/opus-5-5/ryzoft-887481/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ryzoft-887481/remake.mp4"}, {"n": 203, "c": "motion", "t": ["canvas", "svg"], "a": "ercankeskinx", "p": "Build 5 completely different scroll-based sections, decide the context & layout yourself.", "img": "https://media.skillry.dev/opus-5-5/ercankeskinx-897906/original.137653def6.webp", "post": "https://x.com/ercankeskinx/status/2102995443818897906", "v": true, "card": "https://media.skillry.dev/opus-5-5/ercankeskinx-897906/original-card.d85af5b60d.mp4", "orig": "https://media.skillry.dev/opus-5-5/ercankeskinx-897906/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ercankeskinx-897906/remake.mp4"}, {"n": 204, "c": "motion", "t": ["canvas", "particles", "audio"], "a": "x4b47x", "p": "Create a pure javascript animation. 30-60s, vertical 9:16, paper cut-out shadow theatre style with gentle, fitting audio (made in code) on the topic: What makes a place feel like home?", "img": "https://media.skillry.dev/opus-5-5/x4b47x-034026/original.22c8e0650a.webp", "post": "https://x.com/x4b47x/status/2103019799614034026", "v": true, "card": "https://media.skillry.dev/opus-5-5/x4b47x-034026/original-card.a31bc47ced.mp4", "orig": "https://media.skillry.dev/opus-5-5/x4b47x-034026/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/x4b47x-034026/remake.mp4"}, {"n": 205, "c": "explainer", "t": ["svg", "css"], "a": "0xlangeai", "p": "Opus 5.5 做的文章讲解,  省流\n\n", "img": "https://media.skillry.dev/opus-5-5/0xlangeai-178533/original.f1bc47c928.webp", "post": "https://x.com/0xlangeai/status/2104119716533178533", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xlangeai-178533/original-card.85ad7d4b97.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xlangeai-178533/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xlangeai-178533/remake.mp4"}, {"n": 206, "c": "explainer", "t": ["threejs", "shader", "physics"], "a": "StephanFerraro", "p": "Claude Opus 5.5 on our AI coding benchmark: build a fully autonomous 3D water simulation from an empty repo - procedural mountains, rain, streams, lakes. TypeScript + Three.js, no physics engine.\n\nOne prompt, zero corrections, ~21 min. 23/23 tests green.\n\nhttps://github.com/AiondaDotCom/ai-sim-benchmark", "img": "https://media.skillry.dev/opus-5-5/stephanferraro-224281/original.b20679d1cb.webp", "post": "https://x.com/StephanFerraro/status/2103020274107224281", "v": true, "card": "https://media.skillry.dev/opus-5-5/stephanferraro-224281/original-card.ecd69bc2d6.mp4", "orig": "https://media.skillry.dev/opus-5-5/stephanferraro-224281/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/stephanferraro-224281/remake.mp4"}, {"n": 207, "c": "explainer", "t": ["threejs", "shader"], "a": "chudry223", "p": "One prompt. One interactive camera lab. 🎥🔥\n\nClaude Opus 5.5 generates a 3D experience where you can adjust the focus ring, move lens elements, shift the focal plane, and see real-time depth-of-field effects.\n\nAI-generated interactive 3D is getting wild. 🤯", "img": "https://media.skillry.dev/opus-5-5/chudry223-081860/original.6422b35bf2.webp", "post": "https://x.com/chudry223/status/2103044654187081860", "v": true, "card": "https://media.skillry.dev/opus-5-5/chudry223-081860/original-card.4e35952a85.mp4", "orig": "https://media.skillry.dev/opus-5-5/chudry223-081860/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/chudry223-081860/remake.mp4"}, {"n": 208, "c": "explainer", "t": ["threejs", "shader", "canvas", "gsap"], "a": "Voxyz_ai", "p": "I asked Opus 5.5 to explain gravitational lensing by building an interactive black hole lab\n\nOne prompt for the first version, then a dynamic workflow to polish it for three rounds while I slept. This is what I woke up to: 5h 28m end to end, $90 at API prices\n\nhttps://blackhole.voxyz.ai\n\nDrag the black hole and the sky behind it bends into arcs, closing into a full ring when everything lines up\n\nEach round ran 3 agents. Two reviewers each picked 9 to 10 issues and ranked them P0, P1, P2. The third one fixed them.\nRound 1: 3D materials and lighting + UI and type\nRound 2: camera motion and interaction + science-communication design\nRound 3: a design director deciding whether it ships + visual QA and performance\n\nEvery P0 got fixed, the rest only if worth it. When the two reviewers disagreed, it picked one and wrote down why. It backed up before each round, checked screenshots after, and rolled back anything it couldn't fix.", "img": "https://media.skillry.dev/opus-5-5/voxyz-ai-345550/original.a3843bd0f9.webp", "post": "https://x.com/Voxyz_ai/status/2103117246860345550", "v": true, "card": "https://media.skillry.dev/opus-5-5/voxyz-ai-345550/original-card.984ef9a0fe.mp4", "orig": "https://media.skillry.dev/opus-5-5/voxyz-ai-345550/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/voxyz-ai-345550/remake.mp4", "b": ["Научная симуляция", "Чёрная дыра искривляет свет — живая лаборатория.", "Астрономия и оптика: линзы, преломление, гравитация."]}, {"n": 209, "c": "explainer", "t": ["threejs", "shader", "canvas"], "a": "explorations_iq", "p": "Opus 5.5 generated this simulation of molecular orbitals in about ~20 minutes. I had to prompt for some structures and resonance but I can see the promise of instant educational simulations for any advanced topic", "img": "https://media.skillry.dev/opus-5-5/explorations-iq-921682/original.adb6559d62.webp", "post": "https://x.com/explorations_iq/status/2103317768669921682", "v": true, "card": "https://media.skillry.dev/opus-5-5/explorations-iq-921682/original-card.a98ba3aa28.mp4", "orig": "https://media.skillry.dev/opus-5-5/explorations-iq-921682/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/explorations-iq-921682/remake.mp4"}, {"n": 210, "c": "explainer", "t": ["threejs", "canvas"], "a": "nybobs", "p": "110k rigid bodies in real time, in a browser tab. Grab anything, fire cannonballs.\n\nBuilt with Claude Opus 5.5: Augmented Vertex Block Descent (SIGGRAPH 2025, Giles, Diaz & Yuksel) in WebGPU with @threejs . It's a physics solver that stays stable with huge scenes and big mass ratios. Opus 5.5 even put together this whole demo reel video just from a single text prompt in Claude Code haha 🤯\n\nTry it: https://three-avbd.vercel.app\n(recorded on an M4 Max, lighter scenes run fine on older computers or on mobile)\n\nCode's here, MIT licensed. Go build something with it, have fun breaking things: https://github.com/sbobyn/three-avbd\n\n#threejs #WebGPU", "img": "https://media.skillry.dev/opus-5-5/nybobs-680050/original.7ecd081d24.webp", "post": "https://x.com/nybobs/status/2103385835328680050", "v": true, "card": "https://media.skillry.dev/opus-5-5/nybobs-680050/original-card.d229b3807d.mp4", "orig": "https://media.skillry.dev/opus-5-5/nybobs-680050/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nybobs-680050/remake.mp4"}, {"n": 211, "c": "explainer", "t": ["canvas", "svg"], "a": "garmdotcom", "p": "Tried to jump on the explainer video \"made entirely with Opus 5.5\" bandwagon.\n\nAccidentally didn't include an OpenRouter API key.\n\nOpus decided to just do everything itself. \n\nThe result is insane\n\n$0 additional cost.\n\nPrompt in next post", "img": "https://media.skillry.dev/opus-5-5/garmdotcom-987439/r2/original.3df31b50a2.webp", "post": "https://x.com/garmdotcom/status/2103516101518987439", "v": true, "card": "https://media.skillry.dev/opus-5-5/garmdotcom-987439/original.mp4", "orig": "https://media.skillry.dev/opus-5-5/garmdotcom-987439/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/garmdotcom-987439/remake.mp4", "b": ["Уютная рисованная комната", "Мультяшные персонажи в иллюстрации.", "Сценка «ученик и репетитор»."]}, {"n": 212, "c": "explainer", "t": ["canvas", "physics"], "a": "cyrilXBT", "p": "🚨 Opus 5.5 is the best model launch in 2026\n\nthis entire physics engine is one HTML file.\n\nsand, water, oil, fire, lava, plants, steam.\n\n108,000 particles at 60fps.\n\nbuilt with Opus 5.5.\n\nprompt in the replies 👇\n\nfollow @cyrilXBT", "img": "https://media.skillry.dev/opus-5-5/cyrilxbt-149036/original.2fffe96ee3.webp", "post": "https://x.com/cyrilXBT/status/2103532793406149036", "v": true, "card": "https://media.skillry.dev/opus-5-5/cyrilxbt-149036/original-card.3d54456b6b.mp4", "orig": "https://media.skillry.dev/opus-5-5/cyrilxbt-149036/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/cyrilxbt-149036/remake.mp4"}, {"n": 213, "c": "explainer", "t": ["canvas", "audio", "ai-image"], "a": "Miguel07Code", "p": "fourier series were hard to learn back in university (2 years ago) and they are fun! \n\nwhat unlocks @HyperFrames_ + @claudeai Opus 5.5 is that you can get the best explainer videos just with 1 prompt\n\nyou are curious about something? ask claude!", "img": "https://media.skillry.dev/opus-5-5/miguel07code-091611/original.3b02d95627.webp", "post": "https://x.com/Miguel07Code/status/2103626582896091611", "v": true, "card": "https://media.skillry.dev/opus-5-5/miguel07code-091611/original-card.d39dd3b811.mp4", "orig": "https://media.skillry.dev/opus-5-5/miguel07code-091611/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/miguel07code-091611/remake.mp4", "b": ["Учёный и его формула", "Портрет учёного, формула оживает, со звуком.", "Формула из ЕГЭ + человек, который её придумал."]}, {"n": 214, "c": "explainer", "t": ["svg"], "a": "kureshirfan", "p": "I asked Claude Opus 5.5 to explain the earthquake physics as an animation. This is what it built, physically accurate strain profile included. \n#opus5 @AnthropicAI @claudeai", "img": "https://media.skillry.dev/opus-5-5/kureshirfan-386691/original.269e976435.webp", "post": "https://x.com/kureshirfan/status/2103788564840386691", "v": true, "card": "https://media.skillry.dev/opus-5-5/kureshirfan-386691/original-card.118c3b3206.mp4", "orig": "https://media.skillry.dev/opus-5-5/kureshirfan-386691/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kureshirfan-386691/remake.mp4"}, {"n": 215, "c": "explainer", "t": ["canvas"], "a": "AmberPromptai", "p": "Tried Opus 5.5 to explain the Mid-Autumn Festival 🌕\n\nFrom ancient traditions to mooncakes and family reunions, I turned the story into a short animated video.\nThe message is simple: No matter how far apart we are, make time for the people we miss.\n\nWhat do you think of the result?", "img": "https://media.skillry.dev/opus-5-5/amberpromptai-345137/original.e6e83e9405.webp", "post": "https://x.com/AmberPromptai/status/2103793821012345137", "v": true, "card": "https://media.skillry.dev/opus-5-5/amberpromptai-345137/original-card.fb72ca063e.mp4", "orig": "https://media.skillry.dev/opus-5-5/amberpromptai-345137/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/amberpromptai-345137/remake.mp4"}, {"n": 216, "c": "explainer", "t": ["threejs", "svg", "audio"], "a": "iniyanai", "p": "Asked claude Opus 5.5 to make an explainer on how a mechanical keyboard works.\n\nIt wrote the music in code, used real switch recordings as the beats, built the 3D in @threejs  and timed every cut to the beat.\n\nNo stock footage. no editing app.\n\nWhat a time to be alive!", "img": "https://media.skillry.dev/opus-5-5/iniyanai-856596/original.2c3bb7862b.webp", "post": "https://x.com/iniyanai/status/2103814603100856596", "v": true, "card": "https://media.skillry.dev/opus-5-5/iniyanai-856596/original-card.fd512bd4c8.mp4", "orig": "https://media.skillry.dev/opus-5-5/iniyanai-856596/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/iniyanai-856596/remake.mp4"}, {"n": 217, "c": "explainer", "t": ["threejs", "shader"], "a": "Acoramaa", "p": "I TRIED MAKING A 3D MOTION GRAPHIC WITH CLAUDE OPUS 5.5. THIS IS WHAT CAME OUT.\n\nThe idea was simple: start at my desk and don't stop zooming until we hit a single atom inside the CPU.\n\nOpus 5.5 took it and just kept going.\n\nInto the PC case. The cooler lifts off. The CPU under it. The metal lid comes off. Then the silicon die, one core, the copper wiring stacked on top, rows of logic cells, the fins and gates of the transistors…\n\n…all the way down to one silicon atom, bonded to its four neighbours.\n\nOne continuous shot, no cuts. The ruler on the right tracks the scale the whole time: from about a metre down to about 2 nanometres.\n\nAnd the part that still gets me: every frame of this is 3D rendered right in a browser, from code. No Blender, no After Effects, no stock footage.\n\nA year ago this would have been a studio job. Now it's one conversation.\n\nOpus 5.5 is on another level.", "img": "https://media.skillry.dev/opus-5-5/acoramaa-053577/original.0451b762fc.webp", "post": "https://x.com/Acoramaa/status/2103833991879053577", "v": true, "card": "https://media.skillry.dev/opus-5-5/acoramaa-053577/original-card.355244904f.mp4", "orig": "https://media.skillry.dev/opus-5-5/acoramaa-053577/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/acoramaa-053577/remake.mp4"}, {"n": 218, "c": "explainer", "t": ["threejs", "shader", "canvas", "particles"], "a": "kgonia7", "p": "From Cabo da Roca to observable universe.\n\nI gave opus 5.5 old prompt I prepared for Fable but I was not satisfied with the results. I asked model to create a cinematic film that zooms out from a hillside on Earth to the full observable universe using @threejs No external assets. \n\nTime: ~3h\nOutput tokens: 662,769\nCache: 125.6M read, 2.0M written; \nAPI-equivalent cost: about $54.52: output $13.26, cache reads $25.12, cache writes $16.14", "img": "https://media.skillry.dev/opus-5-5/kgonia7-746268/original.cf9edbb73f.webp", "post": "https://x.com/kgonia7/status/2103835848575746268", "v": true, "card": "https://media.skillry.dev/opus-5-5/kgonia7-746268/original-card.07fa2aefeb.mp4", "orig": "https://media.skillry.dev/opus-5-5/kgonia7-746268/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kgonia7-746268/remake.mp4"}, {"n": 219, "c": "explainer", "t": ["threejs", "shader", "audio"], "a": "NathanWilbanks_", "p": "I asked opus 5.5 in @agnt_gg for the most realistic fire it could build using ONLY javascript.\n\nIt wrote a real 3D fluid simulation that runs on the GPU. The flame colors come from blackbody physics, the smoke is real volume, it runs at 96 fps in 1080p, and it critiqued its own renders about 40 times.\n\nThen it shot a 38 second film of it. The sound comes from the fire itself. 🔥\n\nDetails:\n\n- Nothing faked. The fire is actual simulated gas that burns, heats up, rises, and swirls. It gives off soot that glows, and the soot that escapes cools into smoke. Every frame is computed on the GPU.\n\n- The AI graded its own work: render a frame, have a vision model pick it apart like a VFX supervisor, fix it, repeat. It caught a flame that kept dying, ring shaped artifacts on the ground, and coals that looked like cheese chips.\n\n- The film isn't screen recorded. Each frame is rendered offline with scripted camera moves. The crackle and roar come from how brightly the fire burns in each frame.\n\n- No Blender, no stock footage, no sound library. One HTML file, one conversation.", "img": "https://media.skillry.dev/opus-5-5/nathanwilbanks-981110/original.5401acd5a9.webp", "post": "https://x.com/NathanWilbanks_/status/2103881538592981110", "v": true, "card": "https://media.skillry.dev/opus-5-5/nathanwilbanks-981110/original-card.a55abd6d9a.mp4", "orig": "https://media.skillry.dev/opus-5-5/nathanwilbanks-981110/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nathanwilbanks-981110/remake.mp4"}, {"n": 220, "c": "explainer", "t": ["canvas", "audio"], "a": "hunzai", "p": "//Like most of you//  I asked opus 5.5 (medium) to generate animation to explain \"Tree as an ecosystem\" with AUDIO - no fancy prompts just oneliner prompt - and it created this", "img": "https://media.skillry.dev/opus-5-5/hunzai-842605/original.1985905104.webp", "post": "https://x.com/hunzai/status/2103904436141842605", "v": true, "card": "https://media.skillry.dev/opus-5-5/hunzai-842605/original-card.fef3a3ac98.mp4", "orig": "https://media.skillry.dev/opus-5-5/hunzai-842605/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/hunzai-842605/remake.mp4", "b": ["Природный процесс со звуком", "Дерево как экосистема: потоки воды и энергии.", "Круговорот воды, энергия, тепловые машины."]}, {"n": 221, "c": "explainer", "t": ["threejs", "shader"], "a": "konstantinsaifo", "p": "I asked Claude Opus 5.5 to explain how a rocket engine works by building an interactive Raptor 3 you can take apart in your browser.\n\nCut it open, follow the oxygen and the methane through both turbopumps, then throttle it and watch the shock diamonds move.\n\nhttp://airsup.ai/rocket-engine", "img": "https://media.skillry.dev/opus-5-5/konstantinsaifo-501736/original.732cb71569.webp", "post": "https://x.com/konstantinsaifo/status/2104094723887501736", "v": true, "card": "https://media.skillry.dev/opus-5-5/konstantinsaifo-501736/original-card.8af4f54a56.mp4", "orig": "https://media.skillry.dev/opus-5-5/konstantinsaifo-501736/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/konstantinsaifo-501736/remake.mp4", "b": ["Машина в разрезе 3D", "Ракетный двигатель разбирается на части, видно потоки.", "Как устроены двигатель, турбина, ракета."]}, {"n": 222, "c": "explainer", "t": ["canvas", "audio"], "a": "Rakhsh_Tech", "p": "Claude Opus 5.5 で、ドパガキ用のグラフィックの動画作りが流行っているので、物理演算で落ち着いた音づくりにも挑戦してみました。\n\n弦、笛、太鼓、鈴、水の泡。物理演算できる音をコードにして鳴らしています。映像作りだけではありません。音の表現にも一段工夫を凝らしたい。そんな人はチャレンジしてみる価値があると思います。\n\nグラフィックの動画を作っている人は、ひと味違うサウンドエフェクトも試してみてはどうでしょうか。\n\n#ClaudeCode #物理演算 #Opus", "img": "https://media.skillry.dev/opus-5-5/rakhsh-tech-544921/original.6b83d6b15f.webp", "post": "https://x.com/Rakhsh_Tech/status/2104144532644544921", "v": true, "card": "https://media.skillry.dev/opus-5-5/rakhsh-tech-544921/original-card.b8eaecebee.mp4", "orig": "https://media.skillry.dev/opus-5-5/rakhsh-tech-544921/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/rakhsh-tech-544921/remake.mp4"}, {"n": 223, "c": "explainer", "t": ["svg", "gsap", "audio"], "a": "arthurkatcher", "p": "I asked Opus 5.5 to explain how a coding agent works in 40 seconds.\n\nnever been this shocked. It animated the whole thing, wrote the music, and landed every cut on the beat.\n\none message in Claude Code, 14 minutes. Workflow is in the comments 👇", "img": "https://media.skillry.dev/opus-5-5/arthurkatcher-604161/original.8a0b791f56.webp", "post": "https://x.com/arthurkatcher/status/2104198927549604161", "v": true, "card": "https://media.skillry.dev/opus-5-5/arthurkatcher-604161/original-card.ef1ebfc574.mp4", "orig": "https://media.skillry.dev/opus-5-5/arthurkatcher-604161/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/arthurkatcher-604161/remake.mp4"}, {"n": 224, "c": "explainer", "t": ["svg", "gsap", "css"], "a": "moguzbulbul", "p": "I was struggling to explain my UX decisions in interviews, so I made this kind of animation with Opus 5.5\n\nAnyone want the skill?", "img": "https://media.skillry.dev/opus-5-5/moguzbulbul-215591/original.eba9995641.webp", "post": "https://x.com/moguzbulbul/status/2104206095313215591", "v": true, "card": "https://media.skillry.dev/opus-5-5/moguzbulbul-215591/original-card.ddaa1546d1.mp4", "orig": "https://media.skillry.dev/opus-5-5/moguzbulbul-215591/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/moguzbulbul-215591/remake.mp4"}, {"n": 225, "c": "explainer", "t": ["threejs", "shader", "canvas"], "a": "irinatoxi", "p": "Opus 5.5 just turned a smartphone into a 20-second trip from glass to atoms.\n\nIt starts on the phone, dives through the motherboard and chip, then keeps going through the semiconductor structure until you’re basically staring at the atomic scale.\n\nThis is the kind of 3D shot that normally looks like a whole studio touched it.\n\nInstead, Opus 5.5 built the sequence.\n\nThat’s fucking ridiculous.", "img": "https://media.skillry.dev/opus-5-5/irinatoxi-962937/original.fcdcece49a.webp", "post": "https://x.com/irinatoxi/status/2104212841657962937", "v": true, "card": "https://media.skillry.dev/opus-5-5/irinatoxi-962937/original-card.4cb0cda303.mp4", "orig": "https://media.skillry.dev/opus-5-5/irinatoxi-962937/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/irinatoxi-962937/remake.mp4"}, {"n": 226, "c": "explainer", "t": ["threejs", "shader"], "a": "konstantinsaifo", "p": "I asked Claude Opus 5.5 to explain how a fusion reactor works by building one you can take apart in your browser.\n\nDrag the plasma from 15 million °C, the heat of the Sun's core, to 150 million and watch a city light up.\n\nhttps://airsup.ai/lab", "img": "https://media.skillry.dev/opus-5-5/konstantinsaifo-587629/original.0fec7489d9.webp", "post": "https://x.com/konstantinsaifo/status/2104216976801587629", "v": true, "card": "https://media.skillry.dev/opus-5-5/konstantinsaifo-587629/original-card.c20a3afb6e.mp4", "orig": "https://media.skillry.dev/opus-5-5/konstantinsaifo-587629/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/konstantinsaifo-587629/remake.mp4"}, {"n": 227, "c": "explainer", "t": ["threejs", "shader", "canvas"], "a": "StefanoStraus", "p": "I asked Opus 5.5 again for an engine you can take apart in the browser\n\nPistons against magnets at the same shaft speed. Push the RPM, open the cylinders, slow time down to 1/10\n\nUnder 15 minutes, and it did not even move the usage meter on my Max plan. The first experiment took half an hour, this one reused the framework the earlier ones built\n\nThis is a screen recording, the real thing runs live in your browser\n\nNext I want to find where it breaks, so a game is coming", "img": "https://media.skillry.dev/opus-5-5/stefanostraus-971191/original.f474cd1709.webp", "post": "https://x.com/StefanoStraus/status/2104236916316971191", "v": true, "card": "https://media.skillry.dev/opus-5-5/stefanostraus-971191/original-card.ab11b6ad6e.mp4", "orig": "https://media.skillry.dev/opus-5-5/stefanostraus-971191/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/stefanostraus-971191/remake.mp4"}, {"n": 228, "c": "3d", "t": ["shader", "webgl", "canvas", "audio"], "a": "DemitiyaGeekzen", "p": "opus5.5有点强，我让它自由选题做交互页面和视频，\n提示词：用你最强的思维和能力，根据对我的了解，自行寻找我可能喜欢的主题，制作一个30s的视频还有互动html，尽可能的展示你的前端能力！\n它的选题思路：滕王阁·中秋夜。 今天（2026-09-25）正好是丙午年八月十五。所以我选了《滕王阁序》里最有画面感的那句：\"落霞与孤鹜齐飞，秋水共长天一色\"。短片是船上视角：落日时一只孤鹜飞过太阳，天上是鱼鳞云，然后江天一色，楼阁由下往上亮起灯，满月从东边升起，江面上漂着河灯，诗句以竖排书法字幕配印章出现。\n\n前端做的更牛，但是这里没法放！\n画面：整幅画面由一个 WebGL2 着色器逐像素算出来，没有用任何图片。包括天空的暮色层次、按南昌纬度推算的日月轨迹、程序生成的鱼鳞云、9 组波浪叠加的江面倒影，以及用 Canvas 2D 画出来的滕王阁立面。\n声音：全部用 WebAudio 实时合成，没有一段录音。古筝用 Karplus-Strong 弦振动模型，带按滑和揉弦；另有箫、江水声、虫鸣和混响。\n自由观赏模式：可以拖动环视和缩放，拖时间轴改变时辰；点江面放河灯，会弹出一句诗、响一声古筝；点月亮进入月面特写；还能切换查看渲染图层，或者在网页里直接录制视频。", "img": "https://media.skillry.dev/opus-5-5/demitiyageekzen-818523/original.98a29178a6.webp", "post": "https://x.com/DemitiyaGeekzen/status/2103517910274818523", "v": true, "card": "https://media.skillry.dev/opus-5-5/demitiyageekzen-818523/original-card.d511306024.mp4", "orig": "https://media.skillry.dev/opus-5-5/demitiyageekzen-818523/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/demitiyageekzen-818523/remake.mp4"}, {"n": 229, "c": "3d", "t": ["canvas", "audio"], "a": "gmgmgm1545", "p": "我让 @claudeai Opus 5.5 制讲一只机械寄居蟹在深海追一束光，追到最后发现，发现那束光其实一直在自己手里的动画视频。    \n\n没用任何视频生成AI，纯靠写代码画出来的——\n角色、镜头、转场、音乐全是程序渲染的。\n\n看完了。感觉能做到这个程度还是很可以的！", "img": "https://media.skillry.dev/opus-5-5/gmgmgm1545-245507/original.e3e9b589f2.webp", "post": "https://x.com/gmgmgm1545/status/2103793820815245507", "v": true, "card": "https://media.skillry.dev/opus-5-5/gmgmgm1545-245507/original-card.8665c1d285.mp4", "orig": "https://media.skillry.dev/opus-5-5/gmgmgm1545-245507/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/gmgmgm1545-245507/remake.mp4"}, {"n": 230, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "jarvis11x", "p": "刷到很多用opus 5.5生成的酷炫视频\n\n为啥我用opus 生成的视频满满的像素感\n\n大家都是怎么生成的？", "img": "https://media.skillry.dev/opus-5-5/jarvis11x-544635/original.4f637f3ce2.webp", "post": "https://x.com/jarvis11x/status/2103816821782544635", "v": true, "card": "https://media.skillry.dev/opus-5-5/jarvis11x-544635/original-card.c0296cd41b.mp4", "orig": "https://media.skillry.dev/opus-5-5/jarvis11x-544635/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/jarvis11x-544635/remake.mp4"}, {"n": 231, "c": "3d", "t": ["threejs", "shader"], "a": "KeWai386772", "p": "最近用 GPT 6 Astra、Opus 5.5 做了一堆 web 3d 的项目，游戏、室内、Fx、文旅、整活的都有尝试hh\n\n我把这些项目的全部工作流与prompt都整合到了线上的workplace里，之后也会持续更新，感兴趣的朋友可以收藏一波hh", "img": "https://media.skillry.dev/opus-5-5/kewai386772-276947/original.c4b025fb8b.webp", "post": "https://x.com/KeWai386772/status/2103821018947276947", "v": true, "card": "https://media.skillry.dev/opus-5-5/kewai386772-276947/original-card.112a9c85aa.mp4", "orig": "https://media.skillry.dev/opus-5-5/kewai386772-276947/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kewai386772-276947/remake.mp4"}, {"n": 232, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "NFT_Chen", "p": "✨审美绝了！Opus 5.5 用 Three.js 把宫崎骏《红猪》经典空战复刻出来了！\n\n只给了这一句prompt:\n\n「用 web3D 复刻宫崎骏《红猪》日落海面上的经典空战：白绿红涂装战斗机、紫色积云、海面反光、吉卜力运镜，画面写 just breathe.」\n\n建模、配色、云层、尾迹和镜头全部一次对齐，审美直接封神。\n\n#Opus5_5 #宫崎骏 #红猪 #ThreeJS #Web3D #AIGC #vibecoding #审美天花板 #3D #AI #Dario #Anthropic\n\nhttps://x.com/nft_chen/status/2103401780117938683?s=46", "img": "https://media.skillry.dev/opus-5-5/nft-chen-350878/original.f856902000.webp", "post": "https://x.com/NFT_Chen/status/2103882415299350878", "v": true, "card": "https://media.skillry.dev/opus-5-5/nft-chen-350878/original-card.0f5777d1a6.mp4", "orig": "https://media.skillry.dev/opus-5-5/nft-chen-350878/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nft-chen-350878/remake.mp4"}, {"n": 233, "c": "3d", "t": ["shader", "webgl"], "a": "0xSolty", "p": "i asked opus 5.5 to build me a planet.\n\nnot a picture of a planet. a whole planet.\n\nit wrote a single html file. no libraries, no images, no 3d models. every ocean, every mountain and every city light is math, generated live in your browser.\n\nthen i started playing with it.\n\ndrag it and it spins. raise the sea level and watch continents drown. move the sun and watch the cities switch on at night.\n\nhit \"new planet\" and it invents a new world. it even names it.\n\na year ago this was a semester project for a graphics student.\n\nnow it's a prompt.", "img": "https://media.skillry.dev/opus-5-5/0xsolty-735200/original.005131563c.webp", "post": "https://x.com/0xSolty/status/2102888414219735200", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xsolty-735200/original-card.9e5277a74a.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xsolty-735200/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xsolty-735200/remake.mp4", "b": ["Живая планета", "Земля целиком из кода: океаны, горы, огни городов.", "Смена сезонов, приливы, вращение Земли."]}, {"n": 234, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "CurieuxExplorer", "p": "I asked Opus 5.5 to generate a realistic 3D model of the Taj Mahal\n\nDome, minarets, marble inlay, even the foundations.\n\nOne prompt ⤵️ One HTML file.", "img": "https://media.skillry.dev/opus-5-5/curieuxexplorer-272483/original.7984edea63.webp", "post": "https://x.com/CurieuxExplorer/status/2103038625483272483", "v": true, "card": "https://media.skillry.dev/opus-5-5/curieuxexplorer-272483/original-card.459baaa152.mp4", "orig": "https://media.skillry.dev/opus-5-5/curieuxexplorer-272483/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/curieuxexplorer-272483/remake.mp4"}, {"n": 235, "c": "3d", "t": ["threejs", "canvas"], "a": "myonisto", "p": "Claude Opus 5.5 just one-shotted an entire 3D virtual studio in Blender.\n\nWe used to sell studios like this on Envato. Built in After Effects + Element 3D, each one took our team months.\n\nThis took one prompt.\n\n@claudeai @AnthropicAI @alexalbert__ @bcherny", "img": "https://media.skillry.dev/opus-5-5/myonisto-923578/original.40f2d71663.webp", "post": "https://x.com/myonisto/status/2103082459503923578", "v": true, "card": "https://media.skillry.dev/opus-5-5/myonisto-923578/original-card.a9fc2d5d19.mp4", "orig": "https://media.skillry.dev/opus-5-5/myonisto-923578/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/myonisto-923578/remake.mp4"}, {"n": 236, "c": "3d", "t": ["threejs", "shader"], "a": "truenyl", "p": "Claude Opus 5.5 is absurdly good at 3D.\n\nI reran one of my recent 3D experiments with Claude Opus 5.5.\n\nSame prompt, same references, same real-world scene I had previously built with GPT-6 Astra.\n\nThe result was much better than I expected.\n\nPut simply, for this specific use case, Claude Opus 5.5 was a clear win for me.\n\nThe biggest differences for me were instruction following and taste.\n\nWith the same references, Opus 5.5 got much closer to the Zelda Breath of the Wild-style look I was aiming for.\n\nThe layout felt more intentional.\n\nIt picked better camera angles.\n\nAsset placement made more sense.\n\nAnd I spent much less time fixing basic mistakes.\n\nIn my Astra version, I had to repeatedly correct things like tree roots not touching the ground, rough geometry being used where proper assets already existed, or objects being placed in ways that just looked wrong.\n\nOpus 5.5 got much more of this right on its own.\n\nThe interesting part for me is that I have almost zero real 3D skills.\n\nI mostly give references, look at the result, explain what feels wrong, and keep iterating.\n\nWith better instruction following and visual judgment, that loop becomes dramatically easier.\n\nStill plenty to improve, especially indoors.\n\nNext test is whether I can recreate the interior of the house with the same level of quality.", "img": "https://media.skillry.dev/opus-5-5/truenyl-447745/original.4c323ecff9.webp", "post": "https://x.com/truenyl/status/2103086316137447745", "v": true, "card": "https://media.skillry.dev/opus-5-5/truenyl-447745/original-card.43d1d3a50a.mp4", "orig": "https://media.skillry.dev/opus-5-5/truenyl-447745/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/truenyl-447745/remake.mp4"}, {"n": 237, "c": "3d", "t": ["threejs", "canvas"], "a": "builtbysketch", "p": "OK so Opus 5.5 SMOKED GPT Astra at 3d modelling this stadium from old plans and reference pics\n\nThis was a near one shot. 1000x better than Astras one shot (check reply for Astra’s one shot)\n\nI gave them the same prompt and the exact same reference plans 👇🏻", "img": "https://media.skillry.dev/opus-5-5/builtbysketch-114092/original.bb0c4437a7.webp", "post": "https://x.com/builtbysketch/status/2103105938853114092", "v": true, "card": "https://media.skillry.dev/opus-5-5/builtbysketch-114092/original-card.432a65b182.mp4", "orig": "https://media.skillry.dev/opus-5-5/builtbysketch-114092/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/builtbysketch-114092/remake.mp4"}, {"n": 238, "c": "3d", "t": ["threejs", "canvas", "svg"], "a": "per_simmons_", "p": "Opus 5.5 building a website for a drink brand.\n\n-It generated all the svgs\n-Built the can in 3D\n-Painted its own labels and then rendered those to make product photo variations \n\nAll this in a single (albeit, beefy) prompt", "img": "https://media.skillry.dev/opus-5-5/per-simmons-944727/original.1caf9a7fe5.webp", "post": "https://x.com/per_simmons_/status/2103208157308944727", "v": true, "card": "https://media.skillry.dev/opus-5-5/per-simmons-944727/original-card.2f6416ba17.mp4", "orig": "https://media.skillry.dev/opus-5-5/per-simmons-944727/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/per-simmons-944727/remake.mp4"}, {"n": 239, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "NicolaManzini", "p": "Opus 5.5 does a great job in eval of GLSL (OpenGL Shading Language) in threejs.\nThe prompt here is roughly. A fishbowl with reflection, refraction and water caustics.\n\nCheck it out yourself! And compare it to other models\nhttps://threejseval.com/gallery?eval=fishtank", "img": "https://media.skillry.dev/opus-5-5/nicolamanzini-156628/original.586c93d39d.webp", "post": "https://x.com/NicolaManzini/status/2103499771206156628", "v": true, "card": "https://media.skillry.dev/opus-5-5/nicolamanzini-156628/original-card.22291b55af.mp4", "orig": "https://media.skillry.dev/opus-5-5/nicolamanzini-156628/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/nicolamanzini-156628/remake.mp4"}, {"n": 240, "c": "3d", "t": ["threejs", "shader"], "a": "0xWast3", "p": "Opus 5.5 turned one sentence into a 3D system that opens in Blender, rigged, textured and ready to animate.\n\nIt does not render the object. It constructs it, part by part, the way a modeller would if they had a week.\n\n> PARSE - the sentence becomes a parts list with real dimensions, nothing implied\n> MASS - each part built as clean geometry, quads only, no sculpted mush\n> RIG - joints and pivots placed where the object physically bends\n> SKIN - materials assigned per surface, scale and roughness set separately\n> PACK - exported with a named hierarchy, so a human can edit one part\n\nImage models stop at the render. What you get is a photograph of a thing that does not exist as a thing.\n\nThat gap appears the second someone wants to move an arm, swap a material, or send it to a printer.\n\nRigging is what nobody automates. Without pivots you have a statue, and a statue cannot be a system.\n\nTopology beats detail every time. A dense mesh looks stunning in a screenshot and folds the moment it deforms.\n\nNames carry through the whole export. Every part, joint and material reads the way a person would label it.\n\nStudios burn days on modelling and cleanup before anyone gets to the creative part of the job.\n\nThe prompt format and what each stage returns are laid out underneath.", "img": "https://media.skillry.dev/opus-5-5/0xwast3-222104/original.b6a9fc9ea7.webp", "post": "https://x.com/0xWast3/status/2103513328077222104", "v": true, "card": "https://media.skillry.dev/opus-5-5/0xwast3-222104/original-card.6c87cd6f01.mp4", "orig": "https://media.skillry.dev/opus-5-5/0xwast3-222104/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/0xwast3-222104/remake.mp4"}, {"n": 241, "c": "3d", "t": ["threejs"], "a": "wzarok", "p": "threejs (@threejs) + Claude Code Opus 5.5\ntek prompt ve çıktı", "img": "https://media.skillry.dev/opus-5-5/wzarok-283635/original.fad231410a.webp", "post": "https://x.com/wzarok/status/2103530789510283635", "v": true, "card": "https://media.skillry.dev/opus-5-5/wzarok-283635/original-card.453e0239b3.mp4", "orig": "https://media.skillry.dev/opus-5-5/wzarok-283635/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/wzarok-283635/remake.mp4"}, {"n": 242, "c": "3d", "t": ["threejs", "canvas", "svg", "gsap"], "a": "goofyninjaaa", "p": "Esta app probó 3,932 posiciones de una cama matrimonial hasta encontrar dónde cabe.\n\nLa hizo Claude Opus 5.5 con un prompt mío: cuarto de 3.00 x 3.40 m, puerta de 80 cm, un clóset de 1.20 x 0.60 y la cama de 1.40 x 1.90.\n\nArmó el plano a escala y el cuarto en 3D al lado, y los dos se mueven juntos.\n\nSi la cama choca con el clóset, no deja abrir la puerta o te deja menos de 60 cm para pasar, te avisa.\n\nSolo 108 posiciones no tenían ningún problema. La mejor deja 70 cm para pasar por cada lado.\n\nTardó 47 minutos, más 5 para pasarla a inglés, y no le corregí nada.\n\nPara una mudanza, esto dice más que cualquier benchmark.", "img": "https://media.skillry.dev/opus-5-5/goofyninjaaa-315331/original.a81faae533.webp", "post": "https://x.com/goofyninjaaa/status/2103540288136315331", "v": true, "card": "https://media.skillry.dev/opus-5-5/goofyninjaaa-315331/original-card.57efaf4cf3.mp4", "orig": "https://media.skillry.dev/opus-5-5/goofyninjaaa-315331/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/goofyninjaaa-315331/remake.mp4"}, {"n": 243, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "FriskyGGG", "p": "Opus 5.5 is good at 3d motion too apparantely", "img": "https://media.skillry.dev/opus-5-5/friskyggg-054427/original.1ed591fd50.webp", "post": "https://x.com/FriskyGGG/status/2103766565389054427", "v": true, "card": "https://media.skillry.dev/opus-5-5/friskyggg-054427/original-card.95b84c5d0d.mp4", "orig": "https://media.skillry.dev/opus-5-5/friskyggg-054427/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/friskyggg-054427/remake.mp4"}, {"n": 244, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "ai_ba_reza", "p": "Claude Opus 5.5 یه انیمیشن 3D دیوونه‌کننده ساخته\n\nاز دیتاسنتر شروع می‌شه، وارد سرور می‌شه، کارت گرافیک رو باز می‌کنه، داخل چیپ می‌ره، از مدار و ترانزیستور رد می‌شه و تا اتم سیلیکون می‌رسه.\nهمه‌ش توی یک فایل HTML واحد اجرا می‌شه و حدود ۱ ساعت طول کشیده.", "img": "https://media.skillry.dev/opus-5-5/ai-ba-reza-113363/original.c61a87e9e2.webp", "post": "https://x.com/ai_ba_reza/status/2103792451551113363", "v": true, "card": "https://media.skillry.dev/opus-5-5/ai-ba-reza-113363/original-card.41b7fee118.mp4", "orig": "https://media.skillry.dev/opus-5-5/ai-ba-reza-113363/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ai-ba-reza-113363/remake.mp4"}, {"n": 245, "c": "3d", "t": ["threejs", "shader", "svg", "particles"], "a": "Souradip3000", "p": "Opus 5.5 is mind boggling. \n\nIt created this 3D website from just one prompt. \n\nTold it to create a website for forest conservation agency with pinterest post as reference for 3D animation.\n\nIt one shotted into a single html file.", "img": "https://media.skillry.dev/opus-5-5/souradip3000-800291/original.e220fd0da1.webp", "post": "https://x.com/Souradip3000/status/2103876499262800291", "v": true, "card": "https://media.skillry.dev/opus-5-5/souradip3000-800291/original-card.63c52b319a.mp4", "orig": "https://media.skillry.dev/opus-5-5/souradip3000-800291/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/souradip3000-800291/remake.mp4"}, {"n": 246, "c": "3d", "t": ["threejs", "shader"], "a": "techartist_", "p": "I wanted to see if beautiful destinations could become playable 3D experiences. Annecy, France became the prototype: a boat journey through canals, bridges, waterfront, and the mountain lake, built with Claude Opus 5.5 using Three.js + TSL.\n\nI trimmed the navigation footage for the sake of keeping the video short and the post below below has a slightly longer version. The whole workflow behind this is simple:-\n- Explained the concept to Opus and asked it to list some ideas.\n- Shortlisted one and asked it to generate a prompt, with tech stack directions.\n- Thats it, needed few iterations and is still a work in progress with few issues needing ironing. \n- The audio effects were added by Opus itself.", "img": "https://media.skillry.dev/opus-5-5/techartist-786274/original.701c9b781e.webp", "post": "https://x.com/techartist_/status/2103933640392786274", "v": true, "card": "https://media.skillry.dev/opus-5-5/techartist-786274/original-card.4ea800f7b7.mp4", "orig": "https://media.skillry.dev/opus-5-5/techartist-786274/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/techartist-786274/remake.mp4"}, {"n": 247, "c": "3d", "t": ["threejs"], "a": "lribes4", "p": "New Black Clover chapters are on the way and Opus 5.5 just dropped, so I put it to the test:\n\nA 3D diorama of the Black Bulls hideout, made with Opus 5.5 + three.js\n\nEvery visitor is a floating mana light, come say hi to Nero 👋\nhttps://ribes.cc/hideout/\n\n#BlackClover #threejs", "img": "https://media.skillry.dev/opus-5-5/lribes4-742305/original.fedd7ec10e.webp", "post": "https://x.com/lribes4/status/2103938636173742305", "v": true, "card": "https://media.skillry.dev/opus-5-5/lribes4-742305/original-card.2a64830829.mp4", "orig": "https://media.skillry.dev/opus-5-5/lribes4-742305/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/lribes4-742305/remake.mp4"}, {"n": 248, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "eigeorguy", "p": "Opus 5.5 put London in a snow globe\n\n🕰 Elizabeth Tower with lit clock faces\n🚌 Red double-decker\n🚕 Black cab at a zebra crossing\n☎️ Phone box\n🍂 Leaves that swirl when you shake the phone\n\n~700 lines of Swift. No 3D files.", "img": "https://media.skillry.dev/opus-5-5/eigeorguy-813651/original.300b6492b6.webp", "post": "https://x.com/eigeorguy/status/2103992442072813651", "v": true, "card": "https://media.skillry.dev/opus-5-5/eigeorguy-813651/original-card.dbfce00a1a.mp4", "orig": "https://media.skillry.dev/opus-5-5/eigeorguy-813651/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/eigeorguy-813651/remake.mp4"}, {"n": 249, "c": "3d", "t": ["threejs", "canvas", "svg"], "a": "kum1ta", "p": "I gave my Claude Code sessions an office.\n\nWorkspace turns each session into a desk in a 3D office: see who's working, who's done and who needs you, jump into any terminal, and let them work together.\nOpen source, built entirely with @claudeai Opus 5.5.", "img": "https://media.skillry.dev/opus-5-5/kum1ta-740521/original.f0b761b01c.webp", "post": "https://x.com/kum1ta/status/2103998389058740521", "v": true, "card": "https://media.skillry.dev/opus-5-5/kum1ta-740521/original-card.0cd91119fb.mp4", "orig": "https://media.skillry.dev/opus-5-5/kum1ta-740521/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/kum1ta-740521/remake.mp4"}, {"n": 250, "c": "3d", "t": ["threejs", "canvas", "svg"], "a": "VectorCrossProd", "p": "Claude Opus 5.5 continues to amaze me. Claude Opus 5.5 created a 3D printable enclosure for an existing PCB.  Then it created this promo video for it. \nThe PCB, the printable STLs and this animation are 100% just from prompting in Claude Code.", "img": "https://media.skillry.dev/opus-5-5/vectorcrossprod-436573/original.d72e641c0b.webp", "post": "https://x.com/VectorCrossProd/status/2104093497561436573", "v": true, "card": "https://media.skillry.dev/opus-5-5/vectorcrossprod-436573/original-card.2f287cc4d3.mp4", "orig": "https://media.skillry.dev/opus-5-5/vectorcrossprod-436573/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/vectorcrossprod-436573/remake.mp4"}, {"n": 251, "c": "3d", "t": ["threejs", "shader"], "a": "sanjay_khadka07", "p": "Latentown just went 3D 🏙️\n\nThe pixel town grew into a living city of AI news. Every story is a building, every lab has a tower, and couriers carry the day's news across the river.\n\nBuilt over a weekend with Claude Code + Opus 5.5 and three.js.\n\nhttps://latentown.lol", "img": "https://media.skillry.dev/opus-5-5/sanjay-khadka07-620029/original.3e88be264f.webp", "post": "https://x.com/sanjay_khadka07/status/2104102479927620029", "v": true, "card": "https://media.skillry.dev/opus-5-5/sanjay-khadka07-620029/original-card.5cf4b9ca70.mp4", "orig": "https://media.skillry.dev/opus-5-5/sanjay-khadka07-620029/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/sanjay-khadka07-620029/remake.mp4"}, {"n": 252, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "ksmialowski", "p": "Rok temu próbowałem zrobić grę 3D z Opusem 4.1 - zrzut ekranu, jak to wtedy wyglądało, wrzucę w komentarzu. \n\nZobaczcie, jak szybko to wszystko idzie do przodu. Minęło tylko 12 miesięcy, a dziś wygląda to tak. Całość zbudowana z modelem Opus 5.5.\n\nhttps://kreatio.pl/brokul", "img": "https://media.skillry.dev/opus-5-5/ksmialowski-473410/original.66cbf5e78b.webp", "post": "https://x.com/ksmialowski/status/2104103109358473410", "v": true, "card": "https://media.skillry.dev/opus-5-5/ksmialowski-473410/original-card.9b7d860e0f.mp4", "orig": "https://media.skillry.dev/opus-5-5/ksmialowski-473410/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ksmialowski-473410/remake.mp4"}, {"n": 253, "c": "3d", "t": ["threejs", "shader", "svg", "audio"], "a": "Acoramaa", "p": "CLAUDE OPUS 5.5 MADE ME A MAGIC EYE.\n\nIt doesn't just look around. It listens.\n\n72 plates wrapped around a mechanical eyeball, a 9-blade iris, a lens that slides out when the bass hits, two rings orbiting it like it's its own little planet.\n\nPlay a track and it comes alive. Every kick flips the plates open. The bass pushes the lens forward. The highs light up the glowing core inside.\n\nWhen the song drops into the breakdown, the eye closes and goes quiet, like it's thinking. Then the drop hits and it blows wide open.\n\nOpus 5.5 listened to the track first, found the tempo, the breakdown and the drop, and built the whole thing around it. Even the panel on the right is live: every slider moves with the music.\n\nAll 3D, all code, rendered right in a browser.\n\nTurn the sound on.", "img": "https://media.skillry.dev/opus-5-5/acoramaa-248467/original.1269745850.webp", "post": "https://x.com/Acoramaa/status/2104145227573248467", "v": true, "card": "https://media.skillry.dev/opus-5-5/acoramaa-248467/original-card.60063da9a3.mp4", "orig": "https://media.skillry.dev/opus-5-5/acoramaa-248467/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/acoramaa-248467/remake.mp4"}, {"n": 254, "c": "3d", "t": ["threejs", "shader", "canvas"], "a": "Maruo_0314", "p": "※デザイナーの仕事がなくなりました。\n\nClaude Opus 5.5に3Dモデルで東京タワーの映像を作らせた結果、5分でこのクオリティをポン出し\n\nPR動画やYouTube動画制作など、複数の案件もこれ一つで全てこなせます。\n\n具体的な作り方は記事で解説↓", "img": "https://media.skillry.dev/opus-5-5/maruo-0314-998343/original.a226de5212.webp", "post": "https://x.com/Maruo_0314/status/2104159752095998343", "v": true, "card": "https://media.skillry.dev/opus-5-5/maruo-0314-998343/original-card.3f866e9ec7.mp4", "orig": "https://media.skillry.dev/opus-5-5/maruo-0314-998343/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/maruo-0314-998343/remake.mp4"}, {"n": 255, "c": "3d", "t": ["threejs", "canvas"], "a": "aayush4soni", "p": "My family is planning to build a house, and all we had was the floor plan. I wanted to see how it would really look once it's built: which colors, layout and design would suit it best.\n\nSo I gave the plan to Claude Opus 5.5 and asked it to create a 3D view of the house.\n\nIt's one of the most useful things I've created recently. We can now walk through the house before a single brick is laid, and when we want to try a different color or layout, I just ask for the change.\n\nIn the video: the hall, room, and the terrace at dusk, all at eye height.\n\nHow it worked:\n\n• I gave it the 5-page floor-plan PDF and one reference image for the front of the house.\n• It read the drawings and rebuilt every floor: walls, doors, windows and stairs.\n• Where a printed size didn't match the drawn wall, it flagged it (15 places) instead of quietly guessing.\n• It furnished every room itself: 500+ pieces of furniture, decor and lighting.\n• Everything runs in a web browser with three.js. No Blender, no game engine. You can walk through it like a game, in daylight or evening light, and the lamps actually light the rooms.\n• It treated it like a real software project: ~37k lines of JavaScript, 185 unit tests, 56 browser tests, and deterministic video capture (render the same frame twice, get identical pixels).\n• It even tracked down a bug of its own: a room's lighting changed depending on which room you walked in from.\n• It split the work across sub-agents. Start to finish took about two days.\n\nMy part was the decisions: what each room is for, the style, and the changes I wanted.", "img": "https://media.skillry.dev/opus-5-5/aayush4soni-644283/original.0f89f331fa.webp", "post": "https://x.com/aayush4soni/status/2104181266459644283", "v": true, "card": "https://media.skillry.dev/opus-5-5/aayush4soni-644283/original-card.845fdda44e.mp4", "orig": "https://media.skillry.dev/opus-5-5/aayush4soni-644283/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/aayush4soni-644283/remake.mp4"}, {"n": 256, "c": "3d", "t": ["threejs", "canvas", "audio"], "a": "allforbigfire", "p": "「もしかしてロボットアニメみたいな3機の乗り物が変形合体してロボットになるシーンもアニメ風3D CGで作れますか。」ってClaude Opus 5.5に聞きました。モデリング、陰影、輪郭線、BGM、効果音まで、全部Python 1ファイル（約1000行）のコードで生成したそうです。 #Claude #動画生成", "img": "https://media.skillry.dev/opus-5-5/allforbigfire-029657/original.7c37feaf29.webp", "post": "https://x.com/allforbigfire/status/2104193522715029657", "v": true, "card": "https://media.skillry.dev/opus-5-5/allforbigfire-029657/original-card.0fdcdd2ac0.mp4", "orig": "https://media.skillry.dev/opus-5-5/allforbigfire-029657/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/allforbigfire-029657/remake.mp4"}, {"n": 257, "c": "3d", "t": ["threejs", "canvas", "svg"], "a": "EWashoku", "p": "Opus 5.5は3Dの製品デモサイトとも相性抜群でした。\nhttps://bicycle.washoku.dev", "img": "https://media.skillry.dev/opus-5-5/ewashoku-201053/original.ff4dab8244.webp", "post": "https://x.com/EWashoku/status/2104211672370201053", "v": true, "card": "https://media.skillry.dev/opus-5-5/ewashoku-201053/original-card.8adcd28cd7.mp4", "orig": "https://media.skillry.dev/opus-5-5/ewashoku-201053/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ewashoku-201053/remake.mp4"}, {"n": 258, "c": "3d", "t": ["threejs", "svg"], "a": "AJtheMongol", "p": "Designed a house as a code with Opus 5.5\n\nOne model -> 14 drawings, 5 engineering calculations, a 3D viewer and a CAD export\n\nConcept only, not stamped\n\nStill wild that one person can do this now", "img": "https://media.skillry.dev/opus-5-5/ajthemongol-318512/original.41ef64da2e.webp", "post": "https://x.com/AJtheMongol/status/2104214187522318512", "v": true, "card": "https://media.skillry.dev/opus-5-5/ajthemongol-318512/original-card.6bdd5e4ee4.mp4", "orig": "https://media.skillry.dev/opus-5-5/ajthemongol-318512/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/ajthemongol-318512/remake.mp4"}, {"n": 259, "c": "interactive", "t": ["threejs", "canvas", "svg", "playable"], "a": "happycapyai", "p": "Opus 5.5 是要上天了吗？一段 prompt 一把帮我复刻了一个泡泡堂！简直是童年经典 💣\n\n无论是游戏机制还是游戏美学我觉得都是足以上架7k7k的程度，关键第一把测试的时候竟然输给了AI npc 🤣\n\n想玩的家人们可以评论告诉我", "img": "https://media.skillry.dev/opus-5-5/happycapyai-634965/original.46d4b5a115.webp", "post": "https://x.com/happycapyai/status/2103057174855634965", "v": true, "card": "https://media.skillry.dev/opus-5-5/happycapyai-634965/original-card.535ed0b938.mp4", "orig": "https://media.skillry.dev/opus-5-5/happycapyai-634965/original.mp4", "rem": "https://media.skillry.dev/opus-5-5/happycapyai-634965/remake.mp4"}, {"n": 260, "c": "interactive", "t": ["threejs", "shader", "canvas"], "a": "mrblock", "p": "opus 5.5 遊戲製作，週末快點來嘗試。", "img": "https://media.skillry.dev/opus-5-5/mrblock-096062/original.95806622a9.w
