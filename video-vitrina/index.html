/3qY-PTqo3iDh6M5i.jpg", "post": "https://x.com/tonka1981jp/status/2103442781096288376", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103442081838768128/vid/avc1/474x270/Dzvw8Ddiv9dqqB2c.mp4", "orig": "https://video.twimg.com/amplify_video/2103442081838768128/vid/avc1/1138x648/ijzhpItLojJoDQm3.mp4", "rem": ""}, {"n": 677, "c": "motion", "t": [], "a": "FumiyaMizuguchi", "p": "このプロダクトを紹介する、ダイナミックな15秒のモーショングラフィックス動画を作成してください。ポートフォリオ用のショーリールのようにあなたの高い技術力を証明できるよう、持てる技術を全力ですべて注ぎ込んでください。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103424790522691584/img/kp-vYIE8ZvSgP0g4.jpg", "post": "https://x.com/FumiyaMizuguchi/status/2103431573752500632", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103424790522691584/vid/avc1/480x270/W4lGd9zwBNcf3LjZ.mp4", "orig": "https://video.twimg.com/amplify_video/2103424790522691584/vid/avc1/1920x1080/ZK-OtAordm6gRnIP.mp4", "rem": ""}, {"n": 678, "c": "motion", "t": [], "a": "enhanced_jp", "p": "あなたがどれほど素晴らしいモーションデザイナーかを示す、ダイナミックな15秒のモーショングラフィックスビデオを作成してください。履歴書用のショーリールのような感じで、全力でやって。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103399144668979200/img/ose-ZOQPzWE6cS08.jpg", "post": "https://x.com/enhanced_jp/status/2103424962350776726", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103399144668979200/vid/avc1/480x270/YYbKu7HW22KKpXmu.mp4", "orig": "https://video.twimg.com/amplify_video/2103399144668979200/vid/avc1/1920x1080/qBU6H4eXvpPCkR_5.mp4", "rem": ""}, {"n": 679, "c": "motion", "t": [], "a": "aiwarts", "p": "所有技术栈也都让 opus5.5 自己列出来！\n\nRemotion 负责画面，Python 负责配乐，最后由 Remotion 调 ffmpeg 合成成片。\n\n画面\n影片工程是 Remotion 4.0.528，这是一个用 React", "img": "https://pbs.twimg.com/amplify_video_thumb/2103419590323924992/img/a97FjWhO9ODoRLfP.jpg", "post": "https://x.com/aiwarts/status/2103419817034428866", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103419590323924992/vid/avc1/320x568/7HakKuRo8p_0bIf6.mp4", "orig": "https://video.twimg.com/amplify_video/2103419590323924992/vid/avc1/1080x1920/mTcgV1Wx4ZV3DD3m.mp4", "rem": ""}, {"n": 680, "c": "motion", "t": [], "a": "aiwarts", "p": "为 https://t.co/MpUyPSxZVk 制作一支 30 秒的网站宣传片，并完成配乐。\n\n你可以读取当前 Mac mini 上的代码和素材，也可以使用浏览器访问 https://t.co/fOQQgAhran。从代码和真实网站自行寻找品牌", "img": "https://pbs.twimg.com/amplify_video_thumb/2103419590323924992/img/a97FjWhO9ODoRLfP.jpg", "post": "https://x.com/aiwarts/status/2103419813263815008", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103419590323924992/vid/avc1/320x568/7HakKuRo8p_0bIf6.mp4", "orig": "https://video.twimg.com/amplify_video/2103419590323924992/vid/avc1/1080x1920/mTcgV1Wx4ZV3DD3m.mp4", "rem": ""}, {"n": 681, "c": "motion", "t": [], "a": "mtvneo_", "p": "make a 15 second motion graphics video. personify yourself in the video as introducing opus 5.5.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103407575614312448/img/2CXvvr8XvwSSKCcp.jpg", "post": "https://x.com/mtvneo_/status/2103407813355819281", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103407575614312448/vid/avc1/480x270/LQ5AM9Xv9DPwkbpq.mp4", "orig": "https://video.twimg.com/amplify_video/2103407575614312448/vid/avc1/1920x1080/WKuXepaeH7Cdrea6.mp4", "rem": ""}, {"n": 682, "c": "explainer", "t": [], "a": "rneayan", "p": "Drop every country's population as marbles. 1 marble = 1 million people.\n+ sound effects\n8,144 marbles. Real 2024 population data.\nEvery clink is synced to a simulated collision.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103400569717346304/img/EQkDl2vfJHpzGBBs.jpg", "post": "https://x.com/rneayan/status/2103400657856417829", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103400569717346304/vid/avc1/320x568/Mp3lIsiM0o0qH1j3.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2103400569717346304/vid/avc1/720x1280/bCCaXscbrAkNzRKB.mp4?tag=14", "rem": ""}, {"n": 683, "c": "interactive", "t": [], "a": "CurieuxExplorer", "p": "Rebuild Type 1 diabetes in one HTML file, from the whole body down to a single molecule.\n\nTHE BROKEN MESSAGE\n\nType 1 diabetes isn't caused by sugar, weight or lifestyle. It's autoimmune: the immune system destroys the beta cells in the pancreas that make insulin.\n\nThose cells live in tiny clusters called islets, about 1–2% of the pancreas. After a meal, they sense rising glucose and release insulin. Insulin signals muscle and fat to take glucose in, and tells the liver to release less.\n\nIn Type 1, that signal disappears.\nThe fuel is still there. The message is missing.\nSo glucose builds up in the blood.\n\nWith almost no insulin, the body breaks down fat fast and the liver makes ketones. They can build up into diabetic ketoacidosis (DKA), a medical emergency.\n\nInsulin therapy doesn't cure Type 1. It replaces a signal the body can no longer provide adequately, through injections or a pump. The daily challenge is balance: too little and glucose rises, too much and it can fall dangerously low. Food, exercise, stress and timing all change the picture.\n\nTechnology helps. A CGM tracks glucose every few minutes, and automated insulin delivery (AID) adjusts insulin based on those readings.\n\nIn the build, you can compare Healthy vs Type 1 vs Type 1 + insulin on the same meal, drag one slider from INTACT to BROKEN to watch the signal fade, follow a glucose molecule through the body, and explore CGM, pumps and AID.\n\nType 1 diabetes changes the system.\nIt doesn't define the person.\n\nBuilt in Three.js. Educational visualization, not medical advice.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103372322401038336/img/FSpplbcHCNnB2H_E.jpg", "post": "https://x.com/CurieuxExplorer/status/2103373314354016717", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103372322401038336/vid/avc1/612x270/059EiJQ0LmldkBqa.mp4", "orig": "https://video.twimg.com/amplify_video/2103372322401038336/vid/avc1/1892x834/2FWfOI-qOA8z_ozO.mp4", "rem": ""}, {"n": 684, "c": "motion", "t": [], "a": "dimoff2000", "p": "I want you to create a highly professional SaaS product launch video for Easy-Peasy AI. Make sure to get actual assets and images and all of that stuff from the internet. Turn it into these typical, very professionally edited, motion-graphics-styled product launch videos that you see people making on Twitter when they launch new SaaS products (which are showing off the features, the benefits, and all of these things). That's all. I have not uploaded any materials.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103372336040927232/img/T3IjpwY7uf0hAJb6.jpg", "post": "https://x.com/dimoff2000/status/2103372924753260969", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103372336040927232/vid/avc1/480x270/j_xKL3EExNV8gAmA.mp4", "orig": "https://video.twimg.com/amplify_video/2103372336040927232/vid/avc1/1920x1080/v4Lch6cxiRGrR0vT.mp4", "rem": ""}, {"n": 685, "c": "interactive", "t": [], "a": "Artless101", "p": "Create a cinematic, highly detailed, interactive 3D rocket launch from an ocean platform at dawn. Deliver the complete project in one HTML file that opens directly in Chrome. Use Three.js + WebGL and procedural assets. Embed assets wherever practical; a reliable CDN may", "img": "https://pbs.twimg.com/amplify_video_thumb/2103303251235831808/img/wyC-py0PpYosTSdr.jpg", "post": "https://x.com/Artless101/status/2103303449831964679", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103303251235831808/vid/avc1/272x270/r1XOCK9iLIgI3wUv.mp4", "orig": "https://video.twimg.com/amplify_video/2103303251235831808/vid/avc1/1088x1080/IwelCBX8lEsaduiA.mp4", "rem": ""}, {"n": 686, "c": "3d", "t": [], "a": "VictorTaelin", "p": "Create an animated sequence that starts in a room, zooms into a MacBook, then into an Apple M4 chip, followed by atoms, and finally quarks. Use HTML and Three.js for rendering.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103299369931821056/img/PtRFNzOdkGpwO0c_.jpg", "post": "https://x.com/VictorTaelin/status/2103299766473875778", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103299369931821056/vid/avc1/432x270/x8qxFahs2j0sVS_T.mp4", "orig": "https://video.twimg.com/amplify_video/2103299369931821056/vid/avc1/1920x1200/SwoDdX93trUwIXxi.mp4", "rem": ""}, {"n": 687, "c": "3d", "t": [], "a": "SammmAing", "p": "Create an animation of building instructions for a real LEGO model of Doctor Doom based on the provided picture. The model should consist of approximately 3,144 pieces, be 46 cm tall, and ensure every piece clicks onto the one below without overlapping or tipping over. Build the mask as a separate sub-assembly snapped onto the face. Animate the assembly process in 850 steps using Three.js in a single web page.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103278050209144832/img/pLmuw8anbJCPLx_l.jpg", "post": "https://x.com/SammmAing/status/2103280356371702076", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103278050209144832/vid/avc1/480x270/ky6jK-OlvD_2yQCH.mp4", "orig": "https://video.twimg.com/amplify_video/2103278050209144832/vid/avc1/3840x2160/A8-Dqc2wgldqCYkY.mp4", "rem": ""}, {"n": 688, "c": "interactive", "t": [], "a": "otatechie", "p": "Animate the moonwalk dance. Draw every frame, the character, the physics of the glide, camera cuts on the beat, and generate an original soundtrack in a single HTML file.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103257209987588096/img/lgaVxn0_c4Y7Onrf.jpg", "post": "https://x.com/otatechie/status/2103257988895035448", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103257209987588096/vid/avc1/320x568/n-aYk6zJJpBeZNvv.mp4", "orig": "https://video.twimg.com/amplify_video/2103257209987588096/vid/avc1/1080x1920/MxHjuGHYOH8xKzaZ.mp4", "rem": ""}, {"n": 689, "c": "motion", "t": [], "a": "DaveRogenmoser", "p": "Make a dope polished 30 second video for our Mackenzie Club fox chase event using whatever tools you think are best. tessaract, etc. it should be all code (that's what people on X are saying). Cool music. Hype video. Use Tessaract or Remotion or whatever you think is best. Make it amazing and interesting.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103247261199147008/img/W6I07-so6PGcLJMx.jpg", "post": "https://x.com/DaveRogenmoser/status/2103249424075899271", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103247261199147008/vid/avc1/320x400/txprfQNZ8Mkjcnx0.mp4", "orig": "https://video.twimg.com/amplify_video/2103247261199147008/vid/avc1/1080x1350/oAwpfXkN6AlWGpqr.mp4", "rem": ""}, {"n": 690, "c": "explainer", "t": [], "a": "RetropunkAI", "p": "Render a fun motion graphic animation using the GSAP animation platform (see below) to show a brief history of The Sphere in Las Vegas from start to today (start with a minimal architecture to completed venue) - Explainer video style - Talk about how bands live page with GSAP animations :", "img": "https://pbs.twimg.com/amplify_video_thumb/2103235968073437184/img/Yl8_SUZolXRQuqnz.jpg", "post": "https://x.com/RetropunkAI/status/2103237991091060898", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103235968073437184/vid/avc1/320x568/SScHCOT_0UlGBWzJ.mp4", "orig": "https://video.twimg.com/amplify_video/2103235968073437184/vid/avc1/1080x1920/cNZmpPCfkjlVWSbT.mp4", "rem": ""}, {"n": 691, "c": "motion", "t": [], "a": "JulianPscheid", "p": "I want you to create a highly professional SaaS product promotion video for Hedy. make sure to get actual assets and images and all of that stuff from the internet. Turn it into these typical, very professionally edited, motion-graphics-styled product launch videos that you see people making on Twitter when they promote SaaS products (which are showing off the features, the benefits, and all of these things).", "img": "https://pbs.twimg.com/amplify_video_thumb/2103197283877892096/img/MbaVJpJT2O-91GEe.jpg", "post": "https://x.com/JulianPscheid/status/2103197385283494027", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103197283877892096/vid/avc1/480x270/eJWjTNtW1jlWszb-.mp4", "orig": "https://video.twimg.com/amplify_video/2103197283877892096/vid/avc1/1920x1080/kRDqpBPkuRWcfBz2.mp4", "rem": ""}, {"n": 692, "c": "motion", "t": [], "a": "pradeepXkapoor", "p": "# PROJECT: \"UNFINISHED\" (未完) — The Unfinished Ronin\nA 90-second, fast-paced, cinematic sumi-e ink film rendered in code, third-person camera\n\n## MISSION\nBuild a 90-second film in which every frame looks like a living Japanese ink painting,\npainted as we", "img": "https://pbs.twimg.com/amplify_video_thumb/2103053510179000320/img/QlmDlT7EHn3aooWb.jpg", "post": "https://x.com/pradeepXkapoor/status/2103176631917641956", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103053510179000320/vid/avc1/480x270/qqGewHKJNi8YlcF6.mp4", "orig": "https://video.twimg.com/amplify_video/2103053510179000320/vid/avc1/1920x1080/rUWEmC2tFkMmBamC.mp4", "rem": ""}, {"n": 693, "c": "3d", "t": [], "a": "AGIOyaZ", "p": "Create a 37-second vertical short film (1080×1920, 30 fps) in three.js, titled \"White Space\".\n\n【Experience】\nWithout showing a single human figure, let viewers physically feel how a life consumed by efficiency loses its light — and how a single empty space lets a richer light pour back in. The climax should make people hold their breath: a world-class stained glass image of the Virgin and two angels projected across a cathedral floor in blazing color.\n\n【Setting】\n- A dim Gothic cathedral interior with one lancet window, 15 m tall and 10 m wide.\n- Strong sunlight enters from outside at 45°, casting the window's image onto the stone floor.\n- Stained glass: an original, symmetric composition in the tradition of 13th-century French cathedral glass — never copy an existing window.\n\n【Stained glass quality bar】\nAim for the level of Chartres or Sainte-Chapelle:\n- Hundreds of small glass pieces, each with its own color variation, streaks, and seed bubbles\n- Grisaille painting on the glass: serene faces with painted eyelids, brows and lips; drapery folds with soft shading; every feather painted with a rachis and barbs\n- Edge matting so each piece glows brighter at its center\n- A deep blue diaper background with ruby rosettes, a jeweled border of alternating colors and pearls\n- The Virgin in a ruby niche under a pointed Gothic arch with crockets, columns and capitals, gold rays radiating behind her halo\n- A multi-ring rose window at the top with stone-like tracery and jewel roundels\n\n【Timeline】\n0–3 s: Colorless white light fills the cathedral.\n3–11 s: Gray cubes engraved with words fly in faster and faster, sealing the window. The room darkens.\n11–14 s: Total darkness and silence.\n14–19 s: Only the \"BUSY\" block falls away, dissolving into sparks. One golden beam enters.\n19–26 s: Blocks cascade away from the first hole. Colored light shafts multiply; the glass is revealed.\n26–33 s: The camera spirals up through the shafts to look down on the Virgin and angels glowing across the floor.\n33–37 s: Everything is engulfed in radiant light; the final line appears, then dissolves into white.\n\n【Words on the blocks】\nBUSY, URGENT, ASAP, DEADLINE, KPI, MEETING, OVERTIME, OPTIMIZE, EFFICIENCY, INBOX, FASTER, TO-DO, SPRINT, TARGETS, HUSTLE, REPLY ALL, EOD, METRICS, SCALE, GRIND, RUSH, PING, FOLLOW-UP, MULTITASK, NOW\n\n【On-screen text (elegant serif, appearing and fading quietly)】\n\"Every day, faster.\"\n\"Every day, more efficient.\"\n\"Until the light could no longer get in.\"\n\"Let one thing go.\"\n\"Where there is space, light comes in.\"\n\"And the light was richer than before.\"\nFinal: \"Abundance dwells / in white space.\"\n\n【Music and sound (original, synthesized)】\n- 0–11 s: A ticking clock that accelerates; a dull thud each time a block lands; a low drone rising in tension\n- 11–14 s: Silence\n- 14.8 s: A single crystalline bell as the first beam enters\n- 19–33 s: A soft chime for each falling block, blooming into an ethereal choir-like pad with a slo", "img": "https://pbs.twimg.com/amplify_video_thumb/2103167564251873281/img/LaVJ6-kyVBPJepTu.jpg", "post": "https://x.com/AGIOyaZ/status/2103167623303397647", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103167564251873281/vid/avc1/320x568/glcsIN3mQT42hnQa.mp4", "orig": "https://video.twimg.com/amplify_video/2103167564251873281/vid/avc1/1080x1920/Z4lioVR9uJDUy-TR.mp4", "rem": ""}, {"n": 694, "c": "3d", "t": [], "a": "AGIOyaZ", "p": "three.jsで、縦長1080×1920・30コマ/秒・約36秒の短編映像を作ってください。\n\n【作品名】\n余白\n\n【見せたい体験】\n効率化に追われて時間を失っていく感覚と、余白を手に入れた瞬間に人生が豊かな光で満たされていく感覚を、人物を一切登場させずに体感させる映像です。最後に床一面に浮かび上がるステンドグラスの光で、見た人が思わず息をのむことを目指します。\n\n【舞台】\n・薄暗い石造りの大聖堂の内部。正面の壁に、高さ15m・幅10mの尖頭アーチ型の窓が一つだけある\n・窓の外からは、斜め45度の角度で強い光が差し込み、石の床に窓の形の光を落としている\n・窓には、中央に聖母、両脇に翼を広げた二人の天使、上部にバラ窓を配したステンドグラスがはまっている。デザインは既存の作品を模さずオリジナルで、左右対称の構図にする\n\n【時間の構成】\n0〜3秒：窓から差す光は、まだ色のない白い光。床にやわらかな白い光の形\n3〜11秒：「忙しい」「効率化」「至急」「締切」などの言葉が刻まれた灰色の立方体が、部屋の手前から次々と飛んできて窓を埋めていく。飛来のペースはどんどん加速し、窓が埋まるほど部屋は暗くなる\n11〜14秒：窓は完全にふさがれ、闇と静寂\n14〜19秒：「忙しい」のブロックが一つだけ窓から外れて落ち、光の粒になって消える。空いた穴から、鮮やかな色の一筋の光が差し込む\n19〜26秒：最初の穴を中心に、ブロックが連鎖的に外れていく。穴が増えるたびに色とりどりの光の柱が増え、隠れていたステンドグラスが少しずつ姿を現す\n26〜33秒：すべてのブロックが消え、カメラは光の柱をくぐり抜けて上昇し、真上から床を見下ろす。床一面に、聖母と天使のステンドグラスが色鮮やかな光として映し出されている\n33〜36秒：画面全体がまばゆい光に包まれ、最後の言葉が浮かび、静かに終わる\n\n【言葉（明朝体、控えめに浮かんでは消える）】\n・「毎日、もっと速く。」\n・「もっと、効率よく。」\n・「気づけば、光が入らなくなっていた。」\n・「ひとつ、手放してみる。」\n・「空いたところから、光が入る。」\n・「その光は、前より豊かだった。」\n・最後に大きく：「豊かさは余白に宿る」\n\n【光と質感】\n・光の柱は、ステンドグラスのその場所の色に染まり、空中の塵がきらめく\n・床の投影は、窓のどの穴が空いているかを正確に反映する（ブロックがある場所は影になる）\n・ブロックは無機質なマットグレー。言葉は白く刻印されている\n・前半は冷たく無彩色、後半は宝石のような赤・青・金。この色の対比で「豊かになった」ことを語る\n\n【技術条件】\n・ステンドグラスの絵柄は画像として生成し、床の光・光の柱・窓の表示はすべて同じ絵柄から計算して一致させる\n・時間を1/30秒ずつ正確に進めて1コマずつ書き出し、MP4にする\n\n【仕上げ】\n各場面を実際に描画して確認し、ステンドグラスの絵柄が床の上で聖母と天使として読み取れるか、言葉が読めるか、動きが唐突でないかを直してから渡してください。", "img": "https://pbs.twimg.com/amplify_video_thumb/2103145494377848833/img/O3tng2YQfJLlCUPZ.jpg", "post": "https://x.com/AGIOyaZ/status/2103145567945986461", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103145494377848833/vid/avc1/320x568/r-jktNvn6uMHJ880.mp4", "orig": "https://video.twimg.com/amplify_video/2103145494377848833/vid/avc1/1080x1920/tu7J83z_HEbeJN_z.mp4", "rem": ""}, {"n": 695, "c": "motion", "t": [], "a": "thallisribeiro", "p": "Use apenas: JavaScript, Playwright e FFmpeg. Faça um vídeo moderno, elegante e impactante para meu produto (https://t.co/Lv7w1nzKzq)", "img": "https://pbs.twimg.com/amplify_video_thumb/2103106937088786432/img/35N6v4ZNr7iOs3GO.jpg", "post": "https://x.com/thallisribeiro/status/2103134082267750805", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103106937088786432/vid/avc1/320x568/ijlp3X-tnhcVQU64.mp4", "orig": "https://video.twimg.com/amplify_video/2103106937088786432/vid/avc1/1080x1920/HK-iyFoRlz41rNg1.mp4", "rem": ""}, {"n": 696, "c": "explainer", "t": [], "a": "so_ainsight", "p": "JavaScriptだけでアニメーション動画を作って。\nテーマは「Claude Codeって何？」。15秒・16:9、手描きの紙コラージュ風で、日本語ナレーション付き。\n\n台本・素材・アニメーション・構成、全部任せます。\n画像は gpt-image-2.5 、声は Gemini TTS", "img": "https://pbs.twimg.com/amplify_video_thumb/2103117472039944192/img/2TO57_O0xLHsdUpk.jpg", "post": "https://x.com/so_ainsight/status/2103119227192225926", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103117472039944192/vid/avc1/480x270/RdNV0OiqkKP5FXj1.mp4", "orig": "https://video.twimg.com/amplify_video/2103117472039944192/vid/avc1/1920x1080/kJpThi2yIsYKn99Z.mp4", "rem": ""}, {"n": 697, "c": "interactive", "t": [], "a": "GodsBoy7777", "p": "Build a single self-contained HTML file: a 3D marble computer, in the spirit of Wintergatan's marble machine and the Digi-Comp II, that adds two 4-bit numbers using nothing but marbles falling through mechanical toggles.\n\nHard rules:\n\n1. One HTML file. Three.js from https://t.co/KCQbEZLusb via an import map, plus its OrbitControls addon. No other libraries, no physics engine, no external assets.\n\n2. The mechanism is the computer. Each bit of the result is stored in a two-state toggle (flip-flop) that a marble physically flips as it passes. Carries happen because a marble leaving one toggle rolls on to the next. Do not compute the answer in JavaScript arithmetic anywhere. The displayed result must be read from the toggle states after the last marble stops.\n\n3. Marbles move along tracks with believable gravity and timing. Nothing teleports. You may script motion along paths, but every toggle flip must be caused by a marble arriving at it.\n\n4. Input: two rows of four switches (A and B, 0 to 15), set by clicking. A lever labelled RUN releases the marbles. A counter shows how many marbles have fallen.\n\n5. Output: a row of five result toggles, most significant bit on the left, and a readout that shows the binary and decimal value read from those toggles.\n\n6. A DEMO button runs 5+6, then 9+7, then 15+15, resetting between runs, so it can be screen-recorded without touching anything.\n\n7. Looks: a wooden board, brass toggles, glass marbles, warm studio lighting, soft shadows, a slow camera that follows the busiest part of the machine. It should look good in a square 1080x1080 recording.\n\n8. Short click sounds via the Web Audio API when a toggle flips, started only after the first user click.\n\n9. It must run at 60 fps on a normal laptop and have no console errors.\n\nOutput only the complete HTML file.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103117396420534272/img/3zbySh7Dp-nr5ro6.jpg", "post": "https://x.com/GodsBoy7777/status/2103117450854150194", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103117396420534272/vid/avc1/480x270/Z5p6kz6Ua2NEisp3.mp4", "orig": "https://video.twimg.com/amplify_video/2103117396420534272/vid/avc1/1920x1080/nOYEvZ98Ls6J5wum.mp4", "rem": ""}, {"n": 698, "c": "motion", "t": [], "a": "1234lust", "p": "I asked @claudeai for a 10-second film about a moose living in a code editor.\n\nNo animation software. Just one HTML file.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103073367133691904/img/1wnGHiNnByFlV4ng.jpg", "post": "https://x.com/1234lust/status/2103073554581671954", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103073367133691904/vid/avc1/644x270/cCp_8IAvslfCUMIV.mp4?tag=14", "orig": "https://video.twimg.com/amplify_video/2103073367133691904/vid/avc1/1600x670/qbkilR8ZJAysYvDS.mp4?tag=14", "rem": ""}, {"n": 699, "c": "motion", "t": [], "a": "superalesha", "p": "make an animated short that felt like Hedgehog in the Fog. I didn’t want to copy Yuri Norstein’s film, so we went with a new story.\n\nIt runs for 6.5 minutes. All 9363 frames are drawn by JavaScript code written by Opus. No video or image generation models, just canvas.\n\nIt follows a little mouse in a red scarf. Her grandfather, an old mole, is out fishing when fog rolls over the lake. She goes looking for him with a walnut-shell lantern and a sleeping firefly inside. They have a secret knock to help them find each other: short, short, long. It means \"I’m here\".\n\nNorstein used paper cutouts on layers of glass, filmed frame by frame. I wanted some of that paper texture to come through in code. So the scenes use different styles: torn-paper collage, chalk on black paper, tissue paper underwater. There’s even sand on a light table and a pop-up book.\n\nOpus wrote the music too. It found Steinway piano samples in my Logic library and used Python to compose the score around the rhythm of that knock.", "img": "https://pbs.twimg.com/amplify_video_thumb/2103051660859740160/img/iqqgvG_DyCI4iTOW.jpg", "post": "https://x.com/superalesha/status/2103052154931970412", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2103051660859740160/vid/avc1/480x270/MsmuJsob4qWYKB8w.mp4", "orig": "https://video.twimg.com/amplify_video/2103051660859740160/vid/avc1/1920x1080/-Gb8uj8TxCrdYee4.mp4", "rem": ""}, {"n": 700, "c": "interactive", "t": [], "a": "EngMoElgaraihy", "p": "إنشاء مشهد قارب تفاعلي يمر بجمال الطبيعة اليابانية باستخدام Three.js، مع طقس ديناميكي وانعكاسات ماء واقعية وتفاصيل معماريّة وشخصيات 3D", "img": "https://pbs.twimg.com/amplify_video_thumb/2102760366745010177/img/8_z3VSBLv9sfV3C8.jpg", "post": "https://x.com/EngMoElgaraihy/status/2103038655178694832", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2102760366745010177/vid/avc1/360x270/WK5BILR6P50fBxRO.mp4", "orig": "https://video.twimg.com/amplify_video/2102760366745010177/vid/avc1/2880x2160/3TqCddKGHBP7cVgY.mp4", "rem": ""}, {"n": 701, "c": "motion", "t": [], "a": "perezalexa23", "p": "Tell the Trojan Horse story in a 20-second HTML animation painted around an ancient Greek vase. Rotate the vase as the horse enters the city, night falls, and hidden warriors emerge. Draw everything in code; no external assets or website UI.", "img": "https://media.skillry.dev/opus-5-5/_prompts/perezalexa23-414045/poster.126ed09b20.webp", "post": "https://x.com/perezalexa23/status/2103027565703414045", "v": false}, {"n": 702, "c": "motion", "t": [], "a": "meetarno", "p": "make a modern slick and punchy video for a modern startup that works on enabling people to grow on X, use our X Vision theme and website purpose.", "img": "https://pbs.twimg.com/amplify_video_thumb/2102934469590020096/img/PNphs7Rs5Ec746Da.jpg", "post": "https://x.com/meetarno/status/2102934732203782464", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2102934469590020096/vid/avc1/480x270/OxFhrB2Qi-VuFOtY.mp4", "orig": "https://video.twimg.com/amplify_video/2102934469590020096/vid/avc1/1920x1080/9jC7GzKCZyZm-3kK.mp4", "rem": ""}, {"n": 703, "c": "motion", "t": [], "a": "Fanfulladev", "p": "Do a full animation with sound of anthropic mascote with the newset model of Opus 5.5 fighting against OpenAI mascotte with the new astra models Sol etc like the intro of pokemon fire red and leaf green. Same animations", "img": "https://pbs.twimg.com/amplify_video_thumb/2102478756669468672/img/ioTD_tLja0xoN3PR.jpg", "post": "https://x.com/Fanfulladev/status/2102479018784063524", "v": true, "x": true, "card": "https://video.twimg.com/amplify_video/2102478756669468672/vid/avc1/404x270/CSURYTy5vJTyTYFM.mp4", "orig": "https://video.twimg.com/amplify_video/2102478756669468672/vid/avc1/1440x960/6AvwWiOSfwccB-P2.mp4", "rem": ""}],CAT={"motion": "Моушн", "3d": "3D", "explainer": "Объяснялка", "interactive": "Игра/интерактив"},BOOK=[8, 366, 355, 213, 89, 189, 221, 414, 208, 233, 28, 405, 354, 25, 47, 211, 40, 220, 406, 34],LEAD=[[8, "Почему небо голубое — процесс по шагам"], [366, "Молоток и перо на Луне, Apollo 15, 1971"], [213, "Ньютон и закон всемирного тяготения"], [89, "Задача ЕГЭ на доске за 30 секунд"], [28, "E = mc²: Солнце теряет 4 млн тонн в секунду"]];
let tab="book",cat="all",q="";
const TABS=[["book","Книга стилей · 20"],["lead","5 для лид-магнита"],["vid","Все с видео · "+D.filter(x=>x.v).length],["all","Все · "+D.length]];
const tabs=document.getElementById("tabs"),bar=document.getElementById("bar"),g=document.getElementById("g"),intro=document.getElementById("intro");
TABS.forEach(([k,v])=>{const b=document.createElement("button");b.className="t"+(k==tab?" on":"");b.textContent=v;b.onclick=()=>{tab=k;[...tabs.children].forEach(e=>e.classList.remove("on"));b.classList.add("on");draw()};tabs.appendChild(b)});
[["all","Все типы"],...Object.entries(CAT)].forEach(([k,v])=>{const b=document.createElement("button");b.className="f"+(k=="all"?" on":"");b.textContent=v;b.onclick=()=>{cat=k;[...bar.querySelectorAll(".f")].forEach(e=>e.classList.remove("on"));b.classList.add("on");draw()};bar.appendChild(b)});
const inp=document.createElement("input");inp.type="search";inp.placeholder="поиск: physics, paper, 3d, chart, typography…";inp.oninput=e=>{q=e.target.value.toLowerCase();draw()};bar.appendChild(inp);
const cnt=document.createElement("span");cnt.id="cnt";bar.appendChild(cnt);
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){if(!v.src)v.src=v.dataset.src;v.play().catch(()=>{})}else{v.pause()}}),{rootMargin:"150px"});
function card(x,extra){
  const media=x.card?`<video muted loop playsinline preload="none" referrerpolicy="no-referrer" poster="${x.img}" data-src="${x.card}"></video>`:`<img loading="lazy" src="${x.img}" alt="">`;
  const b=x.b;const head=extra?extra:(b?b[0]:CAT[x.c]);
  return `<div class="c" data-n="${x.n}"><div class="media">${media}<span class="badge">№${x.n}</span>${x.v?"":'<span class="nov">видео в X</span>'}</div>
  <div class="m"><div class="ttl">${head}</div>${b?`<div class="d">${b[1]}</div><div class="use">Для нас: ${extra?b[0]+". "+b[2]:b[2]}</div>`:`<div class="tg">${x.t.join(" · ")} · @${x.a}</div>`}</div></div>`}
function draw(){
  io.disconnect();bar.style.display=(tab=="vid"||tab=="all")?"flex":"none";
  let L,html;
  if(tab=="book"){L=BOOK.map(n=>D[n-1]);intro.textContent="20 номеров, отобранных под наши задачи: физика, объяснялки, хуки, ролики с лицом. Выбери номер и напиши «беру №…».";html=L.map(x=>card(x)).join("")}
  else if(tab=="lead"){intro.textContent="Лид-магнит Арсения: 5 стилей → 5 тем по физике. В конце каждого ролика: «Готовлю к ЕГЭ по физике — Telegram в профиле».";html=LEAD.map(([n,t])=>card(D[n-1],t)).join("")}
  else{intro.textContent="";L=D.filter(x=>(tab=="all"||x.v)&&(cat=="all"||x.c==cat)&&(!q||(x.p+" "+x.t.join(" ")+" "+x.a).toLowerCase().includes(q)));html=L.map(x=>card(x)).join("");cnt.textContent="показано "+L.length}
  g.innerHTML=html;g.querySelectorAll("video").forEach(v=>io.observe(v))}
const pv=document.getElementById("pv"),sw=document.getElementById("sw");
function play(url){pv.innerHTML=`<video controls autoplay playsinline referrerpolicy="no-referrer" src="${url}"></video>`}
g.onclick=e=>{const c=e.target.closest(".c");if(!c)return;const x=D[c.dataset.n-1];
  if(x.v){play(x.orig);sw.innerHTML=x.rem?`<button class="f on" data-u="${x.orig}">Оригинал автора</button><button class="f" data-u="${x.rem}">Пересъёмка тем же промтом</button>`:`<span class="d">Видео из поста автора в X</span>`;
    sw.onclick=ev=>{const b=ev.target.closest("button");if(!b)return;[...sw.children].forEach(z=>z.classList.remove("on"));b.classList.add("on");play(b.dataset.u)}}
  else{pv.innerHTML=`<img src="${x.img}" style="width:100%;display:block">`;sw.innerHTML=`<span class="d">Видео есть только в посте автора — ссылка ниже.</span>`}
  const b=x.b;document.getElementById("dh").textContent="№"+x.n+(b?" · "+b[0]:" · "+CAT[x.c]);
  document.getElementById("dd").innerHTML=b?`<p>${b[1]}</p><p class="use">Для нас: ${b[2]}</p>`:`<p class="d">${x.t.join(" · ")} · @${x.a}</p>`;
  document.getElementById("dp").textContent=x.p;
  document.getElementById("lk").innerHTML=`<a href="${x.post}" target="_blank">пост автора в X</a>`;
  document.getElementById("cp").textContent="";
  document.getElementById("take").onclick=()=>{const t="беру №"+x.n;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{cp.textContent="скопировано: «"+t+"» — вставь мне в чат"}).catch(()=>{cp.textContent="напиши мне: «"+t+"»"})};
  dl.showModal()};
dl.addEventListener("close",()=>{pv.innerHTML=""});
draw();
