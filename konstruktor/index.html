<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Конструктор видео — выбираю стиль и анимации</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link id="fontpreview" rel="stylesheet" href="">
<script src="https://cdn.jsdelivr.net/npm/@hyperframes/player@0.8.184/dist/hyperframes-player.global.js" integrity="sha384-qM7hhhIJHat0rxrHQoc2/CZJ1VOD3osW5ISn1i1u9RQ2za8dfXATpnBHMW7SE5Vu" crossorigin="anonymous"></script>
<style>
:root{--bg:#F5F2EC;--paper:#FFFFFF;--ink:#151515;--mute:#6A665F;--line:#E2DDD3;--acc:#D9480F;--acc-soft:#FBE9DF;--ok:#2B7A4B;--warn:#9A6B00;--r:14px}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Golos Text",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(245,242,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:19px;margin:0;font-weight:700}
.brand .sub{color:var(--mute);font-size:14px}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.steps::-webkit-scrollbar{display:none}
.st{flex:none;border:0;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--mute);font-weight:600;white-space:nowrap}
.st b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px;margin-right:6px}
.st.on{background:var(--ink);color:#fff}.st.on b{background:#fff}
.st.done b{background:var(--ok);color:#fff}
.wrap{max-width:1480px;margin:0 auto;padding:18px 20px 120px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}
.main{min-width:0}
h2{font-size:24px;margin:4px 0 6px;letter-spacing:-.01em}
.lead{color:var(--mute);margin:0 0 14px;max-width:760px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{opacity:.6;margin-left:4px}
.tog{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:14px;cursor:pointer}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#cfc8bb}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.media{position:relative;aspect-ratio:16/9;background:#1b1b1b;overflow:hidden}
.media.v916{aspect-ratio:16/9}
.media video,.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media hyperframes-player{position:absolute;inset:0;width:100%;height:100%;display:block}
.code{position:absolute;left:8px;top:8px;z-index:2;background:rgba(21,21,21,.82);color:#fff;font-weight:700;font-size:13px;border-radius:7px;padding:2px 8px}
.pick{position:absolute;right:8px;top:8px;z-index:2;background:var(--acc);color:#fff;font-weight:700;font-size:12px;border-radius:7px;padding:3px 8px;display:none}
.card.sel .pick{display:block}
.body{padding:10px 12px 12px}
.ttl{font-weight:650;font-size:15.5px}
.what{color:var(--mute);font-size:13.5px;margin-top:3px}
.when{font-size:13px;margin-top:7px;background:var(--acc-soft);border-radius:8px;padding:5px 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:#EFEBE3;color:#4d4942}
.tag.rec{background:#E3F1E8;color:var(--ok)}
.tag.slop{background:#FFF3D6;color:var(--warn)}
.big-btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:11px 18px;font-weight:650;cursor:pointer}
.ghost{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
/* корзина */
.side{position:sticky;top:110px;align-self:start;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:calc(100vh - 130px);overflow:auto}
.side h3{margin:0 0 8px;font-size:16px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.row .k{color:var(--mute);font-size:12px}
.x{border:0;background:none;cursor:pointer;color:var(--mute);font-size:18px;line-height:1}
.empty{color:var(--mute);font-size:13.5px}
.fab{display:none}
/* модальное окно */
dialog{border:0;border-radius:16px;padding:0;max-width:1000px;width:96vw;background:var(--paper)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-media{position:relative;aspect-ratio:16/9;background:#111}
.dlg-media video,.dlg-media hyperframes-player{position:absolute;inset:0;width:100%;height:100%;display:block}
.dlg-b{padding:14px 18px 18px}
.dlg-b pre{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;font:12.5px/1.45 ui-monospace,monospace;max-height:22vh;overflow:auto}
.close{position:absolute;right:10px;top:10px;z-index:3;border:0;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);font-size:20px;cursor:pointer}
/* проекты, палитры, шрифты */
.pj{padding:16px}.pj .ttl{font-size:17px}
.sw{display:flex;height:64px}.sw span{flex:1}
.fontdemo{height:120px;display:grid;place-items:center;background:var(--bg);font-size:34px;padding:0 10px;text-align:center;overflow:hidden}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.sec{margin:0 0 6px;font-weight:650}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--paper)}
.msg{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;font:13.5px/1.5 ui-monospace,monospace}
.ok{color:var(--ok);font-weight:600}
.tempo{height:46px;display:flex;gap:3px;align-items:flex-end;margin-top:8px}
.tempo i{flex:1;background:var(--ink);opacity:.15;border-radius:3px}
.loadmore{margin:18px auto 0;display:block}
.note{font-size:13px;color:var(--mute);margin-top:10px}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.side{display:none;position:fixed;inset:auto 0 0 0;top:auto;max-height:70vh;border-radius:16px 16px 0 0;z-index:30;box-shadow:0 -10px 30px rgba(0,0,0,.18)}.side.open{display:block;padding-bottom:84px}
.fab{display:flex;position:fixed;right:14px;bottom:14px;z-index:31;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;font-weight:650;box-shadow:0 6px 20px rgba(0,0,0,.25)}}
@media (max-width:560px){.bar.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-12px;padding-right:12px}.bar.scroll::-webkit-scrollbar{display:none}.bar.scroll .chip,.bar.scroll .note{flex:none}.top-in{padding:10px 12px 0}.wrap{padding:12px 12px 110px}.grid,.grid.big{grid-template-columns:1fr}h2{font-size:21px}.brand .sub{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1>Конструктор видео</h1><span class="sub">Выбираешь глазами — в конце готовое сообщение для Claude</span></div>
  <nav class="steps" id="steps"></nav>
</div></header>
<div class="wrap">
  <main class="main" id="main"></main>
  <aside class="side" id="side"></aside>
</div>
<button class="fab" id="fab">Мой выбор · 0</button>
<dialog id="dlg"><button class="close" onclick="closeDlg()" aria-label="Закрыть">×</button><div class="dlg-media" id="dlgMedia"></div><div class="dlg-b" id="dlgB"></div></dialog>
<script src="data.js"></script>
<script src="demos.js"></script>
<script>
"use strict";
const D=window.SK;
const STEPS=[["who","Для кого"],["fam","Семейство"],["style","Стиль"],["anim","Анимации"],["look","Цвет и шрифт"],["more","Темп, звук, формат"],["done","Итог"]];
const LS="sk-choice-v1";
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(LS))||fresh()}catch(e){return fresh()}}
function fresh(){return {step:"who",proj:null,fam:[],style:[],anim:{},pal:null,font:null,more:{},note:"",grp:null,onlyFit:true}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const famById=Object.fromEntries(D.families.map(f=>[f.id,f]));
const grpById=Object.fromEntries(D.groups.map(g=>[g.id,g]));
const animByCode=Object.fromEntries(D.anims.map(a=>[a.code,a]));
const styleByCode=Object.fromEntries(D.styles.map(s=>[s.code,s]));
const projById=Object.fromEntries(D.projects.map(p=>[p.id,p]));

/* ---------- живые превью: монтируем только видимое, не больше MAX сразу ---------- */
const MAX=6;let live=[];
const io=new IntersectionObserver(es=>es.forEach(e=>{const m=e.target;if(e.isIntersecting)mount(m);else unmount(m)}),{rootMargin:"120px"});
function mount(m){if(m.dataset.on)return;
  if(m.dataset.kind==="video"){let v=m.querySelector("video");if(!v.src){v.src=m.dataset.src}const t0=+m.dataset.t0||0,t1=+m.dataset.t1||0;
    if(t0&&v.currentTime<t0)v.currentTime=t0;v.play().catch(()=>{});m.dataset.on=1;return}
  if(m.dataset.kind==="demo"){const pp=m.dataset.pal&&D.palettes.find(x=>x.code===m.dataset.pal);m._stop=SKD.run(m.dataset.demo,m,pp?pp.vars:curPal());m.dataset.on=1;return}
  if(m.dataset.kind==="hf"){live.push(m);if(live.length>MAX){unmount(live[0])}
    const p=document.createElement("hyperframes-player");p.setAttribute("muted","");p.setAttribute("audio-locked","");p.setAttribute("loop","");p.setAttribute("autoplay","");p.setAttribute("low-power-idle","");p.setAttribute("disable-click-to-play","");p.setAttribute("assets-loading-ui","none");
    m.appendChild(p);m.dataset.on=1;
    fetch(m.dataset.src).then(r=>r.json()).then(j=>{if(m.dataset.on)p.setAttribute("srcdoc",j.html)}).catch(()=>{})}}
function unmount(m){if(!m.dataset.on)return;delete m.dataset.on;
  if(m.dataset.kind==="video"){const v=m.querySelector("video");v&&v.pause();return}
  if(m.dataset.kind==="demo"){m._stop&&m._stop();m._stop=null;return}
  const p=m.querySelector("hyperframes-player");p&&p.remove();live=live.filter(x=>x!==m)}
function segLoop(v){v.addEventListener("timeupdate",()=>{const m=v.parentElement,t0=+m.dataset.t0||0,t1=+m.dataset.t1||0;if(t1&&v.currentTime>=t1){v.currentTime=t0}})}
function observe(){document.querySelectorAll(".media[data-kind]").forEach(m=>{io.observe(m);const v=m.querySelector("video");if(v&&!v._seg){v._seg=1;segLoop(v)}})}
function vmedia(src,poster,t0,t1){return `<div class="media" data-kind="video" data-src="${esc(src)}" data-t0="${t0||0}" data-t1="${t1||""}"><video muted loop playsinline preload="none" referrerpolicy="no-referrer" poster="${esc(poster||"")}"></video>`}
function hfmedia(a){return a.src==="astra"?`<div class="media" data-kind="demo" data-demo="${esc(a.demo)}">`:`<div class="media" data-kind="hf" data-src="${esc(a.prev)}">`}
function curPal(){const p=S&&S.pal&&D.palettes.find(x=>x.code===S.pal);return p&&p.vars?p.vars:null}

/* ---------- шаги ---------- */
function stepsBar(){const i=STEPS.findIndex(x=>x[0]===S.step);
  $("#steps").innerHTML=STEPS.map(([k,v],n)=>`<button class="st ${k===S.step?"on":""} ${doneStep(k)&&k!==S.step?"done":""}" data-k="${k}"><b>${n+1}</b>${v}</button>`).join("");
  $("#steps").onclick=e=>{const b=e.target.closest(".st");if(b)go(b.dataset.k)}}
function doneStep(k){return {who:!!S.proj,fam:S.fam.length>0,style:S.style.length>0,anim:Object.values(S.anim).some(a=>a.length),look:!!(S.pal||S.font),more:Object.keys(S.more).length>0,done:false}[k]}
function go(k){$("#side").classList.remove("open");$("#fab").dataset.open="";S.step=k;save();render();window.scrollTo({top:0,behavior:"instant"})}
function nav(prev,next,label){return `<div class="nav">${prev?`<button class="ghost" onclick="go('${prev}')">← Назад</button>`:"<span></span>"}${next?`<button class="big-btn" onclick="go('${next}')">${label||"Дальше →"}</button>`:""}</div>`}

/* ---------- 1. для кого ---------- */
function viewWho(){
  return `<h2>Для кого видео?</h2><p class="lead">Семь шагов: для кого → семейство → стиль → анимации → цвет и шрифт → темп и звук → итог. Всё, что нажимаешь, складывается в «Мой выбор». В конце — готовое сообщение, которое ты копируешь мне. От проекта зависит, что я подсвечу как подходящее; можно сразу взять готовый набор и поменять любые пункты.</p>
  <div class="grid big">${D.projects.map(p=>`<div class="card pj ${S.proj===p.id?"sel":""}" data-p="${p.id}"><span class="pick">выбрано</span>
   <div class="ttl">${esc(p.ru)}</div><div class="what">${esc(p.desc)}</div>
   <div class="tags">${p.fams.map(f=>`<span class="tag rec">${esc(famById[f]?famById[f].ru:f)}</span>`).join("")}</div>
   ${p.preset?`<div style="margin-top:12px"><button class="ghost" data-preset="${p.id}">Взять готовый набор</button></div>`:""}</div>`).join("")}</div>
   ${nav(null,"fam")}`}
function bindWho(){$("#main").onclick=e=>{const pr=e.target.closest("[data-preset]");if(pr){applyPreset(pr.dataset.preset);return}
  const c=e.target.closest("[data-p]");if(!c)return;S.proj=S.proj===c.dataset.p?null:c.dataset.p;save();render()}}
function applyPreset(id){const p=projById[id];if(!p||!p.preset)return;const x=p.preset;S.proj=id;
  S.fam=(x.fam||[]).slice();S.style=(x.style||[]).filter(c=>styleByCode[c]);S.anim={};(x.anim||[]).forEach(c=>{const a=animByCode[c];if(a){(S.anim[a.group]=S.anim[a.group]||[]).push(c)}});
  S.pal=x.pal||null;S.font=x.font||null;S.more=Object.assign({},x.more||{});save();go("done")}

/* ---------- 2. семейство ---------- */
function viewFam(){const rec=S.proj?projById[S.proj].fams:[];
  const list=D.families.slice().sort((a,b)=>(rec.includes(b.id)-rec.includes(a.id)));
  return `<h2>Какое семейство стилей?</h2><p class="lead">Семейство — общий язык картинки: интерфейсы, бумага, рисовка от руки, Япония и так далее. Можно выбрать 1–2, внутри будут конкретные стили.</p>
  <div class="grid big">${list.map(f=>`<div class="card ${S.fam.includes(f.id)?"sel":""}" data-f="${f.id}"><span class="pick">выбрано</span>
   ${f.cover?vmedia(f.cover.video,f.cover.poster,f.cover.t0,f.cover.t1):`<div class="media">`}<span class="code">${f.id.replace("F","Ф")}</span></div>
   <div class="body"><div class="ttl">${esc(f.ru)}</div><div class="what">${esc(f.what)}</div><div class="when">Для чего: ${esc(f.for)}</div>
   <div class="tags">${rec.includes(f.id)?'<span class="tag rec">советую для проекта</span>':""}<span class="tag">${D.styles.filter(s=>s.fam===f.id).length} стилей</span></div></div></div>`).join("")}</div>
  ${nav("who","style")}`}
function bindFam(){$("#main").onclick=e=>{const c=e.target.closest("[data-f]");if(!c)return;const id=c.dataset.f;
  S.fam=S.fam.includes(id)?S.fam.filter(x=>x!==id):S.fam.concat(id).slice(-2);save();render()}}

/* ---------- 3. стиль ---------- */
let styleLimit=36;
function viewStyle(){const fams=S.fam.length?S.fam:[];
  const list=D.styles.filter(s=>!fams.length||fams.includes(s.fam));
  const shown=list.slice(0,styleLimit);
  return `<h2>Стиль рисовки</h2><p class="lead">${fams.length?"Стили семейства "+fams.map(f=>"«"+esc(famById[f].ru)+"»").join(" и "):"Все стили"}. Нажми на карточку — откроется большой просмотр. Выбери один главный стиль, можно добавить второй для смеси.</p>
  <div class="bar scroll">${D.families.map(f=>`<button class="chip ${fams.includes(f.id)?"on":""}" data-ff="${f.id}">${esc(f.ru)}<small>${D.styles.filter(s=>s.fam===f.id).length}</small></button>`).join("")}</div>
  <div class="grid">${shown.map(styleCard).join("")}</div>
  ${list.length>styleLimit?`<button class="ghost loadmore" onclick="styleLimit+=36;render()">Показать ещё ${list.length-styleLimit}</button>`:""}
  ${nav("fam","anim")}`}
function styleCard(s){const sel=S.style.includes(s.code);
  return `<div class="card ${sel?"sel":""}" data-s="${s.code}"><span class="pick">${S.style[0]===s.code?"главный":"выбрано"}</span>
  ${vmedia(s.video,s.poster,s.t0,s.t1)}<span class="code">${s.code}</span></div>
  <div class="body"><div class="ttl">${esc(s.ru)}</div><div class="what">${esc(s.what)}</div><div class="when">Для чего: ${esc(s.for)}</div>
  <div class="tags"><span class="tag">${esc(s.render)}</span>${S.proj&&s.proj.includes(S.proj)?'<span class="tag rec">подходит проекту</span>':""}<button class="tag" data-big="${s.code}" style="border:0;cursor:pointer">смотреть крупно</button></div></div></div>`}
function bindStyle(){$("#main").onclick=e=>{const ff=e.target.closest("[data-ff]");if(ff){const id=ff.dataset.ff;S.fam=S.fam.includes(id)?S.fam.filter(x=>x!==id):S.fam.concat(id).slice(-2);styleLimit=36;save();render();return}
  const big=e.target.closest("[data-big]");if(big){openStyle(big.dataset.big);return}
  const c=e.target.closest("[data-s]");if(!c)return;const id=c.dataset.s;
  S.style=S.style.includes(id)?S.style.filter(x=>x!==id):S.style.concat(id).slice(-2);save();render()}}
function openStyle(code){const s=styleByCode[code];
  $("#dlgMedia").innerHTML=`<video controls autoplay muted playsinline referrerpolicy="no-referrer" src="${esc(s.video)}${s.t0?"#t="+s.t0+(s.t1?","+s.t1:""):""}" poster="${esc(s.poster)}"></video>`;
  $("#dlgB").innerHTML=`<div class="ttl" style="font-size:19px">${s.code} · ${esc(s.ru)}</div><p class="what">${esc(s.what)}</p><p class="when">Для чего: ${esc(s.for)}</p><p class="note">Источник: ${esc(s.ref||"")} · ${s.src==="lemo"?"Lemo-Opuscar (MIT · CC BY 4.0)":"OPUSCAR 98, LemoLab (CC BY 4.0)"}</p>${s.prompt?`<pre>${esc(s.prompt)}</pre>`:""}
  <button class="big-btn" onclick="toggleStyle('${s.code}')">${S.style.includes(s.code)?"Убрать из выбора":"Беру этот стиль"}</button>`;$("#dlg").showModal()}
function toggleStyle(c){S.style=S.style.includes(c)?S.style.filter(x=>x!==c):S.style.concat(c).slice(-2);save();closeDlg();render()}

/* ---------- 4. анимации ---------- */
let animLimit=24;
function famOrder(){const f=S.fam[0];const base=D.famOrder[f]||[];const all=D.groups.map(g=>g.id);return base.concat(all.filter(g=>!base.includes(g))).filter(g=>D.anims.some(a=>a.group===g))}
function mainGroups(){const f=S.fam[0];return D.famOrder[f]||[]}
function viewAnim(){const order=famOrder();const g=S.grp&&order.includes(S.grp)?S.grp:order[0];S.grp=g;
  const fits=a=>!S.fam.length||a.fam.some(f=>S.fam.includes(f));
  let list=D.anims.filter(a=>a.group===g);const fitN=list.filter(fits).length;
  const few=fitN<6;if(S.onlyFit&&!few)list=list.filter(fits);
  list.sort((a,b)=>(fits(b)-fits(a))||(a.slop-b.slop)||((S.proj&&b.proj.includes(S.proj))-(S.proj&&a.proj.includes(S.proj)))||((a.src==="astra"?0:1)-(b.src==="astra"?0:1))||a.code.localeCompare(b.code,"ru",{numeric:true}));
  const shown=list.slice(0,animLimit);const gg=grpById[g];
  return `<h2>Анимации: ${esc(gg.ru)}</h2><p class="lead">${esc(gg.hint)} Отметь всё, что нравится, — лучше 1–3 в каждом разделе. Превью играют сами; нажми «крупно», чтобы посмотреть в большом окне.</p>
  <div class="bar scroll">${order.map((id,i)=>{const n=(S.anim[id]||[]).length;const sep=i>0&&mainGroups().length&&!mainGroups().includes(id)&&mainGroups().includes(order[i-1])?'<span class="note" style="margin:0 4px">ещё:</span>':"";return sep+`<button class="chip ${id===g?"on":""}" data-g="${id}">${esc(grpById[id].ru)}<small>${grpCount(id)}</small>${n?`<small>✓${n}</small>`:""}</button>`}).join("")}</div>
  <div class="bar"><label class="tog"><input type="checkbox" ${S.onlyFit?"checked":""} id="onlyFit"> только подходящие к выбранному семейству (${fitN} из ${D.anims.filter(a=>a.group===g).length})</label>${few&&S.fam.length?`<span class="note">подходящих мало — показываю все, подходящие первыми</span>`:""}</div>
  <div class="grid">${shown.map(animCard).join("")}</div>
  ${list.length>animLimit?`<button class="ghost loadmore" onclick="animLimit+=24;render()">Показать ещё ${list.length-animLimit}</button>`:""}
  <div class="nav"><button class="ghost" onclick="go('style')">← К стилям</button><span style="display:flex;gap:10px;flex-wrap:wrap">${nextGrp(order,g)?`<button class="ghost" onclick="go('look')">Хватит анимаций → цвет</button><button class="big-btn" onclick="S.grp='${nextGrp(order,g)}';animLimit=24;save();render();scrollTo(0,0)">Дальше: ${esc(grpById[nextGrp(order,g)].ru)} →</button>`:`<button class="big-btn" onclick="go('look')">Дальше: цвет и шрифт →</button>`}</span></div>`}
function grpCount(id){const L=D.anims.filter(a=>a.group===id);if(!S.onlyFit||!S.fam.length)return L.length;const f=L.filter(a=>a.fam.some(x=>S.fam.includes(x))).length;return f<6?L.length:f}
function nextGrp(order,g){const i=order.indexOf(g);return order[i+1]||null}
function animCard(a){const sel=(S.anim[a.group]||[]).includes(a.code);
  return `<div class="card ${sel?"sel":""}" data-a="${a.code}"><span class="pick">выбрано</span>
  ${hfmedia(a)}<span class="code">${a.code}</span></div>
  <div class="body"><div class="ttl">${esc(a.ru)}</div><div class="what">${esc(a.what)}</div><div class="when">Когда: ${esc(a.when)}</div>
  <div class="tags">${S.fam.length&&a.fam.some(f=>S.fam.includes(f))?'<span class="tag rec">к твоему стилю</span>':""}${S.proj&&a.proj.includes(S.proj)?'<span class="tag rec">подходит проекту</span>':""}${a.slop?'<span class="tag slop">штамп — осторожно</span>':""}<button class="tag" data-bigA="${a.code}" style="border:0;cursor:pointer">смотреть крупно</button></div></div></div>`}
function bindAnim(){const of=$("#onlyFit");if(of)of.onchange=()=>{S.onlyFit=of.checked;animLimit=24;save();render()};
  $("#main").onclick=e=>{const gb=e.target.closest("[data-g]");if(gb){S.grp=gb.dataset.g;animLimit=24;save();render();return}
  const big=e.target.closest("[data-biga]");if(big){openAnim(big.dataset.biga);return}
  const c=e.target.closest("[data-a]");if(!c)return;toggleAnim(c.dataset.a,false)}}
function toggleAnim(code,fromDlg){const a=animByCode[code];const arr=S.anim[a.group]=S.anim[a.group]||[];
  const i=arr.indexOf(code);i>=0?arr.splice(i,1):arr.push(code);save();if(fromDlg)closeDlg();render()}
function openAnim(code){const a=animByCode[code];$("#dlgMedia").innerHTML="";
  const p=document.createElement("hyperframes-player");["muted","audio-locked","loop","autoplay","controls"].forEach(x=>p.setAttribute(x,""));$("#dlgMedia").appendChild(p);
  fetch(a.prev).then(r=>r.json()).then(j=>p.setAttribute("srcdoc",j.html));
  $("#dlgB").innerHTML=`<div class="ttl" style="font-size:19px">${a.code} · ${esc(a.ru)}</div><p class="what">${esc(a.what)}</p><p class="when">Когда: ${esc(a.when)}</p><p class="note">Компонент HyperFrames «${esc(a.name)}» (Apache 2.0) · ${a.dur?a.dur+" с":""}${a.slop?" · штамп, использовать точечно":""}</p>
  <button class="big-btn" onclick="toggleAnim('${a.code}',true)">${(S.anim[a.group]||[]).includes(a.code)?"Убрать из выбора":"Беру эту анимацию"}</button>`;$("#dlg").showModal()}

/* ---------- 5. цвет и шрифт ---------- */
function viewLook(){return `<h2>Цвет и шрифт</h2><p class="lead">Палитра задаёт настроение, шрифт — характер. Все шрифты бесплатные и с кириллицей.</p>
  <div class="sec">Палитра</div><div class="grid">${D.palettes.map(p=>`<div class="card ${S.pal===p.code?"sel":""}" data-pal="${p.code}"><span class="pick">выбрано</span><div class="media" data-kind="demo" data-demo="PAL-DEMO" data-pal="${p.code}"></div><div class="sw" style="height:14px">${p.colors.map(c=>`<span style="background:${c}"></span>`).join("")}</div><div class="body"><div class="ttl">${p.code} · ${esc(p.ru)}</div><div class="what">${esc(p.for)}</div></div></div>`).join("")}</div>
  <div class="sec" style="margin-top:22px">Шрифт</div><div class="grid">${D.fonts.map(f=>`<div class="card ${S.font===f.code?"sel":""}" data-font="${f.code}"><span class="pick">выбрано</span><div class="fontdemo" style="font-family:'${f.family}',sans-serif;font-weight:${f.weight||700}">${esc(f.sample||"Физика без зубрёжки")}</div><div class="body"><div class="ttl">${f.code} · ${esc(f.ru)}</div><div class="what">${esc(f.for)}</div></div></div>`).join("")}</div>
  ${nav("anim","more")}`}
function bindLook(){$("#fontpreview").href="https://fonts.googleapis.com/css2?"+D.fonts.map(f=>"family="+f.family.replace(/ /g,"+")+":wght@"+(f.weight||700)).join("&")+"&display=swap&subset=cyrillic";
  $("#main").onclick=e=>{const p=e.target.closest("[data-pal]");if(p){S.pal=S.pal===p.dataset.pal?null:p.dataset.pal;save();render();return}
  const f=e.target.closest("[data-font]");if(f){S.font=S.font===f.dataset.font?null:f.dataset.font;save();render()}}}

/* ---------- 6. темп, звук, формат ---------- */
function viewMore(){return `<h2>Темп, звук и формат</h2><p class="lead">Последние настройки. Звуки кликов можно послушать — нажми на кнопку со значком ♪.</p>
  ${D.more.map(q=>`<div class="sec">${esc(q.ru)}</div><div class="opt">${q.opts.map(o=>`<button class="chip ${(S.more[q.id]||[]).includes(o.id)?"on":""}" data-q="${q.id}" data-o="${o.id}" ${q.multi?'data-multi="1"':""}>${esc(o.ru)}${o.snd?" ♪":""}</button>`).join("")}</div>${q.id==="tempo"?`<div class="tempo" id="tempo"></div>`:""}`).join("")}
  <div class="sec">Своими словами (необязательно)</div><textarea id="note" placeholder="Например: тема — молоток и перо на Луне; хочу, чтобы в начале был вопрос, а в конце Telegram">${esc(S.note)}</textarea>
  ${nav("look","done","К итогу →")}`}
function bindMore(){const t=$("#note");t.oninput=()=>{S.note=t.value;save()};drawTempo();
  $("#main").onclick=e=>{const b=e.target.closest("[data-q]");if(!b)return;const q=b.dataset.q,o=b.dataset.o,multi=b.dataset.multi;
  const opt=D.more.find(x=>x.id===q).opts.find(x=>x.id===o);if(opt.snd)playSnd(opt.snd);
  let arr=S.more[q]||[];arr=arr.includes(o)?arr.filter(x=>x!==o):(multi?arr.concat(o):[o]);if(arr.length)S.more[q]=arr;else delete S.more[q];save();render()}}
let tempoTimer;function drawTempo(){clearInterval(tempoTimer);const el=$("#tempo");if(!el)return;const sel=(S.more.tempo||["mid"])[0];
  const ms={slow:4200,mid:3000,fast:2000,mix:0}[sel]??3000;el.innerHTML="";let n=0;
  tempoTimer=setInterval(()=>{const i=document.createElement("i");i.style.height=(20+Math.random()*26)+"px";i.style.opacity=.9;el.appendChild(i);setTimeout(()=>i.style.opacity=.15,250);if(el.children.length>40)el.firstChild.remove()},ms||[600,1800,900,2600][n++%4])}
let ac;function playSnd(kind){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  const P={tick:[1800,0.03,"sine"],soft:[900,0.06,"sine"],pop:[520,0.09,"triangle"],tap:[1300,0.025,"square"],wood:[420,0.07,"triangle"],bell:[1320,0.5,"sine"]}[kind]||[1000,.05,"sine"];
  o.type=P[2];o.frequency.setValueAtTime(P[0],t);if(kind==="pop")o.frequency.exponentialRampToValueAtTime(260,t+P[1]);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(kind==="tap"?0.08:0.25,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+P[1]);o.start(t);o.stop(t+P[1]+0.02)}catch(e){}}

/* ---------- 7. итог ---------- */
function message(){const L=[];const d=new Date().toLocaleDateString("ru-RU");
  L.push("ЗАКАЗ СТИЛЯ ВИДЕО · "+d);
  const sum=[];if(S.style.length)sum.push(styleByCode[S.style[0]].ru);if(S.proj)sum.push("для «"+projById[S.proj].ru+"»");
  const pal=S.pal&&D.palettes.find(x=>x.code===S.pal);if(pal)sum.push("палитра «"+pal.ru+"»");const nA=Object.values(S.anim).reduce((n,a)=>n+a.length,0);if(nA)sum.push(nA+" анимаций");
  if(sum.length)L.push("Коротко: "+sum.join(", ")+".");
  L.push("Каталог: konstruktor v1 · "+D.version);
  if(S.proj)L.push("Для кого: "+projById[S.proj].ru);
  if(S.fam.length)L.push("Семейство: "+S.fam.map(f=>f.replace("F","Ф")+" «"+famById[f].ru+"»").join(", "));
  if(S.style.length)L.push("Стиль: "+S.style.map((c,i)=>{const s=styleByCode[c];return c+" «"+s.ru+"» ["+s.id+"]"+(i===0&&S.style.length>1?" — главный":"")}).join("; "));
  famOrder().concat(D.groups.map(g=>g.id)).filter((v,i,a)=>a.indexOf(v)===i).forEach(g=>{const arr=S.anim[g];if(arr&&arr.length)L.push(grpById[g].ru+": "+arr.map(c=>c+" «"+animByCode[c].ru+"» ["+(animByCode[c].src==="astra"?"наш":"hf")+":"+animByCode[c].name+"]").join("; "))});
  if(S.pal){const p=D.palettes.find(x=>x.code===S.pal);L.push("Палитра: "+p.code+" «"+p.ru+"» "+p.colors.join(" "))}
  if(S.font){const f=D.fonts.find(x=>x.code===S.font);L.push("Шрифт: "+f.code+" «"+f.ru+"» ("+f.family+")")}
  D.more.forEach(q=>{const a=S.more[q.id];if(a&&a.length)L.push(q.ru.replace(/\s*\(.*\)/,"")+": "+a.map(o=>q.opts.find(x=>x.id===o).ru).join(", "))});
  if(S.note.trim())L.push("Своими словами: "+S.note.trim());
  L.push("Ограничения: антислоп AS-01 (без эмодзи, караоке-капса, конфетти, глитча по умолчанию; субтитры ≤14 знаков в строке)");
  L.push("Ссылка: diveylaunch.github.io/show/konstruktor");return L.join("\n")}
function viewDone(){const m=message();const n=countPicks();
  return `<h2>Итог: сообщение для Claude</h2><p class="lead">Скопируй и пришли мне в чат. По кодам я точно пойму, что ты выбрал, и соберу видео из этих же анимаций.</p>
  ${n?"":`<p class="note">Пока ничего не выбрано — начни с шага «Для кого» или возьми готовый набор.</p>`}
  <div class="msg" id="msg">${esc(m)}</div>
  <div class="nav"><button class="ghost" onclick="if(confirm('Очистить весь выбор?')){S=fresh();save();render()}">Начать заново</button><button class="big-btn" id="copy">Скопировать сообщение</button></div><p class="ok" id="copied"></p>`}
function bindDone(){$("#copy").onclick=()=>{const m=message();(navigator.clipboard?navigator.clipboard.writeText(m):Promise.reject()).then(()=>{$("#copied").textContent="Скопировано — вставь мне в чат"}).catch(()=>{const r=document.createRange();r.selectNodeContents($("#msg"));getSelection().removeAllRanges();getSelection().addRange(r);$("#copied").textContent="Выделил текст — нажми ⌘C"})}}
function countPicks(){return (S.proj?1:0)+S.fam.length+S.style.length+Object.values(S.anim).reduce((n,a)=>n+a.length,0)+(S.pal?1:0)+(S.font?1:0)+Object.values(S.more).reduce((n,a)=>n+a.length,0)}

/* ---------- корзина ---------- */
function side(){const rows=[];
  if(S.proj)rows.push(["Для кого",projById[S.proj].ru,"proj"]);
  S.fam.forEach(f=>rows.push(["Семейство",f.replace("F","Ф")+" "+famById[f].ru,"fam:"+f]));
  S.style.forEach(c=>rows.push(["Стиль",c+" "+styleByCode[c].ru,"style:"+c]));
  Object.entries(S.anim).forEach(([g,arr])=>arr.forEach(c=>rows.push([grpById[g].ru,c+" "+animByCode[c].ru,"anim:"+c])));
  if(S.pal)rows.push(["Палитра",S.pal+" "+(D.palettes.find(x=>x.code===S.pal)||{}).ru,"pal"]);if(S.font)rows.push(["Шрифт",S.font+" "+(D.fonts.find(x=>x.code===S.font)||{}).ru,"font"]);
  Object.entries(S.more).forEach(([q,a])=>{const Q=D.more.find(x=>x.id===q);a.forEach(o=>rows.push([Q.ru,Q.opts.find(x=>x.id===o).ru,"more:"+q+":"+o]))});
  $("#side").innerHTML=`<h3>Мой выбор · ${rows.length}</h3>${rows.length?rows.map(r=>`<div class="row"><div><div class="k">${esc(r[0])}</div>${esc(r[1])}</div><button class="x" data-rm="${esc(r[2])}" aria-label="убрать">×</button></div>`).join(""):'<p class="empty">Пока пусто. Нажимай на карточки — выбранное появится здесь.</p>'}
  ${rows.length?`<div style="margin-top:12px"><button class="big-btn" style="width:100%" onclick="go('done')">К итогу</button></div>`:""}`;
  $("#fab").textContent=$("#fab").dataset.open?"Закрыть":"Мой выбор · "+rows.length;
  $("#side").onclick=e=>{const b=e.target.closest("[data-rm]");if(!b)return;const [k,v,w]=b.dataset.rm.split(":");
   if(k==="proj")S.proj=null;else if(k==="fam")S.fam=S.fam.filter(x=>x!==v);else if(k==="style")S.style=S.style.filter(x=>x!==v);
   else if(k==="anim"){const g=animByCode[v].group;S.anim[g]=S.anim[g].filter(x=>x!==v)}else if(k==="pal")S.pal=null;else if(k==="font")S.font=null;
   else if(k==="more"){S.more[v]=S.more[v].filter(x=>x!==w);if(!S.more[v].length)delete S.more[v]}save();render()}}
$("#fab").onclick=()=>{const o=$("#side").classList.toggle("open");$("#fab").dataset.open=o?1:"";side()};
function closeDlg(){$("#dlg").close()}
$("#dlg").addEventListener("close",()=>{$("#dlgMedia").innerHTML=""});

const VIEWS={who:[viewWho,bindWho],fam:[viewFam,bindFam],style:[viewStyle,bindStyle],anim:[viewAnim,bindAnim],look:[viewLook,bindLook],more:[viewMore,bindMore],done:[viewDone,bindDone]};
function render(){live.forEach(m=>{const p=m.querySelector("hyperframes-player");p&&p.remove()});live=[];io.disconnect();
  stepsBar();const [v,b]=VIEWS[S.step]||VIEWS.who;$("#main").innerHTML=v();b();side();observe()}
render();
</script>
</body>
</html>
